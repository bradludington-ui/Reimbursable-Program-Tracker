    h += card('Appropriation and fiscal year',
              fN(af.appns.length)+' appropriation'+(af.appns.length===1?'':'s')
              + ' &middot; '+fN(af.fys.length)+' fiscal year'+(af.fys.length===1?'':'s')
              + ' &middot; as written', ab);
  }

  /* A participant the order does not recognise falls to the FMS tail, which is
     right for a country and WRONG for a service - and silent either way. So it
     is named. */
  const unr = CED.unranked(all);
  h += card('Service and partner order',
        'the fixed briefing order, and what fell outside it',
        '<div class="note b">Listed as: '
        + CED.PARTS.map((p,i)=>'<span class="pill '+(i<6?'b':'t')+'">'+esc(p.name)+'</span>').join(' ')
        + ' &mdash; then every other participant, alphabetically.</div>'
        + (unr.length
            ? '<div class="note a"><b>'+fN(unr.length)+' participant'+(unr.length===1?'':'s')
              + ' fell outside the order</b> and are listed after it: '
              + unr.map(esc).join(', ') + '. That is correct for an FMS country. '
              + 'If any of those is a US service the order needs a pattern for it, '
              + 'because it is currently sorting among the partner nations.</div>'
            : '<div class="note g">Every participant in this import matched the order.</div>')
        + (CED.noParticipant(all)
            ? '<div class="note a">'+fN(CED.noParticipant(all))+' line'
              + (CED.noParticipant(all)===1?' carries':'s carry')
              + ' no participant at all, and sort at the end.</div>'
            : ''),
        {});

  h += card('Advisories', 'none of these is a failure; each is something worth a look',
        at? '<table class="t"><thead><tr><th class="n">Rows</th><th></th><th>What</th></tr></thead><tbody>'+at+'</tbody></table>'
          : '<div class="empty"><div class="big">Nothing to report</div>No advisory triggered on this import.</div>',
        {flush:true});

  /* what the tool deliberately does not claim */
  h += card('What this tool does not claim',
        'stated so a reader does not infer it',
        '<div class="note">The source carries <b>no contract value or ceiling</b>, so nothing here is a '
        + 'percentage of contract value - every percentage is against <b>obligations</b>.</div>'
        + '<div class="note">The contract number is read from the <b>file name</b> and appears nowhere '
        + 'inside the workbook. A misnamed file is a mislabelled contract, and the tool cannot detect it.</div>'
        + '<div class="note">Lines with no appropriation are reported as <b>FMS / partner</b> because that is '
        + 'the split the source workbook\'s own pivots make. The source never states it in words, and the '
        + 'tool does not classify by nation name.</div>'
        + '<div class="note">There is <b>no period-over-period comparison</b>. Every figure is the position '
        + 'at the as-of date of the files that were imported.</div>');

  return h;
}

/* ============================================================================
   LINE DETAIL
   ============================================================================ */
function openLine(key){
  const L = findLine(key);
  if(!L) return;
  const f = fileOf(L);
  const mT = curAsOf()? CED.monthsTo(curAsOf(), L.cancD) : null;
  const kv = (k,v)=>'<tr><td style="color:var(--dim);white-space:nowrap">'+k+'</td><td><b>'+v+'</b></td></tr>';

  let b = '<div class="tiles" style="margin:0 0 12px">'
    + tile('Obligations', fD(L.obl), '', 'b')
    + tile('Expenditures', fD(L.exp), L.obl? fPct(L.exp/L.obl) : '', 'g')
    + tile('Unliquidated', fD(L.ulo), L.uloOk? 'reconciles' : 'DOES NOT reconcile', L.uloOk?'r':'r')
    + '</div>';

  if(!L.uloOk){
    b += '<div class="note r"><b>This line does not reconcile.</b> The file carries a ULO of '
      +  fD(L.ulo)+', but obligations minus expenditures is '+fD(L.uloCalc)
      +  ' - a difference of '+fD(L.ulo-L.uloCalc)+'. The figure on file is what is shown and totalled '
      +  'everywhere in this tool; it is never overwritten.</div>';
  }

  b += '<div class="grid g2"><div class="card" style="margin:0"><div class="hd"><h3>The line</h3></div>'
    +  '<div class="bd"><table class="t">'
    +  kv('Contract', '<span class="mono">'+esc(L.ktr)+'</span>')
    +  kv('CLIN', '<span class="mono">'+esc(L.clin)+'</span>')
    +  kv('CLIN title', esc(L.title))
    +  kv('CLIN type', esc(L.ctype)||'&ndash;')
    +  kv('ACRN', '<span class="mono">'+esc(L.acrn)+'</span>')
    +  kv('Participant', esc(L.part))
    +  kv('Funding', '<span class="pill '+(L.us?'b':'p')+'">'+esc(L.fund)+'</span>')
    +  '</table></div></div>'
    +  '<div class="card" style="margin:0"><div class="hd"><h3>Availability</h3></div>'
    +  '<div class="bd"><table class="t">'
    +  kv('Appropriation', L.appn? esc(L.appn) : '<span class="pill p">none on file</span>')
    +  kv('Fiscal year', L.fy? esc(L.fy) : '<span class="pill p">none on file</span>')
    +  kv('Expires', L.expD? esc(dLabel(L.expD))
          + (curAsOf() && L.expD<=curAsOf()? ' <span class="pill r">expired</span>' : '')
          : '<span class="pill p">none on file</span>')
    +  kv('Cancels', L.cancD? esc(dLabel(L.cancD))
          + (mT===null? '' : mT<0? ' <span class="pill r">past</span>'
             : ' <span class="pill '+(mT<12?'r':mT<24?'a':'g')+'">'+mT+' months</span>')
          : '<span class="pill p">none on file</span>')
    +  kv('Source file', '<span class="mono">'+esc(f.name||'')+'</span>')
    +  (L.cmt? kv('Comment', esc(L.cmt)) : '')
    +  '</table></div></div></div>';

  /* WHO OWNS IT. The source says nothing about this; the contact register does. */
  const pp = CED.pocAllFor(pocs(), L);
  const anyPoc = Object.keys(pp).length;
  /* THE BUTTON CARRIES THE LINE. A rule assigned from here starts pinned to
     exactly the line being looked at; the form says how many lines that
     matches and the owner widens it by emptying boxes. Asking for a contract
     number in a window opened against that contract is asking the reader to
     retype what is on the screen in front of them.
     A contact is offered whether or not one is already assigned - there are
     five roles, and the first cut hid the button the moment any one of them
     was filled. */
  b += '<div class="note '+(anyPoc? 'b':'a')+'" style="margin-top:12px"><b>Contacts:</b> '
    + (anyPoc
        ? CED.POC_ROLES.filter(r=>pp[r.id]).map(r=>
            '<span class="pill '+r.tone+'">'+esc(r.short)+'</span> '+esc(pp[r.id].name)
            + (pp[r.id].org? ' <span style="color:var(--dim)">('+esc(pp[r.id].org)+')</span>':'')
          ).join(' &nbsp; ')
        : 'nobody is assigned to this line. ')
    + ' <button class="mbtn pill" data-act="pocNew"'
    + ' data-contract="'+esc(L.ktr)+'" data-clin="'+esc(L.clin)+'"'
    + ' data-acrn="'+esc(L.acrn)+'" data-part="'+esc(L.part)+'">Assign a contact</button>'
    + '</div>';

  /* the actions on this line, and the way one gets raised */
  const mine = CED.actionsFor(actions(), L);
  b += '<div class="card" style="margin:12px 0 0"><div class="hd"><h3>Actions</h3>'
    + '<span class="sub">'+fN(mine.length)+' on this line</span>'
    + '<span style="flex:1"></span>'
    + '<button class="mbtn pill" data-act="actAdd" data-scope="line" data-v="'+esc(L.key)+'">'
    + 'Raise an action</button></div><div class="bd flush">'
    + (mine.length
        ? dataTable('ln-act-'+L.ix, [
            {k:'status', h:'Status', cls:'c', get:r=>r.status,
             cell:r=>{ const s=CED.actStatus(r.status);
               return '<span class="pill '+s.tone+'">'+esc(s.name)+'</span>'; }},
            {k:'title', h:'Action', cls:'w', get:r=>r.title, cell:r=>'<b>'+esc(r.title)+'</b>'},
            {k:'disp', h:'Disposition', cls:'c', get:r=>r.disp,
             cell:r=>{ const d=CED.actDisp(r.disp);
               return d? '<span class="pill '+(d.tone||'')+'">'+esc(d.name)+'</span>'
                       : '<span class="pill r">not set</span>'; }},
            {k:'owner', h:'Owner', get:r=>r.owner},
            {k:'due', h:'Due', cls:'c', get:r=>r.due,
             cell:r=>r.due? esc(dLabel(r.due)) : '<span class="pill">&ndash;</span>'}
          ], mine, {sortKey:'status', sortDir:'asc',
             rowAttr:r=>'class="clk" data-action="'+esc(r.id)+'"'})
        : '<div class="empty">Nothing raised against this line yet.</div>')
    + '</div></div>';

  modal(esc(L.ktr)+' &middot; CLIN '+esc(L.clin), b);
}

/* ============================================================================
   THE IMPORT DIALOG — confirm the month before anything lands.

   The reporting month exists ONLY in the file name. Nothing inside the
   workbook records it: not the sheet name, not a cell, not the file date. So
   a file renamed from July to August is a mislabelled month and no amount of
   reading the contents can catch it - and the as-of is not a caption, it
   decides what counts as expired or cancelled, which expired year a balance
   sits in, and the elapsed months behind the burn rate.

   The name stays the default because it is right almost every time. The point
   is that it is now a PROPOSAL the owner sees, rather than a fact the tool
   asserts on their behalf.
   ============================================================================ */
function importForm(err){
  if(!PENDING || !PENDING.files.length){ closeModal(); return; }
  const n = PENDING.files.length;
  const same = new Set(PENDING.asOf.map(a=>pkOf(a)));

  let b = '';
  b += '<div class="note b">The reporting month comes from the <b>file name</b> and from '
    + 'nowhere else &mdash; the workbook does not record it. Check it here: the as-of date '
    + 'decides what counts as <b>expired or cancelled</b>, which expired year a balance is '
    + 'in, and the months behind the burn rate. Leave a row alone to accept what the name '
    + 'says.</div>';

  /* one control for the common case: a whole month-end drop */
  b += '<div class="filt" style="margin-bottom:8px">'
    + '<label>Set every file to</label>'
    + '<input data-impall="1" type="month" value="'
      + esc(same.size===1 && [...same][0]!==UNDATED ? [...same][0] : '') + '">'
    + '<button class="mbtn" data-act="impAll">Apply to all</button>'
    + '<span style="flex:1"></span>'
    + '<span style="font-size:11.5px;color:var(--dim)">'
      + fN(n)+' file'+(n===1?'':'s')+' &middot; '
      + (same.size===1
          ? 'all in <b>'+esc(pLabel([...same][0]))+'</b>'
          : fN(same.size)+' different periods')
    + '</span></div>';

  b += '<div class="scroll"><table class="t"><thead><tr>'
    + '<th>File</th><th>Contract</th><th>Read from the name</th>'
    + '<th>As-of to use</th><th>Period</th></tr></thead><tbody>';
  PENDING.files.forEach((f,i)=>{
    const m  = PENDING.meta[i];
    const a  = PENDING.asOf[i] || '';
    const pk = pkOf(a);
    const changed = a !== (m.asOf || '');
    b += '<tr>'
      + '<td class="nw"><span class="mono" style="font-size:11.5px">'+esc(f.name)+'</span></td>'
      + '<td class="nw"><span class="mono">'+esc(m.pretty)+'</span>'
        + (m.recognised? '' : ' <span class="pill a" title="not the N#####-##-X-#### shape">shape?</span>')
      + '</td>'
      + '<td class="nw">' + (m.asOf
          ? '<span class="mono">'+esc(m.asOf)+'</span>'
          : '<span class="pill a">no date in the name</span>') + '</td>'
      + '<td class="nw"><input data-imp="'+i+'" type="date" value="'+esc(a)+'" '
        + 'style="font:inherit;font-size:12px;background:var(--panelA);'
        + 'border:1px solid var(--line2);border-radius:5px;padding:2px 6px"></td>'
      + '<td class="nw">' + (pk===UNDATED
          ? '<span class="pill r">Undated</span>'
          : '<span class="pill '+(changed?'a':'g')+'">'+esc(pLabel(pk))+'</span>')
        + (changed? ' <span style="color:var(--dim);font-size:11px">changed</span>' : '')
      + '</td></tr>';
  });
  b += '</tbody></table></div>';

  /* the two things worth saying out loud before the button */
  const undated = PENDING.asOf.filter(a=>!a).length;
  const moved   = PENDING.asOf.filter((a,i)=>a !== (PENDING.meta[i].asOf||'')).length;
  if(undated)
    b += '<div class="note a" style="margin-top:10px"><b>'+fN(undated)+'</b> file'
      + (undated===1?' has':'s have')+' no as-of. '+(undated===1?'It':'They')
      + ' will land in <b>Undated</b> and cannot be compared month over month '
      + 'until given one.</div>';
  if(moved)
    b += '<div class="note b" style="margin-top:10px"><b>'+fN(moved)+'</b> file'
      + (moved===1?'':'s')+' will be imported under a date other than the one in the '
      + 'name. That is recorded against the file in <b>Verify</b>, because it is the one '
      + 'thing about this import the file itself does not evidence.</div>';

  b += formErr(err);
  b += '<div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    + '<button class="mbtn go" data-act="impApply">Import '+fN(n)+' file'+(n===1?'':'s')+'</button>'
    + '<button class="mbtn pill" data-act="impCancel">Cancel</button>'
    + '</div>';

  modal('Import &mdash; confirm the month', b);
}

/* one date changed */
function impSet(i, v){
  if(!PENDING) return;
  PENDING.asOf[i] = (''+(v||'')).trim();
  importForm();
}
/* the whole drop moved to one month. A file whose date already falls in that
   month KEEPS ITS DAY - it is the more precise figure and the one the source
   actually carries. */
function impAll(){
  if(!PENDING) return;
  const el = $('modalHost').querySelector('[data-impall]');
  const ym = el? (''+el.value).trim() : '';
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(ym)){
    importForm(['pick a month first']);
    return;
  }
  PENDING.asOf = PENDING.asOf.map(a=>
    (a && a.slice(0,7) === ym)? a : lastDayOf(ym));
  importForm();
}
function impCancel(){ PENDING = null; closeModal(); setStat('Import cancelled.'); }

async function impApply(){
  if(!PENDING) return;
  const files = PENDING.files, asOf = PENDING.asOf.slice();
  PENDING = null;
  closeModal();
  LASTFILES = files; LASTASOF = asOf;
  await loadFiles(files, asOf);
}

/* AN ERROR THE READER CANNOT SEE IS A BUTTON THAT DOES NOTHING.

   Both forms put this note at the top and their buttons at the bottom of a
   74vh scrolling body, so "Save" on a form missing its title re-rendered a
   message that was never on screen. It is rendered next to the buttons now,
   and formFocus scrolls it into view and puts the caret in the field that is
   missing. REQ marks the fields that are actually required, so the error is
   avoided rather than merely reported. */
const REQ = ' <span style="color:var(--red)" title="required">*</span>';
function formErr(err){
  return (err && err.length)
    ? '<div class="note r" data-formerr="1" style="margin-bottom:10px">'
      + '<b>Not saved.</b> ' + err.map(esc).join('; ') + '.</div>'
    : '';
}
function formFocus(sel){
  const host = $('modalHost');
  const n = host.querySelector('[data-formerr]');
  if(n && n.scrollIntoView) n.scrollIntoView({block:'nearest'});
  const f = sel? host.querySelector(sel) : null;
  /* never steal the caret out of a field the reader has already filled in */
  if(f && !(''+f.value).trim()) f.focus();
}

function modal(title, body){
  $('modalHost').innerHTML =
    '<div class="mask" data-act="closeModal"><div class="modal">'
    + '<div class="mh"><h3>'+title+'</h3><button class="x" data-act="closeModal">&times;</button></div>'
    + '<div class="mb">'+body+'</div></div></div>';
}
function closeModal(){ $('modalHost').innerHTML=''; }
</script>

<script>
/* ============================================================================
   MONTH OVER MONTH, TREND, and the Periods manager.
   ============================================================================ */

/* A signed money cell. The sign is the whole message here, so it is never
   dropped, and the tone follows what the movement MEANS rather than its sign:
   for a balance, down is good; for expenditures, up is good. */
function dCell(v, goodWhen){
  if(Math.abs(v) <= CED.EPS) return '<span class="pill">&ndash;</span>';
  const good = goodWhen==='down'? v<0 : v>0;
  return '<span class="pill '+(good?'g':'r')+'">'+(v>0?'+':'&minus;')+'$'+fM(Math.abs(v))+'M</span>';
}
function dNum(v){
  if(Math.abs(v) <= CED.EPS) return '&ndash;';
  return (v>0?'+':'&minus;')+fD(Math.abs(v)).slice(1);
}

function periodPicker(which, sel, allowNone){
  const ps = DB.periods;
  return '<select data-cmp="'+which+'">'
    + (allowNone? '<option value=""'+(sel===''?' selected':'')+'>(none)</option>' : '')
    + ps.map(p=>'<option value="'+esc(p.key)+'"'+(p.key===sel?' selected':'')+'>'
        + esc(p.label) + (p.asOf? ' · as of '+esc(dLabel(p.asOf)) : '') + '</option>').join('')
    + '</select>';
}

/* ============================================================================
   COMPARE
   ============================================================================ */
function viewCompare(){
  const ps = DB.periods;
  if(ps.length < 2){
    return card('Month over month', 'needs two periods',
      '<div class="empty"><div class="big">Only one period is loaded</div>'
      + 'Import a second month and this view compares them line by line.<br><br>'
      + 'The contract number and the month both come from the file name, so importing '
      + '<span class="mono">' + esc((ps[0] && ps[0].files[0] ? ps[0].files[0].name : 'N0001922CXXXX O&M ULO Summary 8.26.26.xlsx')) + '</span> '
      + 'and the September equivalent is all it takes.'
      + '<div style="margin-top:14px"><button class="mbtn go" data-act="import">Import another month</button></div>'
      + '</div>');
  }

  const A = CED.inPeriod(CMP.a), B = CED.inPeriod(CMP.b);
  const pa = periodOf(CMP.a), pb = periodOf(CMP.b);
  const c  = CED.compare(A, B);
  const br = c.bridge;

  let h = '';

  h += '<div class="filt">'
    + '<label>From</label>' + periodPicker('a', CMP.a, false)
    + '<label>To</label>'   + periodPicker('b', CMP.b, false)
    + '<span style="flex:1"></span>'
    + '<span class="pill">'+fN(c.matched.length)+' matched</span>'
    + '<span class="pill g">'+fN(c.added.length)+' new</span>'
    + '<span class="pill a">'+fN(c.removed.length)+' dropped</span>'
    + '</div>';

  if(CMP.a === CMP.b){
    return card('Month over month', '', h
      + '<div class="empty"><div class="big">Same period on both sides</div>'
      + 'Pick two different periods.</div>', {flush:true});
  }

  /* ---- the bridge, which is the briefable artefact --------------------- */
  const rows = [
    ['Opening balance &mdash; ' + esc(pa.label), br.opening, '', 'b'],
    ['Obligations added',     br.oblUp,   'placed on contract, on lines already reported', 'r'],
    ['Deobligations',         br.oblDown, 'taken back off contract',                       'g'],
    ['Expenditures',          -br.expUp,  'paid out &mdash; the real burn',                'g'],
    ['Expenditure reversals', -br.expDown,'credits and corrections',                       'r'],
    ['Lines new to the report',  br.addedUlo,
      br.addedN? br.addedN+' line'+(br.addedN===1?'':'s')+' not on the '+esc(pa.label)+' report' : 'none', 'r'],
    ['Lines no longer reported', br.removedUlo,
      br.removedN? br.removedN+' line'+(br.removedN===1?'':'s')+' gone from the '+esc(pb.label)+' report' : 'none', 'g'],
    ['Closing balance &mdash; ' + esc(pb.label), br.closing, '', 'b']
  ];
  let bt = '<table class="t"><thead><tr><th>Roll-forward</th><th class="n">$M</th><th>What it is</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const isEnd = i===0 || i===rows.length-1;
    bt += '<tr'+(isEnd?' class="tot"':'')+'>'
       +  '<td>'+r[0]+'</td>'
       +  '<td class="n">'+(isEnd? '<b>$'+fM(r[1])+'M</b>'
            : (Math.abs(r[1])<=CED.EPS? '<span class="pill">&ndash;</span>'
               : '<span class="pill '+r[3]+'">'+(r[1]>0?'+':'&minus;')+'$'+fM(Math.abs(r[1]))+'M</span>'))+'</td>'
       +  '<td style="color:var(--dim)">'+r[2]+'</td></tr>';
  });
  bt += '</tbody></table>';

  h += '<div class="tiles">'
    + tile('Balance moved', (br.delta>0?'+':'−')+'$'+fM(Math.abs(br.delta))+'M',
           esc(pa.label)+' to '+esc(pb.label), br.delta<=0?'g':'r')
    + tile('Paid out', '$'+fM(br.expUp)+'M', 'on lines reported in both months', 'g')
    + tile('Deobligated', '$'+fM(Math.abs(br.oblDown))+'M', 'taken back off contract', 'a')
    + tile('Newly obligated', '$'+fM(br.oblUp)+'M', 'added to contract', 'b')
    + tile('New lines', fN(br.addedN), '$'+fM(br.addedUlo)+'M balance arrived', 'p')
    + tile('Dropped lines', fN(br.removedN), '$'+fM(Math.abs(br.removedUlo))+'M balance left', 't')
    + '</div>';

  h += card('Where the balance went', esc(pa.label)+' &rarr; '+esc(pb.label),
        (br.ok
          ? '<div class="note g" style="margin:10px 12px"><b>The bridge reconciles.</b> '
            + 'Movement on lines reported in both months, plus the balance carried in and out by lines '
            + 'entering and leaving the report, equals the closing balance exactly. '
            + 'A line that drops off having been fully liquidated moves this by nothing, which is why '
            + 'those two rows are kept separate from the four above them.</div>'
          : '<div class="note r" style="margin:10px 12px"><b>The bridge does NOT reconcile</b> &mdash; '
            + 'it derives '+fD(br.derived)+' against a closing balance of '+fD(br.closing)
            + ', a difference of '+fD(br.derived-br.closing)+'. That can only happen if a line\'s own '
            + 'ULO disagrees with its obligations less expenditures; check <b>Verify</b>.</div>')
        + bt, {flush:true});

  /* ---- movement by contract and by participant ------------------------- */
  h += '<div class="grid g2">'
    + card('Movement by contract', '',
        movementTable('cmp-ktr', c.rows, r=>r.line.ktr))
    + card('Movement by participant', 'in briefing order',
        movementTable('cmp-part', c.rows, r=>r.line.part, true))
    + '</div>';

  /* ---- the lines that moved -------------------------------------------- */
  const moveCols = [
    {k:'move', h:'Movement', cls:'c', get:r=>CED.moveLabel(r),
     cell:r=>{ const l=CED.moveLabel(r);
       const tone = l==='New'?'g' : l==='Dropped'?'a' : l==='Liquidated'?'g'
                  : l==='Deobligated'?'a' : l==='Obligated'?'b' : l==='Reversed'?'r' : '';
       return '<span class="pill '+tone+'">'+l+'</span>'; }},
    {k:'ktr',  h:'Contract', cls:'mono', get:r=>r.line.ktr},
    {k:'part', h:'Participant', get:r=>r.line.part},
    {k:'clin', h:'CLIN', cls:'mono', get:r=>r.line.clin},
    {k:'title',h:'CLIN title', cls:'w', get:r=>r.line.title},
    {k:'acrn', h:'ACRN', cls:'mono c', get:r=>r.line.acrn},
    {k:'oblA', h:'Obl before', cls:'n', get:r=>r.a? r.a.obl : 0, cell:r=>r.a? fD(r.a.obl) : '&ndash;'},
    {k:'oblB', h:'Obl after',  cls:'n', get:r=>r.b? r.b.obl : 0, cell:r=>r.b? fD(r.b.obl) : '&ndash;'},
    {k:'dObl', h:'&Delta; Obl', cls:'n', get:r=>r.dObl, cell:r=>dNum(r.dObl)},
    {k:'dExp', h:'&Delta; Exp', cls:'n', get:r=>r.dExp, cell:r=>dNum(r.dExp)},
    {k:'uloA', h:'ULO before', cls:'n', get:r=>r.a? r.a.ulo : 0, cell:r=>r.a? fD(r.a.ulo) : '&ndash;'},
    {k:'uloB', h:'ULO after',  cls:'n', get:r=>r.b? r.b.ulo : 0, cell:r=>r.b? fD(r.b.ulo) : '&ndash;'},
    {k:'dUlo', h:'&Delta; ULO', cls:'n', get:r=>r.dUlo,
     cell:r=>(r.consistent? '' : '<span class="pill r" title="does not equal the change in obligations less expenditures">!</span> ')+dNum(r.dUlo)}
  ];
  const moved = c.rows.filter(r=>r.moved || r.kind!=='matched');
  /* ---- WHAT WE STILL CANNOT ACCOUNT FOR, AND WHY IT MOVED --------------
     The same bridge the slide draws. Unexplained money falls because somebody
     ANSWERED or because the balance MOVED, and those lead to opposite
     decisions - so they are never added together here either. */
  {
    const ub = CED.unexBridge(A, B, actions(), pa.asOf, pb.asOf);
    if(Math.abs(ub.opening) > CED.EPS || Math.abs(ub.closing) > CED.EPS){
      const P = ub.parts;
      const answered = Math.abs(P.explained);
      const anyway   = Math.abs(P.paid + P.deobligated + P.left + P.noLongerAtRisk);
      const added    = P.newlyAtRisk + P.arrived + P.obligated + P.regressed;

      let u = '<div class="grid g4" style="margin-bottom:12px">'
        + tile('Opening unexplained', fD(ub.opening), esc(pa.label))
        + tile('Answered', fD(answered), 'the chase working', answered>CED.EPS? 'g':'')
        + tile('Left anyway', fD(anyway), 'paid, taken back or gone', 'b')
        + tile('Closing unexplained', fD(ub.closing), esc(pb.label),
               ub.delta<=0? 'g':'r')
        + '</div>';

      u += '<div class="scroll"><table class="t"><thead><tr>'
        + '<th>Roll-forward</th><th class="n">$M</th><th>What it means</th>'
        + '</tr></thead><tbody>';
      u += '<tr><td><b>Opening &mdash; '+esc(pa.label)+'</b></td>'
        + '<td class="n"><b>'+fM(ub.opening)+'</b></td>'
        + '<td style="color:var(--dim)">at risk with nothing said about it</td></tr>';
      const why = {
        explained:      'somebody gave a disposition',
        paid:           'liquidated &mdash; nobody explained it, there is just less of it',
        deobligated:    'taken off contract',
        noLongerAtRisk: 'no longer expired or cancelled',
        left:           'the line is no longer on the report at all',
        newlyAtRisk:    'expired since last month, and nothing said',
        arrived:        'new to the report, already at risk',
        obligated:      'obligation added to an unexplained line',
        regressed:      'the disposition it had has gone'
      };
      CED.UNEX_PARTS.forEach(part=>{
        const v = P[part.id];
        if(Math.abs(v) <= CED.EPS) return;
        u += '<tr><td>'+esc(part.name)+'</td>'
          + '<td class="n ' + (part.good? 'g':'r') + '">'
          + (v>0? '+':'&minus;') + fM(Math.abs(v)) + '</td>'
          + '<td style="color:var(--dim)">'+why[part.id]+'</td></tr>';
      });
      u += '<tr><td><b>Closing &mdash; '+esc(pb.label)+'</b></td>'
        + '<td class="n"><b>'+fM(ub.closing)+'</b></td>'
        + '<td style="color:var(--dim)">'+fN(ub.nB)+' lines</td></tr>';
      u += '</tbody></table></div>';

      u += '<div class="note '+(ub.ok? 'b':'r')+'" style="margin-top:10px">'
        + (ub.ok
            ? '<b>Every cause above carries opening to closing exactly.</b> '
            : '<b>These causes do NOT reconcile, which is a defect.</b> ')
        + 'Each month is scored against the action register <b>as it stood that '
        + 'month</b> &mdash; an answer given in '+esc(pb.label)+' does not count back '
        + 'into '+esc(pa.label)+', or the chase would look like it had achieved '
        + 'nothing. A line both paid down and answered credits the chase only with '
        + 'what was left to answer for.'
        + (added > CED.EPS
            ? ' <b>$'+fM(added)+'M arrived or crossed into risk</b> and is unexplained '
              + 'from the day it landed.' : '')
        + '</div>';

      h += card('What we still cannot account for',
                esc(pa.label)+' &rarr; '+esc(pb.label), u);
    }
  }

  h += card('Every line that moved', fN(moved.length)+' of '+fN(c.rows.length)
        + ' lines &middot; sorted by the size of the balance change',
        '<div class="scroll">'
        + dataTable('cmp-lines', moveCols, moved, {
            sortKey:'dUlo', sortDir:'asc', page:true,
            rowAttr:r=>r.b? 'class="clk" data-line="'+lineKey(r.b)+'"' : '',
            total:(rows,col)=>{
              if(col.k==='move') return 'TOTAL ('+fN(rows.length)+')';
              if(col.k==='dObl') return dNum(rows.reduce((a,r)=>a+r.dObl,0));
              if(col.k==='dExp') return dNum(rows.reduce((a,r)=>a+r.dExp,0));
              if(col.k==='dUlo') return dNum(rows.reduce((a,r)=>a+r.dUlo,0));
              return '';
            }})
        + '</div>', {flush:true});

  /* ---- attribute drift -------------------------------------------------- */
  if(c.drift.length){
    const FLD = {part:'Participant', appn:'Appropriation', fy:'Fiscal year',
                 ctype:'CLIN type', title:'CLIN title', expD:'Expiration', cancD:'Cancel date'};
    h += card('Lines described differently this month', fN(c.drift.length)+' changes',
      '<div class="note a" style="margin:10px 12px">These are the same line &mdash; same contract, CLIN and ACRN &mdash; '
      + 'carrying a different value in a field that is not part of its identity. Usually a correction at source. '
      + 'It is surfaced because it changes how the line is grouped and totalled.</div>'
      + '<div class="scroll sm">'
      + dataTable('cmp-drift', [
          {k:'ktr',  h:'Contract', cls:'mono', get:r=>r.line.ktr},
          {k:'clin', h:'CLIN', cls:'mono', get:r=>r.line.clin},
          {k:'acrn', h:'ACRN', cls:'mono c', get:r=>r.line.acrn},
          {k:'field',h:'Field', get:r=>FLD[r.field]||r.field},
          {k:'from', h:'Was', get:r=>r.from, cell:r=>r.from? esc(r.from) : '<span class="pill">(blank)</span>'},
          {k:'to',   h:'Now', get:r=>r.to,   cell:r=>r.to? '<b>'+esc(r.to)+'</b>' : '<span class="pill">(blank)</span>'}
        ], c.drift, {sortKey:'ktr', sortDir:'asc'})
      + '</div>', {flush:true});
  }

  return h;
}

/* Group the deltas and show what moved, without ever totalling a rate. */
function movementTable(id, rows, keyOf, byPart){
  const m = new Map();
  rows.forEach(r=>{
    const k = keyOf(r);
    if(!m.has(k)) m.set(k, {key:k, n:0, dObl:0, dExp:0, dUlo:0, uloB:0});
    const g = m.get(k);
    g.n++; g.dObl+=r.dObl; g.dExp+=r.dExp; g.dUlo+=r.dUlo;
    g.uloB += r.b? r.b.ulo : 0;
  });
  const gs = [...m.values()];
  if(byPart) gs.sort((a,b)=> CED.partRank(a.key)-CED.partRank(b.key) || a.key.localeCompare(b.key));
  const t = gs.reduce((a,g)=>({n:a.n+g.n, dObl:a.dObl+g.dObl, dExp:a.dExp+g.dExp,
                               dUlo:a.dUlo+g.dUlo, uloB:a.uloB+g.uloB}),
                      {n:0,dObl:0,dExp:0,dUlo:0,uloB:0});
  return '<div class="scroll sm">' + dataTable(id, [
      {k:'key',  h:'', get:r=>r.key},
      {k:'dExp', h:'Paid out', cls:'n', get:r=>r.dExp, cell:r=>dCell(r.dExp,'up')},
      {k:'dObl', h:'&Delta; Obligations', cls:'n', get:r=>r.dObl, cell:r=>dCell(r.dObl,'down')},
      {k:'dUlo', h:'&Delta; ULO', cls:'n', get:r=>r.dUlo, cell:r=>dCell(r.dUlo,'down')},
      {k:'uloB', h:'ULO now', cls:'n', get:r=>r.uloB, cell:r=>cM(r.uloB)}
    ], gs, {sortKey:'dUlo', sortDir:'asc', preSorted:!!byPart, total:(rw,col)=>
      col.k==='key'? 'TOTAL' : col.k==='dExp'? dCell(t.dExp,'up')
      : col.k==='dObl'? dCell(t.dObl,'down') : col.k==='dUlo'? dCell(t.dUlo,'down')
      : col.k==='uloB'? cM(t.uloB) : ''})
    + '</div>';
}

/* ============================================================================
   TREND
   ============================================================================ */
function viewTrend(){
  const ps = DB.periods.filter(p=>p.key!==UNDATED);
  if(ps.length < 2){
    return card('Trend', 'needs two or more dated periods',
      '<div class="empty"><div class="big">Not enough history yet</div>'
      + 'The trend needs at least two dated months. '
      + (DB.periods.some(p=>p.key===UNDATED)
          ? 'One import has no date in its file name &mdash; give it a month under <b>File &rarr; Periods</b> and it joins the series.'
          : 'Import another month and the series builds itself.')
      + '<div style="margin-top:14px"><button class="mbtn go" data-act="import">Import another month</button>'
      + ' <button class="mbtn pill" data-act="periods">Periods…</button></div></div>');
  }

  const ser = CED.series(ps, CED.inPeriod);
  const bn  = CED.burn(ser);
  const last = ser[ser.length-1];
  let h = '';

  h += '<div class="tiles">'
    + tile('Periods', fN(ser.length), esc(ser[0].label)+' to '+esc(last.label), 'b')
    + tile('Balance now', '$'+fM(last.ulo)+'M', esc(last.label), 'r')
    + tile('Paid out / month', bn? '$'+fM(bn.rate)+'M' : '&ndash;',
           bn? 'mean over '+bn.months+' month'+(bn.months===1?'':'s') : '', 'g')
    + tile('Months to clear', (bn && bn.runway!==null)? bn.runway.toFixed(1) : '&ndash;',
           'at the observed rate', 'a')
    + tile('Total paid out', bn? '$'+fM(bn.expended)+'M' : '&ndash;', 'across the series', 't')
    + tile('Change in balance', ser.length>1
        ? ((last.ulo-ser[0].ulo>0?'+':'−')+'$'+fM(Math.abs(last.ulo-ser[0].ulo))+'M') : '&ndash;',
        'first period to last', (last.ulo-ser[0].ulo)<=0?'g':'r')
    + '</div>';

  if(bn && bn.runway!==null){
    /* Does the observed burn clear the balance before it starts cancelling?

       The date to measure against is the NEXT cancel date, not the earliest one
       on file. Balances whose cancel date has already passed are a different
       problem entirely - they have already cancelled - and quoting one of them
       here produced "the earliest cancel date is 1 Oct 2020, -71 months out",
       which is not a sentence about the future. Those are called out in their
       own right instead, and belong to the Cancellation Risk view. */
    const asOfL = last.asOf;
    const open  = last.lines.filter(L=>L.cancD && Math.abs(L.ulo)>CED.EPS);
    const past  = asOfL? open.filter(L=>L.cancD <= asOfL) : [];
    const ahead = asOfL? open.filter(L=>L.cancD >  asOfL) : open;
    const soonest = ahead.length? ahead.map(L=>L.cancD).sort()[0] : '';
    const mTo = (soonest && asOfL)? CED.monthsTo(asOfL, soonest) : null;
    const tight = mTo!==null && bn.runway > mTo;

    h += '<div class="note '+(tight||past.length? 'r':'b')+'">'
      + '<b>At $'+fM(bn.rate)+'M a month</b>, the $'+fM(last.ulo)+'M on the books clears in about '
      + '<b>'+bn.runway.toFixed(1)+' month'+(bn.runway.toFixed(1)==='1.0'?'':'s')+'</b>. '
      + (mTo===null
          ? 'Nothing in the current period has a cancel date still ahead of it to measure that against. '
          : ('The next cancel date is <b>'+esc(dLabel(soonest))+'</b>, '+mTo+' month'+(mTo===1?'':'s')+' out'
             + (tight ? ' &mdash; <b>the rate does not clear the balance before money starts cancelling</b>. '
                      : ', so the rate clears it with room to spare. ')))
      + (past.length
          ? '<b>Separately, $'+fM(CED.totals(past).ulo)+'M on '+fN(past.length)+' line'
            + (past.length===1?'':'s')+' is already past its cancel date</b> and is not a burn-rate '
            + 'question at all &mdash; see <b>Cancellation Risk</b>. '
          : '')
      + 'This is a straight-line reading of what has actually happened, not a forecast: '
      + 'it assumes the rate holds and that nothing further is obligated.</div>';
  }

  /* the series as columns */
  h += card('Unliquidated balance by period', 'the position at each month end',
        CH.cols(ser.map(s=>({label:s.label, v:s.ulo, tone:'red'})), {h:230}));

  h += '<div class="grid g2">'
    + card('Obligations and expenditures by period', '',
        CH.stack(ser.map(s=>({label:s.label,
            segs:[{v:s.exp, tone:'green', name:'Expended'},{v:s.ulo, tone:'red', name:'Unliquidated'}],
            total:s.obl, sub:fPct(s.pctExp)})), {labelW:110})
        + CH.legend([{tone:'green',name:'Expended'},{tone:'red',name:'Unliquidated'}]))
    + card('Paid out each period', 'expenditures only - deobligations are not burn',
        CH.cols(ser.slice(1).map(s=>({label:s.label, v:s.cmp.bridge.expUp, tone:'green',
            sub:s.months>1? s.months+' mo':''})), {h:200, emptyMsg:'Needs two periods.'}))
    + '</div>';

  /* the table behind the charts */
  h += card('The series', 'every figure behind the charts',
    '<div class="scroll">' + dataTable('tr-ser', [
      {k:'label', h:'Period', get:r=>r.label, cell:r=>'<b>'+esc(r.label)+'</b>'},
      {k:'asOf',  h:'As of', cls:'c', get:r=>r.asOf||'', cell:r=>r.asOf? esc(dLabel(r.asOf)) : '<span class="pill">&ndash;</span>'},
      {k:'n',     h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
      {k:'obl',   h:'Obligations', cls:'n', get:r=>r.obl, cell:r=>cM(r.obl)},
      {k:'exp',   h:'Expenditures', cls:'n', get:r=>r.exp, cell:r=>cM(r.exp)},
      {k:'ulo',   h:'ULO', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
      {k:'pct',   h:'Expended', cls:'n', get:r=>r.pctExp===null?-1:r.pctExp,
       cell:r=>meter(r.pctExp)+' '+fPct(r.pctExp)},
      {k:'paid',  h:'Paid out in period', cls:'n', get:r=>r.cmp? r.cmp.bridge.expUp : 0,
       cell:r=>r.cmp? dCell(r.cmp.bridge.expUp,'up') : '<span class="pill">first</span>'},
      {k:'dUlo',  h:'&Delta; ULO', cls:'n', get:r=>r.dUlo||0,
       cell:r=>r.cmp? dCell(r.dUlo,'down') : '<span class="pill">first</span>'}
    ], ser, {sortKey:'label', sortDir:'asc'}) + '</div>', {flush:true});

  /* per-contract trend, because one contract can hide inside a portfolio */
  const ktrs = [...new Set(CED.everything().map(L=>L.piin))];
  if(ktrs.length > 1){
    const rows = ktrs.map(k=>{
      const cells = ser.map(s=>CED.totals(s.lines.filter(L=>L.piin===k)));
      return {k, ktr:(CED.everything().find(L=>L.piin===k)||{}).ktr||k, cells};
    });
    let ct = '<table class="t"><thead><tr><th>Contract</th>'
      + ser.map(s=>'<th class="n">'+esc(s.label)+'</th>').join('')
      + '<th class="n">Change</th></tr></thead><tbody>';
    rows.forEach(r=>{
      const d = r.cells[r.cells.length-1].ulo - r.cells[0].ulo;
      ct += '<tr><td class="mono"><b>'+esc(r.ktr)+'</b></td>'
         +  r.cells.map(c=>'<td class="n">'+cM(c.ulo)+'</td>').join('')
         +  '<td class="n">'+dCell(d,'down')+'</td></tr>';
    });
    ct += '<tr class="tot"><td>TOTAL</td>'
       +  ser.map(s=>'<td class="n">'+cM(s.ulo)+'</td>').join('')
       +  '<td class="n">'+dCell(last.ulo-ser[0].ulo,'down')+'</td></tr>';
    ct += '</tbody></table>';
    h += card('Unliquidated balance by contract, by period', '$M', ct, {flush:true});
  }

  return h;
}

/* ============================================================================
   PERIODS MANAGER - how a month gets identified when the file name did not
   say, and how one gets thrown away.
   ============================================================================ */
function viewPeriods(){
  let t = '<table class="t"><thead><tr><th>Period</th><th class="c">As of</th>'
    + '<th class="n">Contracts</th><th class="n">Lines</th><th class="n">Obligations</th>'
    + '<th class="n">ULO</th><th>Files</th><th></th></tr></thead><tbody>';
  DB.periods.forEach(p=>{
    const ls = CED.inPeriod(p.key);
    const tt = CED.totals(ls);
    const isU = p.key===UNDATED;
    t += '<tr>'
      + '<td><b>'+esc(p.label)+'</b>'+(p.key===DB.cur? ' <span class="pill b">showing</span>':'')
      + (isU? ' <span class="pill a">needs a month</span>':'')+'</td>'
      + '<td class="c">'+(p.asOf? esc(dLabel(p.asOf)) : '<span class="pill">&ndash;</span>')+'</td>'
      + '<td class="n">'+fN(p.files.length)+'</td>'
      + '<td class="n">'+fN(tt.n)+'</td>'
      + '<td class="n">'+cM(tt.obl)+'</td>'
      + '<td class="n">'+cM(tt.ulo)+'</td>'
      + '<td style="font-size:11px;color:var(--dim)">'+p.files.map(f=>esc(f.name)).join('<br>')+'</td>'
      + '<td class="n" style="white-space:nowrap">'
      + '<button class="mbtn pill" data-act="setMonth" data-v="'+esc(p.key)+'">Set month…</button> '
      + '<button class="mbtn pill" data-act="dropPeriod" data-v="'+esc(p.key)+'">Remove</button>'
      + '</td></tr>';
  });
  t += '</tbody></table>';

  modal('Periods', '<div class="note b">A period is a <b>month</b>, taken from the date in each file name. '
    + 'Files whose name carries no date land in <b>Undated</b>; give them a month here and they join the '
    + 'comparison and the trend. Setting a month that already exists <b>merges</b> the two.</div>'
    + '<div class="scroll bx">'+t+'</div>');
}
</script>

<script>
/* ============================================================================
   EXPORTS.  CSV, a minimal XLSX writer, and Save copy.

   There is no library here and there cannot be one, so the .xlsx is built by
   hand: a stored (uncompressed) zip with real CRC-32s. Stored rather than
   deflated because it is a dozen lines instead of a compressor, and these
   workbooks are small - the whole point is that it opens in Excel without a
   repair prompt, not that it is small.
   ============================================================================ */

function dl(name, blob){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
}

/* --------------------------------------------------------------------- CSV */
function csvCell(v){
  const s = (v===null||v===undefined)? '' : ''+v;
  return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCsv(){
  const ls = CED.scope();
  const head = ['Contract','Participant','Appropriation','FY','CLIN','CLIN Title','CLIN Type','ACRN',
                'Obligations','Expenditures','ULO','Obl minus Exp','Reconciles',
                'Expiration','Cancel','Months to cancel','Funding','Comment','Source file'];
  const rows = ls.map(L=>[
    L.ktr, L.part, L.appn, L.fy, L.clin, L.title, L.ctype, L.acrn,
    L.obl.toFixed(2), L.exp.toFixed(2), L.ulo.toFixed(2), L.uloCalc.toFixed(2), L.uloOk? 'yes':'NO',
    L.expD, L.cancD, (curAsOf() && L.cancD)? CED.monthsTo(curAsOf(), L.cancD) : '',
    L.fund, L.cmt, fileOf(L).name||''
  ]);
  const csv = [head].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n');
  dl('CED CLIN lines '+curPeriod().label+'.csv',
     new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}));
  setStat('&#9989; Exported <b>'+fN(ls.length)+'</b> lines to CSV.');
}

/* ------------------------------------------------------------------- CRC-32 */
const CRC_T = (function(){
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++) c = (c&1)? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

/* ---------------------------------------------------------- stored-zip writer */
/* ONE ZIP WRITER, TWO SHAPES.

   zipBytes returns the archive as bytes so it can be NESTED - a batch of
   worklists is a zip whose members are themselves .xlsx zips, and a Blob
   cannot be read back synchronously to put inside another one. zipStore is
   the same thing wrapped for download. There is deliberately no second copy
   of the format: a stored zip with a wrong CRC-32 is Excel's "found
   unreadable content" prompt, and one implementation of that is enough. */
function zipBytes(files){
  const enc = new TextEncoder();
  const parts=[], central=[];
  let off=0;
  files.forEach(f=>{
    const nameB = enc.encode(f.name);
    const dataB = (typeof f.data==='string')? enc.encode(f.data) : f.data;
    const crc = crc32(dataB);
    const lh = new Uint8Array(30+nameB.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,dataB.length,true); dv.setUint32(22,dataB.length,true);
    dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true);
    lh.set(nameB,30);
    parts.push(lh, dataB);

    const ch = new Uint8Array(46+nameB.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,dataB.length,true); cv.setUint32(24,dataB.length,true);
    cv.setUint16(28,nameB.length,true);
    cv.setUint32(42,off,true);
    ch.set(nameB,46);
    central.push(ch);
    off += lh.length + dataB.length;
  });
  let cLen=0; central.forEach(c=>cLen+=c.length);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cLen,true); ev.setUint32(16,off,true);
  const all = parts.concat(central, [end]);
  let n = 0; all.forEach(b=>n += b.length);
  const out = new Uint8Array(n);
  let at = 0; all.forEach(b=>{ out.set(b, at); at += b.length; });
  return out;
}

/* one zip writer for every product - the .xlsx, the .pptx and the batch of
   worklists differ only in the media type they declare */
function zipStore(files, mime){
  return new Blob([zipBytes(files)],
    {type: mime || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const xe = s => (''+(s===null||s===undefined?'':s))
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* Excel rejects the C0 range outright, so strip it rather than emit a file
   that opens with a repair prompt. */
const xclean = s => (''+s).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');

function sheetXml(rows){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((r,ri)=>{
    x += '<row r="'+(ri+1)+'">';
    r.forEach((c,ci)=>{
      let ref=''; let n=ci+1;
      while(n>0){ const m=(n-1)%26; ref=String.fromCharCode(65+m)+ref; n=Math.floor((n-1)/26); }
      ref += (ri+1);
      if(typeof c==='number' && isFinite(c)) x += '<c r="'+ref+'"><v>'+c+'</v></c>';
      else if(c!=='' && c!==null && c!==undefined)
        x += '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(xclean(c))+'</t></is></c>';
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}

function exportXlsx(){
  const ls = CED.scope();
  const t  = CED.totals(ls);
  const bands = CED.riskBands(ls, curAsOf());

  const sum = [
    ['Contract Execution Dashboard'],
    ['Period', curPeriod().label],
    ['As of', curAsOf()? dLabel(curAsOf()) : '(no as-of date in the file names)'],
    ['Generated', new Date().toISOString().slice(0,19).replace('T',' ')],
    ['Scope', ls.length===CED.all().length? 'all imported lines' : 'FILTERED - '+ls.length+' of '+CED.all().length+' lines'],
    [],
    ['','Lines','Obligations','Expenditures','ULO','% Expended'],
    ['TOTAL', t.n, t.obl, t.exp, t.ulo, t.pctExp===null? '' : t.pctExp],
    [],
    ['By contract'],
    ['','Lines','Obligations','Expenditures','ULO','% Expended']
  ];
  CED.byContract(ls).forEach(c=>sum.push([c.label, c.n, c.obl, c.exp, c.ulo, c.pctExp===null?'':c.pctExp]));
  sum.push([], ['By participant'], ['','Lines','Obligations','Expenditures','ULO','% Expended']);
  CED.byParticipant(ls).forEach(c=>sum.push([c.label, c.n, c.obl, c.exp, c.ulo, c.pctExp===null?'':c.pctExp]));
  sum.push([], ['By cancellation band'], ['','Lines','Obligations','Expenditures','ULO']);
  bands.forEach(b=>sum.push([b.name, b.n, b.obl, b.exp, b.ulo]));

  const lines = [['Contract','Participant','Appropriation','FY','CLIN','CLIN Title','CLIN Type','ACRN',
                  'Obligations','Expenditures','ULO','Obl minus Exp','Reconciles','Expiration','Cancel',
                  'Months to cancel','Funding','Comment','Source file']];
  ls.forEach(L=>lines.push([L.ktr,L.part,L.appn,L.fy,L.clin,L.title,L.ctype,L.acrn,
    L.obl,L.exp,L.ulo,L.uloCalc,L.uloOk?'yes':'NO',L.expD,L.cancD,
    (curAsOf()&&L.cancD)? CED.monthsTo(curAsOf(),L.cancD) : '',
    L.fund,L.cmt,fileOf(L).name||'']));

  const canc = [['Cancel date','Lines','Obligations','Expenditures','ULO']];
  CED.byCancel(ls).forEach(g=>canc.push([g.key||'(none)', g.n, g.obl, g.exp, g.ulo]));

  const names  = ['Summary','CLIN Lines','By Cancel Date'];
  const sheets = [sum, lines, canc];

  /* ---- the two multi-period sheets, when there is more than one period ----
     These are what makes the workbook a trend report rather than a snapshot,
     so they are built from the SAME model functions the views use - there is
     no second implementation of the bridge that could disagree with the
     screen. */
  const dated = DB.periods.filter(p=>p.key!==UNDATED);
  if(DB.periods.length > 1){
    const pa = periodOf(CMP.a), pb = periodOf(CMP.b);
    if(pa && pb && pa.key !== pb.key){
      const c = CED.compare(CED.inPeriod(pa.key), CED.inPeriod(pb.key));
      const b = c.bridge;
      const mom = [
        ['Month over month'],
        ['From', pa.label, 'as of', pa.asOf||''],
        ['To',   pb.label, 'as of', pb.asOf||''],
        [],
        ['Roll-forward', '$'],
        ['Opening balance', b.opening],
        ['Obligations added', b.oblUp],
        ['Deobligations', b.oblDown],
        ['Expenditures', -b.expUp],
        ['Expenditure reversals', -b.expDown],
        ['Lines new to the report', b.addedUlo],
        ['Lines no longer reported', b.removedUlo],
        ['Closing balance', b.closing],
        ['Reconciles', b.ok? 'yes' : 'NO'],
        [],
        ['Movement','Contract','Participant','CLIN','CLIN Title','ACRN',
         'Obl before','Obl after','Change in obligations',
         'Exp before','Exp after','Change in expenditures',
         'ULO before','ULO after','Change in ULO']
      ];
      c.rows.filter(r=>r.moved || r.kind!=='matched').forEach(r=>mom.push([
        CED.moveLabel(r), r.line.ktr, r.line.part, r.line.clin, r.line.title, r.line.acrn,
        r.a? r.a.obl : '', r.b? r.b.obl : '', r.dObl,
        r.a? r.a.exp : '', r.b? r.b.exp : '', r.dExp,
        r.a? r.a.ulo : '', r.b? r.b.ulo : '', r.dUlo
      ]));
      names.push('Month over Month'); sheets.push(mom);
    }
  }
  /* ---- the action register, so the position can be handed to someone ----
     This is the only sheet that is not a reading of the source file, and it is
     the one a PM, KO or contractor is actually sent. */
  const acts = (DB.actions||[]);
  if(acts.length){
    const cov = CED.coverage(ls, acts, curAsOf());
    const act = [
      ['Action register'],
      ['Period', curPeriod().label, 'as of', curAsOf()||''],
      [],
      ['At-risk balance (expired or cancelled)', cov.atRisk.ulo],
      ['Accounted for (carries a disposition)',  cov.covered.ulo],
      ['Unexplained',                            cov.uncovered.ulo],
      ['Confidence', cov.pct===null? '' : cov.pct],
      [],
      ['Status','Action','Detail','Scope','Anchored to','Disposition','Owner','With',
       'Amount','Raised','Due','Closed','Last updated']
    ];
    acts.forEach(a=>act.push([
      CED.actStatus(a.status).name, a.title, a.detail,
      (CED.ACT_SCOPE.find(x=>x.id===a.scope)||{}).name || a.scope, a.target,
      (CED.actDisp(a.disp)||{}).name || '', a.owner, a.withWho,
      a.amount===null? '' : a.amount, a.opened, a.due, a.closed,
      (a.updated||'').slice(0,10)
    ]));
    names.push('Actions'); sheets.push(act);
  }

  if(dated.length > 1){
    const ser = CED.series(dated, CED.inPeriod);
    const bn  = CED.burn(ser);
    const tr = [
      ['Trend'],
      ['Periods', ser.length, 'from', ser[0].label, 'to', ser[ser.length-1].label],
      bn? ['Paid out per month (mean)', bn.rate, 'over', bn.months, 'months'] : ['Paid out per month', 'n/a'],
      (bn && bn.runway!==null)? ['Months to clear at that rate', bn.runway] : ['Months to clear', 'n/a'],
      [],
      ['Period','As of','Lines','Obligations','Expenditures','ULO','% Expended',
       'Paid out in period','Deobligated in period','Change in ULO','Months since previous']
    ];
    ser.forEach(x=>tr.push([
      x.label, x.asOf||'', x.n, x.obl, x.exp, x.ulo, x.pctExp===null? '' : x.pctExp,
      x.cmp? x.cmp.bridge.expUp : '', x.cmp? Math.abs(x.cmp.bridge.oblDown) : '',
      x.cmp? x.dUlo : '', x.cmp? x.months : ''
    ]));
    /* and the same series per contract, because one contract hides inside a
       portfolio total */
    const ktrs = [...new Set(CED.everything().map(L=>L.piin))];
    if(ktrs.length > 1){
      tr.push([], ['Unliquidated balance by contract'],
              ['Contract'].concat(ser.map(x=>x.label)));
      ktrs.forEach(k=>{
        const nm = (CED.everything().find(L=>L.piin===k)||{}).ktr || k;
        tr.push([nm].concat(ser.map(x=>CED.totals(x.lines.filter(L=>L.piin===k)).ulo)));
      });
    }
    names.push('Trend'); sheets.push(tr);
  }
  dl('Contract Execution Dashboard ' + curPeriod().label + '.xlsx', xlsxOf(names, sheets));
  setStat('&#9989; Built an .xlsx for <b>'+esc(curPeriod().label)+'</b> &mdash; '
    + fN(ls.length)+' lines across '+names.length+' sheets'
    + (names.length>3? ' (including month over month and the trend)' : '')+'.');
}

/* THE package builder, extracted so the workbook the owner briefs from and the
   worklist a contracting officer is sent are produced by the same code. */
function xlsxFiles(names, sheets){
  const files = [
    {name:'[Content_Types].xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '</Types>'},
    {name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>'},
    {name:'xl/workbook.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
      + names.map((n,i)=>'<sheet name="'+xe(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')
      + '</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + names.map((n,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')
      + '</Relationships>'}
  ];
  sheets.forEach((s,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml', data:sheetXml(s)}));
  return files;
}
/* the workbook the owner briefs from, the worklist one contact is sent and the
   batch that goes to a dozen of them are all built by THIS packager, so they
   cannot drift apart */
function xlsxOf(names, sheets){    return zipStore(xlsxFiles(names, sheets)); }
function xlsxBytes(names, sheets){ return zipBytes(xlsxFiles(names, sheets)); }

/* ==========================================================================
   SAVE COPY.  The saved file is this page with the data payload written into
   it - so it opens on any machine with no import step. A saved copy CONTAINS
   contract data and is a CUI artefact; the shipped file contains none.
   ========================================================================== */
function saveCopy(){
  if(!DB){ setStat('&#9888; Nothing to save - import a file first.'); return; }
  const root = document.documentElement;
  const hadTheme = root.getAttribute('data-theme');
  /* the theme is the reader's preference; opening someone else's copy must
     not restyle your screen */
  if(hadTheme) root.removeAttribute('data-theme');
  const host = $('modalHost').innerHTML;
  $('modalHost').innerHTML = '';
  try{
    const doc = '<!doctype html>\n' + root.outerHTML;
    const payload = JSON.stringify(DB).replace(/<\//g, '<\\/');
    const out = doc.replace(
      /(<script type="application\/json" id="pubState">)[\s\S]*?(<\/script>)/,
      (m,a,b)=>a+payload+b);
    if(out.indexOf(payload)<0) throw new Error('the payload slot was not found in the page');
    const stamp = (curAsOf()||new Date().toISOString().slice(0,10));
    dl('Contract Execution Dashboard '+stamp+' (CUI).html',
       new Blob([out], {type:'text/html;charset=utf-8'}));
    DIRTY = false;
    setStat('&#9989; Saved a copy carrying <b>'+fN(DB.lines.length)+'</b> lines across '
          + fN(DB.periods.length) + ' period' + (DB.periods.length===1?'':'s') + '. '
          + '<b>That file is CUI</b> - it contains contract execution data.');
  }catch(err){
    setStat('&#9888; <span class="bad">Save failed:</span> '+esc(err&&err.message||err));
  }finally{
    if(hadTheme) root.setAttribute('data-theme', hadTheme);
    $('modalHost').innerHTML = host;
  }
}

/* Read a payload back out of a saved copy without leaving this page. */
async function loadCopy(inp){
  const f = inp.files && inp.files[0];
  inp.value='';
  if(!f) return;
  try{
    const txt = await f.text();
    const m = /<script type="application\/json" id="pubState">([\s\S]*?)<\/script>/.exec(txt);
    if(!m) throw new Error('that file carries no CED payload');
    const db = JSON.parse(m[1].replace(/<\\\//g,'</'));
    if(!db || !db.lines || !db.lines.length) throw new Error('the payload in that file is empty');
    adoptDb(db);
    setStat('&#9989; Opened <b>'+esc(f.name)+'</b> &mdash; '+fN(db.lines.length)+' lines.');
  }catch(err){
    setStat('&#9888; <span class="bad">Could not open that file:</span> '+esc(err&&err.message||err));
  }
}

function adoptDb(db){
  /* a v0.1 saved copy is a single snapshot; migrate() turns it into one period
     rather than refusing to open it */
  DB = migrate(db);
  if(!DB.cur || !periodOf(DB.cur)) DB.cur = DB.periods[DB.periods.length-1].key;
  resetFilters(); SORT={}; DIRTY=false; defaultCompare();
  $('cuiChip').className='chip cui';
  $('cuiChip').textContent='CUI//DL ONLY//F-35 PARTNERS';
  paintChrome(); render();
}
</script>
