function slideBlurb(id){
  const m = momModel();
  if(id==='mom')
    return m? 'the roll-forward from '+esc(m.pa.label)+' to '+esc(m.pb.label)
              +', with movement by contract' : 'the roll-forward between two months';
  if(id==='movers')
    return m? 'the largest '+fN(Math.min(18, m.c.rows.filter(r=>r.moved).length))
              +' line movements by change in balance' : 'the largest line movements';
  if(id==='trend'){
    const n = DB? DB.periods.filter(p=>p.key!==UNDATED).length : 0;
    return 'the balance across all '+n+' dated periods, with the burn rate';
  }
  if(id==='actions'){
    if(!DB) return 'the confidence figure and what is open';
    const c = CED.coverage(CED.scope(), actions(), curAsOf());
    return 'confidence &mdash; ' + (c.pct===null? 'no basis' : fPct(c.pct))
         + ' of $' + fM(c.atRisk.ulo) + 'M at risk has a disposition';
  }
  if(id==='unex'){
    const u = unexModel();
    if(!u) return 'where the unexplained balance went, and how much was answered';
    return 'unexplained $'+fM(u.br.opening)+'M &rarr; $'+fM(u.br.closing)
         + 'M, of which $'+fM(Math.abs(u.br.parts.explained))+'M was answered';
  }
  if(id==='disp'){
    if(!DB) return 'what becomes of the at-risk money, contract by contract';
    const D = dispModel();
    if(!D) return 'nothing is at risk in this period';
    return fN(D.rows.length)+' contract'+(D.rows.length===1?'':'s')+' &mdash; '
         + (D.all.pct===null? 'no basis' : fPct(D.all.pct))
         + ' of $'+fM(D.all.atRisk.ulo)+'M has a disposition';
  }
  if(id==='aging'){
    if(!DB) return 'how long the open work has been open, and whose it is';
    const today = new Date().toISOString().slice(0,10);
    const open = actions().filter(CED.actOpen);
    if(!open.length) return 'no action is open';
    const rs = CED.agingByOwner(actions(), today, actAmount);
    const ages = open.map(a=>CED.actAge(a, today)).filter(d=>d!==null);
    const med = CED.median(ages);
    return fN(open.length)+' open across '+fN(rs.length)+' owner'
         + (rs.length===1?'':'s') + (med===null? '' : ', median age '+med+' days');
  }
  if(id==='worklist'){
    if(!DB) return 'who was asked, and who has not come back';
    const rs = wlRows();
    if(!rs.length) return 'nobody in the contact register owns a line yet';
    const never = rs.filter(r=>r.state==='never').length;
    const late  = rs.filter(r=>r.state==='overdue').length;
    return fN(rs.length) + ' contacts &mdash; ' + fN(never) + ' never asked, '
         + fN(late) + ' overdue';
  }
  if(id==='appn'){
    const rs = appnModel();
    if(!rs) return 'the money by the rule that governs it';
    const one = rs.filter(r=>r.life && r.life.yrs === 1).reduce((s,r)=>s+r.ulo, 0);
    return fN(rs.length)+' appropriations &mdash; $'+fM(one)+'M of it one-year money';
  }
  if(id==='top'){
    const t = topModel();
    if(!t) return 'where the balance actually sits';
    const n50 = t.need[0.5];
    return 'the ten largest carry $'+fM(t.top.ulo)+'M'
         + (n50===null? '' : '; half the balance sits on '+n50+' lines');
  }
  if(id==='part'){
    const rs = partModel();
    if(!rs) return 'who the money belongs to, in briefing order';
    const t = CED.sortBy(rs, r=>Math.abs(r.ulo), 'desc')[0];
    return fN(rs.length)+' participants &mdash; '+esc(t.label)+' largest at $'
         + fM(t.ulo)+'M';
  }
  if(id==='expiry'){
    const rs = expModel();
    if(!rs) return 'when availability ends, fiscal year by fiscal year';
    const d = rs.filter(r=>r.fy !== null);
    const w = d.filter(r=>r.days !== null && r.days > 0).sort((a,b)=>a.days-b.days)[0];
    return w? ('$'+fM(w.ulo)+'M of FY'+w.fy+' money expires in '+w.days+' days')
            : 'nothing is still available &mdash; all of it has expired or cancelled';
  }
  if(id==='risk'){
    if(!DB) return 'what cancels, and when';
    const b = CED.riskBands(CED.scope(), curAsOf());
    const g = i => (b.find(x=>x.id===i)||{ulo:0}).ulo;
    return 'what cancels and when \u2014 $'+fM(g('cancelled'))+'M already past, $'
         + fM(g('m12'))+'M within 12 months';
  }
  return '';
}
</script>

<script>
/* ============================================================================
   THE ACTION REGISTER - storage, the view, and the form.

   The model (04_model.js) is pure and knows nothing about DB; everything that
   MUTATES lives here, in one place, so there is exactly one path by which an
   action changes and exactly one place that stamps `updated` and appends to the
   log. Scattering that would be how two copies quietly stop being mergeable.
   ============================================================================ */

/* Who is making the change. There is no login on a file:// page, so this is the
   owner's own initials, kept beside the theme in localStorage and NEVER in the
   data payload - it is a property of the person at the keyboard, not of the
   register, and a saved copy opened by someone else must not claim their edits. */
function who(){
  try{ return localStorage.getItem('cedWho') || ''; }catch(e){ return ''; }
}
function setWho(v){
  try{ localStorage.setItem('cedWho', (''+v).trim().slice(0,24)); }catch(e){}
}

function actions(){ return (DB && DB.actions) || []; }
function actById(id){ return actions().find(a=>a.id===id) || null; }

/* THE ONLY WAY AN ACTION CHANGES. Stamps `updated`, appends the log line, and
   marks the file dirty - all three, every time, because a merge that trusts
   `updated` is only as good as the discipline that maintains it. */
function actSave(a, note){
  if(!DB) return null;
  if(!DB.actions) DB.actions = [];
  const bad = CED.actValid(a);
  if(bad.length) return {error: bad};
  const prev = actById(a.id);
  a.updated = new Date().toISOString();
  /* STAMP WHEN THE DISPOSITION CHANGED, here and nowhere else - the same
     reason `updated` is stamped here. A month-over-month reading of
     unexplained money is only as good as the date on the answer. It is dated
     by the PERIOD AS-OF where there is one, not the wall clock, so a register
     kept up to date a week late still lands the answer in the month it was
     about. */
  const dNow = curAsOf() || a.updated.slice(0,10);
  if(!a.disp) a.dispAt = '';
  else if(!prev || !prev.disp || prev.disp !== a.disp || !prev.dispAt) {
    a.dispAt = (prev && prev.disp === a.disp && prev.dispAt) ? prev.dispAt : dNow;
  } else a.dispAt = prev.dispAt;
  if(a.status==='done' && !a.closed) a.closed = (curAsOf() || a.updated.slice(0,10));
  if(a.status!=='done') a.closed = '';
  CED.actLog(a, who(), note || (prev? 'edited' : 'raised'));
  if(prev) Object.assign(prev, a);
  else DB.actions.unshift(a);
  DIRTY = true;
  return {ok:true, action: prev || a};
}

function actDelete(id){
  if(!DB) return;
  const a = actById(id);
  if(!a) return;
  if(!confirm('Delete this action?\n\n"' + a.title + '"\n\n'
    + 'Its history goes with it. Closing it instead keeps the record.')) return;
  DB.actions = actions().filter(x=>x.id!==id);
  DIRTY = true;
  closeModal(); render();
  setStat('Deleted <b>'+esc(a.title)+'</b>.');
}

/* ---------------------------------------------------------------- the form */
let AF = null;                 /* the action being edited, or null            */

function actEdit(id){
  AF = id? Object.assign({}, actById(id)) : null;
  if(id && !AF) return;
  actForm();
}
/* raise one already anchored to a line or a contract */
function actNewFor(scope, target, seed){
  AF = CED.actNew(Object.assign({scope:scope, target:target}, seed||{}));
  AF.__isNew = true;
  actForm();
}

function actForm(err){
  const a = AF || (AF = Object.assign(CED.actNew({}), {__isNew:true}));
  const isNew = !!a.__isNew;
  const L = a.scope==='line'? CED.everything().find(x=>x.key===a.target) : null;

  const sel = (field, list, cur, blank) =>
    '<select data-af="'+field+'">'
    + (blank? '<option value=""'+(cur===''?' selected':'')+'>'+esc(blank)+'</option>' : '')
    + list.map(o=>'<option value="'+esc(o.id)+'"'+(cur===o.id?' selected':'')+'>'
        + esc(o.name)+'</option>').join('')
    + '</select>';
  const inp = (field, val, ph, type) =>
    '<input data-af="'+field+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"'
    + (ph? ' placeholder="'+esc(ph)+'"' : '') + ' style="width:100%">';
  const row = (lbl, ctl, hint) =>
    '<div style="margin-bottom:10px"><label style="display:block;font-size:10px;'
    + 'letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:3px">'
    + lbl + '</label>' + ctl
    + (hint? '<div style="font-size:11px;color:var(--dim);margin-top:3px">'+hint+'</div>' : '')
    + '</div>';

  let b = '';

  /* what it is anchored to - shown, not editable, because re-anchoring an
     action to a different line is a different action */
  b += '<div class="note b"><b>Anchored to:</b> '
    + (a.scope==='portfolio'
        ? 'the portfolio &mdash; not tied to a contract or a line'
        : a.scope==='contract'
          ? 'contract <span class="mono">'+esc(a.target)+'</span>'
          : (L
              ? '<span class="mono">'+esc(L.ktr)+'</span> &middot; CLIN <span class="mono">'
                + esc(L.clin)+'</span> &middot; ACRN <span class="mono">'+esc(L.acrn)+'</span>'
                + ' &middot; ' + esc(L.part)
                + ' &middot; ULO <b>'+fD(L.ulo)+'</b>'
              : '<span class="mono">'+esc(a.target)+'</span> <span class="pill a">that line is '
                + 'not in the period being shown</span>'))
    + '</div>';

  b += '<div class="grid g2">';
  b += '<div>'
    + row('Title'+REQ, inp('title', a.title, 'what has to happen, in a few words'))
    + row('Detail', '<textarea data-af="detail" rows="5" style="width:100%;background:var(--panelA);'
        + 'border:1px solid var(--line2);border-radius:5px;padding:6px 8px;font:inherit;font-size:12px;'
        + 'color:var(--ink)" placeholder="the finding, what was tried, what it is waiting on">'
        + esc(a.detail) + '</textarea>')
    + row('Status', sel('status', CED.ACT_STATUS, a.status))
    + row('Disposition', sel('disp', CED.ACT_DISP, a.disp, '(not yet decided)'),
        'What becomes of the money. This is what the confidence figure counts &mdash; '
        + 'an action with no disposition reads as unexplained.')
    + '</div>';
  b += '<div>'
    + row('Owner (us)', inp('owner', a.owner, 'who on the team'))
    + row('With (them)', inp('withWho', a.withWho, 'PM, contracting officer, contractor'))
    + row('Amount at issue', inp('amount', a.amount==null? '' : a.amount, 'dollars'),
        'Leave blank to use the line&rsquo;s own balance.')
    + row('Due', inp('due', a.due, '', 'date'),
        curAsOf()? 'Overdue is measured against the period as-of, '+esc(dLabel(curAsOf()))
                 + ' &mdash; not today, so a briefing can be reconciled later.' : '')
    + row('Raised', inp('opened', a.opened, '', 'date'))
    + '</div></div>';

  if(a.log && a.log.length){
    b += '<div class="card" style="margin:12px 0 0"><div class="hd"><h3>History</h3>'
      + '<span class="sub">append-only</span></div><div class="bd flush"><div class="scroll sm">'
      + '<table class="t"><thead><tr><th>When</th><th>Who</th><th>Status</th><th>What</th></tr></thead><tbody>'
      + a.log.slice().reverse().map(e=>'<tr><td class="mono" style="white-space:nowrap">'
          + esc((e.at||'').slice(0,16).replace('T',' '))+'</td>'
          + '<td>'+(esc(e.who)||'<span class="pill">&ndash;</span>')+'</td>'
          + '<td><span class="pill '+CED.actStatus(e.status).tone+'">'
          + esc(CED.actStatus(e.status).name)+'</span></td>'
          + '<td>'+esc(e.text)+'</td></tr>').join('')
      + '</tbody></table></div></div></div>';
  }

  b += formErr(err);
  b += '<div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    + '<button class="mbtn go" data-act="actApply">'+(isNew? 'Raise action' : 'Save')+'</button>'
    + '<button class="mbtn pill" data-act="closeModal">Cancel</button>'
    + (isNew? '' : ' <button class="mbtn pill" data-act="actDelete" data-v="'+esc(a.id)+'">Delete</button>')
    + '<span style="flex:1"></span>'
    + '<label style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)">Your initials</label>'
    + '<input data-af="__who" value="'+esc(who())+'" placeholder="BL" style="width:70px;'
    + 'background:var(--panelA);border:1px solid var(--line2);border-radius:5px;padding:3px 7px;font-size:12px">'
    + '</div>';

  modal(isNew? 'Raise an action' : 'Action', b);
  formFocus('[data-af="title"]');
}

/* Read the form back out of the DOM and save it. */
function actApply(){
  if(!AF) return;
  const host = $('modalHost');
  host.querySelectorAll('[data-af]').forEach(el=>{
    const f = el.dataset.af;
    if(f==='__who'){ setWho(el.value); return; }
    if(f==='amount'){
      const v = (''+el.value).trim();
      AF.amount = v===''? null : num(v);
      return;
    }
    AF[f] = el.value;
  });
  const isNew = !!AF.__isNew;
  delete AF.__isNew;
  const r = actSave(AF, isNew? 'raised' : 'edited');
  if(r && r.error){ AF.__isNew = isNew; actForm(r.error); return; }
  AF = null;
  closeModal(); paintChrome(); render();
  setStat('&#9989; ' + (isNew? 'Raised' : 'Saved') + ' &mdash; '
    + fN(actions().filter(CED.actOpen).length) + ' action'
    + (actions().filter(CED.actOpen).length===1?'':'s') + ' open.');
}

/* ============================================================================
   VIEW: the register
   ============================================================================ */
function viewActions(){
  const asOf = curAsOf();
  const all  = actions();
  const rows = CED.actFilter(all, AQ, asOf);
  const ls   = CED.all();
  const cov  = CED.coverage(ls, all, asOf);
  const orph = CED.orphans(all, ls);
  const owners = [...new Set(all.map(a=>a.owner).filter(Boolean))].sort();

  let h = '';

  /* ---- the confidence figure ------------------------------------------- */
  h += '<div class="tiles">'
    + tile('Open actions', fN(all.filter(CED.actOpen).length),
        fN(all.length)+' raised in total', 'b')
    + tile('Overdue', fN(all.filter(a=>CED.actOverdue(a, asOf)).length),
        asOf? 'against '+dLabel(asOf) : 'no as-of date',
        all.some(a=>CED.actOverdue(a, asOf))? 'r' : 'g')
    + tile('At-risk balance', '$'+fM(cov.atRisk.ulo)+'M',
        fN(cov.atRisk.n)+' expired or cancelled lines', 'a')
    + tile('Accounted for', cov.pct===null? '&ndash;' : fPct(cov.pct),
        '$'+fM(cov.covered.ulo)+'M has a disposition',
        (cov.pct!==null && cov.pct>=0.8)? 'g' : (cov.pct!==null && cov.pct>=0.4)? 'a' : 'r')
    + tile('Unexplained', '$'+fM(cov.uncovered.ulo)+'M',
        fN(cov.uncovered.n)+' lines with nothing said about them',
        cov.uncovered.ulo>=CED.EPS? 'r' : 'g')
    + tile('Closed', fN(all.filter(a=>!CED.actOpen(a)).length), 'done', 't')
    + '</div>';

  h += '<div class="note b"><b>Accounted for</b> is the confidence figure: of the balance that '
    + 'can still be lost &mdash; expired or already cancelled &mdash; how much carries an action '
    + 'that says <i>what becomes of the money</i>. An open action with no disposition set counts '
    + 'as <b>unexplained</b>, deliberately: work in progress is not yet an answer.</div>';

  /* what we say will happen to it */
  const dispRows = CED.ACT_DISP.map(d=>Object.assign({d:d}, cov.byDisp[d.id]))
      .concat([{d:{id:'', name:'Nothing said', tone:'r'}, ...cov.uncovered}]);
  h += card('What we say becomes of the at-risk money', 'the briefable position',
      dataTable('ac-disp', [
        {k:'name', h:'Disposition', get:r=>r.d.name,
         cell:r=>'<span class="pill '+(r.d.tone||'')+'">'+esc(r.d.name)+'</span>'},
        {k:'n',   h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
        {k:'ulo', h:'Unliquidated', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
        {k:'sh',  h:'Share', cls:'n', get:r=>r.ulo,
         cell:r=>Math.abs(cov.atRisk.ulo)>CED.EPS? fPct(r.ulo/cov.atRisk.ulo) : '&ndash;'}
      ], dispRows, {preSorted:true, total:(rw,c)=>
        c.k==='name'? 'AT RISK' : c.k==='n'? fN(cov.atRisk.n)
        : c.k==='ulo'? cM(cov.atRisk.ulo) : c.k==='sh'? '100.0%' : ''}), {flush:true});

  /* ---- the register ----------------------------------------------------- */
  const stOpts = [['','All'],['__open','Open (any)'],['__done','Closed']]
    .concat(CED.ACT_STATUS.map(s=>[s.id, s.name]));
  const dpOpts = [['','All'],['__none','No disposition set']]
    .concat(CED.ACT_DISP.map(d=>[d.id, d.name]));

  let filt = '<div class="filt">'
    + '<label>Find</label><input id="aqBox" type="search" placeholder="title, detail, owner, target"'
    + ' value="'+esc(AQ.q)+'" style="min-width:200px">'
    + '<label>Status</label><select data-aq="status">'
    + stOpts.map(([v,l])=>'<option value="'+v+'"'+(AQ.status===v?' selected':'')+'>'+l+'</option>').join('')
    + '</select>'
    + '<label>Disposition</label><select data-aq="disp">'
    + dpOpts.map(([v,l])=>'<option value="'+v+'"'+(AQ.disp===v?' selected':'')+'>'+l+'</option>').join('')
    + '</select>'
    + '<label>Owner</label><select data-aq="owner"><option value="">All</option>'
    + owners.map(o=>'<option value="'+esc(o)+'"'+(AQ.owner===o?' selected':'')+'>'+esc(o)+'</option>').join('')
    + '</select>'
    + '<button data-aq-toggle="overdue" class="'+(AQ.overdue?'':'')+'">'
    + (AQ.overdue? '&#10003; Overdue only' : 'Overdue only')+'</button>'
    + '<button data-act="clearActionFilters">Clear</button>'
    + '<span style="flex:1"></span>'
    + '<button class="mbtn go" data-act="actNew">Raise an action</button>'
    + '</div>';

  /* ---- WHAT BECOMES OF IT, CONTRACT BY CONTRACT -----------------------
     The portfolio confidence figure above tells a contracting officer running
     ONE contract nothing about their own. Same model call as the slide. */
  {
    const D = CED.dispByContract(CED.scope(), all, curAsOf());
    if(D.rows.length && Math.abs(D.all.atRisk.ulo) > CED.EPS){
      const A = D.all;
      let m = '<div class="scroll"><table class="t"><thead><tr>'
        + '<th>Contract</th><th class="n">At risk</th>'
        + CED.ACT_DISP.map(d=>'<th class="n">'+esc(d.name)+'</th>').join('')
        + '<th class="n">Nothing said</th><th class="n">Accounted</th>'
        + '</tr></thead><tbody>';
      const cell = (v, tone) => '<td class="n'+(Math.abs(v)>CED.EPS && tone? ' '+tone : '')
        + '">' + cMz(v) + '</td>';
      D.rows.forEach(r=>{
        m += '<tr class="clk" data-contract="'+esc(r.piin)+'">'
          + '<td class="nw"><b>'+esc(r.ktr)+'</b></td>'
          + '<td class="n"><b>'+cMz(r.atRisk)+'</b></td>'
          + CED.ACT_DISP.map(d=>cell(r.cov.byDisp[d.id].ulo, d.tone)).join('')
          + cell(r.uncovered, 'r')
          + '<td class="n">'+(r.pct===null? '<span class="pill">&ndash;</span>'
              : '<span class="pill '+(r.pct>=0.8?'g':r.pct>=0.4?'a':'r')+'">'
                + fPct(r.pct)+'</span>')+'</td></tr>';
      });
      m += '<tr class="tot"><td><b>ALL</b></td><td class="n"><b>'+cMz(A.atRisk.ulo)+'</b></td>'
        + CED.ACT_DISP.map(d=>'<td class="n"><b>'+cMz(A.byDisp[d.id].ulo)+'</b></td>').join('')
        + '<td class="n"><b>'+cMz(A.uncovered.ulo)+'</b></td>'
        + '<td class="n"><b>'+(A.pct===null? '&ndash;' : fPct(A.pct))+'</b></td></tr>'
        + '</tbody></table></div>';
      m += '<div class="note '+(D.ok? 'b':'r')+'" style="margin-top:10px">'
        + (D.ok
            ? '<b>This table adds up in both directions</b>, and it is the only one in '
              + 'the tool that does: contracts split the lines between them and a line '
              + 'takes exactly one disposition &mdash; its own action&rsquo;s, or its '
              + 'contract&rsquo;s where it has none of its own. So the rows sum to each '
              + 'contract&rsquo;s at-risk balance and the columns to the portfolio.'
            : '<b>These rows and columns do NOT reconcile, which is a defect.</b>')
        + ' At risk is expired or already cancelled balance; active money is excluded.'
        + '</div>';
      h += card('What becomes of the at-risk money, by contract',
                fN(D.rows.length)+' contract'+(D.rows.length===1?'':'s')
                + ' &middot; click a row for the contract', m);
    }
  }

  /* ---- HOW OLD THE OPEN WORK IS, AND WHOSE ----------------------------
     Aging is not overdue: an action with no due date can never be overdue and
     can still have been sitting there since March, which is exactly the item
     that quietly becomes a cancelled balance. Same model call as the slide. */
  {
    const today = new Date().toISOString().slice(0,10);
    const openA = all.filter(CED.actOpen);
    if(openA.length){
      const own  = CED.agingByOwner(all, today, actAmount);
      const prof = CED.agingProfile(all, today, actAmount);
      const ages = openA.map(a=>CED.actAge(a, today)).filter(d=>d!==null);
      const med  = CED.median(ages);
      const old  = ages.length? Math.max.apply(null, ages) : null;
      const o90  = prof.find(x=>x.band.id==='d90p') || {n:0, amount:0};
      const un   = own.find(r=>r.unowned);

      let g = '<div class="grid g4" style="margin-bottom:12px">'
        + tile('Open actions', fN(openA.length), fN(own.length)
             + ' owner'+(own.length===1?'':'s'))
        + tile('Median age', med===null? '&ndash;' : med+' days', 'half are older')
        + tile('Over 90 days', fN(o90.n),
               o90.n? fD(o90.amount)+' under them' : 'none this old',
               o90.n? 'r':'g')
        + tile('Unassigned', un? fN(un.n) : '0',
               un? 'nobody is carrying them' : 'every action is owned',
               un? 'r':'g')
        + '</div>';

      g += '<div class="scroll"><table class="t"><thead><tr>'
        + '<th>Owner</th><th class="n">Open</th>'
        + CED.AGE_BANDS.map(b=>'<th class="n">'+esc(b.short)+'</th>').join('')
        + '<th class="n">Oldest</th><th class="n">Median</th>'
        + '<th class="n">Balance</th></tr></thead><tbody>';
      own.forEach(r=>{
        g += '<tr><td>' + (r.unowned
              ? '<span class="pill r">nobody assigned</span>'
              : '<b>'+esc(r.name)+'</b>')
          + (r.undated? ' <span class="pill a" title="raised with no date">'
                        + fN(r.undated)+' undated</span>' : '')
          + '</td><td class="n">'+fN(r.n)+'</td>'
          + CED.AGE_BANDS.map(b=>'<td class="n'+(r.bands[b.id]? ' '+b.tone : '')+'">'
              + (r.bands[b.id]? fN(r.bands[b.id]) : '<span style="color:var(--faint)">&ndash;</span>')
              + '</td>').join('')
          + '<td class="n'+(r.oldest!==null && r.oldest>90? ' r':'')+'">'
          + (r.oldest===null? '&ndash;' : r.oldest+'d')+'</td>'
          + '<td class="n">'+(r.median===null? '&ndash;' : r.median+'d')+'</td>'
          + '<td class="n">'+cMz(r.amount)+'</td></tr>';
      });
      /* OWNERS DO NOT OVERLAP, so the band columns really do add up - unlike
         Balance, which is per action and can name one line twice */
      g += '<tr class="tot"><td><b>ALL</b></td><td class="n"><b>'+fN(openA.length)+'</b></td>'
        + CED.AGE_BANDS.map(b=>{
            const x = prof.find(y=>y.band.id===b.id) || {n:0};
            return '<td class="n"><b>'+(x.n? fN(x.n) : '&ndash;')+'</b></td>';
          }).join('')
        + '<td class="n"><b>'+(old===null? '&ndash;' : old+'d')+'</b></td>'
        + '<td class="n"><b>'+(med===null? '&ndash;' : med+'d')+'</b></td>'
        + '<td class="n"><b>'+cMz(own.reduce((s,r)=>s+r.amount,0))+'</b></td></tr>';
      g += '</tbody></table></div>';

      g += '<div class="note b" style="margin-top:10px"><b>Age is days since the '
        + 'action was raised, counted to today</b> &mdash; not to the period as-of, '
        + 'because actions are raised <i>after</i> the report they are about lands '
        + 'and ageing them against the as-of would read as negative. '
        + '<b>Aging is not overdue:</b> an action with no due date can never be '
        + 'overdue and can still be six months old. Closed actions are excluded. '
        + 'The band columns add up; <b>Balance does not</b> &mdash; it is what each '
        + 'action names, and two actions can name one line.</div>';

      h += card('How old the open work is', fN(openA.length)+' open &middot; by owner', g);
    }
  }

  h += card('Actions', fN(rows.length)+' of '+fN(all.length)+' &middot; click a row to open it',
    filt + '<div class="scroll">' + dataTable('ac-all', [
      {k:'status', h:'Status', cls:'c', get:r=>CED.ACT_STATUS.findIndex(s=>s.id===r.status),
       cell:r=>{ const s=CED.actStatus(r.status);
         return '<span class="pill '+s.tone+'">'+esc(s.name)+'</span>'; }},
      {k:'title', h:'Action', cls:'w', get:r=>r.title,
       cell:r=>'<b>'+esc(r.title)+'</b>'
          + (r.detail? '<div style="color:var(--dim);font-size:11px">'
              + esc(r.detail.slice(0,110)) + (r.detail.length>110?'…':'') + '</div>' : '')},
      {k:'target', h:'Anchored to', cls:'mono', get:r=>r.target, cell:r=>actTargetCell(r)},
      {k:'disp', h:'Disposition', cls:'c', get:r=>r.disp||'zz',
       cell:r=>{ const d=CED.actDisp(r.disp);
         return d? '<span class="pill '+(d.tone||'')+'">'+esc(d.name)+'</span>'
                 : '<span class="pill r">not set</span>'; }},
      {k:'owner', h:'Owner', get:r=>r.owner, cell:r=>esc(r.owner)||'<span class="pill r">unassigned</span>'},
      {k:'withWho', h:'With', get:r=>r.withWho},
      {k:'amount', h:'Amount', cls:'n', get:r=>actAmount(r),
       cell:r=>{ const v=actAmount(r); return v===null? '<span class="pill">&ndash;</span>' : fD(v); }},
      {k:'due', h:'Due', cls:'c', get:r=>r.due||'9999',
       cell:r=>{
         if(!r.due) return '<span class="pill">&ndash;</span>';
         const d = CED.actDueIn(r, asOf);
         const over = CED.actOverdue(r, asOf);
         return esc(dLabel(r.due)) + (d===null? '' :
           ' <span class="pill '+(over?'r':d<=14?'a':'')+'">'
           + (over? fN(-d)+'d late' : fN(d)+'d')+'</span>');
       }}
    ], rows, {sortKey:'status', sortDir:'asc', page:true,
       rowAttr:r=>'class="clk" data-action="'+esc(r.id)+'"',
       emptyMsg: all.length? 'No action matches these filters.'
         : 'No actions yet. Raise one here, or from any CLIN line.'})
    + '</div>', {flush:true});

  /* ---- actions whose line stopped being reported ------------------------ */
  if(orph.length){
    h += card('Anchored to something no longer reported', fN(orph.length)+' actions',
      '<div class="note a">The line or contract these point at is not in <b>'
      + esc(curPeriod().label) + '</b>. That is normal when a balance is fully liquidated and '
      + 'drops off the report &mdash; and it is exactly the moment to decide whether the action '
      + 'is finished. They are never deleted for you.</div>'
      + dataTable('ac-orph', [
          {k:'title', h:'Action', cls:'w', get:r=>r.title, cell:r=>'<b>'+esc(r.title)+'</b>'},
          {k:'target', h:'Anchored to', cls:'mono', get:r=>r.target},
          {k:'status', h:'Status', cls:'c', get:r=>r.status,
           cell:r=>{ const s=CED.actStatus(r.status);
             return '<span class="pill '+s.tone+'">'+esc(s.name)+'</span>'; }},
          {k:'owner', h:'Owner', get:r=>r.owner}
        ], orph, {sortKey:'title', sortDir:'asc',
           rowAttr:r=>'class="clk" data-action="'+esc(r.id)+'"'}), {flush:true});
  }

  return h;
}

/* the amount an action is about: its own if stated, else the line's balance */
function actAmount(a){
  if(a.amount!==null && a.amount!==undefined) return a.amount;
  if(a.scope==='line'){
    const L = CED.everything().find(x=>x.key===a.target && x.pk===DB.cur);
    if(L) return L.ulo;
  }
  return null;
}
function actTargetCell(a){
  if(a.scope==='portfolio') return '<span class="pill">portfolio</span>';
  if(a.scope==='contract')  return '<span class="pill b">contract</span> '+esc(a.target);
  const p = a.target.split('|');
  return esc(p[0]||'') + ' <span style="color:var(--dim)">CLIN</span> ' + esc(p[1]||'')
       + ' <span style="color:var(--dim)">ACRN</span> ' + esc(p[2]||'');
}

/* ============================================================================
   THE REGISTER TRAVELS SEPARATELY.

   A saved copy carries the actions, but a team also needs to exchange JUST the
   register: it is small, it is the only part that is theirs rather than the
   file's, and shipping the whole CUI payload round to add one note would be
   absurd. Export writes the register alone; import merges it by id.
   ============================================================================ */
function exportActions(){
  if(!DB) return;
  const payload = {kind:'ced-actions', v:1, at:new Date().toISOString(),
                   period:DB.cur, actions:actions()};
  dl('CED actions ' + (curPeriod()? curPeriod().label : '') + '.json',
     new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'}));
  setStat('&#9989; Exported <b>'+fN(actions().length)+'</b> actions. '
    + 'That file carries contract detail and is <b>CUI</b>.');
}

/* THE SEND LOG MERGES LIKE THE OTHER TWO. Four people chasing four sets of
   contacts have four partial records of who was asked; by id, they come back
   together. A send is never edited, so there is no conflict to resolve - the
   shared mergeById does the whole job. */
function exportSends(){
  if(!DB){ setStat('&#9888; Nothing to export.'); return; }
  dl('CED send log ' + new Date().toISOString().slice(0,10) + '.json',
     new Blob([JSON.stringify({kind:'ced-sends', at:new Date().toISOString(),
                               sends: sends()}, null, 1)],
              {type:'application/json'}));
  setStat('&#9989; Exported <b>'+fN(sends().length)+'</b> send record'
    + (sends().length===1?'':'s')+'. <b>That file names contacts and is CUI.</b>');
}
async function importSends(inp){
  const f = inp.files && inp.files[0];
  inp.value = '';
  if(!f) return;
  try{
    const j = JSON.parse(await f.text());
    const theirs = (j && j.sends) || (Array.isArray(j)? j : null);
    if(!theirs) throw new Error('that file carries no send log');
    if(!DB) DB = emptyDb();
    if(!Array.isArray(DB.sends)) DB.sends = [];
    const r = CED.mergeById(DB.sends.map(x=>CED.sendNew(x)),
                            theirs.map(x=>CED.sendNew(x)), CED.sendNew);
    DB.sends = r.items;
    DIRTY = true; paintChrome(); render();
    setStat('&#9989; Merged <b>'+esc(f.name)+'</b> &mdash; '
      + r.report.added + ' added, ' + r.report.updated + ' updated, '
      + r.report.kept + ' kept because ours was newer, ' + r.report.same + ' identical. '
      + 'Nothing was dropped.');
  }catch(err){
    setStat('&#9888; <span class="bad">Could not merge that:</span> '+esc(err&&err.message||err));
  }
}

function exportPocs(){
  if(!DB) return;
  const payload = {kind:'ced-pocs', v:1, at:new Date().toISOString(), pocs:(DB.pocs||[])};
  dl('CED contacts.json',
     new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'}));
  setStat('&#9989; Exported <b>'+fN((DB.pocs||[]).length)+'</b> contact assignments.');
}

async function importPocs(inp){
  const f = inp.files && inp.files[0];
  inp.value='';
  if(!f || !DB) return;
  try{
    const j = JSON.parse(await f.text());
    const incoming = Array.isArray(j)? j : (j && j.pocs);
    if(!Array.isArray(incoming)) throw new Error('that file carries no contact register');
    const r = CED.mergePocs(DB.pocs||[], incoming);
    DB.pocs = r.pocs;
    DIRTY = true;
    paintChrome(); render();
    setStat('&#9989; Merged <b>'+esc(f.name)+'</b> &mdash; '
      + r.report.added + ' added, ' + r.report.updated + ' updated, '
      + r.report.kept + ' kept because ours was newer, ' + r.report.same + ' identical. '
      + 'Nothing was dropped.');
  }catch(err){
    setStat('&#9888; <span class="bad">Could not merge that file:</span> '+esc(err&&err.message||err));
  }
}

async function importActions(inp){
  const f = inp.files && inp.files[0];
  inp.value='';
  if(!f || !DB) return;
  try{
    const j = JSON.parse(await f.text());
    const incoming = Array.isArray(j)? j : (j && j.actions);
    if(!Array.isArray(incoming)) throw new Error('that file carries no action register');
    const r = CED.mergeActions(actions(), incoming);
    DB.actions = r.actions;
    DIRTY = true;
    paintChrome(); render();
    setStat('&#9989; Merged <b>'+esc(f.name)+'</b> &mdash; '
      + r.report.added + ' added, ' + r.report.updated + ' updated from the newer copy, '
      + r.report.kept + ' kept because ours was newer, ' + r.report.same + ' identical. '
      + 'Nothing was dropped.');
  }catch(err){
    setStat('&#9888; <span class="bad">Could not merge that file:</span> '+esc(err&&err.message||err));
  }
}
</script>

<script>
/* ============================================================================
   THE POC REGISTER - storage, the view, the form, and the worklist extract.

   The model is pure; everything that mutates lives here, one write path, the
   same discipline the action register keeps.
   ============================================================================ */

function pocs(){ return (DB && DB.pocs) || []; }
function pocById(id){ return pocs().find(p=>p.id===id) || null; }

function pocSave(p){
  if(!DB) return null;
  if(!DB.pocs) DB.pocs = [];
  const bad = CED.pocValid(p);
  if(bad.length) return {error: bad};
  const prev = pocById(p.id);
  p.updated = new Date().toISOString();
  if(prev) Object.assign(prev, p); else DB.pocs.unshift(p);
  DIRTY = true;
  return {ok:true};
}
function pocDelete(id){
  if(!DB) return;
  const p = pocById(id);
  if(!p) return;
  const n = CED.pocLines(pocs(), CED.all(), p.name, p.role).length;
  if(!confirm('Delete this assignment?\n\n' + p.name + ' as '
    + CED.pocRole(p.role).name + '\n\n'
    + (n? 'It currently resolves for ' + n + ' CLIN lines; they will fall back to a '
        + 'less specific rule, or to nobody.' : 'It matches nothing in the loaded data.'))) return;
  DB.pocs = pocs().filter(x=>x.id!==id);
  DIRTY = true;
  closeModal(); render();
  setStat('Removed <b>'+esc(p.name)+'</b> as '+esc(CED.pocRole(p.role).name)+'.');
}

/* ---------------------------------------------------------------- the form */
let PF = null;

function pocEdit(id){
  PF = id? JSON.parse(JSON.stringify(pocById(id))) : null;
  if(id && !PF) return;
  pocForm();
}
function pocNewFor(seed){
  PF = CED.pocNew(seed||{});
  PF.__isNew = true;
  pocForm();
}

function pocForm(err){
  const p = PF || (PF = Object.assign(CED.pocNew({}), {__isNew:true}));
  const isNew = !!p.__isNew;
  const hits = CED.all().filter(L=>CED.pocMatch(p, L));
  const owns = p.name? CED.pocLines(pocs().filter(x=>x.id!==p.id).concat([p]),
                                    CED.all(), p.name, p.role) : [];

  const inp = (f, v, ph) => '<input data-pf="'+f+'" value="'+esc(v==null?'':v)+'"'
    + (ph? ' placeholder="'+esc(ph)+'"' : '')+' style="width:100%">';
  const row = (lbl, ctl, hint) =>
    '<div style="margin-bottom:10px"><label style="display:block;font-size:10px;'
    + 'letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:3px">'
    + lbl + '</label>' + ctl
    + (hint? '<div style="font-size:11px;color:var(--dim);margin-top:3px">'+hint+'</div>' : '')
    + '</div>';

  let b = '';

  b += '<div class="grid g2"><div>'
    + row('Role', '<select data-pf="role">'
        + CED.POC_ROLES.map(r=>'<option value="'+r.id+'"'+(p.role===r.id?' selected':'')+'>'
            + esc(r.name)+'</option>').join('') + '</select>')
    + row('Name'+REQ, inp('name', p.name, 'who'))
    + row('Organisation', inp('org', p.org, 'DCMA, NAVAIR, Lockheed Martin…'))
    + row('E-mail', inp('email', p.email))
    + row('Phone', inp('phone', p.phone))
    + '</div><div>'
    + '<div class="note b">This is a <b>rule</b>, not a row per line. Leave a box blank to mean '
    + '<i>any</i>. The rule that pins down the <b>most</b> boxes wins for a given line, so a '
    + 'contract-wide KO can be overridden for one CLIN without touching the first rule.</div>'
    + row('Contract', inp('m.contract', p.m.contract, 'e.g. N0001922CXXXX — blank for any'))
    + row('CLIN', inp('m.clin', p.m.clin, 'blank for any'))
    + row('ACRN', inp('m.acrn', p.m.acrn, 'blank for any'))
    + row('Participant', inp('m.part', p.m.part, 'blank for any'))
    + row('Note', inp('note', p.note))
    + '</div></div>';

  b += '<div class="note '+(hits.length? 'g':'a')+'" style="margin-top:4px">'
    + '<b>' + fN(hits.length) + '</b> CLIN line' + (hits.length===1?'':'s') + ' in <b>'
    + esc(curPeriod()? curPeriod().label : '') + '</b> '
    + (hits.length===1? 'matches' : 'match') + ' this rule'
    + (hits.length? ' &mdash; $'+fM(CED.totals(hits).ulo)+'M unliquidated' : '')
    + (p.name && owns.length!==hits.length
        ? '. <b>'+fN(owns.length)+'</b> would actually resolve to '+esc(p.name)
          + ' as '+esc(CED.pocRole(p.role).name)+'; the rest are taken by a more specific rule.'
        : '.')
    + (hits.length? '' : ' Nothing matches it yet &mdash; that is fine if the contract has not '
        + 'been imported, and worth a look if it has.')
    + '</div>';

  b += formErr(err);
  b += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="mbtn go" data-act="pocApply">'+(isNew? 'Add' : 'Save')+'</button>'
    + '<button class="mbtn pill" data-act="closeModal">Cancel</button>'
    + (isNew? '' : ' <button class="mbtn pill" data-act="pocDelete" data-v="'+esc(p.id)+'">Delete</button>')
    + '</div>';

  modal(isNew? 'Assign a point of contact' : 'Point of contact', b);
  formFocus('[data-pf="name"]');
}

function pocApply(){
  if(!PF) return;
  $('modalHost').querySelectorAll('[data-pf]').forEach(el=>{
    const f = el.dataset.pf;
    if(f.indexOf('m.')===0) PF.m[f.slice(2)] = el.value.trim();
    else PF[f] = el.value;
  });
  const isNew = !!PF.__isNew;
  delete PF.__isNew;
  const r = pocSave(PF);
  if(r && r.error){ PF.__isNew = isNew; pocForm(r.error); return; }
  PF = null;
  closeModal(); paintChrome(); render();
  setStat('&#9989; ' + (isNew? 'Added' : 'Saved') + ' &mdash; ' + fN(pocs().length)
    + ' assignment' + (pocs().length===1?'':'s') + ' in the register.');
}

/* ============================================================================
   VIEW
   ============================================================================ */
function viewPocs(){
  const ls    = CED.all();
  const asOf  = curAsOf();
  const reg   = pocs();
  const acts  = actions();
  const role  = PQ.role || 'ko';
  const roll  = CED.pocRollup(reg, ls, acts, role, asOf);
  const unused= CED.pocUnused(reg, ls);

  let h = '';

  h += '<div class="note b">The ULO summary carries <b>no contracting officer, no programme '
    + 'manager, no contractor and no financial manager</b> &mdash; there is no owner dimension in '
    + 'the source at all. This register supplies it, as <b>rules</b>: one row can cover a whole '
    + 'contract, and a more specific row overrides it for one CLIN or ACRN. It is how a balance '
    + 'becomes somebody&rsquo;s.</div>';

  /* ---- who owns what, in one role at a time ---------------------------- */
  const tabs = CED.POC_ROLES.map(r=>'<button class="mbtn'+(role===r.id?' act':'')
      + '" data-pq="role" data-v="'+r.id+'">'+esc(r.name)+'</button>').join('');
  h += card('Who owns what', 'by role &middot; sorted by unexplained money',
      '<div class="filt">'+tabs+'<span style="flex:1"></span>'
      + '<button class="mbtn" data-act="pocSendAll">Send worklists&hellip;</button>'
      + '<button class="mbtn go" data-act="pocNew">Assign a contact</button></div>'
      + dataTable('pc-roll', [
          {k:'name', h:CED.pocRole(role).name, get:r=>r.name,
           cell:r=>r.unassigned
             ? '<span class="pill r">nobody assigned</span>'
             : '<b>'+esc(r.name)+'</b>'
               + (r.poc && r.poc.org? ' <span style="color:var(--dim)">'+esc(r.poc.org)+'</span>':'')},
          {k:'n',   h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
          {k:'ulo', h:'Unliquidated', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
          {k:'risk',h:'At risk', cls:'n', get:r=>r.atRisk.ulo, cell:r=>cM(r.atRisk.ulo)},
          {k:'unex',h:'Unexplained', cls:'n', get:r=>r.uncovered.ulo,
           cell:r=>cMz(r.uncovered.ulo,'r')},
          {k:'pct', h:'Accounted for', cls:'n', get:r=>r.pct===null?-1:r.pct,
           cell:r=>r.pct===null? '<span class="pill">no basis</span>'
                 : meter(r.pct)+' '+fPct(r.pct)},
          {k:'open',h:'Open actions', cls:'n', get:r=>r.open, cell:r=>fN(r.open)},
          {k:'x', h:'', cls:'n', noSort:true,
           cell:r=>r.unassigned? '' :
             '<button class="mbtn pill" data-act="pocWorklist" data-v="'+esc(r.name)
             + '" data-role="'+esc(role)+'">Worklist</button>'}
        ], roll, {preSorted:true, total:(rw,c)=>{
          const t = CED.totals(ls);
          if(c.k==='name') return 'TOTAL';
          if(c.k==='n')   return fN(t.n);
          if(c.k==='ulo') return cM(t.ulo);
          if(c.k==='risk')return cM(rw.reduce((a,r)=>a+r.atRisk.ulo,0));
          if(c.k==='unex')return cM(rw.reduce((a,r)=>a+r.uncovered.ulo,0));
          if(c.k==='open')return fN(rw.reduce((a,r)=>a+r.open,0));
          return '';
        }}), {flush:true});

  /* ---- the rules themselves -------------------------------------------- */
  h += card('Assignments', fN(reg.length)+' rule'+(reg.length===1?'':'s')
      + ' &middot; click one to edit &middot; the rule pinning down the most fields wins',
      reg.length
        ? dataTable('pc-reg', [
            {k:'role', h:'Role', cls:'c', get:r=>r.role,
             cell:r=>{ const R=CED.pocRole(r.role);
               return '<span class="pill '+R.tone+'">'+esc(R.short)+'</span>'; }},
            {k:'name', h:'Name', get:r=>r.name, cell:r=>'<b>'+esc(r.name)+'</b>'},
            {k:'org',  h:'Organisation', get:r=>r.org},
            {k:'email',h:'Contact', get:r=>r.email,
             cell:r=>esc(r.email)+(r.phone? ' <span style="color:var(--dim)">'+esc(r.phone)+'</span>':'')},
            {k:'m',    h:'Applies to', cls:'w', get:r=>CED.pocSpec(r),
             cell:r=>{
               const bits = CED.POC_DIMS.filter(d=>r.m[d])
                 .map(d=>'<span class="pill b">'+d.replace('part','participant')+' '
                       + esc(r.m[d])+'</span>');
               return bits.length? bits.join(' ')
                    : '<span class="pill a">everything &mdash; a catch-all</span>';
             }},
            {k:'hits', h:'Lines', cls:'n', get:r=>CED.all().filter(L=>CED.pocMatch(r,L)).length,
             cell:r=>{ const n=CED.all().filter(L=>CED.pocMatch(r,L)).length;
               return n? fN(n) : '<span class="pill a">0</span>'; }}
          ], reg, {sortKey:'role', sortDir:'asc',
             rowAttr:r=>'class="clk" data-poc="'+esc(r.id)+'"'})
        : '<div class="empty"><div class="big">No contacts assigned yet</div>'
          + 'Assign one and every line it matches gets an owner.'
          + '<div style="margin-top:14px"><button class="mbtn go" data-act="pocNew">'
          + 'Assign a contact</button></div></div>', {flush:true});

  if(unused.length){
    h += card('Rules that match nothing', fN(unused.length),
      '<div class="note a">These match no line in <b>'+esc(curPeriod().label)+'</b>. That is '
      + 'expected if the contract has not been imported, and worth a look if it has &mdash; a '
      + 'mistyped contract number or CLIN silently owns nothing.</div>'
      + dataTable('pc-unused', [
          {k:'name', h:'Name', get:r=>r.name, cell:r=>'<b>'+esc(r.name)+'</b>'},
          {k:'role', h:'Role', cls:'c', get:r=>r.role, cell:r=>esc(CED.pocRole(r.role).short)},
          {k:'m', h:'Applies to', cls:'w', get:r=>0,
           cell:r=>CED.POC_DIMS.filter(d=>r.m[d])
                   .map(d=>'<span class="pill">'+d+' '+esc(r.m[d])+'</span>').join(' ')}
        ], unused, {sortKey:'name', sortDir:'asc',
           rowAttr:r=>'class="clk" data-poc="'+esc(r.id)+'"'}), {flush:true});
  }

  return h;
}

/* ============================================================================
   THE WORKLIST - what actually gets sent to a person.
   ============================================================================ */
/* ============================================================================
   ONE WORKLIST BUILDER.

   The file a contact is sent on their own and the file that goes out inside a
   batch must be BYTE-FOR-BYTE the same product, or a worklist returned from a
   batch would not read back through takeWorklist(). So there is one builder
   and two ways of delivering what it makes.

   Returns null when the contact owns nothing in the period being shown - that
   is not an error, it is the answer.
   ============================================================================ */
function worklistFor(name, role){
  if(!DB) return null;
  const ls   = CED.all();
  const asOf = curAsOf();
  const mine = CED.pocLines(pocs(), ls, name, role);
  if(!mine.length) return null;
  const acts = actions().filter(a=>
    (a.scope==='line'     && mine.some(L=>L.key===a.target)) ||
    (a.scope==='contract' && mine.some(L=>L.piin===a.target)));
  const cov  = CED.coverage(mine, actions(), asOf);
  const R    = CED.pocRole(role);
  const t    = CED.totals(mine);
  const per  = curPeriod();

  const head = [
    ['Unliquidated obligation worklist'],
    [R.name, name],
    ['Period', per? per.label : '', 'as of', asOf||''],
    [],
    ['Lines', t.n],
    ['Obligations', t.obl],
    ['Unliquidated', t.ulo],
    ['At risk (expired or cancelled)', cov.atRisk.ulo],
    ['Of that, with a stated disposition', cov.covered.ulo],
    ['Of that, unexplained', cov.uncovered.ulo],
    [],
    ['Please review each line below and tell us what becomes of the balance.'],
    ['Use the last three columns; leave the rest as they are.'],
    [],
    ['Contract','CLIN','CLIN Title','ACRN','Participant','Appropriation','FY',
     'State','Cancels FY','Obligations','Expenditures','ULO',
     'Our disposition','Our note',
     'YOUR DISPOSITION','YOUR NOTE','YOUR TARGET DATE']
  ];
  const rows = CED.sortBy(mine, L=>L.ulo, 'desc').map(L=>{
    const p = CED.phaseOf(L, asOf);
    const a = CED.actionsFor(actions(), L).filter(CED.actOpen)[0]
           || CED.actionsFor(actions(), L)[0];
    return [
      L.ktr, L.clin, L.title, L.acrn, L.part, L.appn, L.fy,
      p.id==='expired'? ('expired ' + (p.year||'?') + ' of 5')
        : p.id==='active'? 'available' : p.id==='cancelled'? 'CANCELLED' : '',
      CED.cancelFY(L)? 'FY'+CED.cancelFY(L) : '',
      L.obl, L.exp, L.ulo,
      a? ((CED.actDisp(a.disp)||{}).name || '') : '',
      a? a.title : '',
      '', '', ''
    ];
  });

  const sheets = [head.concat(rows)];
  const names  = ['Worklist'];
  if(acts.length){
    const at = [['Open actions on these lines'], [],
      ['Status','Action','Detail','Anchored to','Disposition','Owner','With','Due']];
    acts.forEach(a=>at.push([
      CED.actStatus(a.status).name, a.title, a.detail, a.target,
      (CED.actDisp(a.disp)||{}).name || '', a.owner, a.withWho, a.due]));
    sheets.push(at); names.push('Actions');
  }
  return {
    name: name, role: role, roleName: R.name, short: R.short,
    lines: mine, cov: cov, tot: t, open: acts.filter(CED.actOpen).length,
    names: names, sheets: sheets,
    file: 'ULO worklist - ' + safeFile(name) + ' - ' + (per? per.label : '') + '.xlsx'
  };
}

/* A file name somebody has to find in Outlook. Keep it readable, keep it
   unique, and never let a name with a slash in it walk out into a zip entry. */
function safeFile(s){
  return (''+(s||'')).replace(/[^A-Za-z0-9 .()-]/g,' ').replace(/\s+/g,' ').trim()
      || 'unnamed';
}

/* THE ONE WRITE PATH INTO THE SEND LOG, for the same reason actSave is the
   one write path into the action register: a record that several places
   append to is a record whose shape drifts. */
function sends(){ return (DB && DB.sends) || []; }
function sendLog(o){
  if(!DB) return null;
  if(!Array.isArray(DB.sends)) DB.sends = [];
  const x = CED.sendNew(Object.assign({by: who()}, o));
  if(CED.sendValid(x).length) return null;
  DB.sends.push(x);
  DIRTY = true;
  return x;
}

function pocWorklist(name, role){
  const w = worklistFor(name, role);
  if(!w){ setStat('&#9888; ' + esc(name) + ' owns no lines in this period.'); return; }
  dl(w.file, xlsxOf(w.names, w.sheets));
  sendLog({kind:'sent', name:name, role:role, pk:DB.cur, n:w.lines.length,
           ulo:w.tot.ulo, uncovered:w.cov.uncovered.ulo, file:w.file});
  setStat('&#9989; Worklist for <b>'+esc(name)+'</b> &mdash; '+fN(w.lines.length)
    + ' lines, $'+fM(w.cov.uncovered.ulo)+'M of it unexplained. <b>That file is CUI.</b>');
}

/* ============================================================================
   SENDING TO EVERYBODY AT ONCE.

   End of month is not one worklist, it is a dozen: every contracting officer,
   programme manager and contractor who owns a balance that is about to cancel.
   Building them one at a time is the difference between a job that gets done
   monthly and one that does not.

   ONE ZIP, ONE FILE PER RECIPIENT. Not one workbook with a tab each - each of
   these is addressed to a different person and gets forwarded on its own, and
   a tab holding somebody else's balances is a disclosure, not a convenience.
   ============================================================================ */
let WLSEL = null;              /* null means "recompute the default" */

/* Everyone who owns a line, in every role. A person who is KO on one contract
   and PM on another is TWO recipients, because those are two different asks
   and the answers come back against different lines. */
function wlRecipients(){
  if(!DB) return [];
  /* THE SAME MODEL CALL THE SLIDE USES. The dialog and the deck must not be
     able to disagree about who has answered - so there is one wlStatus and
     both read it, rather than the dialog computing its own idea of status. */
  return CED.wlStatus(pocs(), CED.all(), actions(), sends(), DB.cur,
                      curAsOf(), WL_DUE, new Date().toISOString().slice(0,10))
    .map(g=>Object.assign({}, g, {key: g.role + '|' + g.name}));
}

/* What nobody can be sent, because nobody owns it. Reported, never silently
   left out of the count - unassigned money is the whole reason this register
   exists, and a send that quietly skips it reads as a complete send.

   ONLY FOR ROLES THE REGISTER ACTUALLY USES. Every line lacks a Financial
   Manager until somebody names one, and reporting that as a finding on a
   register that has never used the role is nagging, not information. A role
   starts being checked the moment it has its first rule.

   THESE FIGURES ARE PER ROLE AND DO NOT ADD UP. The same dollar can be
   unassigned in five roles at once, so there is deliberately no total. */
function wlUnassigned(){
  if(!DB) return [];
  const ls = CED.all(), reg = pocs(), acts = actions(), asOf = curAsOf();
  const out = [];
  CED.POC_ROLES.forEach(R=>{
    if(!reg.some(p=>p.role===R.id)) return;   /* the role is not in use */
    CED.pocRollup(reg, ls, acts, R.id, asOf).forEach(g=>{
      if(!g.unassigned || !g.n) return;
      out.push({role:R.id, roleName:R.name, short:R.short, n:g.n, ulo:g.ulo,
                atRisk:g.atRisk, uncovered:g.uncovered});
    });
  });
  return out;
}

/* WHAT A SET OF WORKLISTS ACTUALLY COVERS, counted once.

   Recipients overlap - a portfolio-wide PM's lines wholly contain a KO's -
   so adding their balances together is the same error as adding the
   by-owner column on the actions slide, and on the real register it read
   $87.3M against a portfolio at risk of $48.2M. The union is the only
   figure that means anything. */
function wlCover(rs){
  const ls = CED.all(), reg = pocs();
  const seen = new Set(), lines = [];
  (rs||[]).forEach(r=>{
    CED.pocLines(reg, ls, r.name, r.role).forEach(L=>{
      if(seen.has(L.ix)) return;
      seen.add(L.ix); lines.push(L);
    });
  });
  const cov = CED.coverage(lines, actions(), curAsOf());
  return {n: lines.length, ulo: CED.totals(lines).ulo,
          atRisk: cov.atRisk.ulo, uncovered: cov.uncovered.ulo};
}

/* THE DEFAULT IS THE PEOPLE WITH SOMETHING TO ANSWER FOR. Sending a worklist
   to somebody whose every balance is already explained wastes their time and
   teaches them to ignore the next one. If nothing anywhere is unexplained,
   everyone is offered instead, because then the default would be nobody and
   an empty dialog reads as a broken one. */
function wlDefault(rs){
  const chase = rs.filter(r=>Math.abs(r.uncovered.ulo) > CED.EPS);
  return new Set((chase.length? chase : rs).map(r=>r.key));
}
function wlSel(){
  const rs = wlRecipients();
  if(WLSEL === null) WLSEL = wlDefault(rs);
  const live = new Set(rs.map(r=>r.key));
  /* a recipient can disappear between opening the dialog and building - a
     rule edited, a period switched - so the selection is intersected, never
     trusted */
  return new Set([...WLSEL].filter(k=>live.has(k)));
}
function wlToggle(key){
  const s = wlSel();
  if(s.has(key)) s.delete(key); else s.add(key);
  WLSEL = s; pocSendForm();
}
function wlPick(which){
  const rs = wlRecipients();
  WLSEL = which==='all'  ? new Set(rs.map(r=>r.key))
        : which==='none' ? new Set()
        : which==='owed' ? new Set(rs.filter(r=>r.state!=='returned').map(r=>r.key))
        : wlDefault(rs);
  pocSendForm();
}

function pocSendAll(){
  if(!DB){ setStat('&#9888; Import a file first.'); return; }
  WLSEL = null;
  pocSendForm();
}

function pocSendForm(){
  const rs   = wlRecipients();

  let b = '';
  b += '<div class="note b">One <b>.zip</b>, one workbook per recipient &mdash; each addressed '

  if(!rs.length){

  }else{
    b += '<div class="filt" style="margin-bottom:8px">'

      + '<button class="mbtn" data-act="wlPick" data-v="none">None</button>'

      + '<span style="flex:1"></span>'
      + '<span style="font-size:11.5px;color:var(--dim)">'+fN(rs.length)+' contacts own lines</span>'
      + '</div>';

      + '<th>Last sent</th><th class="n">Lines</th>'
      + '<th class="n">Unliquidated</th><th class="n">Unexplained</th></tr></thead><tbody>';
    rs.forEach(r=>{
      const on = sel.has(r.key);
      b += '<tr class="clk" data-wlpick="'+esc(r.key)+'"'+(on?'':' style="opacity:.5"')+'>'
        + '<td>'+(on? '&#9745;' : '&#9744;')+'</td>'
        + '<td><span class="pill '+r.tone+'">'+esc(r.short)+'</span></td>'
        + '<td><b>'+esc(r.name)+'</b>'
          + (r.poc && r.poc.org? ' <span style="color:var(--dim)">'+esc(r.poc.org)+'</span>':'')
          + (r.poc && r.poc.email? '<div style="font-size:11px;color:var(--dim)" class="mono">'
              + esc(r.poc.email)+'</div>' : '')
        + '</td>'
        + '<td><span class="pill '+CED.wlState(r.state).tone+'">'
          + esc(CED.wlState(r.state).name)+'</span></td>'

    + '<button class="mbtn pill" data-act="closeModal">Cancel</button>'

        ? (()=>{ const c = wlCover(chosen);
                 return fN(c.n) + ' distinct lines covered &middot; $'
