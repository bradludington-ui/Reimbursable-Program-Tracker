     byParticipant already returns the canonical order - Air Force, ANG, AFRC,
     STOVL, USMC-CV, USN, then the partner nations, then the FMS tail
     alphabetically - so nothing here re-derives it. This adds the only thing
     a participant listing was missing: what state each one's money is in.

     A LINE HAS EXACTLY ONE PARTICIPANT AND EXACTLY ONE STATE, so this table
     ties in both directions: the four state columns sum to that participant's
     balance, and the rows sum to the report. The partner nations carry no
     dates at all, so almost all of their balance lands under "no dates" - and
     that is the honest answer, not a gap.
     ====================================================================== */
  /* THE FOUR-STATE SPLIT, IN ONE PLACE.

     byParticipantState and byAppnState both need it and both carried their own
     copy. Two costs, and the second is the expensive one: a fix applied to one
     silently did not reach the other, and a mutation naming the line could no
     longer say WHICH of them it was about - the sweep matched whichever came
     first in the file, so adding a function above an existing one quietly
     moved the mutation onto different code while still printing a verdict.

     A LINE HAS EXACTLY ONE STATE. Expired and cancelled are never both, and a
     line with no dates is NOT called available - it does not expire on this
     schedule at all. */
  function stateSplit(lines, asOf){
    const st = {available:[], expired:[], cancelled:[], nodate:[]};
    (lines || []).forEach(L=>{
      const p = phaseOf(L, asOf);
      if(p.id === 'cancelled')    st.cancelled.push(L);
      else if(p.id === 'expired') st.expired.push(L);
      else if(p.id === 'active')  st.available.push(L);
      else                        st.nodate.push(L);
    });
    return st;
  }

  function byParticipantState(lines, asOf){
    return byParticipant(lines || []).map(g=>{
      const st = stateSplit(g.lines, asOf);
      return Object.assign({}, g, {
        available: totals(st.available), expired: totals(st.expired),
        cancelled: totals(st.cancelled), nodate: totals(st.nodate)
      });
    });
  }

  /* ======================================================================
     WHERE THE BALANCE ACTUALLY SITS.

     662 CLIN lines is not a thing anyone can read. The useful question is how
     concentrated the money is: if ten lines carry a third of it, ten
     conversations move a third of the problem.

     RANKED BY THE BALANCE ITSELF, DESCENDING - not by its absolute value. A
     line with a NEGATIVE balance is an anomaly, not a large holding, and
     ranking on |ulo| would float it to the top of a slide titled "largest
     unliquidated balance". They are counted here so the slide can say they
     exist, and Verify is where they are examined.
     ====================================================================== */
  function topByUlo(lines, n, marks){
    const ls = (lines || []).slice()
      .sort((a,b)=> b.ulo - a.ulo || a.key.localeCompare(b.key));
    const all = totals(ls);
    const take = Math.max(0, n === undefined? 10 : n);
    const top  = ls.slice(0, take);
    const rest = ls.slice(take);

    /* how few lines carry half of it, and four fifths of it. Only meaningful
       when there is a positive balance to take a share OF. */
    const marksAt = marks || [0.5, 0.8];
    const need = {};
    if(all.ulo > EPS_){
      let run = 0, i = 0;
      marksAt.forEach(f=>{ need[f] = null; });
      for(; i < ls.length; i++){
        run += ls[i].ulo;
        marksAt.forEach(f=>{
          /* WITH SLACK, never an exact >=. The files carry full float noise
             and `run` accumulates its own, so a cumulative sum that reaches
             the mark exactly in arithmetic can land one ULP under it here -
             and the answer would read as one line more than it is. Half a
             cent is the tolerance this model uses everywhere else. */
          if(need[f] === null && run + EPS_ >= all.ulo * f) need[f] = i + 1;
        });
        if(marksAt.every(f=>need[f] !== null)) break;
      }
    }else{
      marksAt.forEach(f=>{ need[f] = null; });
    }

    return {
      rows: top.map((L,i)=>Object.assign({}, {
        rank: i + 1, line: L, ulo: L.ulo,
        share: Math.abs(all.ulo) > EPS_? L.ulo / all.ulo : null
      })),
      top:  totals(top),
      rest: totals(rest),
      all:  all,
      need: need,
      negatives: ls.filter(L=>L.ulo < -EPS_).length
    };
  }

  /* ======================================================================
     BALANCE BY APPROPRIATION, SPLIT BY WHAT CAN STILL HAPPEN TO IT.

     The Verify card audits the VALUES in this field; this is the money in
     them. Same shape as byParticipantState, and the same two ties: a line has
     exactly one appropriation and exactly one state.

     THE LIFE IS ASKED THROUGH lifeRefusal, never through lifeOf alone. A
     compound value like "PROC FF/O&M" matches the PROC FF pattern and the
     tool still refuses to derive a life from it - reporting it as three-year
     money on a slide would claim more than applyLife concludes. Section 31
     asserts this function and appnFyAudit agree, value for value.
     ====================================================================== */
  function byAppnState(lines, asOf){
    return byAppn(lines || []).map(g=>{
      const st = stateSplit(g.lines, asOf);
      const usable = g.lines.filter(L=>!lifeRefusal(L.appn, L.fy));
      return Object.assign({}, g, {
        value:    g.key,
        blank:    g.key === '',
        compound: g.key.indexOf('/') >= 0,
        life:     usable.length? lifeOf(g.key) : null,
        derivedN: usable.length,
        whys:     [...new Set(g.lines.map(L=>lifeRefusal(L.appn, L.fy)).filter(Boolean))],
        available: totals(st.available), expired: totals(st.expired),
        cancelled: totals(st.cancelled), nodate: totals(st.nodate)
      });
    }).sort((a,b)=> (a.blank?1:0) - (b.blank?1:0)
                 || Math.abs(b.ulo) - Math.abs(a.ulo)
                 || a.value.localeCompare(b.value));
  }

  /* ---- does the source agree with the rule? ---------------------------
     Returns what was checked, what agreed, and every line that did not, so
     Verify can show the disagreement rather than the tool silently preferring
     one date over the other. */
  function lifeCheck(lines){
    const ls = lines||[];
    const out = {checked:0, agree:0, expBad:[], cancBad:[], blind:{}, blindN:0};
    ls.forEach(L=>{
      if(!L.life){
        const why = L.lifeWhy || 'not checked';
        out.blind[why] = (out.blind[why]||0) + 1;
        out.blindN++;
        return;
      }
      out.checked++;
      let ok = true;
      if(L.expOk === false){ out.expBad.push(L); ok = false; }
      if(L.cancOk === false){ out.cancBad.push(L); ok = false; }
      if(ok) out.agree++;
    });
    out.ok = out.expBad.length===0 && out.cancBad.length===0;
    return out;
  }

  /* group by the fiscal year a balance cancels in - the owner's working unit,
     and the one the months-to-cancel bands cannot express */
  const byCancelFY = ls => group(ls, L=>{ const f=cancelFY(L); return f? String(f) : ''; },
                                 k=>k===''? '(no cancel date)' : 'Cancels FY'+k)
                             .sort((a,b)=> a.key===''?1 : b.key===''?-1 : a.key.localeCompare(b.key));
  /* and by appropriation and fiscal year together - one appropriation-year is
     one pot of money with one life, which is how a comptroller reads it.
     NOT `byFund`: that name is already taken by the Appropriated / FMS split,
     and re-using it made the whole bundle a SyntaxError. */
  const byFundYear = ls => group(ls, L=>(L.appn||'')+'|'+(L.fy||''),
                             (k,l)=>{ const p=k.split('|');
                               if(!p[0] && !p[1]) return '(FMS / partner)';
                               return (p[0]||'(no appropriation)') + (p[1]? '  FY'+p[1] : ''); })
                         .sort((a,b)=>a.key.localeCompare(b.key));

  /* ======================================================================
     CANCELLATION RISK - the reason these workbooks exist.

     Expiration and cancellation are DIFFERENT facts and the tool never
     conflates them:
       expired   - past its expiration date. No longer available for new
                   obligation; the balance can still be liquidated.
       cancelled - past its cancel date. The balance is gone; a ULO still
                   showing against it is a problem, not a plan.
     A line with neither date is FMS / partner money, which does not cancel
     on this schedule. It is carried in its own band and never folded into
     one of the dated ones.
     ====================================================================== */
  const BANDS = [
    {id:'cancelled', name:'Past cancel date',          tone:'r', note:'The balance has cancelled. A ULO here is an error to clear, not a bill to pay.'},
    {id:'m12',       name:'Cancels within 12 months',  tone:'r', note:'Liquidate or lose. This is the current-year bill.'},
    {id:'m24',       name:'Cancels in 13 - 24 months', tone:'a', note:'Next year\'s bill; still time to disburse or to deobligate.'},
    {id:'m36',       name:'Cancels in 25 - 36 months', tone:'b', note:''},
    {id:'far',       name:'Cancels beyond 36 months',  tone:'g', note:''},
    {id:'none',      name:'No cancel date on file',    tone:'p', note:'FMS and partner lines, which carry no appropriation, fiscal year or cancellation date in the source.'}
  ];

  function bandOf(L, asOf){
    if(!L.cancD) return 'none';
    if(!asOf)    return 'far';
    if(L.cancD <= asOf) return 'cancelled';
    const m = monthsTo(asOf, L.cancD);
    if(m===null)  return 'far';
    if(m < 12)    return 'm12';
    if(m < 24)    return 'm24';
    if(m < 36)    return 'm36';
    return 'far';
  }

  /* Ordered bands, always all six, so an empty band reads as "none here"
     rather than disappearing and leaving the reader to wonder. */
  function riskBands(lines, asOf){
    const buck={}; BANDS.forEach(b=>buck[b.id]=[]);
    (lines||[]).forEach(L=>buck[bandOf(L, asOf)].push(L));
    return BANDS.map(b=>Object.assign({}, b, {lines:buck[b.id]}, totals(buck[b.id])));
  }

  /* Expired but not yet cancelled, and still holding a balance. */
  function expired(lines, asOf){
    if(!asOf) return [];
    return (lines||[]).filter(L=> L.expD && L.expD <= asOf && Math.abs(L.ulo) > EPS_
                                  && !(L.cancD && L.cancD <= asOf));
  }

  /* ======================================================================
     TIE-OUTS.  Asserted, not assumed. Each returns {ok, ...detail} so the
     Verify view can show what was checked and the suite can fail on it.
     ====================================================================== */
  function ties(lines){
    const ls = lines||[];
    /* 1. every row: ULO == Obligations - Expenditures */
    const rowBad = ls.filter(L=>!L.uloOk);
    /* 2. in aggregate, the same identity */
    const t = totals(ls);
    const aggDelta = t.ulo - (t.obl - t.exp);
    /* 3. the groupings partition the scope - each must sum back to the whole */
    const cuts = [
      ['by contract',     byContract(ls)],
      ['by participant',  byParticipant(ls)],
      ['by appropriation',byAppn(ls)],
      ['by fiscal year',  byFy(ls)],
      ['by CLIN type',    byCtype(ls)],
      ['by funding kind', byFund(ls)],
      ['by cancel date',  byCancel(ls)]
    ].map(([name, g])=>{
      const gt = g.reduce((a,x)=>({obl:a.obl+x.obl, exp:a.exp+x.exp, ulo:a.ulo+x.ulo, n:a.n+x.n}),
                          {obl:0,exp:0,ulo:0,n:0});
      return {name, groups:g.length, n:gt.n,
              dObl:gt.obl-t.obl, dExp:gt.exp-t.exp, dUlo:gt.ulo-t.ulo,
              ok: gt.n===t.n && Math.abs(gt.obl-t.obl)<=EPS_
                  && Math.abs(gt.exp-t.exp)<=EPS_ && Math.abs(gt.ulo-t.ulo)<=EPS_};
    });
    return {
      rowIdentity:{ok: rowBad.length===0, bad: rowBad},
      aggIdentity:{ok: Math.abs(aggDelta)<=EPS_, delta: aggDelta},
      cuts,
      ok: rowBad.length===0 && Math.abs(aggDelta)<=EPS_ && cuts.every(c=>c.ok)
    };
  }

  /* ======================================================================
     DATA-QUALITY ADVISORIES.  None of these is a failure; every one is
     something a reader would otherwise have to notice for themselves.
     ====================================================================== */
  function advisories(lines, asOf){
    const ls = lines||[], out=[];
    const add=(k,t,n)=>{ if(n>0) out.push({k, t, n}); };

    add('bad','rows where the ULO on file does not equal Obligations minus Expenditures',
        ls.filter(L=>!L.uloOk).length);
    add('warn','rows with a negative expenditure', ls.filter(L=>L.exp<0).length);
    add('warn','rows with no obligation but a balance',
        ls.filter(L=>Math.abs(L.obl)<=EPS_ && Math.abs(L.ulo)>EPS_).length);
    add('warn','rows carrying an appropriation but no cancel date',
        ls.filter(L=>L.appn!=='' && !L.cancD).length);
    add('warn','rows carrying a cancel date but no appropriation',
        ls.filter(L=>L.appn==='' && L.cancD).length);
    add('warn','rows whose fiscal year is a compound value (e.g. 2024/2025)',
        ls.filter(L=>/\D/.test(L.fy) && L.fy!=='').length);
    add('warn','rows whose appropriation is a compound value (e.g. PROC FF/O&M)',
        ls.filter(L=>L.appn.indexOf('/')>=0).length);
    /* the five-year rule: funds cancel five years after they expire. A row
       that breaks it is not necessarily wrong, but it is worth a look. */
    add('warn','rows where the cancel date is not five years after expiration',
        ls.filter(L=>{
          if(!L.expD||!L.cancD) return false;
          const m = monthsTo(L.expD, L.cancD);
          return m===null || m!==60;
        }).length);
    if(asOf) add('warn','expired lines still holding a balance', expired(ls, asOf).length);

    /* a participant that appears both with and without an appropriation is
       either two different funding kinds or a gap in the source */
    const mixed = new Set();
    const seen = new Map();
    ls.forEach(L=>{
      const k=L.part, v=seen.get(k);
      if(v===undefined) seen.set(k, L.us);
      else if(v!==L.us) mixed.add(k);
    });
    add('warn','participants appearing as both appropriated and FMS / partner', mixed.size);
    out.mixedParticipants = [...mixed].sort();
    return out;
  }

  /* Distinct values for the filter selects, each sorted and with blanks last. */
  function options(lines){
    const pick = f => {
      const set = new Set((lines||[]).map(f));
      return [...set].sort((a,b)=> a===''?1 : b===''?-1 : (''+a).localeCompare(''+b));
    };
    /* the participant dropdown reads in the briefing order too, not A-Z */
    const parts = [...new Set((lines||[]).map(L=>L.part))]
      .sort((a,b)=> partRank(a)-partRank(b) || a.localeCompare(b));
    return {
      contract: pick(L=>L.piin), part: parts, appn: pick(L=>L.appn),
      fy: pick(L=>L.fy), ctype: pick(L=>L.ctype), fund: pick(L=>L.fund),
      canc: pick(L=>L.cancD)
    };
  }

  /* ======================================================================
     THE ACTION REGISTER.

     The first thing in this tool that is NOT derived from a file. Everything
     else here is a reading of the monthly ULO summary and is thrown away and
     rebuilt on the next import; an action is the owner's own record and has to
     survive every refresh, for years, while the line it hangs off changes
     balance underneath it.

     It exists because the work is already being done and has nowhere to live.
     The August workbooks carry, in the free-text Comments column:

        "DCMA Action item: A negative FNDLTR transaction of $45,973.3..."
        "DCMA Action item: CLIN doesn't exist on ACRN BF to make $4,3..."

     - one line of narrative, truncated, with no owner, no status, no due date
     and no history, overwritten wholesale when next month's file lands.

     THREE RULES.

     1. AN ACTION IS ANCHORED, NOT POSITIONED. It points at `contract|CLIN|ACRN`
        - the identity proved stable across months - or at a contract, or at
        nothing. Never at a row number, and never at a figure that will move.

     2. AN ACTION IS NEVER SILENTLY LOST. If the line it points at stops being
        reported, the action does not disappear with it: `orphans()` finds it and
        the view says so. A balance vanishing is exactly when someone needs to
        know whether the action was completed or the line simply moved.

     3. THE LOG IS APPEND-ONLY. Editing an action does not rewrite its history.
        This is a record that gets briefed, and "what did we say last month" has
        to have an answer.
     ====================================================================== */

  /* Where an action is anchored. */
  const ACT_SCOPE = [
    {id:'line',      name:'CLIN line'},
    {id:'contract',  name:'Whole contract'},
    {id:'portfolio', name:'Portfolio'}
  ];

  /* Deliberately short and fixed, because these get counted and briefed. A
     free-text status column cannot be reported on. */
  const ACT_STATUS = [
    {id:'open',  name:'Open',            tone:'a', done:false},
    {id:'work',  name:'In work',         tone:'b', done:false},
    {id:'wait',  name:'Awaiting others', tone:'p', done:false},
    {id:'block', name:'Blocked',         tone:'r', done:false},
    {id:'done',  name:'Closed',          tone:'g', done:true}
  ];

  /* WHAT IS EXPECTED TO HAPPEN TO THE MONEY. This is the field that turns a
     balance into a position you can brief: not "there is $9.5M open" but
     "$7M will liquidate, $2M comes off contract, $0.5M nobody can explain".
     A blank disposition is the honest default and is what `coverage()` counts
     as unexplained. */
  const ACT_DISP = [
    {id:'liquidate',  name:'Will liquidate',      tone:'g'},
    {id:'deobligate', name:'Deobligate',          tone:'a'},
    {id:'research',   name:'Under research',      tone:'b'},
    {id:'dispute',    name:'Disputed',            tone:'r'},
    {id:'none',       name:'No action needed',    tone:''}
  ];

  const actStatus = id => ACT_STATUS.find(s=>s.id===id) || ACT_STATUS[0];
  const actDisp   = id => ACT_DISP.find(d=>d.id===id) || null;
  const actOpen   = a => !actStatus(a.status).done;

  /* An opaque id, and it is a MERGE KEY, so a collision silently fuses two
     people's actions into one. Three parts, each doing a different job:

       the millisecond   makes a listing roughly time-ordered
       a counter         guarantees uniqueness WITHIN a session - the clock does
                         not move between two actions raised in a loop, and four
                         random characters alone collided about once every
                         fourteen runs of a 500-id test
       six random chars  guard across sessions and across people

     The counter alone is not enough (two people both start at 1) and the random
     part alone is not enough (birthday collisions); together they are. */
  let ACT_SEQ = 0;
  function actId(){
    ACT_SEQ = (ACT_SEQ + 1) % 46656;               /* 36^3 */
    const rnd = Math.floor(Math.random()*2176782336).toString(36).padStart(6,'0');
    return 'a' + Date.now().toString(36) + ACT_SEQ.toString(36).padStart(3,'0') + rnd;
  }

  /* A new action, with every field present. Absent fields on a merged-in
     action are filled the same way, so nothing downstream tests for undefined. */
  function actNew(o){
    o = o || {};
    const now = new Date().toISOString();
    return {
      id:      o.id      || actId(),
      scope:   o.scope   || 'line',
      target:  o.target  || '',
      title:   o.title   || '',
      detail:  o.detail  || '',
      status:  o.status  || 'open',
      disp:    o.disp    || '',
      owner:   o.owner   || '',
      withWho: o.withWho || '',
      amount:  (typeof o.amount==='number')? o.amount : null,
      due:     o.due     || '',
      opened:  o.opened  || now.slice(0,10),
      closed:  o.closed  || '',
      /* WHEN THE DISPOSITION WAS GIVEN, which is not when the action was
         raised. An action opened in July and answered in September did not
         explain anything in August, and without this date the September
         answer would be counted back into August and the chase would look
         like it had achieved nothing.

         An action carrying a disposition but no dispAt predates v0.16; it
         falls back to `opened`, which is exactly right for the ones raised
         from a returned worklist (the disposition arrives with them) and the
         closest honest guess for the rest. */
      dispAt:  o.dispAt  || (o.disp? (o.opened || now.slice(0,10)) : ''),
      updated: o.updated || now,
      log:     Array.isArray(o.log)? o.log.slice() : []
    };
  }

  /* What must be true before an action is worth keeping. Returns the list of
     complaints, so the form can say all of them at once rather than one per
     attempt. */
  function actValid(a){
    const bad = [];
    if(!s_(a.title)) bad.push('it needs a title');
    if(!ACT_SCOPE.some(x=>x.id===a.scope)) bad.push('the scope is not one of the three');
    if(a.scope!=='portfolio' && !s_(a.target)) bad.push('it is not anchored to anything');
    if(!ACT_STATUS.some(x=>x.id===a.status)) bad.push('the status is not a known one');
    if(a.disp && !ACT_DISP.some(x=>x.id===a.disp)) bad.push('the disposition is not a known one');
    if(a.due && !/^\d{4}-\d{2}-\d{2}$/.test(a.due)) bad.push('the due date is not a date');
    if(a.amount!==null && !isFinite(a.amount)) bad.push('the amount is not a number');
    return bad;
  }

  /* ---- which actions belong to what ------------------------------------ */
  function actionsFor(actions, L){
    if(!L) return [];
    return (actions||[]).filter(a=>
      (a.scope==='line'     && a.target===L.key) ||
      (a.scope==='contract' && a.target===L.piin));
  }
  function actionsOnContract(actions, piin, lines){
    const keys = new Set((lines||[]).filter(L=>L.piin===piin).map(L=>L.key));
    return (actions||[]).filter(a=>
      (a.scope==='contract' && a.target===piin) ||
      (a.scope==='line'     && keys.has(a.target)));
  }

  /* AN ACTION WHOSE LINE IS NO LONGER REPORTED. Not an error - a fully
     liquidated line legitimately drops off - but never silently dropped
     either: it is the moment to ask whether the action is finished. */
  function orphans(actions, lines){
    const keys = new Set((lines||[]).map(L=>L.key));
    const piins = new Set((lines||[]).map(L=>L.piin));
    return (actions||[]).filter(a=>
      (a.scope==='line'     && !keys.has(a.target)) ||
      (a.scope==='contract' && !piins.has(a.target)));
  }

  /* ---- filtering the register ------------------------------------------ */
  function actFilter(actions, f, asOf){
    f = f || {};
    const q = s_(f.q).toLowerCase();
    return (actions||[]).filter(a=>{
      if(f.status==='__open'  && !actOpen(a))  return false;
      if(f.status==='__done'  &&  actOpen(a))  return false;
      if(f.status && f.status.indexOf('__')!==0 && a.status !== f.status) return false;
      if(f.owner  && a.owner !== f.owner)  return false;
      if(f.disp==='__none'){ if(a.disp) return false; }
      else if(f.disp && a.disp !== f.disp) return false;
      if(f.overdue && !actOverdue(a, asOf)) return false;
      if(q){
        const hay = (a.title+' '+a.detail+' '+a.owner+' '+a.withWho+' '+a.target).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
  }
  /* Overdue is measured against the PERIOD's as-of, not today: the whole tool
     reports a position at a date, and an action list that drifted with the
     wall clock could not be reconciled against a briefing given last month. */
  function actOverdue(a, asOf){
    return !!(asOf && a.due && actOpen(a) && a.due < asOf);
  }
  function actDueIn(a, asOf){ return (asOf && a.due)? daysBetween(asOf, a.due) : null; }

  /* ======================================================================
     CONFIDENCE.

     "Report on the status of those funds with confidence" is measurable, and
     this is the measurement: of the money that can still be lost, how much has
     somebody's name against it and a statement of what will happen to it?

     A line counts as ACCOUNTED FOR when it carries at least one action with a
     DISPOSITION set. Not merely an action - an action that says what becomes
     of the money. An open action with no disposition is work in progress, and
     it is counted as unexplained on purpose: that is the honest reading.
     ====================================================================== */
  function coverage(lines, actions, asOf){
    const ls = lines||[];
    /* at risk = anything that can still be lost, plus anything already lost.
       Active money is not at risk yet and is excluded, or the number would
       flatter itself as the balance grows. */
    const atRisk = ls.filter(L=>{
      const p = phaseOf(L, asOf);
      return p.id==='expired' || p.id==='cancelled';
    });
    const dispBy = new Map();          /* line key -> the disposition covering it */
    (actions||[]).forEach(a=>{
      if(!a.disp) return;
      if(a.scope==='line')     dispBy.set('L:'+a.target, a.disp);
      if(a.scope==='contract') dispBy.set('C:'+a.target, a.disp);
    });
    const dispOf = L => dispBy.get('L:'+L.key) || dispBy.get('C:'+L.piin) || '';
    const covered = atRisk.filter(L=>dispOf(L)!=='');
    const bare    = atRisk.filter(L=>dispOf(L)==='');
    const t = totals(atRisk), c = totals(covered);
    const by = {};
    ACT_DISP.forEach(d=>{ by[d.id] = totals(atRisk.filter(L=>dispOf(L)===d.id)); });
    return {
      atRisk: t, covered: c, uncovered: totals(bare),
      bareLines: bare, byDisp: by,
      pct: Math.abs(t.ulo)>EPS_? c.ulo/t.ulo : null
    };
  }

  /* ======================================================================
     DISPOSITION BREAKDOWN BY CONTRACT.

     What we say becomes of the at-risk money, cut by the contract it sits on.
     The actions slide gives this at portfolio level; a contracting officer
     runs ONE contract and needs their own column.

     THIS ONE ADDS UP IN BOTH DIRECTIONS, and it is the only table in the tool
     that does. Contracts partition the lines - a line is on exactly one - and
     `coverage` gives a line exactly one disposition or none, so:

       every ROW    sums to that contract's at-risk balance
       every COLUMN sums to the portfolio total for that disposition
       the corner   is the portfolio at-risk balance

     Which means it can be checked rather than believed, and `ok` does exactly
     that. Everywhere else in this tool the dimensions overlap and summing is
     the standing error; here it is the point, so the assertion earns its
     place.

     Each row is a real `coverage()` call over that contract's lines, not a
     re-implementation of one, so a row cannot disagree with the figure the
     rest of the tool shows for the same contract.
     ====================================================================== */
  function dispByContract(lines, actionsList, asOf){
    const ls = lines || [];
    const all = coverage(ls, actionsList, asOf);
    const piins = [...new Set(ls.map(L=>L.piin))];
    const rows = piins.map(k=>{
      const mine = ls.filter(L=>L.piin === k);
      const cov  = coverage(mine, actionsList, asOf);
      return {
        piin: k,
        ktr:  (mine[0] && mine[0].ktr) || k,
        cov:  cov,
        atRisk: cov.atRisk.ulo,
        n:      cov.atRisk.n,
        uncovered: cov.uncovered.ulo,
        pct:    cov.pct
      };
    }).filter(r=>Math.abs(r.atRisk) > EPS_ || r.n > 0)
      .sort((a,b)=> Math.abs(b.atRisk) - Math.abs(a.atRisk)
                 || a.piin.localeCompare(b.piin));

    /* the two identities, measured rather than assumed */
    const rowSum = rows.reduce((s,r)=>s + r.atRisk, 0);
    const colOk  = ACT_DISP.every(d=>
      Math.abs(rows.reduce((s,r)=>s + r.cov.byDisp[d.id].ulo, 0)
               - all.byDisp[d.id].ulo) < 0.5);
    const bareOk = Math.abs(rows.reduce((s,r)=>s + r.uncovered, 0)
                            - all.uncovered.ulo) < 0.5;
    return {
      rows: rows, all: all,
      ok: Math.abs(rowSum - all.atRisk.ulo) < 0.5 && colOk && bareOk
    };
  }

  const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun',
                      'Jul','Aug','Sep','Oct','Nov','Dec'];

  /* ======================================================================
     DOES THE MONTH AGREE WITH THE WORKBOOK?

     The reporting month lives in the FILE NAME and nowhere else, so a renamed
     file is a mislabelled month. Nothing inside the workbook states the month
     outright - but two things corroborate it, and both are measured off the
     real files rather than hoped for:

       THE SHEET NAME.  "AUG ULOs on O&M CLINs" and "Aug ULOs on O&M CLINs ".
                        Direct evidence of the month, though never of the year.
       THE NEWEST FY.   Money cannot be obligated before its own fiscal year
                        begins, so a line carrying FY2026 puts a floor of
                        1 Oct 2025 under the as-of. A hard bound, from the data.

     THIS CAN ONLY EVER CATCH A DISAGREEMENT. Neither piece of evidence proves
     a date right, and the FY21 workbook - "N0001921CXXXX FY21 AVSC ULOs" -
     carries no month at all. Silence is therefore a valid answer and is
     reported as "nothing to check it against", never as agreement.
     ====================================================================== */

  /* Longest form first, and ANCHORED ON WORD BOUNDARIES. "Summary" contains
     the letters m-a-r; a substring search reads every ULO summary ever
     written as a March report. */
  const MONTH_RX = [
    [1,  /\b(january|jan)\b/i],        [2,  /\b(february|feb)\b/i],
    [3,  /\b(march|mar)\b/i],          [4,  /\b(april|apr)\b/i],
    [5,  /\b(may)\b/i],                [6,  /\b(june|jun)\b/i],
    [7,  /\b(july|jul)\b/i],           [8,  /\b(august|aug)\b/i],
    [9,  /\b(september|sept|sep)\b/i], [10, /\b(october|oct)\b/i],
    [11, /\b(november|nov)\b/i],       [12, /\b(december|dec)\b/i]
  ];
  /* every month named anywhere in a string, as numbers */
  function monthsIn(text){
    const t = s_(text);
    const out = [];
    MONTH_RX.forEach(([n, rx])=>{ if(rx.test(t)) out.push(n); });
    return out;
  }

  /* The newest fiscal year on these lines. FY is kept exactly as written and
     can be compound - "2024/2025" - so every four-digit year in it counts and
     the largest wins. */
  function newestFY(lines){
    let max = null;
    (lines||[]).forEach(L=>{
      const m = s_(L.fy).match(/\d{4}/g);
      if(!m) return;
      m.forEach(y=>{ const n = +y; if(n>1900 && n<2200 && (max===null || n>max)) max = n; });
    });
    return max;
  }

  /* A workbook, the month it was imported under, and whether they agree. */
  function monthCheck(file, lines){
    const f = file || {};
    const asOf = s_(f.asOf);
    const out = {
      asOf: asOf, pk: s_(f.pk),
      sheetMonth: null, sheetName: '', sheetSaw: [],
      newestFY: null, fyFloor: '',
      verdict: 'none', why: []
    };

    /* ---- evidence 1: a month named in a sheet name --------------------- */
    const seen = new Map();
    (f.sheets || []).forEach(sn=>{
      monthsIn(sn).forEach(n=>{ if(!seen.has(n)) seen.set(n, sn); });
    });
    out.sheetSaw = [...seen.keys()].sort((a,b)=>a-b);
    if(out.sheetSaw.length === 1){
      out.sheetMonth = out.sheetSaw[0];
      out.sheetName  = seen.get(out.sheetMonth);
    }else if(out.sheetSaw.length > 1){
      /* two different months named across the tabs proves nothing either way */
      out.why.push({k:'note', t:'More than one month is named in the sheet names ('
        + out.sheetSaw.map(n=>MONTH_ABBR[n-1]).join(', ')
        + '), so they cannot corroborate a date.'});
    }

    /* ---- evidence 2: money cannot precede its own fiscal year ---------- */
    out.newestFY = newestFY(lines);
    if(out.newestFY !== null) out.fyFloor = (out.newestFY - 1) + '-10-01';

    /* ---- the verdict --------------------------------------------------- */
    if(!asOf){
      out.verdict = 'none';
      out.why.push({k:'note', t:'This file has no as-of date, so there is nothing to check.'});
      return out;
    }
    const mo = +asOf.slice(5,7);
    let disagreed = false;

    if(out.sheetMonth !== null){
      if(out.sheetMonth === mo){
        out.why.push({k:'ok', t:'Sheet "' + out.sheetName + '" names '
          + MONTH_ABBR[out.sheetMonth-1] + ', which is the month it was imported under.'});
      }else{
        disagreed = true;
        out.why.push({k:'bad', t:'Sheet "' + out.sheetName + '" names '
          + MONTH_ABBR[out.sheetMonth-1] + ', but this file was imported as '
          + MONTH_ABBR[mo-1] + '. The month a file is filed under comes from its NAME, '
          + 'so check the name is the right one.'});
      }
    }

    if(out.fyFloor){
      if(asOf < out.fyFloor){
        disagreed = true;
        out.why.push({k:'bad', t:'It carries FY' + out.newestFY + ' money, which cannot be '
          + 'obligated before ' + out.fyFloor + ' - yet the as-of is ' + asOf + '.'});
      }else{
        out.why.push({k:'ok', t:'The newest fiscal year on it is FY' + out.newestFY
          + ', which is consistent with an as-of of ' + asOf + '.'});
      }
    }

    const any = (out.sheetMonth !== null) || !!out.fyFloor;
    out.verdict = disagreed? 'disagree' : (any? 'agree' : 'none');
    if(!any)
      out.why.push({k:'note', t:'Nothing in this workbook names a month or a fiscal year, '
        + 'so there is nothing to check the file name against.'});
    return out;
  }

  /* ======================================================================
     DOES THE CONTRACT NUMBER AGREE WITH THE WORKBOOK?

     The same question as the month, and a WEAKER answer, because the evidence
     is thinner. Measured across the three real vintages:

       the two Aug-2026 workbooks   NOTHING PIIN-shaped anywhere in the
                                    package - not a cell, not a sheet name,
                                    not the document properties
       the FY21 workbook            the detail tab is called
                                    "N0001921CXXXX FY21 AVSC ULOs"

     So on most files this reports "nothing to check it against", and that is
     the honest answer rather than a defect. Where the evidence IS there, a
     mismatch is caught - and a contract number is the one field whose being
     wrong silently reassigns a whole file's money to another contract.

     The second check needs no evidence at all: TWO FILES IN ONE PERIOD
     CLAIMING THE SAME CONTRACT. Importing replaces a contract's lines within
     a period, so the second file silently discards the first. Between
     separate imports that is the intended way to load a correction; inside a
     single drop it is almost always a duplicate or a misnamed file.
     ====================================================================== */

  /* A PIIN in free text, normalised so shape cannot hide a match:
     N00019-22-C-XXXX, N00019 22 C XXXX and N0001922CXXXX are one contract. */
  const piinNorm = s => s_(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
  function piinsIn(text){
    const t = s_(text), out = [];
    /* THE REGEX IS BUILT HERE, NOT SHARED. A /g regex carries `lastIndex`
       between calls, so a module-level one would silently skip the first
       match of every call after the first. Guarding it with a reset works
       until somebody adds an early exit or a `.test()`; building it per
       call removes the hazard rather than defending against it. */
    const rx = /\b([A-Za-z]\d{5})[-\s]?(\d{2})[-\s]?([A-Za-z])[-\s]?(\d{4})\b/g;
    let m;
    while((m = rx.exec(t))){
      const v = (m[1]+m[2]+m[3]+m[4]).toUpperCase();
      if(out.indexOf(v) < 0) out.push(v);
    }
    return out;
  }

  /* `file` is the import record; `others` are the other files already in the
     same period, so a duplicate claim can be seen. */
  function contractCheck(file, others){
    const f = file || {};
    const mine = piinNorm(f.piin);
    const out = {
      piin: s_(f.piin), pretty: s_(f.pretty),
      recognised: f.recognised !== false,
      seen: (f.piinSeen || []).slice(),      /* [{piin, where}] */
      matched: false, conflicting: [],
      duplicate: null,
      verdict: 'none', why: []
    };

    out.seen.forEach(x=>{
      if(piinNorm(x.piin) === mine) out.matched = true;
      else if(out.conflicting.indexOf(x.piin) < 0) out.conflicting.push(x.piin);
    });

    /* ---- the shape, which is evidence about the NAME rather than the file */
    if(!out.recognised)
      out.why.push({k:'bad', t:'"' + out.piin + '" is not in the N#####-##-X-#### shape. '
        + 'The contract number is the FIRST word of the file name, so a renamed or '
        + 'copied file - "Copy of N00019-22-C-XXXX ..." - lands under a contract '
        + 'called something else entirely.'});

    /* ---- two files claiming one contract in one period ------------------
       Recorded at IMPORT, not derived here: by the time Verify runs, the
       period holds one file record because the loser was already replaced.
       `others` is still accepted for a caller that has both in hand. */
    const dups = (f.batchDup || []).slice();
    (others || []).forEach(o=>{
      if(o === f || !o) return;
      if(piinNorm(o.piin) === mine && s_(o.name) !== s_(f.name)
         && dups.indexOf(s_(o.name)) < 0) dups.push(s_(o.name));
    });
    if(dups.length){
      out.duplicate = dups[0];
      out.why.push({k:'bad', t:dups.map(n=>'"'+n+'"').join(' and ')
        + ' claim'+(dups.length===1?'s':'')+' the same contract in the same period. '
        + 'Importing REPLACES a contract&rsquo;s lines within a period, so only one of '
        + 'them is in the totals.'});
    }

    /* ---- the workbook's own word for it --------------------------------- */
    if(out.matched){
      const w = out.seen.filter(x=>piinNorm(x.piin) === mine)[0];
      out.why.push({k:'ok', t:'The workbook names ' + w.piin + ' in ' + w.where
        + ', which is the contract this file was imported under.'});
    }else if(out.conflicting.length){
      out.why.push({k:'bad', t:'The workbook names ' + out.conflicting.join(', ')
        + ', but this file was imported as ' + out.pretty
        + '. The contract comes from the FILE NAME, so check the name.'});
    }else{
      out.why.push({k:'note', t:'Nothing in this workbook names a contract number, so there '
        + 'is nothing to check the file name against. That is normal - two of the three '
        + 'known workbook vintages carry none anywhere in the file.'});
    }

    const bad = out.why.some(x=>x.k === 'bad');
    out.verdict = bad? 'disagree' : (out.matched? 'agree' : 'none');
    return out;
  }

  /* ======================================================================
     APPROPRIATION AND FISCAL YEAR, AS THE SOURCE WRITES THEM.

     The life-cycle card asks whether the DATES obey the rule. This asks a
     different question about the same two fields: what values are actually in
     the data, and is any of them going to quietly mislead?

     Both are kept exactly as written - the source carries "2024/2025" and
     "PROC FF/O&M", and coercing either to a number or a code would silently
     merge or blank them. Keeping them verbatim is right, and it has a cost
     this card exists to surface: EVERY GROUPING IN THE TOOL IS BY THE LITERAL
     STRING. "O&M" and "O & M" are one appropriation to the life table, which
     matches on a pattern - and two separate rows in the Portfolio, two filter
     options, and two subtotals that each look complete.
     ====================================================================== */

  /* strictly four digits - "2024/2025", "FY21" and "21" are none of them */
  const fyPlain = v => /^\d{4}$/.test(s_(v));
  /* FY2026 begins 1 Oct 2025. Money cannot be obligated before its own year. */
  const fyStart = v => fyPlain(v)? ((+s_(v) - 1) + '-10-01') : '';
  /* what would have to differ for two values to be genuinely different */
  const varNorm = v => s_(v).toUpperCase().replace(/[^A-Z0-9]/g, '');

  function appnFyAudit(lines, asOf){
    const ls = lines || [];

    const tally = get => {
      const m = new Map();
      ls.forEach(L=>{
        const v = s_(get(L));
        if(!m.has(v)) m.set(v, {value:v, n:0, ulo:0, lines:[]});
        const g = m.get(v);
        g.n++; g.ulo += L.ulo; g.lines.push(L);
      });
      return [...m.values()].sort((a,b)=> Math.abs(b.ulo)-Math.abs(a.ulo)
                                       || a.value.localeCompare(b.value));
    };

    /* THE LIFE REPORTED IS THE ONE THE TOOL ACTUALLY DERIVES, asked through
       the same lifeRefusal() applyLife uses. Calling lifeOf() straight
       reported "PROC FF/O&M" as three-year PROC FF money, which the tool
       refuses to conclude - a card must never claim more than the model. */
    const appns = tally(L=>L.appn).map(g=>{
      const usable = g.lines.filter(L=>!lifeRefusal(L.appn, L.fy));
      const whys   = [...new Set(g.lines.map(L=>lifeRefusal(L.appn, L.fy)).filter(Boolean))];
      return Object.assign(g, {
        blank:    g.value === '',
        compound: g.value.indexOf('/') >= 0,
        life:     usable.length? lifeOf(g.value) : null,
        derivedN: usable.length,
        whys:     whys
      });
    });
    const fys = tally(L=>L.fy).map(g=>Object.assign(g, {
      blank:    g.value === '',
      plain:    fyPlain(g.value),
      compound: /\D/.test(g.value) && g.value !== '',
      start:    fyStart(g.value)
    }));

    /* ---- VALUES THAT DIFFER ONLY IN PUNCTUATION OR CASE ------------------
       Two spellings of one thing split every subtotal in the tool, and each
       half looks like a complete answer. This is the only finding here that
       cannot be seen by reading the data. */
    const variants = [];
    [['appropriation', appns], ['fiscal year', fys]].forEach(([kind, rows])=>{
      const by = new Map();
      rows.forEach(g=>{
        if(g.blank) return;
        const k = varNorm(g.value);
        if(!k) return;
        if(!by.has(k)) by.set(k, []);
        by.get(k).push(g);
      });
      by.forEach((group, k)=>{
        if(group.length > 1) variants.push({kind:kind, norm:k, values:group});
      });
    });

    /* ---- THE TWO FIELDS TRAVEL TOGETHER, OR NEITHER DOES -----------------
       Measured on the real files: appropriation, fiscal year, expiration and
       cancel date populate together or not at all - the ones carrying none
       are the partner participants. A line with one and not the other breaks
       that, and cannot have its life derived. */
    const appnNoFy = ls.filter(L=>s_(L.appn) !== '' && s_(L.fy) === '');
    const fyNoAppn = ls.filter(L=>s_(L.appn) === '' && s_(L.fy) !== '');

    /* ---- A FISCAL YEAR THAT CANNOT HAVE STARTED YET ---------------------
       FY2030 money on an August 2026 report is not a late entry, it is
       impossible: FY2030 begins 1 Oct 2029. Same bound the filename-month
       check uses, applied a line at a time. */
    const future = asOf
      ? ls.filter(L=>{ const s = fyStart(L.fy); return s && s > asOf; })
      : [];

    /* an appropriation is UNKNOWN only when the life table is what rejected
       it - not merely because every line carrying it was compound */
    const unknown = appns.filter(g=>!g.blank && !lifeOf(g.value));

    return {
      appns: appns, fys: fys, variants: variants,
      appnNoFy: appnNoFy, fyNoAppn: fyNoAppn, future: future, unknown: unknown,
      dated:  ls.filter(L=>s_(L.appn) !== '' || s_(L.fy) !== '').length,
      ok: !variants.length && !appnNoFy.length && !fyNoAppn.length && !future.length
    };
  }

  /* ======================================================================
     ACTION AGING.

     How long the open work has been open, and whose it is. Not the same
     question as overdue: an action with no due date can never be overdue and
     can still have been sitting there since March, which is exactly the kind
     of item that quietly becomes a cancelled balance.

     THE CLOCK IS THE WALL CLOCK, not the period as-of - the same split
     wlStatus makes. Actions get raised AFTER the report they are about lands,
     so an August action aged against 26 August reads as negative. Age is how
     long somebody has actually been sitting on it.

     Only OPEN actions age. A closed one has an age of record, not of work.
     ====================================================================== */
  const AGE_BANDS = [
    {id:'d30',  name:'30 days or less', short:'≤ 30',  lo:0,  hi:30,   tone:'g'},
    {id:'d60',  name:'31 to 60 days',   short:'31–60', lo:31, hi:60,   tone:'b'},
    {id:'d90',  name:'61 to 90 days',   short:'61–90', lo:61, hi:90,   tone:'a'},
    {id:'d90p', name:'over 90 days',    short:'90+',        lo:91, hi:null, tone:'r'}
  ];
  const ageBand = id => AGE_BANDS.find(b=>b.id===id) || AGE_BANDS[0];

  /* Days an action has been open. Null when it carries no raised date - the
     same refusal every other date function here makes rather than treating a
     missing date as today and reporting an age of zero. */
  function actAge(a, today){
    const now = today || new Date().toISOString().slice(0,10);
    if(!a || !a.opened) return null;
    const d = daysBetween(a.opened, now);
    return d===null? null : Math.max(0, d);
  }
  function ageBandOf(days){
    if(days===null || days===undefined) return null;
    for(const b of AGE_BANDS) if(days >= b.lo && (b.hi===null || days <= b.hi)) return b;
    return AGE_BANDS[AGE_BANDS.length-1];
  }

  /* The aging profile of the whole open book. EVERY BAND IS ALWAYS RETURNED,
     so an empty one reads as "none here" rather than vanishing - the same
     rule LIFE_BANDS and riskBands follow. */
  function agingProfile(actions, today, amountOf){
    const open = (actions||[]).filter(actOpen);
    const amt  = amountOf || (()=>null);
    return AGE_BANDS.map(b=>{
      const in_ = open.filter(a=>{
        const g = ageBandOf(actAge(a, today));
        return g && g.id === b.id;
      });
      return {band:b, n:in_.length, actions:in_,
              amount: in_.reduce((s,a)=>s+Math.abs(amt(a)||0), 0)};
    });
  }

  /* One row per owner, aged across the bands.

     AN UNOWNED ACTION IS A ROW, NOT AN OMISSION. "(unassigned)" is the single
     most important line on this report - work nobody has been given is work
     nobody is doing - so it is named and sorted to the top of its age, never
     quietly dropped for having a blank field. */
  function agingByOwner(actions, today, amountOf){
    const open = (actions||[]).filter(actOpen);
    const amt  = amountOf || (()=>null);
    const UNOWNED = '(unassigned)';
    const by = new Map();
    open.forEach(a=>{
      const k = s_(a.owner) || UNOWNED;
      if(!by.has(k)) by.set(k, {name:k, unowned:(k===UNOWNED), actions:[]});
      by.get(k).actions.push(a);
    });
    return [...by.values()].map(g=>{
      const ages = g.actions.map(a=>actAge(a, today)).filter(d=>d!==null);
      const bands = {};
      AGE_BANDS.forEach(b=>{ bands[b.id] = 0; });
      let undated = 0;
      g.actions.forEach(a=>{
        const bd = ageBandOf(actAge(a, today));
        if(bd) bands[bd.id]++; else undated++;
      });
      return Object.assign({}, g, {
        n: g.actions.length,
        bands: bands,
        undated: undated,          /* raised with no date on them */
        oldest: ages.length? Math.max.apply(null, ages) : null,
        median: median(ages),
        amount: g.actions.reduce((s,a)=>s+Math.abs(amt(a)||0), 0)
      });
    }).sort((x,y)=> (x.unowned?0:1)-(y.unowned?0:1)
                 || (y.oldest===null?-1:y.oldest) - (x.oldest===null?-1:x.oldest)
                 || y.n - x.n
                 || x.name.localeCompare(y.name));
  }

  /* the middle value, or the mean of the middle two. Null on nothing. */
  function median(xs){
    const v = (xs||[]).slice().sort((a,b)=>a-b);
    if(!v.length) return null;
    const m = Math.floor(v.length/2);
    return v.length % 2? v[m] : Math.round((v[m-1] + v[m]) / 2);
  }

  /* ======================================================================
     MONTH OVER MONTH IN UNEXPLAINED BALANCE.

     The ULO bridge asks where the money went. This asks something different:
     where the money we CANNOT ACCOUNT FOR went - and the distinction that
     makes it worth a slide is that unexplained money falls for two completely
     unrelated reasons.

       Somebody ANSWERED          the chase working. The only movement here
                                  the team actually controls.
       The balance MOVED          it was paid or taken off contract. Nobody
                                  explained anything; there is simply less of
                                  it left to explain.

     "Unexplained fell $12M" hides which, and they lead to opposite decisions:
     the first says keep chasing, the second says the money is leaving anyway.
     Exactly the mistake the ULO bridge was built to avoid, one level up.

     EVERY LINE IS SCORED AGAINST THE REGISTER AS IT STOOD IN ITS OWN MONTH,
     via actsAsAt - otherwise a disposition given in September counts in
     August too and `explained` is zero by construction.

     The decomposition is EXACT and `ok` asserts it rather than trusting it.
     A line that is both paid down and answered contributes to both buckets:
     the balance movement is taken first, and the answer is valued at what was
     left - so "we paid $90 and gave a disposition on the other $10" reads as
     what happened, rather than crediting the chase with the whole $100.
     ====================================================================== */
  function unexBridge(a, b, actionsList, asOfA, asOfB){
    const A = a || [], B = b || [];
    const actA = actsAsAt(actionsList, asOfA);
    const actB = actsAsAt(actionsList, asOfB);

    /* at risk, and whether anything was said about it, in each month */
    const look = (ls, acts, asOf) => {
      const dispBy = new Map();
      (acts||[]).forEach(x=>{
        if(!x.disp) return;
        if(x.scope==='line')     dispBy.set('L:'+x.target, x.disp);
        if(x.scope==='contract') dispBy.set('C:'+x.target, x.disp);
      });
      const m = new Map();
      ls.forEach(L=>{
        const p = phaseOf(L, asOf);
        const risk = (p.id==='expired' || p.id==='cancelled');
        const disp = dispBy.get('L:'+L.key) || dispBy.get('C:'+L.piin) || '';
        m.set(L.key, {L:L, risk:risk, disp:disp,
                      u: (risk && !disp)? L.ulo : 0,
                      r: risk? L.ulo : 0});
      });
      return m;
    };
    const mA = look(A, actA, asOfA), mB = look(B, actB, asOfB);

    const parts = {
      explained:0, regressed:0,          /* somebody answered / un-answered   */
      paid:0, deobligated:0, obligated:0, /* the balance moved                */
      newlyAtRisk:0, noLongerAtRisk:0,   /* it crossed into or out of risk    */
      arrived:0, left:0                  /* the line entered or left the file */
    };
    const rows = [];
    const keys = new Set([...mA.keys(), ...mB.keys()]);

    keys.forEach(k=>{
      const x = mA.get(k) || null, y = mB.get(k) || null;
      const uA = x? x.u : 0, uB = y? y.u : 0;
      if(Math.abs(uA) <= EPS_ && Math.abs(uB) <= EPS_) return;

      const put = (bucket, amt) => {
        if(Math.abs(amt) <= EPS_) return;
        parts[bucket] += amt;
        rows.push({key:k, L:(y? y.L : x.L), bucket:bucket, amt:amt,
                   uA:uA, uB:uB, dispA:x? x.disp : '', dispB:y? y.disp : ''});
      };

      /* -- the line is new to the report ---------------------------------- */
      if(!x){ put('arrived', uB); return; }
      /* -- the line has left it ------------------------------------------- */
      if(!y){ put('left', -uA); return; }

      /* -- it was unexplained, and is no longer at risk at all ------------- */
      if(uA > EPS_ && !y.risk){ put('noLongerAtRisk', -uA); return; }
      /* -- it was not at risk, and now is --------------------------------- */
      if(!x.risk && uB > EPS_){ put('newlyAtRisk', uB); return; }

      /* -- it was at risk in both months. Take the BALANCE first, then the
            ANSWER, so a line that was paid down AND answered credits the
            chase only with what was actually left to answer for. ---------- */
      const openU = uA;                        /* unexplained at the start   */
      const mid   = x.disp? 0 : y.r;           /* same status, closing balance */
      if(!x.disp){
        const dv = mid - openU;                /* the balance movement       */
        if(dv < -EPS_){
          /* paid down or taken off contract - the ULO bridge's own test */
          const dObl = (y.L.obl||0) - (x.L.obl||0);
          if(dObl < -EPS_) put('deobligated', Math.max(dv, dObl));
          if(dv - Math.min(0, dObl) < -EPS_) put('paid', dv - Math.min(0, dObl));
        }else if(dv > EPS_) put('obligated', dv);
      }
      /* now the status change, valued at what is left */
      if(!x.disp && y.disp)      put('explained', -mid);
      else if(x.disp && !y.disp) put('regressed', uB);
    });

    const opening = A.reduce((s,L)=>{ const v = mA.get(L.key); return s + (v? v.u : 0); }, 0);
    const closing = B.reduce((s,L)=>{ const v = mB.get(L.key); return s + (v? v.u : 0); }, 0);

    /* PER CONTRACT, FROM THE SAME MAPS THE TOTALS COME FROM.

       The slide's by-contract table first added up the MOVEMENT rows, which
       silently omits every line that was unexplained in both months and did
       not move - it produces no row at all - and came to $47.187M against a
       roll-forward opening of $47.125M. A breakdown that disagrees with the
       total it sits beside is worse than no breakdown, so it is derived here,
       once, from the same place. */
    const openBy = {}, closeBy = {}, answeredBy = {};
    A.forEach(L=>{ const v = mA.get(L.key);
      if(v && Math.abs(v.u) > EPS_) openBy[L.piin] = (openBy[L.piin]||0) + v.u; });
    B.forEach(L=>{ const v = mB.get(L.key);
      if(v && Math.abs(v.u) > EPS_) closeBy[L.piin] = (closeBy[L.piin]||0) + v.u; });
    rows.filter(r=>r.bucket==='explained').forEach(r=>{
      answeredBy[r.L.piin] = (answeredBy[r.L.piin]||0) + r.amt; });
    const moved = Object.keys(parts).reduce((s,k)=>s+parts[k], 0);
    return {
      opening: opening, closing: closing, delta: closing - opening,
      parts: parts, rows: rows,
      openBy: openBy, closeBy: closeBy, answeredBy: answeredBy,
      piins: [...new Set(Object.keys(openBy).concat(Object.keys(closeBy)))],
      nA: A.filter(L=>(mA.get(L.key)||{}).u).length,
      nB: B.filter(L=>(mB.get(L.key)||{}).u).length,
      /* the decomposition carries opening to closing, or it is not one */
      ok: Math.abs((opening + moved) - closing) < 0.5
    };
  }

  const UNEX_PARTS = [
    {id:'explained',      name:'Answered',            good:true},
    {id:'paid',           name:'Paid down',           good:true},
    {id:'deobligated',    name:'Deobligated',         good:true},
    {id:'noLongerAtRisk', name:'No longer at risk',   good:true},
    {id:'left',           name:'Left the report',     good:true},
    {id:'newlyAtRisk',    name:'Newly at risk',       good:false},
    {id:'arrived',        name:'New to the report',   good:false},
    {id:'obligated',      name:'Obligation added',    good:false},
    {id:'regressed',      name:'Answer withdrawn',    good:false}
  ];

  /* THE REGISTER AS IT STOOD ON A DATE.

     Actions raised after the date are not yet known; dispositions set after it
     are masked off, leaving the action itself in place because it WAS open
     then - it just had no answer yet. Passing no date means "as it stands
     now", which is what every other caller wants. */
  function actsAsAt(list, d){
    if(!d) return list || [];
    return (list||[])
      .filter(a=>!a.opened || a.opened <= d)
      .map(a=>(a.disp && a.dispAt && a.dispAt > d)
                ? Object.assign({}, a, {disp:''})
                : a);
  }

  /* one line of history, appended and never edited */
  function actLog(a, who, text){
    a.log = a.log || [];
    a.log.push({at:new Date().toISOString(), who:s_(who), text:s_(text), status:a.status});
    return a;
  }

  /* ======================================================================
     THE POC REGISTER.

     The second thing CED owns, and it exists because the source has no owner
     dimension AT ALL: the ULO summary carries no contracting officer, no
     programme manager, no contractor and no financial manager. Without it the
     tool can say "$9.5M cancels next year" but not "and it is Jane's".

     WHY RULES AND NOT A LIST. Eighteen contracts is 11,835 CLIN lines; nobody
     is going to name a person against each one. So an entry is a RULE: it
     constrains any combination of contract, CLIN, ACRN and participant, and
     applies to every line that matches. One row - "N00019-22-C-XXXX, KO, Jane
     Smith" - covers three hundred lines. A second row naming a different PM for
     one CLIN overrides it, for that CLIN only.

     SPECIFICITY IS COUNTED, NOT ORDERED. The winning rule is the one that
     constrains the MOST dimensions; ties go to whichever was edited last. That
     is explainable in a sentence, which a hand-tuned precedence list never is,
     and it means a rule with no constraints at all is a legitimate catch-all
     rather than a bug.
     ====================================================================== */

  /* The people a balance has to be discussed with. Fixed, because these get
     counted and extracted per role. */
  const POC_ROLES = [
    {id:'ko',    name:'Contracting Officer', short:'KO',  tone:'b'},
    {id:'pm',    name:'Program Manager',     short:'PM',  tone:'t'},
    {id:'ktr',   name:'Contractor',          short:'KTR', tone:'p'},
    {id:'fm',    name:'Financial Manager',   short:'FM',  tone:'g'},
    {id:'other', name:'Other',               short:'--',  tone:''}
  ];
  const pocRole = id => POC_ROLES.find(r=>r.id===id) || POC_ROLES[POC_ROLES.length-1];

  /* The dimensions a rule may constrain. Blank means "any". */
  const POC_DIMS = ['contract','clin','acrn','part'];

  function pocNew(o){
    o = o || {};
    const m = o.m || {};
    return {
      id:      o.id    || actId(),          /* the same collision-safe id */
      role:    o.role  || 'ko',
      name:    o.name  || '',
      org:     o.org   || '',
      email:   o.email || '',
      phone:   o.phone || '',
      note:    o.note  || '',
      m: {contract: s_(m.contract), clin: s_(m.clin), acrn: s_(m.acrn), part: s_(m.part)},
      updated: o.updated || new Date().toISOString()
    };
  }

  function pocValid(p){
    const bad = [];
    if(!s_(p.name)) bad.push('it needs a name');
    if(!POC_ROLES.some(r=>r.id===p.role)) bad.push('the role is not one of the five');
    if(p.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s_(p.email)))
      bad.push('that does not look like an e-mail address');
    return bad;
  }

  /* How many dimensions a rule pins down. 0 is a catch-all and is allowed. */
  const pocSpec = p => POC_DIMS.reduce((n,d)=>n + (s_(p.m[d])? 1 : 0), 0);

  /* Does this rule apply to this line? Every constraint it sets must match;
     the ones it leaves blank are not tested. CLIN and ACRN are compared
     case-insensitively and trimmed, because they are typed by hand. */
  function pocMatch(p, L){
    if(!p || !L) return false;
    const eq = (a,b) => s_(a).toLowerCase() === s_(b).toLowerCase();
    if(p.m.contract && !eq(p.m.contract, L.piin) && !eq(p.m.contract, L.ktr)) return false;
    if(p.m.clin && !eq(p.m.clin, L.clin)) return false;
    if(p.m.acrn && !eq(p.m.acrn, L.acrn)) return false;
    if(p.m.part && !eq(p.m.part, L.part)) return false;
    return true;
  }

  /* The one person in this role for this line: most specific rule wins, then
     most recently edited. Returns null rather than guessing. */
  function pocFor(pocs, L, role){
    let best = null, bestSpec = -1;
    (pocs||[]).forEach(p=>{
      if(p.role !== role || !pocMatch(p, L)) return;
      const sp = pocSpec(p);
      if(sp > bestSpec || (sp === bestSpec && (p.updated||'') > ((best&&best.updated)||''))){
        best = p; bestSpec = sp;
      }
    });
    return best;
  }
  /* every role that resolves for a line, as {role: entry} */
  function pocAllFor(pocs, L){
    const out = {};
    POC_ROLES.forEach(r=>{ const p = pocFor(pocs, L, r.id); if(p) out[r.id] = p; });
    return out;
  }
  /* the lines one rule's PERSON owns in a given role - not just the lines that
     rule matches, because a more specific rule may have taken some away */
  function pocLines(pocs, lines, name, role){
    return (lines||[]).filter(L=>{
      const p = pocFor(pocs, L, role);
      return p && s_(p.name).toLowerCase() === s_(name).toLowerCase();
    });
  }

  /* ---- who owns what, and how much of it nobody can explain ------------- */
  function pocRollup(pocs, lines, actionsList, role, asOf){
    const byName = new Map();
    const UNASSIGNED = '(nobody assigned)';
    (lines||[]).forEach(L=>{
      const p = pocFor(pocs, L, role);
      const k = p? s_(p.name) : UNASSIGNED;
      if(!byName.has(k)) byName.set(k, {name:k, poc:p||null, lines:[]});
      byName.get(k).lines.push(L);
    });
    return [...byName.values()].map(g=>{
      const cov = coverage(g.lines, actionsList, asOf);
      const acts = (actionsList||[]).filter(a=>{
        if(a.scope==='line')     return g.lines.some(L=>L.key===a.target);
        if(a.scope==='contract') return g.lines.some(L=>L.piin===a.target);
        return false;
      });
      return Object.assign({}, g, totals(g.lines), {
        atRisk: cov.atRisk, covered: cov.covered, uncovered: cov.uncovered,
        pct: cov.pct, open: acts.filter(actOpen).length, acts: acts.length,
        unassigned: g.name === UNASSIGNED
      });
    }).sort((a,b)=> (a.unassigned?1:0)-(b.unassigned?1:0)
                 || Math.abs(b.uncovered.ulo)-Math.abs(a.uncovered.ulo)
                 || a.name.localeCompare(b.name));
  }

  /* ====================================================================
     THE SEND LOG.

     Two kinds of event, never anything else: a worklist WENT OUT, or one CAME
     BACK. Both are facts with a date on them, and neither is editable - there
     is no correction that makes sense on "this was sent". Deleting is the only
     way to remove one, and that is deliberate.

     A send is keyed to the PERIOD it was about, not to the day it happened, so
     "was August chased?" is answerable in November.
     ==================================================================== */
  const SEND_KINDS = [
    {id:'sent',     name:'Sent',     tone:'b'},
    {id:'returned', name:'Returned', tone:'g'}
  ];
  function sendNew(o){
    o = o || {};
    return {
      id:    o.id   || actId(),          /* the same collision-safe id */
      kind:  SEND_KINDS.some(k=>k.id===o.kind)? o.kind : 'sent',
      name:  s_(o.name),                 /* who it went to / came back from */
      role:  POC_ROLES.some(r=>r.id===o.role)? o.role : 'ko',
      pk:    s_(o.pk),                   /* the period it was ABOUT */
      at:    o.at || new Date().toISOString(),
      n:     +o.n || 0,                  /* lines on it */
      ulo:   +o.ulo || 0,
      uncovered: +o.uncovered || 0,      /* unexplained when it went out */
      answered:  +o.answered || 0,       /* rows answered, on a return */
      file:  s_(o.file),
      by:    s_(o.by)                    /* whose copy of CED recorded it */
    };
  }
  function sendValid(x){
    const bad = [];
    if(!s_(x.name)) bad.push('a send has to name somebody');
    if(!SEND_KINDS.some(k=>k.id===x.kind)) bad.push('the kind is not one of the two');
    if(!POC_ROLES.some(r=>r.id===x.role)) bad.push('the role is not a known one');
    return bad;
  }
  const sendKind = id => SEND_KINDS.find(k=>k.id===id) || SEND_KINDS[0];
  /* one contact, in one role, about one period */
  const sendKey = x => x.role + '|' + s_(x.name).toLowerCase() + '|' + x.pk;

  /* WORKLIST STATUS BY CONTACT, for one period.

     Every contact who owns a line is a row, whether or not anything has ever
     been sent to them - "never asked" is the most important state on this
     report and it cannot be one that is missing from the table.

     States, in the order they are chased:
       overdue    sent, no reply, and it has been too long
       waiting    sent, no reply, not yet too long
       returned   they answered, and nothing has been sent since
       stale      they answered, but a later send is still outstanding
       never      nobody has ever asked them about this period
  */
  /* TWO DIFFERENT CLOCKS, AND THEY ARE NOT INTERCHANGEABLE.

     `asOf` is the date of the DATA and decides what is expired, cancelled and
     unexplained - it has to be the period's own as-of or the money moves.

     `today` is the date of the CHASE and decides how long somebody has been
     sitting on a worklist. These are not the same date and cannot be: the
     August report lands on 26 August and the worklists go out in September,
     so measuring the wait against the as-of gave "-9 days" - a send that had
     not happened yet. Days waiting is a wall-clock quantity and is measured
     as one; the slide says so rather than pretending otherwise. */
  function wlStatus(pocsList, lines, actionsList, sends, pk, asOf, dueDays, today){
    const days = dueDays===undefined? 14 : dueDays;
    const now  = today || new Date().toISOString().slice(0,10);
    const log  = (sends||[]).filter(x=>!pk || x.pk === pk);
    const out  = [];
    POC_ROLES.forEach(R=>{
      pocRollup(pocsList, lines, actionsList, R.id, asOf).forEach(g=>{
        if(g.unassigned) return;
        const mine = log.filter(x=>x.role===R.id
                              && s_(x.name).toLowerCase() === s_(g.name).toLowerCase());
        const sent = mine.filter(x=>x.kind==='sent')
                         .sort((a,b)=> a.at < b.at? 1 : -1)[0] || null;
        const ret  = mine.filter(x=>x.kind==='returned')
                         .sort((a,b)=> a.at < b.at? 1 : -1)[0] || null;
        let state = 'never', age = null;
        if(sent){
          /* a send stamped in the future is a clock problem, not a negative
             wait - it reads as sent today rather than as nonsense */
          age = Math.max(0, daysBetween(sent.at.slice(0,10), now) || 0);
          if(ret && ret.at >= sent.at) state = 'returned';
          else if(ret)                 state = 'stale';
          else state = (age !== null && age > days)? 'overdue' : 'waiting';
        }else if(ret){
          state = 'returned';           /* answered something never logged out */
        }
        out.push(Object.assign({}, g, {
          role: R.id, roleName: R.name, short: R.short, tone: R.tone,
          sent: sent, ret: ret, state: state, age: age,
          sends: mine.filter(x=>x.kind==='sent').length,
          returns: mine.filter(x=>x.kind==='returned').length
        }));
      });
    });
    const rank = {overdue:0, waiting:1, stale:2, never:3, returned:4};
    return out.sort((a,b)=> (rank[a.state]-rank[b.state])
                         || Math.abs(b.uncovered.ulo)-Math.abs(a.uncovered.ulo)
                         || a.name.localeCompare(b.name));
  }
  const WL_STATES = [
    {id:'overdue',  name:'Overdue',   tone:'r'},
    {id:'waiting',  name:'Waiting',   tone:'a'},
    {id:'stale',    name:'Re-sent',   tone:'a'},
    {id:'never',    name:'Never asked',tone:'p'},
    {id:'returned', name:'Returned',  tone:'g'}
  ];
  const wlState = id => WL_STATES.find(s=>s.id===id) || WL_STATES[WL_STATES.length-1];

  /* Whole numbers of days between two ISO dates. Null when either is missing -
     the same refusal expired() and phaseOf() make rather than inventing a
     reference point. */
  function daysBetween(a, b){
    if(!a || !b) return null;
    const A = Date.UTC(+a.slice(0,4), +a.slice(5,7)-1, +a.slice(8,10));
    const B = Date.UTC(+b.slice(0,4), +b.slice(5,7)-1, +b.slice(8,10));
    return Math.round((B - A) / 86400000);
  }

  /* a rule that matches nothing in the loaded data is not an error - the
     contract may simply not be imported yet - but it is worth saying */
  function pocUnused(pocs, lines){
    return (pocs||[]).filter(p=>!(lines||[]).some(L=>pocMatch(p, L)));
  }

  /* ======================================================================
     MERGING, ONCE.

     Both registers are exchanged as files and both have to come back together
     without losing anything, so the rule lives in one place. `onConflict` is
     the only part that differs: an action's append-only log must never come
     back shorter than it went, and a POC rule has no such history.
     ====================================================================== */
  function mergeById(mine, theirs, mk, onConflict){
    const out = (mine||[]).map(x=>mk(x));
    const byId = new Map(out.map(x=>[x.id, x]));
    const rep = {added:0, updated:0, same:0, kept:0};
    (theirs||[]).forEach(raw=>{
      const b = mk(raw);
      const a = byId.get(b.id);
      if(!a){ out.push(b); byId.set(b.id, b); rep.added++; return; }
      const au = a.updated||'', bu = b.updated||'';
      if(bu > au){ Object.assign(a, onConflict? onConflict(a, b) : b); rep.updated++; }
      else if(bu < au) rep.kept++;
      else rep.same++;
    });
    out.sort((x,y)=>(y.updated||'').localeCompare(x.updated||''));
    return {items:out, report:rep};
  }

  function mergeActions(mine, theirs){
    const r = mergeById(mine, theirs, actNew, (a,b)=>
      /* the incoming edit is newer - take it, but keep the LONGER log, since an
         append-only history should never come back shorter than it went */
      Object.assign({}, b, {log: (b.log||[]).length >= (a.log||[]).length? b.log : a.log}));
    return {actions: r.items, report: r.report};
  }
  function mergePocs(mine, theirs){
    const r = mergeById(mine, theirs, pocNew);
    return {pocs: r.items, report: r.report};
  }

  /* ======================================================================
     TAKING A WORKLIST BACK.

     The extract goes out to a contracting officer, a programme manager or a
     contractor, they type into three columns, and it comes back. This reads it.

     IT IS READ, PROPOSED, AND ONLY THEN APPLIED. Nothing a returned file says
     is written straight into the register: `readWorklist` parses, `planWorklist`
     works out what would change, and the owner sees the whole change set before
     any of it happens. This is the one input to the tool that was edited
     OUTSIDE the building, by somebody who does not use it, in Excel - the
     assumption that it comes back in the shape it went out is exactly the
     assumption that will be wrong.

     What comes back is matched on `contract | CLIN | ACRN`, the same identity
     everything else is anchored to. The contract may return in either form -
     "N0001922CXXXX" or "N00019-22-C-XXXX" - because that is how it went out.
     ====================================================================== */

  /* The three columns they fill in, and the identity columns we match on.
     Read BY NAME, for the same reason the ULO import is: a returned workbook
     has been through somebody else's Excel, and a column may well have moved. */
  const WL_COLS = [
    {k:'contract', req:true,  alias:['contract','contract number','piin']},
    {k:'clin',     req:true,  alias:['clin','clin no','clin number']},
    {k:'acrn',     req:true,  alias:['acrn']},
    {k:'disp',     req:false, alias:['your disposition','disposition (yours)','their disposition']},
    {k:'note',     req:false, alias:['your note','note (yours)','comment','their note']},
    {k:'due',      req:false, alias:['your target date','target date','date','their target date']}
  ];

  /* What they typed, mapped onto the vocabulary. Deliberately generous - these
     are people writing in a spreadsheet, not choosing from a list - and
     anything it cannot place is REPORTED rather than guessed at or dropped. */
  const WL_DISP_HINTS = [
    {id:'liquidate',  rx:/liquidat|will (be )?(pay|paid|spend|spent)|disburs|invoice|bill|expend/},
    {id:'deobligate', rx:/deobl|de-?obl|release|give.*back|return|descope|cancel the oblig/},
    {id:'research',   rx:/research|investigat|look|review|unknown|tbd|checking|pending review/},
    {id:'dispute',    rx:/disput|contest|disagree|challeng/},
    {id:'none',       rx:/^(no action|none|n\/a|na|nothing|correct|ok|okay|agree|as is|valid)\b/}
  ];
  function parseDisp(text){
    const t = s_(text).toLowerCase();
    if(!t) return '';
    /* an exact vocabulary name always wins over a keyword guess */
    const exact = ACT_DISP.find(d=>d.name.toLowerCase()===t || d.id===t);
    if(exact) return exact.id;
    for(const h of WL_DISP_HINTS){ if(h.rx.test(t)) return h.id; }
    return '';
  }

  /* a date in any of the shapes a spreadsheet hands back */
  function parseDate(v){
    if(v===''||v===null||v===undefined) return '';
    if(typeof v==='number') return xlSerial(v);
    const t = s_(v);
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
    if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
    m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(t);
    if(m){
      let y = +m[3]; if(y<100) y += 2000;
      return y+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');
    }
    const d = Date.parse(t);
    return isFinite(d)? new Date(d).toISOString().slice(0,10) : '';
  }
  /* the same Excel epoch the importer uses, kept here so the model has no
     dependency on the chunk that loads before it */
  function xlSerial(n){
    if(!isFinite(n) || n<=0) return '';
    return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10);
  }

  /* Find the header row and map it. Scans further than the ULO importer does,
     because the worklist carries a summary block above its table and somebody
     may well have added rows to it. */
  function wlHeader(rows){
    let best = null;
    for(let i=0;i<Math.min(40,(rows||[]).length);i++){
      const cells = (rows[i]||[]).map(hn);
      const map = {}; const taken = {};
      WL_COLS.forEach(c=>{
        for(let j=0;j<cells.length;j++){
          if(taken[j] || !cells[j]) continue;
          if(c.alias.indexOf(cells[j])>=0){ map[c.k]=j; taken[j]=1; return; }
        }
      });
      const ok = WL_COLS.filter(c=>c.req).every(c=>map[c.k]!==undefined)
              && (map.disp!==undefined || map.note!==undefined || map.due!==undefined);
      const score = Object.keys(map).length;
      if(ok && (!best || score>best.score)) best = {row:i, map, score};
    }
    return best;
  }
  const hn = v => (''+(v===null||v===undefined?'':v)).toLowerCase()
    .replace(/&amp;/g,'&').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();

  /* Who sent it back, and which period they were answering about - both drawn
     from the summary block the extract writes, so a stale worklist can be
     spotted rather than silently applied to the wrong month. */
  function wlMeta(rows, headerRow){
    const out = {who:'', role:'', period:''};
    for(let i=0;i<Math.min(headerRow, (rows||[]).length);i++){
      const a = s_((rows[i]||[])[0]), b = s_((rows[i]||[])[1]);
      if(!a) continue;
      const r = POC_ROLES.find(x=>x.name.toLowerCase()===a.toLowerCase());
      if(r && b){ out.role = r.id; out.who = b; }
      if(/^period$/i.test(a) && b) out.period = b;
    }
    return out;
  }

  /* Read a returned worklist against the lines currently loaded. */
  function readWorklist(rows, lines){
    const h = wlHeader(rows);
    if(!h) return {error:'no worklist table was found in that file - it needs Contract, CLIN and '
                       + 'ACRN columns, and at least one of YOUR DISPOSITION, YOUR NOTE or '
                       + 'YOUR TARGET DATE'};
    const meta = wlMeta(rows, h.row);
    const eq = (a,b) => s_(a).toLowerCase() === s_(b).toLowerCase();
    const idx = new Map();
    (lines||[]).forEach(L=>{
      idx.set((L.piin+'|'+L.clin+'|'+L.acrn).toLowerCase(), L);
      idx.set((L.ktr +'|'+L.clin+'|'+L.acrn).toLowerCase(), L);
    });

    const filled = [], unmatched = [], unreadable = [];
    let blank = 0, scanned = 0;
    for(let i=h.row+1;i<rows.length;i++){
      const r = rows[i]||[];
      const g = k => h.map[k]===undefined? '' : r[h.map[k]];
      const contract = s_(g('contract')), clin = s_(g('clin')), acrn = s_(g('acrn'));
      if(!contract && !clin && !acrn) continue;
      scanned++;
      const dispRaw = s_(g('disp')), note = s_(g('note')), dueRaw = g('due');
      const due = parseDate(dueRaw);
      if(!dispRaw && !note && !due){ blank++; continue; }
      const L = idx.get((contract+'|'+clin+'|'+acrn).toLowerCase());
      const rec = {row:i+1, contract, clin, acrn, dispRaw, note, due,
                   disp: parseDisp(dispRaw), line: L||null};
      if(!L){ unmatched.push(rec); continue; }
      if(dispRaw && !rec.disp) unreadable.push(rec);
      filled.push(rec);
    }
    return {meta, header:h, filled, unmatched, unreadable, blank, scanned};
  }

  /* What taking it back WOULD do. Nothing is changed here - this is the change
     set the owner is shown before anything happens. */
  function planWorklist(parsed, actionsList, opts){
    opts = opts || {};
    const who = s_(opts.who) || s_(parsed.meta && parsed.meta.who);
    const create = [], update = [];
    (parsed.filled||[]).forEach(rec=>{
      const L = rec.line;
      const open = (actionsList||[]).filter(a=>
        a.scope==='line' && a.target===L.key && actOpen(a));
      /* the newest open action on the line is the one being answered; with none,
         the response raises one */
      const target = open.sort((x,y)=>(y.updated||'').localeCompare(x.updated||''))[0];
      if(target){
        const changes = [];
        if(rec.disp && rec.disp !== target.disp)
          changes.push({f:'disp', from:target.disp, to:rec.disp});
        if(rec.due && rec.due !== target.due)
          changes.push({f:'due', from:target.due, to:rec.due});
        if(who && who !== target.withWho)
          changes.push({f:'withWho', from:target.withWho, to:who});
        update.push({rec, action:target, changes, note:rec.note});
      }else{
        create.push({rec, draft: actNew({
          scope:'line', target:L.key,
          title: rec.note? rec.note.slice(0,80)
               : ((actDisp(rec.disp)||{}).name || 'Response') + ' — ' + L.clin + ' / ' + L.acrn,
          detail: rec.note,
          disp: rec.disp, due: rec.due, withWho: who, status:'open'
        })});
      }
    });
    return {who, create, update,
            unmatched: parsed.unmatched||[], unreadable: parsed.unreadable||[],
            blank: parsed.blank||0, scanned: parsed.scanned||0,
            total: (parsed.filled||[]).length};
  }

  /* ======================================================================
     MONTH OVER MONTH.

     Two positions of the same contracts, joined on `key` - contract + CLIN +
     ACRN. Every line falls into exactly one of three sets: matched, added
     (present now, absent before) and removed (present before, absent now).

     THE DECOMPOSITION IS THE POINT. A ULO that fell because money was paid
     out and a ULO that fell because the obligation was taken back are
