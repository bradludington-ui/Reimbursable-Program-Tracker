     completely different facts, and a bare "ULO went down $4M" hides which
     one happened. So every movement is carried as its two causes:

         dUlo = dObl - dExp

     and the roll-forward bridge is built from those, not from the ULO column:

         opening ULO
           + obligations added        (positive dObl, matched and added)
           - deobligations            (negative dObl, matched and removed)
           - expenditures             (positive dExp)
           + expenditure reversals    (negative dExp - credits do happen)
         = closing ULO

     This reconciles by construction over the union of keys, and `bridgeOk`
     asserts it rather than trusting it.
     ====================================================================== */
  const ZERO = {obl:0, exp:0, ulo:0};

  function compare(prior, cur){
    const A = new Map(), B = new Map();
    (prior||[]).forEach(L=>A.set(L.key, L));
    (cur||[]).forEach(L=>B.set(L.key, L));

    const rows = [];
    const seen = new Set();

    B.forEach((b,k)=>{
      const a = A.get(k) || null;
      rows.push(mkDelta(a, b));
      seen.add(k);
    });
    A.forEach((a,k)=>{
      if(seen.has(k)) return;
      rows.push(mkDelta(a, null));
    });

    const opening = totals(prior||[]);
    const closing = totals(cur||[]);

    /* MOVEMENT ON CONTINUING LINES IS KEPT APART FROM LINES ENTERING AND
       LEAVING THE REPORT. Measured on two real months, folding them together
       is actively misleading: nine fully-liquidated lines dropping off the
       September report showed up as $49M of "deobligation" and $44M of
       "expenditure reversal" that almost exactly cancelled, swamping the $31M
       that was actually paid. A line leaving with no balance left should move
       the bridge by nothing, and now it does. */
    let oblUp=0, oblDown=0, expUp=0, expDown=0, addedUlo=0, removedUlo=0;
    rows.forEach(r=>{
      if(r.kind==='added'){   addedUlo   += r.b.ulo; return; }
      if(r.kind==='removed'){ removedUlo -= r.a.ulo; return; }
      if(r.dObl>0) oblUp += r.dObl; else oblDown += r.dObl;
      if(r.dExp>0) expUp += r.dExp; else expDown += r.dExp;
    });

    const bridge = {
      opening: opening.ulo,
      oblUp, oblDown, expUp, expDown,
      addedUlo, removedUlo,
      addedN: rows.filter(r=>r.kind==='added').length,
      removedN: rows.filter(r=>r.kind==='removed').length,
      closing: closing.ulo,
      /* what the bridge says the closing balance should be */
      derived: opening.ulo + oblUp + oblDown - expUp - expDown + addedUlo + removedUlo
    };
    bridge.delta = bridge.closing - bridge.opening;
    bridge.ok = Math.abs(bridge.derived - bridge.closing) <= EPS_;

    /* attribute drift: the same line described differently this month. Not an
       error - a participant or appropriation can be corrected - but the reader
       has to be told, because it changes how the line is grouped. */
    const drift = [];
    rows.forEach(r=>{
      if(!r.a || !r.b) return;
      ['part','appn','fy','ctype','title','expD','cancD'].forEach(f=>{
        if((r.a[f]||'') !== (r.b[f]||''))
          drift.push({key:r.key, field:f, from:r.a[f]||'', to:r.b[f]||'', line:r.b});
      });
    });

    return {
      rows, bridge, drift,
      opening, closing,
      added:   rows.filter(r=>r.kind==='added'),
      removed: rows.filter(r=>r.kind==='removed'),
      matched: rows.filter(r=>r.kind==='matched'),
      moved:   rows.filter(r=>r.moved)
    };
  }

  function mkDelta(a, b){
    const av = a || ZERO, bv = b || ZERO;
    const dObl = bv.obl - av.obl;
    const dExp = bv.exp - av.exp;
    const dUlo = bv.ulo - av.ulo;
    const o = {
      key: (b||a).key,
      a, b,
      line: b || a,                 /* whichever exists, for display */
      kind: !a? 'added' : !b? 'removed' : 'matched',
      dObl, dExp, dUlo,
      /* the two causes, named */
      liquidated:  dExp >  EPS_,
      reversed:    dExp < -EPS_,
      obligated:   dObl >  EPS_,
      deobligated: dObl < -EPS_
    };
    o.moved = Math.abs(dObl)>EPS_ || Math.abs(dExp)>EPS_;
    /* dUlo should equal dObl - dExp whenever both rows reconcile internally */
    o.consistent = Math.abs(dUlo - (dObl - dExp)) <= EPS_;
    return o;
  }

  /* A one-word label for the table, chosen by what dominates. A line can be
     both liquidated and deobligated; the flags above keep both, this is only
     the headline. */
  function moveLabel(r){
    if(r.kind==='added')   return 'New';
    if(r.kind==='removed') return 'Dropped';
    if(!r.moved)           return 'No movement';
    if(r.deobligated && Math.abs(r.dObl) > Math.abs(r.dExp)) return 'Deobligated';
    if(r.obligated   && Math.abs(r.dObl) > Math.abs(r.dExp)) return 'Obligated';
    if(r.liquidated)  return 'Liquidated';
    if(r.reversed)    return 'Reversed';
    return 'Changed';
  }

  /* ======================================================================
     TREND.  One row per period, in time order, plus the month-on-month
     movement between consecutive periods.

     Periods are NOT assumed to be one month apart. Everything rate-based is
     divided by the actual months between them, so a gap in the series makes
     the rate smaller rather than silently overstating it.
     ====================================================================== */
  function series(periods, linesOf){
    const out = (periods||[]).map(p=>{
      const ls = linesOf(p.key);
      const t = totals(ls);
      return Object.assign({period:p, key:p.key, label:p.label, asOf:p.asOf, lines:ls}, t);
    });
    for(let i=1;i<out.length;i++){
      const prev = out[i-1], cur = out[i];
      const cmp = compare(prev.lines, cur.lines);
      cur.cmp = cmp;
      cur.dUlo = cur.ulo - prev.ulo;
      cur.dObl = cur.obl - prev.obl;
      cur.dExp = cur.exp - prev.exp;
      /* months between the two as-of dates; a missing date falls back to the
         period keys, which are months by construction */
      const m = (prev.asOf && cur.asOf)? monthsTo(prev.asOf, cur.asOf)
              : monthsTo(prev.key+'-01', cur.key+'-01');
      cur.months = (m && m>0)? m : 1;
      cur.expPerMonth = cmp.bridge.expUp / cur.months;
    }
    return out;
  }

  /* How fast the balance is actually being paid down, and whether that rate
     clears what is on the books before it cancels.

     Deliberately built on EXPENDITURES ONLY, not on the fall in ULO: money
     that left the balance by deobligation was never going to be spent, and
     counting it as burn would flatter the runway. */
  function burn(ser){
    const steps = (ser||[]).slice(1).filter(s=>s.months>0);
    if(!steps.length) return null;
    let exp=0, months=0;
    steps.forEach(s=>{ exp += s.cmp.bridge.expUp; months += s.months; });
    const rate = months? exp/months : 0;
    const last = ser[ser.length-1];
    return {
      steps: steps.length,
      months,
      expended: exp,
      rate,
      ulo: last.ulo,
      /* months to clear the CURRENT balance at the observed rate */
      runway: rate>0? last.ulo/rate : null
    };
  }

  /* Sort by a named accessor, stably. Ties fall back to the original order so
     a re-render cannot reshuffle rows that compare equal. */
  function sortBy(arr, get, dir){
    const d = dir==='asc'? 1 : -1;
    return arr.map((v,i)=>[v,i]).sort((a,b)=>{
      const x=get(a[0]), y=get(b[0]);
      if(x===y) return a[1]-b[1];
      if(typeof x==='number' && typeof y==='number') return (x-y)*d;
      return (''+x).localeCompare(''+y)*d;
    }).map(p=>p[0]);
  }

  /* The period a bare call means: whatever the chrome is showing. */
  const curKey = () => (typeof DB!=='undefined' && DB)? DB.cur : '';
  const allLines = () => (typeof DB!=='undefined' && DB)? DB.lines : [];
  const inPeriod = pk => allLines().filter(L=>L.pk===pk);

  return {
    EPS: EPS_, BANDS, BLANK,
    filter, totals, group, sortBy, options,
    byContract, byParticipant, byAppn, byFy, byCtype, byFund, byAcrn, byClin, byCancel,
    bandOf, riskBands, expired, ties, advisories,
    dateLabel, monthsTo,
    compare, moveLabel, series, burn,
    PARTS, FMS_RANK, partRank, partName, unranked, noParticipant,
    APPN_LIFE, LIFE_BANDS, lifeOf, applyLife, fyOf, fyLabel, phaseOf, bandIdOf,
    lifeBands, cancelFY, inFinalYear, expiringSoon, expiryWall, daysBetween, addDays,
    /* the watch window - the lens the tool is pointed through */
    WIN_GROUPS, winOf, inWindow, windowSplit, windowSays,
    cancellingAvailFY, cancellingCohort, watchYears,
    lifeCheck, byCancelFY, byFundYear,
    ACT_SCOPE, ACT_STATUS, ACT_DISP, actStatus, actDisp, actOpen, actId, actNew,
    actValid, actionsFor, actionsOnContract, orphans, actFilter, actOverdue,
    actDueIn, coverage, dispByContract, actsAsAt,
    monthCheck, monthsIn, newestFY, MONTH_ABBR,
    contractCheck, piinsIn, piinNorm, lifeRefusal,
    appnFyAudit, fyPlain, fyStart, varNorm, lifeOf,
    expiryFY, byExpiryFY, byParticipantState, byAppnState, topByUlo, unexBridge, UNEX_PARTS,
    AGE_BANDS, ageBand, ageBandOf, actAge, agingProfile, agingByOwner, median,
    mergeActions, mergeById, actLog,
    SEND_KINDS, sendNew, sendValid, sendKind, sendKey, wlStatus,
    WL_STATES, wlState, daysBetween,
    POC_ROLES, POC_DIMS, pocRole, pocNew, pocValid, pocSpec, pocMatch,
    pocFor, pocAllFor, pocLines, pocRollup, pocUnused, mergePocs,
    WL_COLS, parseDisp, parseDate, wlHeader, wlMeta, readWorklist, planWorklist,
    /* ---------------------------------------------------------------------
       SCOPE.  `all` is the CURRENT PERIOD - every single-period view reads it,
       so switching the period switches the whole tool at once. `everything` is
       the entire store and exists for the trend. Model functions never call
       any of these; see Rule 1. */
    scope:      function(){
                  const f = Object.assign({}, (typeof F!=='undefined')? F : {});
                  /* the life filter needs the period's as-of to place a line */
                  f.asOf = (typeof curAsOf==='function')? curAsOf() : '';
                  return filter(inPeriod(curKey()), f);
                },
    /* THE LENS OFF, THE READER'S OWN FILTERS STILL ON.
       For the handful of reports whose SUBJECT is the whole life cycle - the
       expiration wall, the cancellation timeline, the month-over-month bridge
       - the window is not a lens but an error: a bridge that opens on one
       population and closes on another does not tie, and an expiration wall
       drawn only over already-expired money is empty by construction. Those
       ask for this, and say on their face that they did. */
    scopeWide:  function(){
                  const f = Object.assign({}, (typeof F!=='undefined')? F : {});
                  f.win = '';
                  f.asOf = (typeof curAsOf==='function')? curAsOf() : '';
                  return filter(inPeriod(curKey()), f);
                },
    all:        function(){ return inPeriod(curKey()); },
    inPeriod:   inPeriod,
    everything: allLines
  };
})();
</script>

<script>
/* ============================================================================
   THE CHART KIT.  Hand-built SVG, because there is no network and no installs
   on the machines this runs on - there cannot be a charting library.

   Three rules, all of them learned the hard way elsewhere in this family:
     - colour comes from CSS variables, so both themes work with no second set
       of chart code and no hard-coded hex to go stale;
     - every chart prints its own scale, because a bar with no axis is a shape
       and not a measurement;
     - a chart with NO DATA says so in words. An empty axis is indistinguishable
       from a broken query.
   ============================================================================ */

const CH = (function(){

  const enc = s => (''+(s===null||s===undefined?'':s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function empty(msg){
    return '<div class="empty"><div class="big">Nothing to chart</div>'+enc(msg||'No rows in the current scope.')+'</div>';
  }

  /* A "nice" round ceiling, so the axis reads 0 / 25 / 50 rather than 0 / 23.7 */
  function niceMax(v){
    if(!(v>0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v/p;
    const step = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
    return step*p;
  }

  /* $M with the number of decimals the SCALE needs, not a fixed count - a
     0.004 bar labelled "0.0" reads as empty. */
  function fmtM(v, max){
    const m = v/1e6, dp = max>=100? 1 : max>=10? 2 : 3;
    return m.toLocaleString(undefined,{minimumFractionDigits:dp, maximumFractionDigits:dp});
  }

  /* ------------------------------------------------------------------------
     STACKED HORIZONTAL BARS.
     rows: [{label, segs:[{v, tone, name}], total, sub}]
     Each row draws its segments end to end against a shared scale, so rows are
     comparable to each other and the segments are comparable within a row.
     ------------------------------------------------------------------------ */
  function stack(rows, o){
    o = o || {};
    rows = (rows||[]).filter(r=>r);
    if(!rows.length) return empty(o.emptyMsg);
    const labelW = o.labelW || 190;
    const valW   = o.valW   || 96;
    const rowH   = o.rowH   || 22;
    const gap    = 5;
    const W      = 1000;
    const padT   = 22, padB = 20;
    const barX   = labelW + 8;
    const barW   = W - barX - valW - 8;
    const max    = niceMax(Math.max.apply(null, rows.map(r=>Math.abs(r.total)||0).concat([0])));
    const H      = padT + rows.length*(rowH+gap) + padB;
    const x      = v => barX + (Math.abs(v)/max)*barW;

    let g = '';
    /* gridlines and scale first, so bars sit on top of them */
    const ticks = 4;
    for(let i=0;i<=ticks;i++){
      const v = max*i/ticks, gx = x(v);
      g += '<line class="'+(i===0?'zl':'gl')+'" x1="'+gx.toFixed(1)+'" y1="'+(padT-6)+'" x2="'+gx.toFixed(1)+'" y2="'+(H-padB+2)+'"/>';
      g += '<text class="ax" x="'+gx.toFixed(1)+'" y="'+(H-padB+14)+'" text-anchor="middle">'+fmtM(v,max/1e6)+'</text>';
    }
    g += '<text class="ax" x="'+(barX+barW)+'" y="'+(padT-10)+'" text-anchor="end">$M</text>';

    rows.forEach((r,i)=>{
      const y = padT + i*(rowH+gap);
      g += '<text x="'+(labelW)+'" y="'+(y+rowH*0.5+4)+'" text-anchor="end">'+enc(r.label)+'</text>';
      let cx = barX;
      (r.segs||[]).forEach(sg=>{
        const w = (Math.abs(sg.v)/max)*barW;
        if(w>0.2){
          g += '<rect x="'+cx.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+rowH+'" rx="2" '
             + 'fill="var(--'+(sg.tone||'blue')+')" opacity="'+(sg.op||1)+'">'
             + '<title>'+enc((sg.name||'')+': $'+fmtM(sg.v,max/1e6)+'M')+'</title></rect>';
        }
        cx += w;
      });
      g += '<text class="v" x="'+(W-valW+6)+'" y="'+(y+rowH*0.5+4)+'">'+fmtM(r.total,max/1e6)+'</text>';
      if(r.sub) g += '<text class="ax" x="'+(W-4)+'" y="'+(y+rowH*0.5+4)+'" text-anchor="end">'+enc(r.sub)+'</text>';
    });
    return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
  }

  /* ------------------------------------------------------------------------
     VERTICAL COLUMNS - used for the cancellation timeline, where the x axis is
     time and the reader needs the shape of the wall coming at them.
     rows: [{label, v, tone, sub}]
     ------------------------------------------------------------------------ */
  function cols(rows, o){
    o = o || {};
    rows = (rows||[]).filter(r=>r);
    if(!rows.length) return empty(o.emptyMsg);
    const W=1000, padL=54, padR=10, padT=20, padB=46;
    const H = o.h || 240;
    const n = rows.length;
    const plotW = W-padL-padR, plotH = H-padT-padB;
    const cw = Math.min(72, plotW/n*0.72), step = plotW/n;
    const max = niceMax(Math.max.apply(null, rows.map(r=>Math.abs(r.v)||0).concat([0])));
    let g='';
    const ticks=4;
    for(let i=0;i<=ticks;i++){
      const v=max*i/ticks, y=padT+plotH-(v/max)*plotH;
      g += '<line class="'+(i===0?'zl':'gl')+'" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'"/>';
      g += '<text class="ax" x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fmtM(v,max/1e6)+'</text>';
    }
    g += '<text class="ax" x="'+padL+'" y="'+(padT-8)+'">$M</text>';
    rows.forEach((r,i)=>{
      const cx = padL + step*i + step/2;
      const h  = (Math.abs(r.v)/max)*plotH;
      const y  = padT+plotH-h;
      if(h>0.3){
        g += '<rect x="'+(cx-cw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="var(--'+(r.tone||'blue')+')">'
           + '<title>'+enc(r.label+': $'+fmtM(r.v,max/1e6)+'M')+'</title></rect>';
        g += '<text class="v" x="'+cx.toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+fmtM(r.v,max/1e6)+'</text>';
      }
      g += '<text class="ax" x="'+cx.toFixed(1)+'" y="'+(padT+plotH+14)+'" text-anchor="middle">'+enc(r.label)+'</text>';
      if(r.sub) g += '<text class="ax" x="'+cx.toFixed(1)+'" y="'+(padT+plotH+26)+'" text-anchor="middle">'+enc(r.sub)+'</text>';
    });
    return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
  }

  /* A legend that names the colours a chart just used. */
  function legend(items){
    return '<div class="lgd">'+(items||[]).map(i=>
      '<span><i style="background:var(--'+(i.tone||'blue')+')"></i>'+enc(i.name)+'</span>').join('')+'</div>';
  }

  return {stack, cols, legend, niceMax, fmtM, empty};
})();
</script>

<script>
/* ============================================================================
   SHARED RENDER HELPERS + the Portfolio and Cancellation Risk views.
   ============================================================================ */

function card(title, sub, body, opt){
  opt = opt || {};
  return '<div class="card"'+(opt.id? ' id="'+opt.id+'"':'')+'>'
       + '<div class="hd"><h3>'+title+'</h3>'
       + (sub? '<span class="sub">'+sub+'</span>' : '')
       + (opt.right? '<span class="spacer" style="flex:1"></span>'+opt.right : '')
       + '</div>'
       + '<div class="bd'+(opt.sink?' sink':'')+(opt.flush?' flush':'')+'">'+body+'</div></div>';
}

function tile(k, v, n, tone){
  return '<div class="tile '+(tone||'')+'"><div class="k">'+k+'</div>'
       + '<div class="v">'+v+'</div>'
       + (n? '<div class="n">'+n+'</div>' : '')+'</div>';
}

/* A meter reads as a proportion at a glance where a bare percentage does not.
   Tone follows how much is left unliquidated, not an arbitrary threshold. */
function meter(pct){
  if(pct===null||pct===undefined||!isFinite(pct)) return '<span class="pill">no basis</span>';
  const p = Math.max(0, Math.min(1, pct));
  const t = p>=0.95? '' : p>=0.80? ' a' : ' r';
  return '<span class="meter'+t+'" title="'+fPct(pct)+' expended"><i style="width:'+(p*100).toFixed(1)+'%"></i></span>';
}

/* ----------------------------------------------------------------------------
   THE TABLE ENGINE.  One renderer for every table in the tool, so sorting,
   number alignment and totals behave identically everywhere.

   cols: {k, h, cls, get(r), cell(r), noSort}
     get  - the value SORTED on (and exported)
     cell - the HTML shown; defaults to esc(get(r))
   ---------------------------------------------------------------------------- */
function dataTable(id, cols, rows, opt){
  opt = opt || {};
  /* `preSorted` means the caller has already put the rows in the order they are
     meant to be READ in - the service/partner order, say - so nothing is sorted
     until the reader actually clicks a header. Creating SORT[id] eagerly would
     have thrown that order away on the first paint. */
  let st = SORT[id];
  if(!st && opt.preSorted){
    const sorted0 = rows.slice();
    return renderTable(id, cols, sorted0, sorted0, opt, null);
  }
  if(!st) st = SORT[id] = {k: opt.sortKey || cols[0].k, dir: opt.sortDir || 'desc'};
  const col = cols.find(c=>c.k===st.k) || cols[0];
  const sorted = CED.sortBy(rows, col.get, st.dir);
  /* A table of twelve thousand rows is three megabytes of markup and about a
     second of layout, and nobody scrolls it. `page:true` draws a window and
     offers more; the SORT still runs over every row, so "biggest first" really
     means biggest of all of them and not biggest of the first page. */
  return renderTable(id, cols, sorted, sorted, opt, st);
}

function renderTable(id, cols, sorted, _all, opt, st){
  let shown = opt.limit? sorted.slice(0, opt.limit) : sorted;
  let paged = false, pageN = 0;
  if(opt.page && !opt.limit){
    pageN = PAGE[id] || PAGE_STEP;
    if(sorted.length > pageN){ shown = sorted.slice(0, pageN); paged = true; }
  }

  let h = '<table class="t"><thead><tr>';
  cols.forEach(c=>{
    const on = st && c.k===st.k;
    h += '<th class="'+(c.cls||'')+(c.noSort?'':' srt')+'"'
      +  (c.noSort? '' : ' data-sort="'+id+'|'+c.k+'"')
      +  '>'+c.h+(on? ' <span class="ar">'+(st.dir==='asc'?'&#9650;':'&#9660;')+'</span>' : '')+'</th>';
  });
  h += '</tr></thead><tbody>';
  if(!shown.length){
    h += '<tr><td colspan="'+cols.length+'"><div class="empty">'
      +  (opt.emptyMsg||'No rows match the current filters.')+'</div></td></tr>';
  }
  shown.forEach(r=>{
    h += '<tr'+(opt.rowAttr? ' '+opt.rowAttr(r) : '')+'>';
    cols.forEach(c=>{
      h += '<td class="'+(c.cls||'')+'">'+(c.cell? c.cell(r) : esc(c.get(r)))+'</td>';
    });
    h += '</tr>';
  });
  if(opt.total){
    h += '<tr class="tot">';
    cols.forEach(c=>{ h += '<td class="'+(c.cls||'')+'">'+(opt.total(sorted, c)||'')+'</td>'; });
    h += '</tr>';
  }
  h += '</tbody></table>';
  if(opt.limit && sorted.length>opt.limit){
    h += '<div class="note" style="margin:9px 12px 3px">Showing the top <b>'+opt.limit+'</b> of '
      +  fN(sorted.length)+' rows. The full set is on the <b>CLIN Lines</b> view.</div>';
  }
  if(paged){
    h += '<div class="note b" style="margin:9px 12px 3px">Showing <b>'+fN(pageN)+'</b> of '
      +  fN(sorted.length)+' rows, sorted over all of them. '
      +  '<button class="mbtn pill" data-page="'+id+'|'+(pageN+PAGE_STEP)+'">'
      +  'Show '+fN(PAGE_STEP)+' more</button> '
      +  '<button class="mbtn pill" data-page="'+id+'|0">Show all '+fN(sorted.length)+'</button>'
      +  ' &middot; or narrow it with the filters above.</div>';
  }
  return h;
}

/* money cells, used by every table */
const cM  = v => '$'+fM(v)+'M';
const cM0 = v => fD0(v);
/* A figure that rounds to nothing at the precision we print is shown as a dash,
   not as a coloured "$0.000M" - a red pill on nothing is a false alarm. */
const HALF_M = 500;                         /* half of the 0.001M we print to */
const cMz = (v, tone) => Math.abs(v) < HALF_M
  ? '<span class="pill">&ndash;</span>'
  : '<span class="pill '+tone+'">'+cM(v)+'</span>';

/* THE filter select. `blankLabel` names the "these have nothing here" option;
   omit it and the field simply does not offer one. */
function filterSelect(key, label, opts, fmt, blankLabel){
  let h = '<label>'+label+'</label><select data-filter="'+key+'">'
        + '<option value=""'+(F[key]===''?' selected':'')+'>All</option>';
  opts.forEach(v=>{
    if(v===''){
      if(!blankLabel) return;
      h += '<option value="'+esc(CED.BLANK)+'"'+(F[key]===CED.BLANK?' selected':'')+'>'
         + esc(blankLabel)+'</option>';
      return;
    }
    h += '<option value="'+esc(v)+'"'+(F[key]===v?' selected':'')+'>'
       + esc(fmt? fmt(v) : v)+'</option>';
  });
  return h + '</select>';
}

/* ============================================================================
   PORTFOLIO - where the money is, in one screen.
   ============================================================================ */
function viewPortfolio(){
  const ls = CED.scope();
  const t  = CED.totals(ls);
  const all= CED.all();
  const contracts = CED.byContract(ls);

  let h = '';

  /* headline */
  h += '<div class="tiles">'
    +  tile('Obligations', '$'+fM(t.obl)+'M', fN(t.n)+' CLIN lines', 'b')
    +  tile('Expenditures','$'+fM(t.exp)+'M', fPct(t.pctExp)+' of obligations', 'g')
    +  tile('Unliquidated','$'+fM(t.ulo)+'M', t.obl? fPct(t.ulo/t.obl)+' of obligations' : '', 'r')
    +  tile('Contracts', fN(contracts.length), contracts.length===1? contracts[0].label : 'in scope', 't')
    +  tile('Participants', fN(CED.byParticipant(ls).length), 'services and partners', 'p')
    +  tile('Appropriated ULO',
            '$'+fM(CED.totals(ls.filter(L=>L.us)).ulo)+'M',
            'the part that can cancel', 'a')
    +  '</div>';

  /* THE WATCH WINDOW IS NOT A FILTER, AND MUST NOT BE REPORTED AS ONE.
     This fired on any narrowing at all, so once the window became the default
     lens the page said "Filtered: showing 5 of 8" while the menu bar two
     inches above said "no filters" - and the strip above BOTH of them had
     already given the reader better numbers than either. The notice is now
     about filters the reader actually chose; the window states itself. */
  const nOrd = (typeof filterCount === 'function')? filterCount() : 0;
  if(nOrd && ls.length !== all.length){
    h += '<div class="note b">Filtered: showing <b>'+fN(ls.length)+'</b> of '+fN(all.length)
      +  ' CLIN lines'
      +  (F.win? ' <i>within the watch window</i>' : '')
      +  '. Every figure on this page is the filtered scope. '
      +  '<button class="mbtn pill" data-act="clearFilters">Clear filters</button></div>';
  }

  /* by contract - expended and unliquidated, stacked, so the reader sees both
     the size of the contract and how much of it is still open */
  /* A stacked bar per contract is the right picture for a handful and an
     unreadable thicket for forty, so the chart shows the largest and says how
     many it left out. The full list is the Contracts register. */
  const CHART_MAX = 15;
  const cShown = contracts.slice(0, CHART_MAX);
  const cRows = cShown.map(c=>({
    label: c.label,
    segs: [{v:c.exp, tone:'green', name:'Expended'}, {v:c.ulo, tone:'red', name:'Unliquidated'}],
    total: c.obl,
    sub: fPct(c.pctExp)
  }));
  const cRest = contracts.slice(CHART_MAX);
  h += card('Obligations by contract',
        contracts.length>CHART_MAX
          ? 'the '+CHART_MAX+' largest by unliquidated balance, of '+fN(contracts.length)
          : 'expended and unliquidated, against total obligations',
        CH.stack(cRows, {labelW:170, emptyMsg:'No contracts in scope.'})
        + CH.legend([{tone:'green',name:'Expended'},{tone:'red',name:'Unliquidated (ULO)'}])
        + (cRest.length
            ? '<div class="note" style="margin-top:10px">'+fN(cRest.length)+' more contract'
              + (cRest.length===1?'':'s')+' carrying $'
              + fM(CED.totals(cRest.reduce((a,c)=>a.concat(c.lines),[])).ulo)
              + 'M unliquidated. <button class="mbtn pill" data-act="gotoContracts">'
              + 'Open the Contracts register</button></div>'
            : ''));

  /* two-up: participants and appropriations */
  /* In the briefing order, not by size - and capped generously, because the
     order puts the services and partners first, so what a cap removes is the
     FMS tail rather than something in the middle. */
  const PART_MAX = 20;
  const pAll  = CED.byParticipant(ls);
  const pRows = pAll.slice(0, PART_MAX).map(p=>({
    label: p.label,
    segs: [{v:p.exp, tone:'green', name:'Expended'}, {v:p.ulo, tone:'red', name:'Unliquidated'}],
    total: p.obl, sub: fPct(p.pctExp)
  }));
  const aRows = CED.byAppn(ls).map(a=>({
    label: a.label,
    segs: [{v:a.exp, tone:'green', name:'Expended'}, {v:a.ulo, tone:'red', name:'Unliquidated'}],
    total: a.obl, sub: fPct(a.pctExp)
  }));
  h += '<div class="grid g2">'
    +  card('By participant',
          'services and partners in briefing order, then FMS'
          + (pAll.length>PART_MAX? ' \u2014 the first '+PART_MAX+' of '+fN(pAll.length) : ''),
          CH.stack(pRows, {labelW:170, emptyMsg:'No participants in scope.'}))
    +  card('By appropriation', 'partner lines carry no appropriation in the source',
          CH.stack(aRows, {labelW:170, emptyMsg:'No appropriations in scope.'}))
    +  '</div>';

  /* the funding-kind split, spelled out rather than left to the colours */
  const funds = CED.byFund(ls);
  h += card('Appropriated against FMS / partner',
        'the split the source itself makes - an appropriated line carries a fiscal year and both dates; a partner line carries none',
        dataTable('pf-fund', [
          {k:'label', h:'Funding', get:r=>r.label,
           cell:r=>'<span class="pill '+(r.key==='Appropriated'?'b':'p')+'">'+esc(r.label)+'</span>'},
          {k:'n',   h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
          {k:'obl', h:'Obligations', cls:'n', get:r=>r.obl, cell:r=>cM(r.obl)},
          {k:'exp', h:'Expenditures', cls:'n', get:r=>r.exp, cell:r=>cM(r.exp)},
          {k:'ulo', h:'Unliquidated', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
          {k:'pct', h:'Expended', cls:'n', get:r=>r.pctExp===null?-1:r.pctExp,
           cell:r=>meter(r.pctExp)+' '+fPct(r.pctExp)}
        ], funds, {sortKey:'ulo', total:(rows,c)=>{
          if(c.k==='label') return 'TOTAL';
          if(c.k==='n')   return fN(t.n);
          if(c.k==='obl') return cM(t.obl);
          if(c.k==='exp') return cM(t.exp);
          if(c.k==='ulo') return cM(t.ulo);
          if(c.k==='pct') return fPct(t.pctExp);
          return '';
        }}), {flush:true});

  /* the biggest open balances, which is what anyone opens this for */
  h += card('Largest unliquidated balances', 'top 20 CLIN lines by ULO',
        dataTable('pf-top', LINE_COLS(), ls.filter(L=>Math.abs(L.ulo)>CED.EPS),
          {sortKey:'ulo', limit:20, rowAttr:r=>'class="clk" data-line="'+lineKey(r)+'"'}),
        {flush:true});

  return h;
}

/* ============================================================================
   CANCELLATION RISK - expiration and cancellation are different facts, and the
   whole value of this view is that it never conflates them.
   ============================================================================ */
function viewRisk(){
  const ls   = CED.scope();
  const asOf = curAsOf();
  const bands= CED.riskBands(ls, asOf);
  const exp  = CED.expired(ls, asOf);
  const t    = CED.totals(ls);
  const dated= ls.filter(L=>L.cancD);
  const tD   = CED.totals(dated);

  let h = '';

  const lb    = CED.lifeBands(ls, asOf);
  const lband = id => (lb.find(b=>b.id===id) || {ulo:0, n:0, obl:0, lines:[]});
  const wall  = CED.expiryWall(ls, asOf);
  const soon  = wall.length? wall[0] : null;
  const finalYr = lband('exp5');

  h += '<div class="note b"><b>Available</b>, <b>expired</b> and <b>cancelled</b> are three '
    +  'different states and the tool never merges them. Money is available for new obligation '
    +  'for its period of availability &mdash; <b>one year</b> for O&amp;M, <b>three</b> for the '
    +  'procurement accounts &mdash; then <b>expired for five fiscal years</b>, during which it can '
    +  'still be disbursed or deobligated but not newly obligated, and at the end of the fifth it '
    +  '<b>cancels</b>. '
    +  (asOf? 'Everything below is measured against <b>'+dLabel(asOf)+'</b>.'
            : '<b>No as-of date was found in any file name</b>, so nothing can be placed in the cycle.')
    +  '</div>';

  /* ---- the near cliff. Cancellation is the far one and was the only one this
     view reported; expiration is nearer and is where the ability to obligate is
     lost. On the August files $77.371M expired 36 days later and nothing said so. */
  if(soon){
    const d = soon.days;
    const urgent = d!==null && d<=90;
    h += '<div class="note '+(urgent?'r':'a')+'"><b>Next expiration: '+esc(dLabel(soon.date))+'</b>'
      +  (d!==null? ' &mdash; <b>'+fN(d)+' day'+(d===1?'':'s')+' away</b>' : '')
      +  '. <b>$'+fM(soon.ulo)+'M</b> on '+fN(soon.n)+' line'+(soon.n===1?'':'s')
      +  ' stops being available for new obligation that day. After it, the balance can only be '
      +  'disbursed against work already on contract, or given back.'
      +  (wall.length>1? ' '+fN(wall.length-1)+' further expiration date'
          +(wall.length===2?'':'s')+' follow.' : '')
      +  '</div>';
  }

  h += '<div class="tiles">'
    +  tile('Unliquidated, all lines', '$'+fM(t.ulo)+'M', fN(t.n)+' lines', 'r')
    +  tile('Still available', '$'+fM(lband('active').ulo)+'M',
          soon? 'expires '+dLabel(soon.date) : fN(lband('active').n)+' lines', 'g')
    +  tile('Expired &mdash; years 1 to 4', '$'+fM(['exp1','exp2','exp3','exp4']
            .reduce((a,i)=>a+lband(i).ulo,0))+'M', 'still time to act', 'a')
    +  tile('FINAL expired year', '$'+fM(finalYr.ulo)+'M',
          finalYr.n? fN(finalYr.n)+' lines cancel this fiscal year' : 'nothing in its fifth year',
          finalYr.ulo>=CED.EPS? 'r' : 'g')
    +  tile('Cancelled', '$'+fM(lband('cancelled').ulo)+'M',
          lband('cancelled').ulo>=CED.EPS? 'should be zero' : 'clear',
          lband('cancelled').ulo>=CED.EPS? 'r' : 'g')
    +  tile('No dates on file', '$'+fM(lband('none').ulo)+'M', 'FMS / partner', 'p')
    +  '</div>';

  /* ---- where the money sits in the cycle -------------------------------- */
  h += card('Where the balance sits in the appropriation life cycle',
        'the owner\'s working framing &mdash; available, then five expired years, then cancelled',
        dataTable('rk-life', [
          {k:'name', h:'State', get:r=>r.name,
           cell:r=>'<span class="pill '+r.tone+'">'+esc(r.name)+'</span>'},
          {k:'n',   h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
          {k:'obl', h:'Obligations', cls:'n', get:r=>r.obl, cell:r=>cM(r.obl)},
          {k:'ulo', h:'Unliquidated', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
          {k:'pct', h:'Expended', cls:'n', get:r=>r.pctExp===null?-1:r.pctExp,
           cell:r=>meter(r.pctExp)+' '+fPct(r.pctExp)},
          {k:'note', h:'', cls:'w', get:r=>r.note, cell:r=>'<span style="color:var(--dim)">'+esc(r.note)+'</span>'}
        ], lb, {preSorted:true, total:(rows,c)=>{
          if(c.k==='name') return 'TOTAL';
          if(c.k==='n')   return fN(t.n);
          if(c.k==='obl') return cM(t.obl);
          if(c.k==='ulo') return cM(t.ulo);
          if(c.k==='pct') return fPct(t.pctExp);
          return '';
        }}), {flush:true});

  /* the fifth year is the working set, so it gets its own block */
  if(finalYr.n){
    h += card('<span class="pill r">FINAL EXPIRED YEAR</span> &nbsp; $'+fM(finalYr.ulo)+'M cancels this fiscal year',
      fN(finalYr.n)+' lines &middot; the last chance to disburse or deobligate',
      '<div class="note r" style="margin:10px 12px">'+esc(finalYr.note)+'</div>'
      + dataTable('rk-final', LINE_COLS(true), finalYr.lines,
          {sortKey:'ulo', page:true, rowAttr:r=>'class="clk" data-line="'+lineKey(r)+'"'}),
      {flush:true});
  }

  /* the expiration wall, which the cancellation timeline cannot show */
  if(wall.length){
    h += card('Expiration wall', 'when availability ends &mdash; the near cliff, not the cancellation one',
      dataTable('rk-wall', [
        {k:'date', h:'Availability ends', get:r=>r.date, cell:r=>'<b>'+esc(dLabel(r.date))+'</b>'},
        {k:'days', h:'Days away', cls:'n', get:r=>r.days===null?1e9:r.days,
         cell:r=>r.days===null? '&ndash;'
              : '<span class="pill '+(r.days<=90?'r':r.days<=365?'a':'')+'">'+fN(r.days)+'</span>'},
        {k:'n',   h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
        {k:'obl', h:'Obligations', cls:'n', get:r=>r.obl, cell:r=>cM(r.obl)},
        {k:'ulo', h:'Unliquidated', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
        {k:'pct', h:'Expended', cls:'n', get:r=>r.pctExp===null?-1:r.pctExp,
         cell:r=>meter(r.pctExp)+' '+fPct(r.pctExp)}
      ], wall, {preSorted:true}), {flush:true});
  }

  /* the wall, as a timeline */
  const tl = CED.byCancel(ls).filter(g=>g.key!=='').map(g=>({
    label: g.key.slice(0,4),
    sub: g.key.slice(5,7)+'/'+g.key.slice(8,10),
    v: g.ulo,
    tone: (asOf && g.key<=asOf)? 'red' : (asOf && CED.monthsTo(asOf,g.key)<12)? 'red'
        : (asOf && CED.monthsTo(asOf,g.key)<24)? 'amber' : 'blue'
  }));
  h += card('Unliquidated balance by cancel date', 'appropriated lines only - partner funds carry no cancel date',
        CH.cols(tl, {h:250, emptyMsg:'No line in scope carries a cancel date.'})
        + CH.legend([{tone:'red',name:'Cancelled, or within 12 months'},
                     {tone:'amber',name:'13 - 24 months'},
                     {tone:'blue',name:'Beyond 24 months'}]));

  /* expired but not cancelled - the actionable middle */
  h += card('Expired funds still holding a balance',
        'no longer available for new obligation; can still be disbursed or deobligated before the cancel date',
        exp.length
          ? dataTable('rk-exp', LINE_COLS(true), exp,
              {sortKey:'ulo', page:true, rowAttr:r=>'class="clk" data-line="'+lineKey(r)+'"'})
          : '<div class="empty"><div class="big">Nothing expired and open</div>'
            + (asOf? 'No line in scope is past its expiration date with a balance remaining.'
                   : 'Cannot be determined without an as-of date.')+'</div>',
        {flush:true});

  /* the bands, all six, always */
  bands.forEach(b=>{
    const sub = fN(b.n)+' lines &middot; obligations $'+fM(b.obl)+'M &middot; expended '+fPct(b.pctExp);
    h += card('<span class="pill '+b.tone+'">'+esc(b.name)+'</span> &nbsp; $'+fM(b.ulo)+'M unliquidated', sub,
          (b.note? '<div class="note '+b.tone+'" style="margin:10px 12px">'+esc(b.note)+'</div>' : '')
          + (b.n
              ? dataTable('rk-'+b.id, LINE_COLS(true), b.lines,
                  {sortKey:'ulo', limit:25, rowAttr:r=>'class="clk" data-line="'+lineKey(r)+'"'})
              : '<div class="empty">No lines in this band.</div>'),
          {flush:true});
  });

  return h;
}

function bandTot(bands, id){
  const b = bands.find(x=>x.id===id);
  return b || {obl:0, exp:0, ulo:0, n:0};
}

/* ----------------------------------------------------------------------------
   The CLIN-line column set, shared by every table that lists lines so they
   cannot drift apart. `dates` adds the expiration / cancel pair.
   ---------------------------------------------------------------------------- */
function LINE_COLS(dates){
  const c = [
    {k:'ktr',  h:'Contract', cls:'mono', get:r=>r.ktr},
    {k:'part', h:'Participant', get:r=>r.part},
    {k:'clin', h:'CLIN', cls:'mono', get:r=>r.clin},
    {k:'title',h:'CLIN title', cls:'w', get:r=>r.title},
    {k:'ctype',h:'Type', cls:'c', get:r=>r.ctype,
     cell:r=>r.ctype? '<span class="pill">'+esc(r.ctype)+'</span>' : ''},
    {k:'acrn', h:'ACRN', cls:'mono c', get:r=>r.acrn},
    {k:'appn', h:'Appn', get:r=>r.appn,
     cell:r=>r.appn? esc(r.appn) : '<span class="pill p">FMS / partner</span>'},
    {k:'fy',   h:'FY', cls:'c', get:r=>r.fy},
    {k:'obl',  h:'Obligations', cls:'n', get:r=>r.obl, cell:r=>fD(r.obl)},
    {k:'exp',  h:'Expenditures', cls:'n', get:r=>r.exp, cell:r=>fD(r.exp)},
    {k:'ulo',  h:'ULO', cls:'n', get:r=>r.ulo,
     cell:r=>(r.uloOk? '' : '<span class="pill r" title="does not equal obligations minus expenditures">!</span> ')+fD(r.ulo)}
  ];
  if(dates){
    /* WHERE IN THE CYCLE. The dates alone do not say it, and this is the thing
       the owner reads first: available, expired year N of 5, or cancelled. */
    c.push({k:'phase', h:'State', cls:'c', get:r=>{
        const p = CED.phaseOf(r, curAsOf());
        return p.id==='expired'? (10+(p.year||9)) : p.id==='active'? 1 : p.id==='cancelled'? 20 : 30;
      },
      cell:r=>{
        const p = CED.phaseOf(r, curAsOf());
        if(p.id==='active')    return '<span class="pill g">available</span>';
        if(p.id==='cancelled') return '<span class="pill r">cancelled</span>';
        if(p.id==='expired'){
          const fin = p.year===5;
          return '<span class="pill '+(fin?'r':p.year>=3?'a':'b')+'" title="expired year '
               + (p.year||'?')+' of 5">exp '+(p.year||'?')+'/5</span>';
        }
        return '<span class="pill p">&ndash;</span>';
      }});
    c.push({k:'cfy', h:'Cancels FY', cls:'c', get:r=>CED.cancelFY(r)||0,
      cell:r=>{ const f=CED.cancelFY(r); return f? esc('FY'+f) : '<span class="pill">&ndash;</span>'; }});
    c.push({k:'expD', h:'Expires', cls:'c', get:r=>r.expD||'',
            cell:r=>r.expD? esc(dLabel(r.expD)) : '<span class="pill">&ndash;</span>'});
    c.push({k:'cancD', h:'Cancels', cls:'c', get:r=>r.cancD||'',
            cell:r=>{
              if(!r.cancD) return '<span class="pill">&ndash;</span>';
              const m = curAsOf()? CED.monthsTo(curAsOf(), r.cancD) : null;
              const tone = m===null? '' : m<0? ' r' : m<12? ' r' : m<24? ' a' : ' g';
              return esc(dLabel(r.cancD))+' <span class="pill'+tone+'">'
                   + (m===null? '&ndash;' : m<0? 'past' : m+'m')+'</span>';
            }});
  }
  return c;
}

/* A line's identity for the DOM. The natural key - contract, participant,
   CLIN, ACRN, appropriation, fiscal year - is genuinely unique (measured on
   the sample files: 0 duplicates across 662 rows), but it is user data, so it
   would have to be escaped into the attribute and unescaped back out again to
   be compared. The import index is opaque, stable for the life of the import
   and cannot collide, so that is what the markup carries. */
function lineKey(L){ return L.ix; }
function findLine(key){
  const i = +key;
  const all = CED.all();
  return (i>=0 && i<all.length)? all[i] : null;
}
</script>

<script>
/* ============================================================================
   Contracts, CLIN Lines, Verify, and the line detail modal.
   ============================================================================ */

/* ============================================================================
   CONTRACTS - a register, not a stack of cards.

   v0.3 drew a full card per contract: four tiles and two tables each. That
   reads well for two contracts and becomes unusable at twenty - the page is
   metres long and there is no way to find anything in it. The unit of this
   view is now ONE ROW per contract, sortable on every column that matters,
   with the detail behind a click.

   The columns exist to be SORTED ON. With a portfolio of contracts the useful
   questions are all "which ones", and each has a column that answers it:
     which is biggest                  -> Obligations, ULO
     which is furthest behind          -> Expended %
     which is about to lose money      -> Cancels <= 12 months
     which has already lost some       -> Past cancel
     which is not moving               -> Paid (this period), Change in ULO
   ============================================================================ */

/* Everything the register needs about one contract, computed ONCE. Doing this
   per cell would re-derive the bands for every column of every row. */
function contractRows(ls){
  const asOf = curAsOf();
  const prev = prevPeriodKey();
  const prevLines = prev? CED.inPeriod(prev) : null;
  const cmp = prevLines? CED.compare(prevLines, ls) : null;

  return CED.byContract(ls).map(c=>{
    const bands = CED.riskBands(c.lines, asOf);
    const band  = id => (bands.find(b=>b.id===id)||{ulo:0,n:0});
    const exp   = CED.expired(c.lines, asOf);
    const mine  = cmp? cmp.rows.filter(r=>r.line.piin===c.key) : [];
    return Object.assign({}, c, {
      piin:      c.key,
      parts:     CED.byParticipant(c.lines).length,
      appns:     CED.byAppn(c.lines),
      clins:     CED.byClin(c.lines).length,
      cancelled: band('cancelled').ulo,
      m12:       band('m12').ulo,
      expiredUlo:CED.totals(exp).ulo,
      expiredN:  exp.length,
      paid:      cmp? mine.filter(r=>r.kind==='matched').reduce((a,r)=>a+Math.max(r.dExp,0),0) : null,
      dUlo:      cmp? mine.reduce((a,r)=>a+r.dUlo,0) : null,
      file:      fileOf(c.lines[0])
    });
  });
}

/* The period immediately before the one being shown, if there is one. */
function prevPeriodKey(){
  if(!DB) return '';
  const ks = DB.periods.filter(p=>p.key!==UNDATED).map(p=>p.key);
  const i = ks.indexOf(DB.cur);
  return i>0? ks[i-1] : '';
}

/* Does this contract match the register's own filters? These narrow the LIST;
   the appropriation / participant / funding selects narrow the MONEY, exactly
   as they do everywhere else in the tool. Two different jobs, kept apart. */
function contractMatches(r){
  const q = (CQ.q||'').trim().toLowerCase();
  if(q){
    const hay = (r.label+' '+r.piin+' '+(r.file.name||'')+' '
               + r.lines.slice(0,400).map(L=>L.part).join(' ')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  if(CQ.risk==='cancelled' && Math.abs(r.cancelled) < HALF_M) return false;
  if(CQ.risk==='m12'       && Math.abs(r.m12)       < HALF_M) return false;
  if(CQ.risk==='expired'   && r.expiredN===0)                 return false;
  if(CQ.risk==='open'      && Math.abs(r.ulo)       < HALF_M) return false;
  return true;
}

function viewContracts(){
  const ls   = CED.scope();
  const all  = contractRows(ls);
  const rows = all.filter(contractMatches);
  const t    = CED.totals(rows.reduce((a,r)=>a.concat(r.lines), []));
  const o    = CED.options(CED.all());
  const prev = prevPeriodKey();
  const asOf = curAsOf();

  /* ---- the controls ----------------------------------------------------- */
  const riskOpts = [
    ['',          'Any'],
    ['open',      'Holding a balance'],
    ['m12',       'Cancels within 12 months'],
    ['cancelled', 'Past cancel date'],
    ['expired',   'Expired and still open']
  ];

  let filt = '<div class="filt">'
    + '<label>Find</label><input id="cqBox" type="search" placeholder="contract, participant, file"'
    + ' value="'+esc(CQ.q)+'" style="min-width:210px">'
    + '<label>Exposure</label><select data-cq="risk">'
    + riskOpts.map(([v,l])=>'<option value="'+v+'"'+(CQ.risk===v?' selected':'')+'>'+l+'</option>').join('')
    + '</select>'
    + filterSelect('appn','Appropriation', o.appn, null, 'No appropriation (FMS / partner)')
    + filterSelect('part','Participant', o.part)
    + filterSelect('fund','Funding', o.fund)
    + '<button data-act="clearContractFilters">Clear</button>'
    + '<span style="flex:1"></span>'
    + '<span class="pill b">'+fN(rows.length)+' of '+fN(all.length)+' contracts</span>'
    + '<span class="pill r">ULO $'+fM(t.ulo)+'M</span>'
    + '</div>';

  /* ---- the register ----------------------------------------------------- */
  const cols = [
    {k:'ktr', h:'Contract', cls:'mono nw', get:r=>r.label,
     cell:r=>'<b>'+esc(r.label)+'</b>'
        + (Math.abs(r.cancelled)>HALF_M? ' <span class="pill r" title="holds a balance past its cancel date">!</span>':'')},
    {k:'n',     h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
    {k:'parts', h:'Participants', cls:'n', get:r=>r.parts, cell:r=>fN(r.parts)},
    {k:'appns', h:'Appropriations', get:r=>r.appns.map(a=>a.label).join(', '),
     cell:r=>r.appns.slice(0,3).map(a=>'<span class="pill '+(a.key===''?'p':'b')+'">'
              +esc(a.key===''? 'FMS' : a.label)+'</span>').join(' ')
            + (r.appns.length>3? ' <span class="pill">+'+(r.appns.length-3)+'</span>' : '')},
    {k:'obl', h:'Obligations', cls:'n', get:r=>r.obl, cell:r=>cM(r.obl)},
    {k:'ulo', h:'Unliquidated', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
    {k:'pct', h:'Expended', cls:'n', get:r=>r.pctExp===null?-1:r.pctExp,
     cell:r=>meter(r.pctExp)+' '+fPct(r.pctExp)},
    {k:'m12', h:'Cancels &le;12mo', cls:'n', get:r=>r.m12, cell:r=>cMz(r.m12,'r')},
    {k:'cancelled', h:'Past cancel', cls:'n', get:r=>r.cancelled, cell:r=>cMz(r.cancelled,'r')}
  ];
  if(prev){
    cols.push({k:'paid', h:'Paid vs '+esc(periodOf(prev).label), cls:'n', get:r=>r.paid||0,
      cell:r=>r.paid===null? '&ndash;' : cMz(r.paid,'g')});
    cols.push({k:'dUlo', h:'&Delta; ULO', cls:'n', get:r=>r.dUlo||0,
      cell:r=>r.dUlo===null? '&ndash;' : dCell(r.dUlo,'down')});
  }

  let h = filt;
  h += '<div class="scroll">'
    + dataTable('ct-all', cols, rows, {
        sortKey:'ulo',
        rowAttr:r=>'class="clk" data-contract="'+esc(r.piin)+'"',
        emptyMsg: all.length? 'No contract matches these filters.' : 'No contracts loaded.',
        total:(rw,c)=>{
          if(c.k==='ktr') return 'TOTAL ('+fN(rw.length)+')';
          if(c.k==='n')   return fN(t.n);
          if(c.k==='obl') return cM(t.obl);
          if(c.k==='ulo') return cM(t.ulo);
          if(c.k==='pct') return fPct(t.pctExp);
          if(c.k==='m12') return cM(rw.reduce((a,r)=>a+r.m12,0));
          if(c.k==='cancelled') return cM(rw.reduce((a,r)=>a+r.cancelled,0));
          if(c.k==='paid') return cM(rw.reduce((a,r)=>a+(r.paid||0),0));
          if(c.k==='dUlo') return dCell(rw.reduce((a,r)=>a+(r.dUlo||0),0),'down');
          return '';
        }})
    + '</div>';

  return card('Contracts', 'click a row for its detail'
      + (asOf? ' &middot; exposure measured against '+esc(dLabel(asOf)) : ''), h, {flush:true});
}

/* ============================================================================
   ONE CONTRACT - what the per-contract card used to show, now behind a click
   so the register stays a register.
   ============================================================================ */
function openContract(piin){
  const ls = CED.scope().filter(L=>L.piin===piin);
  if(!ls.length) return;
  const c    = CED.totals(ls);
  const asOf = curAsOf();
  const f    = fileOf(ls[0]);
  const bands= CED.riskBands(ls, asOf);
  const exp  = CED.expired(ls, asOf);
  const prev = prevPeriodKey();

  let b = '<div class="tiles" style="margin:0 0 12px">'
    + tile('Obligations','$'+fM(c.obl)+'M', fN(c.n)+' CLIN lines','b')
    + tile('Expenditures','$'+fM(c.exp)+'M', fPct(c.pctExp),'g')
    + tile('Unliquidated','$'+fM(c.ulo)+'M','','r')
    + tile('CLINs', fN(CED.byClin(ls).length), 'distinct CLIN numbers','t')
    + tile('Expired, open','$'+fM(CED.totals(exp).ulo)+'M', fN(exp.length)+' lines',
           exp.length? 'a' : 'g')
    /* zero here is the DESIRED state, so it is not painted as an alarm */
    + (function(){
        const v = (bands.find(x=>x.id==='cancelled')||{ulo:0}).ulo;
        const bad = Math.abs(v) >= HALF_M;
        return tile('Past cancel','$'+fM(v)+'M', bad? 'should be zero' : 'clear', bad?'r':'g');
      })()
    + '</div>';

  if(prev){
    const cmp  = CED.compare(CED.inPeriod(prev).filter(L=>L.piin===piin), ls);
    const br   = cmp.bridge;
    b += '<div class="note '+(br.delta<=0?'g':'a')+'"><b>Since '+esc(periodOf(prev).label)+':</b> '
      +  'the balance '+(br.delta<0? 'fell ' : br.delta>0? 'rose ' : 'held')
      +  (Math.abs(br.delta)>CED.EPS? '$'+fM(Math.abs(br.delta))+'M' : '')
      +  ' &mdash; $'+fM(br.expUp)+'M paid out'
      +  (Math.abs(br.oblDown)>CED.EPS? ', $'+fM(Math.abs(br.oblDown))+'M deobligated' : '')
      +  (br.removedN? ', '+br.removedN+' line'+(br.removedN===1?'':'s')+' no longer reported' : '')
      +  '.</div>';
  }

  b += '<div class="grid g2">'
    + '<div>'+miniTable('ctp-'+piin, 'By participant', CED.byParticipant(ls), true)+'</div>'
    + '<div>'+miniTable('cta-'+piin, 'By appropriation and fiscal year',
        CED.group(ls, L=>L.appn+' | '+L.fy,
          k=>{ const p=k.split(' | ');
               return (p[0]||'(FMS / partner)') + (p[1]? '  FY'+p[1] : ''); })
          .sort((x,y)=>Math.abs(y.ulo)-Math.abs(x.ulo)))+'</div>'
    + '</div>';

  b += '<div style="margin-top:12px">'
    + miniTable('ctb-'+piin, 'By cancellation band',
        bands.filter(x=>x.n).map(x=>({label:x.name, n:x.n, obl:x.obl, exp:x.exp, ulo:x.ulo,
                                      pctExp:x.pctExp, key:x.id})))
    + '</div>';

  b += '<div class="card" style="margin:12px 0 0"><div class="hd"><h3>Largest open balances</h3>'
    + '<span class="sub">top 12 CLIN lines by ULO</span></div><div class="bd flush">'
    + dataTable('ctl-'+piin, LINE_COLS(true), ls.filter(L=>Math.abs(L.ulo)>CED.EPS),
        {sortKey:'ulo', limit:12, rowAttr:r=>'class="clk" data-line="'+lineKey(r)+'"'})
    + '</div></div>';

  const cact = CED.actionsOnContract(actions(), piin, ls);
  b += '<div class="note '+(cact.filter(CED.actOpen).length? 'a':'')+'" style="margin-top:12px">'
    + '<b>'+fN(cact.filter(CED.actOpen).length)+'</b> open action'
    + (cact.filter(CED.actOpen).length===1?'':'s')+' on this contract'
    + (cact.length!==cact.filter(CED.actOpen).length
        ? ' ('+fN(cact.length)+' in all)' : '')
    + '. <button class="mbtn pill" data-act="actAdd" data-scope="contract" data-v="'+esc(piin)+'">'
    + 'Raise one against the contract</button>'
    /* the same courtesy as the line modal: this window knows its contract */
    + ' <button class="mbtn pill" data-act="pocNew" data-contract="'+esc(piin)+'">'
    + 'Assign a contact</button></div>';

  b += '<div style="margin-top:12px">'
    + '<button class="mbtn go" data-act="filterContract" data-v="'+esc(piin)+'">'
    + 'Show only this contract on every view</button>'
    + (f.name? ' <span style="color:var(--dim);font-size:11.5px;margin-left:8px" class="mono">'
        + esc(f.name)+'</span>' : '')
    + '</div>';

  modal(esc(ls[0].ktr), b);
}

/* A compact group table used inside the contract detail. */
function miniTable(id, title, groups, ordered){
  const t = groups.reduce((a,g)=>({obl:a.obl+g.obl, exp:a.exp+g.exp, ulo:a.ulo+g.ulo, n:a.n+g.n}),
                          {obl:0,exp:0,ulo:0,n:0});
  return '<div class="card" style="margin:0"><div class="hd"><h3>'+esc(title)+'</h3></div>'
    + '<div class="bd flush"><div class="scroll sm">'
    + dataTable(id, [
        {k:'label', h:'', get:r=>r.label},
        {k:'n',   h:'Lines', cls:'n', get:r=>r.n, cell:r=>fN(r.n)},
        {k:'obl', h:'Obligations', cls:'n', get:r=>r.obl, cell:r=>cM(r.obl)},
        {k:'ulo', h:'ULO', cls:'n', get:r=>r.ulo, cell:r=>cM(r.ulo)},
        {k:'pct', h:'Exp', cls:'n', get:r=>r.pctExp===null?-1:r.pctExp, cell:r=>meter(r.pctExp)}
      ], groups, {sortKey:'ulo', preSorted:!!ordered, total:(rows,c)=>
        c.k==='label'? 'TOTAL' : c.k==='n'? fN(t.n) : c.k==='obl'? cM(t.obl) : c.k==='ulo'? cM(t.ulo) : ''})
    + '</div></div></div>';
}
/* ============================================================================
   CLIN LINES - the whole register, filterable. Everything else in the tool is
   a cut of this table, so this is where a figure gets checked.
   ============================================================================ */
function viewLines(){
  const ls = CED.scope();
  const t  = CED.totals(ls);
  const o  = CED.options(CED.all());

  let filt = '<div class="filt">'
    + filterSelect('contract','Contract', o.contract, v=>{
        const L = CED.all().find(x=>x.piin===v); return L? L.ktr : v; })
    + filterSelect('part','Participant', o.part)
    + filterSelect('appn','Appropriation', o.appn, null, 'No appropriation (FMS / partner)')
    + filterSelect('fy','FY', o.fy, v=>'FY'+v, 'No fiscal year')
    + filterSelect('ctype','Type', o.ctype)
    + filterSelect('fund','Funding', o.fund)
    + filterSelect('canc','Cancels', o.canc, v=>dLabel(v), 'No cancel date')
    + '<label>State</label><select data-filter="life">'
    + '<option value="">All</option>'
    + CED.LIFE_BANDS.map(b=>'<option value="'+esc(b.id)+'"'+(F.life===b.id?' selected':'')+'>'
        + esc(b.name.replace(/ — /g,' - '))+'</option>').join('')
    + '</select>'
    + '<label>Find</label><input id="qBox" type="search" placeholder="CLIN, title, ACRN, comment" value="'+esc(F.q)+'">'
    + '<button data-act="clearFilters">Clear</button>'
    + '<span style="flex:1"></span>'
    + '<span class="pill b">'+fN(t.n)+' of '+fN(CED.all().length)+' lines</span>'
    + '<span class="pill r">ULO $'+fM(t.ulo)+'M</span>'
    + '</div>';

  const cols = LINE_COLS(true);
  cols.push({k:'cmt', h:'Comment', cls:'w', get:r=>r.cmt});

  return card('CLIN lines', 'click a row for its detail',
      filt + '<div class="scroll">'
      + dataTable('ln-all', cols, ls, {sortKey:'ulo', page:true,
          rowAttr:r=>'class="clk" data-line="'+lineKey(r)+'"',
          total:(rows,c)=>{
            if(c.k==='ktr') return 'TOTAL ('+fN(rows.length)+')';
            if(c.k==='obl') return fD(t.obl);
            if(c.k==='exp') return fD(t.exp);
            if(c.k==='ulo') return fD(t.ulo);
            return '';
          }})
      + '</div>', {flush:true});
}

/* ============================================================================
   VERIFY - the import's own account of itself, the tie-outs, and the
   advisories. Three different causes are otherwise indistinguishable from the
   outside: file not read, file read but every row discarded, and file loaded
   fine but filtered out of the view.
   ============================================================================ */
function viewVerify(){
  const all = CED.all();
  const ls  = CED.scope();
  const ties= CED.ties(all);
  const adv = CED.advisories(all, curAsOf());
  let h = '';

  /* the headline gate */
  h += '<div class="note '+(ties.ok?'g':'r')+'"><b>'+(ties.ok? 'All tie-outs pass.' : 'A tie-out FAILED.')+'</b> '
    +  'Checked against all '+fN(all.length)+' imported lines, not the filtered scope - '
    +  'a filter must never be able to make a reconciliation look green.</div>';

  const mixed = mixedAsOf();
  if(mixed){
    h += '<div class="note a"><b>The files carry different as-of dates:</b> '
      +  mixed.map(d=>esc(dLabel(d))).join(', ')
      +  '. This period is dated <b>'+esc(dLabel(curAsOf()))+'</b>, the newest of them. '
      +  'Balances from different months do not belong in one total; check that this is what you meant.</div>';
  }

  /* per file */
  let ft = '';
  curFiles().forEach(f=>{
    const mine = all.filter(L=>L.piin===f.piin);
    const t = CED.totals(mine);
    ft += '<tr><td class="mono">'+esc(f.name)+'</td>'
       +  '<td class="mono">'+esc(f.pretty||'')+'</td>'
       +  '<td class="c">'+(f.asOf? esc(dLabel(f.asOf)) : '<span class="pill a">none</span>')+'</td>'
       +  '<td>'+(f.sheet? esc(f.sheet) : '<span class="pill r">no detail tab</span>')
       +  (f.hdrRow>0? ' <span class="pill">header on row '+(f.hdrRow+1)+'</span>' : '')+'</td>'
       +  '<td class="n">'+fN(f.rows)+'</td><td class="n">'+fN(f.kept)+'</td><td class="n">'+fN(f.skipped)+'</td>'
       +  '<td class="n">'+cM(t.obl)+'</td><td class="n">'+cM(t.ulo)+'</td></tr>';
    if(f.notes && f.notes.length){
      ft += '<tr><td colspan="9" style="padding-top:0">'
         +  f.notes.map(n=>'<div class="note '+(n.k==='bad'?'r':'a')+'" style="margin:4px 0">'+esc(n.t)+'</div>').join('')
         +  '</td></tr>';
    }
    if(f.sheets && f.sheets.length){
      ft += '<tr><td colspan="9" style="padding-top:0;color:var(--faint);font-size:11px">'
         +  'Sheets in this workbook: '+f.sheets.map(esc).join(' &middot; ')+'</td></tr>';
    }
  });
  h += card('What was imported', esc(curPeriod().label)+' \u00b7 '+fN(curFiles().length)+' file'+(curFiles().length===1?'':'s'),
        '<div class="scroll bx"><table class="t"><thead><tr>'
        + '<th>File</th><th>Contract</th><th class="c">As of</th><th>Detail tab</th>'
        + '<th class="n">Rows</th><th class="n">Kept</th><th class="n">Skipped</th>'
        + '<th class="n">Obligations</th><th class="n">ULO</th></tr></thead><tbody>'
        + ft + '</tbody></table></div>');

  /* tie-outs */
  const row = (name, ok, detail) =>
    '<tr><td>'+esc(name)+'</td>'
    + '<td class="c"><span class="pill '+(ok?'g':'r')+'">'+(ok?'PASS':'FAIL')+'</span></td>'
    + '<td>'+detail+'</td></tr>';
  let tt = '';
  tt += row('Every line: ULO equals Obligations minus Expenditures',
        ties.rowIdentity.ok,
        ties.rowIdentity.ok? 'All '+fN(all.length)+' lines agree to within half a cent.'
          : '<b>'+fN(ties.rowIdentity.bad.length)+'</b> lines disagree. The figure on file is kept and shown; it is never overwritten.');
  tt += row('In aggregate: ULO equals Obligations minus Expenditures',
        ties.aggIdentity.ok,
        'Difference '+fD(ties.aggIdentity.delta)+'.');
  ties.cuts.forEach(c=>{
    tt += row('Partition '+c.name+' sums back to the whole', c.ok,
      c.groups+' groups, '+fN(c.n)+' lines. '
      + (c.ok? 'Obligations, expenditures and ULO all reconcile.'
             : 'Obligations off by '+fD(c.dObl)+', expenditures '+fD(c.dExp)+', ULO '+fD(c.dUlo)+'.'));
  });
  /* ---- DOES THE MONTH AGREE WITH THE WORKBOOK? ------------------------
     The month comes from the file NAME and nowhere else, so a renamed file is
     a mislabelled month. Nothing in the workbook states it outright, but the
     sheet names and the newest fiscal year corroborate it - and this card can
     only ever catch a DISAGREEMENT, never confirm a date is right. */
  {
    const files = curFiles();
    const checks = files.map(f=>({
      f: f,
      c: CED.monthCheck(f, CED.everything().filter(L=>L.pk===f.pk && L.piin===f.piin))
    }));
    const bad  = checks.filter(x=>x.c.verdict==='disagree');
    const none = checks.filter(x=>x.c.verdict==='none');
    const okn  = checks.filter(x=>x.c.verdict==='agree');

    let mb = '<div class="note ' + (bad.length? 'r' : 'b') + '">'
      + (bad.length
          ? '<b>' + fN(bad.length) + ' file' + (bad.length===1?' does':'s do')
            + ' not agree with what is inside ' + (bad.length===1?'it':'them') + '.</b> '
          : '<b>The reporting month comes from the file name and nowhere else.</b> ')
      + 'The workbook does not record it &mdash; not in a cell, not in the file date. '
      + 'Two things inside it can still corroborate the name: a <b>month named in a '
      + 'sheet name</b>, and the <b>newest fiscal year</b>, since money cannot be '
      + 'obligated before its own year begins. '
      + '<b>This can only catch a disagreement; it can never prove a date right</b>, '
      + 'and a workbook that names neither is reported as exactly that.</div>';

    mb += '<div class="scroll"><table class="t"><thead><tr>'
      + '<th>File</th><th>Imported as</th><th>As-of</th>'
      + '<th>Month in a sheet name</th><th>Newest FY</th><th>Agrees</th>'
      + '</tr></thead><tbody>';
    checks.forEach(x=>{
      const c = x.c;
      const tone = c.verdict==='disagree'? 'r' : c.verdict==='agree'? 'g' : 'p';
      const word = c.verdict==='disagree'? 'disagrees'
                 : c.verdict==='agree'? 'agrees' : 'nothing to check';
      mb += '<tr>'
        + '<td class="nw"><span class="mono" style="font-size:11.5px">'+esc(x.f.name)+'</span>'
          + (x.f.nameAsOf && x.f.asOf && x.f.nameAsOf!==x.f.asOf
              ? '<div><span class="pill a">re-dated at import</span></div>' : '')
        + '</td>'
        + '<td class="nw">'+esc(pLabel(x.f.pk))+'</td>'
        + '<td class="nw"><span class="mono">'+esc(x.f.asOf||'')+'</span>'
          + (x.f.asOf? '' : '<span class="pill a">none</span>')+'</td>'
        + '<td class="nw">' + (c.sheetMonth!==null
            ? '<b>'+esc(CED.MONTH_ABBR[c.sheetMonth-1])+'</b> '
              + '<span style="color:var(--dim);font-size:11px" class="mono">'
              + esc(c.sheetName)+'</span>'
            : (c.sheetSaw.length
                ? '<span class="pill a">several</span>'
                : '<span class="pill">none named</span>')) + '</td>'
        + '<td class="nw">' + (c.newestFY!==null
            ? 'FY'+c.newestFY+' <span style="color:var(--dim);font-size:11px">on or after '
              + esc(c.fyFloor)+'</span>'
            : '<span class="pill">none</span>') + '</td>'
        + '<td class="nw"><span class="pill '+tone+'">'+word+'</span></td>'
        + '</tr>';
      c.why.filter(w=>w.k==='bad').forEach(w=>{
        mb += '<tr><td colspan="6" style="padding-left:18px;color:var(--red)">'
          + '&#9888; '+esc(w.t)+'</td></tr>';
      });
    });
    mb += '</tbody></table></div>';

    if(none.length && !bad.length)
      mb += '<div class="note a" style="margin-top:10px"><b>'+fN(none.length)+'</b> file'
        + (none.length===1?'':'s')+' carr'+(none.length===1?'ies':'y')
        + ' nothing to check the name against &mdash; no month in a sheet name and no '
        + 'fiscal year. The FY21 workbook is one of these: its tab is '
        + '<span class="mono">N0001921CXXXX FY21 AVSC ULOs</span>, which names no month. '
        + 'That is not a fault; it is the absence of evidence, and it is said rather '
        + 'than counted as agreement.</div>';

    h += card('Does the month agree with the workbook?',
              fN(okn.length)+' agree &middot; '+fN(bad.length)+' disagree &middot; '
              + fN(none.length)+' nothing to check', mb);
  }

  /* ---- DOES THE CONTRACT NUMBER AGREE WITH THE WORKBOOK? -------------
     The same question as the month and a THINNER answer: two of the three
     known workbook vintages carry no contract number anywhere in the file.
     So "nothing to check" is the usual honest verdict - but a contract number
     is the one field whose being wrong silently reassigns a whole file's
     money, and where the evidence exists a mismatch is caught. */
  {
    const files = curFiles();
    const cc = files.map(f=>({f:f, c:CED.contractCheck(f, files)}));
    const bad  = cc.filter(x=>x.c.verdict==='disagree');
    const okn  = cc.filter(x=>x.c.verdict==='agree');
    const none = cc.filter(x=>x.c.verdict==='none');

    let cb = '<div class="note ' + (bad.length? 'r' : 'b') + '">'
      + (bad.length
          ? '<b>' + fN(bad.length) + ' file' + (bad.length===1?' needs':'s need')
            + ' a look.</b> '
          : '<b>The contract number is the FIRST word of the file name.</b> ')
      + 'Most workbooks name no contract anywhere inside &mdash; neither August file '
      + 'carries one in a cell, a sheet name or its document properties &mdash; so on '
      + 'those there is genuinely <b>nothing to check the name against</b>, and that is '
      + 'reported rather than dressed up as agreement. Where a workbook does name one, '
      + 'as the FY21 tab <span class="mono">N0001921CXXXX FY21 AVSC ULOs</span> does, it '
      + 'is held against the name. Two more things need no evidence at all: a name that '
      + 'is <b>not the N#####-##-X-#### shape</b>, and <b>two files claiming one contract '
      + 'in one period</b> &mdash; where only one of them survives the import.</div>';

    cb += '<div class="scroll"><table class="t"><thead><tr>'
      + '<th>File</th><th>Imported as</th><th>Shape</th>'
      + '<th>Named in the workbook</th><th>Agrees</th></tr></thead><tbody>';
    cc.forEach(x=>{
      const c = x.c;
      const tone = c.verdict==='disagree'? 'r' : c.verdict==='agree'? 'g' : 'p';
      const word = c.verdict==='disagree'? 'needs a look'
                 : c.verdict==='agree'? 'agrees' : 'nothing to check';
      cb += '<tr>'
        + '<td class="nw"><span class="mono" style="font-size:11.5px">'+esc(x.f.name)+'</span></td>'
        + '<td class="nw"><span class="mono">'+esc(c.pretty)+'</span></td>'
        + '<td class="nw">'+(c.recognised
            ? '<span class="pill g">N#####-##-X-####</span>'
            : '<span class="pill r">not the shape</span>')+'</td>'
        + '<td class="nw">'+(c.seen.length
            ? c.seen.map(v=>'<span class="mono">'+esc(v.piin)+'</span>').join(', ')
            : '<span class="pill">none named</span>')+'</td>'
        + '<td class="nw"><span class="pill '+tone+'">'+word+'</span></td>'
        + '</tr>';
      c.why.filter(w=>w.k==='bad').forEach(w=>{
        cb += '<tr><td colspan="5" style="padding-left:18px;color:var(--red)">'
          + '&#9888; '+w.t+'</td></tr>';
      });
    });
    cb += '</tbody></table></div>';

    cb += '<div class="note" style="margin-top:10px"><b>This can never confirm a contract '
      + 'number is right</b>, only catch one that argues with itself. A file correctly '
      + 'named for the wrong contract is indistinguishable from a correct one, and no '
      + 'reading of the workbook changes that &mdash; the totals tie to the source either '
      + 'way. It is the reason the file name is worth a second look every month.</div>';

    h += card('Does the contract number agree with the workbook?',
              fN(okn.length)+' agree &middot; '+fN(bad.length)+' need a look &middot; '
              + fN(none.length)+' nothing to check', cb);
  }

  h += card('Tie-outs', 'asserted on every render, not assumed',
        '<table class="t"><thead><tr><th>Check</th><th class="c">Result</th><th>Detail</th></tr></thead><tbody>'
        + tt + '</tbody></table>', {flush:true});

  /* the failing rows themselves, if any */
  if(!ties.rowIdentity.ok){
    h += card('Lines whose ULO does not reconcile', 'shown exactly as the file carries them',
      dataTable('vf-bad', LINE_COLS(true).concat([
        {k:'calc', h:'Obl - Exp', cls:'n', get:r=>r.uloCalc, cell:r=>fD(r.uloCalc)},
        {k:'diff', h:'Difference', cls:'n', get:r=>r.ulo-r.uloCalc, cell:r=>'<b>'+fD(r.ulo-r.uloCalc)+'</b>'}
      ]), ties.rowIdentity.bad, {sortKey:'diff'}), {flush:true});
  }

  /* advisories */
  let at = '';
  adv.forEach(a=>{
    at += '<tr><td class="n"><b>'+fN(a.n)+'</b></td>'
       +  '<td><span class="pill '+(a.k==='bad'?'r':'a')+'">'+(a.k==='bad'?'check':'note')+'</span></td>'
       +  '<td>'+esc(a.t)+'</td></tr>';
  });
  if(adv.mixedParticipants && adv.mixedParticipants.length){
    at += '<tr><td class="n"><b>'+adv.mixedParticipants.length+'</b></td>'
       +  '<td><span class="pill a">note</span></td>'
       +  '<td>appearing as both: '+adv.mixedParticipants.map(esc).join(', ')+'</td></tr>';
  }
  /* ---- does the source agree with the appropriation's statutory life? ----
     This check only became possible in v0.8: the tool now derives the dates the
     appropriation and fiscal year imply and holds them beside the file's own,
     exactly as uloCalc sits beside ulo. The FILE stays authoritative - a
     disagreement is reported, never corrected. */
  const lc = CED.lifeCheck(all);
  let lcBody = '<div class="note b">Period of availability, then five expired fiscal years, then '
    + 'cancellation. The tool derives the expiration and cancel dates that each line&rsquo;s appropriation '
    + 'and fiscal year imply, and compares them with the dates on file.</div>'
    + '<table class="t"><thead><tr><th>Appropriation</th><th class="n">Availability</th>'
    + '<th>Source</th><th class="n">Lines here</th></tr></thead><tbody>'
    + CED.APPN_LIFE.map(e=>{
        const n = all.filter(L=>L.life && L.life.name===e.name).length;
        return '<tr><td><b>'+esc(e.name)+'</b></td>'
          + '<td class="n">'+e.yrs+' year'+(e.yrs===1?'':'s')+'</td>'
          + '<td>'+(e.src==='owner'
              ? '<span class="pill b">stated for this programme</span>'
              : '<span class="pill">standard availability &mdash; not seen in this data</span>')+'</td>'
          + '<td class="n">'+(n? fN(n) : '<span class="pill">&ndash;</span>')+'</td></tr>';
      }).join('')
    + '</tbody></table>';

  lcBody += (lc.ok
      ? '<div class="note g" style="margin-top:10px"><b>Every date that could be checked agrees '
        + 'with the rule</b> &mdash; '+fN(lc.agree)+' of '+fN(lc.checked)+' lines.</div>'
      : '<div class="note r" style="margin-top:10px"><b>'+fN(lc.expBad.length)+' expiration and '
        + fN(lc.cancBad.length)+' cancel date'+(lc.cancBad.length===1?'':'s')
        + ' disagree with the appropriation&rsquo;s life.</b> The date on file is what the tool uses '
        + 'everywhere; this is telling you the two sources differ, not overriding one.</div>');

  if(lc.blindN){
    lcBody += '<div class="note a"><b>'+fN(lc.blindN)+' lines could not be checked at all.</b> '
      + 'Their dates are used as given, and nothing validates them:<ul style="margin:6px 0 0 18px">'
      + Object.keys(lc.blind).sort().map(k=>'<li>'+fN(lc.blind[k])+' &mdash; '+esc(k)+'</li>').join('')
      + '</ul></div>';
  }
  if(lc.expBad.length || lc.cancBad.length){
    const bad = lc.expBad.concat(lc.cancBad.filter(L=>lc.expBad.indexOf(L)<0));
    lcBody += '<div class="scroll bx sm" style="margin-top:10px">'
      + dataTable('vf-life', [
          {k:'ktr',  h:'Contract', cls:'mono nw', get:r=>r.ktr},
          {k:'clin', h:'CLIN', cls:'mono', get:r=>r.clin},
          {k:'acrn', h:'ACRN', cls:'mono c', get:r=>r.acrn},
          {k:'appn', h:'Appropriation', get:r=>r.appn},
          {k:'fy',   h:'FY', cls:'c', get:r=>r.fy},
          {k:'life', h:'Life', cls:'c', get:r=>r.life? r.life.yrs : 0,
           cell:r=>r.life? (r.life.yrs+'-year') : ''},
          {k:'ef',   h:'Expires (file)', cls:'c', get:r=>r.expD,
           cell:r=>(r.expOk===false? '<span class="pill r">':'<span>')+esc(dLabel(r.expD))+'</span>'},
          {k:'ed',   h:'Expires (implied)', cls:'c', get:r=>r.expDerived,
           cell:r=>esc(dLabel(r.expDerived))},
          {k:'cf',   h:'Cancels (file)', cls:'c', get:r=>r.cancD,
           cell:r=>(r.cancOk===false? '<span class="pill r">':'<span>')+esc(dLabel(r.cancD))+'</span>'},
          {k:'cd',   h:'Cancels (implied)', cls:'c', get:r=>r.cancDerived,
           cell:r=>esc(dLabel(r.cancDerived))},
          {k:'ulo',  h:'ULO', cls:'n', get:r=>r.ulo, cell:r=>fD(r.ulo)}
        ], bad, {sortKey:'ulo'})
      + '</div>';
  }
  h += card('Appropriation life cycle', 'the rule, and whether the source obeys it', lcBody, {});

  /* ---- THE TWO FIELDS AS THE SOURCE WRITES THEM -----------------------
     The card above asks whether the DATES obey the rule. This asks what is
     actually in the two fields those dates are derived from, because both are
     kept verbatim - "2024/2025" and "PROC FF/O&M" are real - and every
     grouping in the tool is by the literal string. */
  {
    const af = CED.appnFyAudit(CED.all(), curAsOf());
    let ab = '<div class="note '+(af.ok? 'b':'a')+'">'
      + 'Appropriation and fiscal year are kept <b>exactly as the workbook writes them</b>. '
      + 'Coercing either to a number or a code would silently merge or blank the compound '
      + 'values the source really carries &mdash; <span class="mono">2024/2025</span>, '
      + '<span class="mono">PROC FF/O&amp;M</span>. That is right, and it has a cost this '
      + 'card exists to surface: <b>every grouping in this tool is by the literal string</b>, '
      + 'so two spellings of one thing are two rows everywhere.</div>';

    /* the two censuses, side by side */
    ab += '<div class="grid g2">';
    [['Appropriation', af.appns, true], ['Fiscal year', af.fys, false]].forEach(function(spec){
      const label = spec[0], rows = spec[1], isAppn = spec[2];
      let t = '<div><div style="font-size:10px;letter-spacing:.08em;'
        + 'text-transform:uppercase;color:var(--faint);margin-bottom:5px">'+label+'</div>'
        + '<div class="scroll bx sm">'
        + '<table class="t"><thead><tr><th>As written</th><th class="n">Lines</th>'
        + '<th class="n">ULO</th><th>'+(isAppn? 'In the life table' : 'Shape')+'</th>'
        + '</tr></thead><tbody>';
      rows.forEach(function(g){
        t += '<tr><td class="nw">'+(g.blank
              ? '<span class="pill p">(none)</span>'
              : '<span class="mono">'+esc(g.value)+'</span>')
          + (g.compound? ' <span class="pill a">compound</span>' : '')+'</td>'
          + '<td class="n">'+fN(g.n)+'</td><td class="n">'+cMz(g.ulo)+'</td>'
          + '<td class="nw">'+(g.blank
              ? '<span style="color:var(--dim)">partner &mdash; no life to derive</span>'
              : isAppn
                ? (g.life
                    ? '<span class="pill g">'+esc(g.life.name)+' &middot; '+g.life.yrs+'-year</span>'
                      + (g.life.src==='std'? ' <span class="pill" title="statutory, not stated by the owner">std</span>' : '')
                      + (g.derivedN < g.n
                          ? ' <span class="pill a" title="'+esc(g.whys.join('; '))+'">'
                            + fN(g.n - g.derivedN)+' not derived</span>' : '')
                    /* NOT "not in the table" unless that is really why - a
                       compound value matches the pattern and is still refused */
                    : (CED.lifeOf(g.value)
                        ? '<span class="pill a" title="'+esc(g.whys.join('; '))+'">no life derived</span>'
                        : '<span class="pill r">not in the table</span>'))
                : (g.plain
                    ? '<span class="pill g">a four-digit year</span>'
                      + (g.start? ' <span style="color:var(--dim);font-size:11px">from '+esc(g.start)+'</span>' : '')
                    : '<span class="pill a">not a plain year</span>'))
          + '</td></tr>';
      });
      t += '</tbody></table></div></div>';
      ab += t;
    });
    ab += '</div>';

    /* ---- the findings, each said only when it happens ------------------ */
    if(af.variants.length){
      ab += '<div class="note r" style="margin-top:12px"><b>Two spellings of one value.</b> '
        + 'These differ only in case, spacing or punctuation, so the tool treats them as '
        + 'different &mdash; <b>every subtotal splits, and each half looks complete</b>. '
        + 'This is the one finding here you cannot see by reading the data.'
        + '<ul style="margin:6px 0 0 18px">'
        + af.variants.map(function(v){
            return '<li>'+esc(v.kind)+': '
              + v.values.map(x=>'<span class="mono">&ldquo;'+esc(x.value)+'&rdquo;</span> ('
                  + fN(x.n)+' lines, '+fM(x.ulo)+'M)').join(' and ')
              + '</li>';
          }).join('')
        + '</ul></div>';
    }
    if(af.unknown.length){
      ab += '<div class="note a" style="margin-top:10px"><b>'+fN(af.unknown.length)
        + ' appropriation'+(af.unknown.length===1?'':'s')+' not in the life table.</b> '
        + 'Nothing is guessed for '+(af.unknown.length===1?'it':'them')+' &mdash; the '
        + 'dates on file are used as given and no life is derived: '
        + af.unknown.map(x=>'<span class="mono">'+esc(x.value)+'</span> ('+fN(x.n)+')').join(', ')
        + '.</div>';
    }
    if(af.appnNoFy.length || af.fyNoAppn.length){
      ab += '<div class="note a" style="margin-top:10px"><b>One field without the other.</b> '
        + 'Measured on the real files, appropriation and fiscal year populate together or '
        + 'not at all. '
        + (af.appnNoFy.length? '<b>'+fN(af.appnNoFy.length)+'</b> lines carry an '
            + 'appropriation but no fiscal year. ' : '')
        + (af.fyNoAppn.length? '<b>'+fN(af.fyNoAppn.length)+'</b> carry a fiscal year but '
            + 'no appropriation. ' : '')
        + 'Neither can have its life derived.</div>';
    }
    if(af.future.length){
      ab += '<div class="note r" style="margin-top:10px"><b>'+fN(af.future.length)
        + ' line'+(af.future.length===1?'':'s')+' carry a fiscal year that has not begun.</b> '
        + 'Money cannot be obligated before its own year starts, so this is not a late '
        + 'entry &mdash; it is impossible as at '+esc(dLabel(curAsOf()))+':'
        + '<ul style="margin:6px 0 0 18px">'
        + [...new Set(af.future.map(L=>L.fy))].sort().map(function(fy){
            const n = af.future.filter(L=>L.fy===fy).length;
            return '<li>FY<span class="mono">'+esc(fy)+'</span> begins '
              + esc(CED.fyStart(fy)) + ' &mdash; '+fN(n)+' line'+(n===1?'':'s')+'</li>';
          }).join('')
        + '</ul></div>';
    }
    if(af.ok)
      ab += '<div class="note g" style="margin-top:10px"><b>Nothing to flag.</b> No value '
        + 'appears under two spellings, the two fields travel together on every line that '
        + 'has either, and no fiscal year is ahead of the as-of.</div>';
