/* Build the zip. One .xlsx per recipient plus a manifest, and NOTHING is
   written unless every chosen recipient actually produced a workbook. */
function wlBuild(){
  const sel = wlSel();
  const rs  = wlRecipients().filter(r=>sel.has(r.key));
  if(!rs.length){ setStat('&#9888; Nobody is selected.'); return; }
  const per = curPeriod(), asOf = curAsOf();

  const files = [], made = [], skipped = [];
  const used  = new Set();
  rs.forEach(r=>{
    const w = worklistFor(r.name, r.role);
    if(!w){ skipped.push(r); return; }
    /* two people can sanitise to the same file name; a zip with a duplicate
       entry loses one of them silently */
    let fn = w.short + ' - ' + safeFile(r.name) + '.xlsx', i = 2;
    while(used.has(fn.toLowerCase())){
      fn = w.short + ' - ' + safeFile(r.name) + ' (' + (i++) + ').xlsx';
    }
    used.add(fn.toLowerCase());
    files.push({name: fn, data: xlsxBytes(w.names, w.sheets)});
    made.push(Object.assign({}, r, {fileName: fn, w: w}));
  });

  if(!made.length){ setStat('&#9888; None of those contacts owns a line in this period.'); return; }

  /* THE MANIFEST IS THE RECORD OF THE SEND. After a dozen files go out, what
     went to whom is not something to reconstruct from memory. */
  const cvr = wlCover(made);
  const man = [
    ['Unliquidated obligation worklists'],
    ['Period', per? per.label : '', 'as of', asOf||''],
    ['Built', new Date().toISOString().slice(0,16).replace('T',' ')],
    ['Recipients', made.length],
    ['Distinct lines covered', cvr.n],
    ['Unliquidated on those lines', cvr.ulo],
    ['At risk (expired or cancelled)', cvr.atRisk],
    ['Of that, unexplained', cvr.uncovered],
    ['NOTE', 'The per-recipient rows below OVERLAP - one line can appear on '
           + 'more than one worklist - so their columns do not add to the '
           + 'figures above.'],
    [],
    ['Role','Contact','Organisation','E-mail','Phone','Lines','Obligations',
     'Unliquidated','At risk','Unexplained','Open actions','File']
  ];
  made.forEach(r=>man.push([
    r.roleName, r.name, r.poc? r.poc.org : '', r.poc? r.poc.email : '',
    r.poc? r.poc.phone : '', r.n, r.w.tot.obl, r.ulo,
    r.atRisk.ulo, r.uncovered.ulo, r.open, r.fileName]));

  const mNames = ['Sent'], mSheets = [man];
  const un = wlUnassigned();
  if(un.length){
    const u = [['Lines nobody is assigned to - NO worklist was built for these'],
               ['Per role. These do NOT add up: one balance can be unassigned in '
                + 'more than one role.'], [],
               ['Role','Lines','Unliquidated','At risk','Unexplained']];
    un.forEach(x=>u.push([x.roleName, x.n, x.ulo, x.atRisk.ulo, x.uncovered.ulo]));
    mSheets.push(u); mNames.push('Not addressed');
  }
  files.unshift({name:'Manifest.xlsx', data: xlsxBytes(mNames, mSheets)});

  dl('ULO worklists - ' + (per? per.label : '') + '.zip',
     zipStore(files, 'application/zip'));
  /* RECORDED ONLY ONCE THE FILE IS ACTUALLY BUILT. Logging the intent before
     the zip exists would leave the register claiming a send that failed. */
  made.forEach(r=>sendLog({kind:'sent', name:r.name, role:r.role, pk:DB.cur,
                           n:r.n, ulo:r.ulo, uncovered:r.uncovered.ulo,
                           file:r.fileName}));
  closeModal();
  setStat('&#9989; Built <b>'+fN(made.length)+'</b> worklist'+(made.length===1?'':'s')
    + ' in one zip &mdash; ' + fN(cvr.n) + ' distinct lines between them, $'
    + fM(cvr.uncovered) + 'M of it unexplained'
    + (skipped.length? ' (' + fN(skipped.length) + ' skipped, they own nothing this period)' : '')
    + '. <b>Every file in it is CUI.</b>');
}

/* ============================================================================
   TAKING A WORKLIST BACK.

   The one input to this tool that was edited OUTSIDE the building, by somebody
   who does not use it, in Excel. So it is READ, then PROPOSED, and only applied
   when the owner has seen the whole change set. Nothing a returned file says is
   written straight into the register.
   ============================================================================ */
let WLP = null;                 /* the plan awaiting review, or null */

async function takeWorklist(inp){
  const f = inp.files && inp.files[0];
  inp.value = '';
  if(!f || !DB) return;
  setStat('&#128229; Reading <b>'+esc(f.name)+'</b> &hellip;');
  try{
    const read = await xlsxRead(await f.arrayBuffer());
    /* the sheet is found by SHAPE, like everything else here - a returned
       workbook may have been renamed, re-saved or had a tab added */
    let best = null;
    Object.keys(read.sheets).forEach(n=>{
      const h = CED.wlHeader(read.sheets[n]);
      if(h && (!best || h.score > best.h.score)) best = {name:n, h:h};
    });
    if(!best) throw new Error('no worklist table was found in any sheet of that file');
    const parsed = CED.readWorklist(read.sheets[best.name], CED.all());
    if(parsed.error) throw new Error(parsed.error);
    WLP = CED.planWorklist(parsed, actions(), {});
    WLP.file = f.name; WLP.sheet = best.name; WLP.meta = parsed.meta;
    wlReview();
  }catch(err){
    setStat('&#9888; <span class="bad">Could not read that worklist:</span> '
      + esc(err && err.message || err));
  }
}

function wlReview(){
  const p = WLP;
  if(!p) return;
  const per = curPeriod();
  const stale = p.meta.period && per && p.meta.period !== per.label;

  let b = '<div class="note b"><b>'+esc(p.file)+'</b>'
    + (p.sheet? ' &middot; sheet <span class="mono">'+esc(p.sheet)+'</span>' : '')
    + (p.meta.who? ' &middot; returned by <b>'+esc(p.meta.who)+'</b>' : '')
    + (p.meta.role? ' ('+esc(CED.pocRole(p.meta.role).name)+')' : '')
    + '. ' + fN(p.scanned) + ' rows read, ' + fN(p.total) + ' answered, '
    + fN(p.blank) + ' left blank.</div>';

  if(stale)
    b += '<div class="note a"><b>That worklist is for '+esc(p.meta.period)+'</b> and you are '
      + 'showing <b>'+esc(per.label)+'</b>. The answers still apply to the lines they name &mdash; '
      + 'balances move, the CLIN and ACRN do not &mdash; but check that is what you meant.</div>';

  if(!p.create.length && !p.update.length)
    b += '<div class="note a">Nothing to apply: no row carries a disposition, a note or a '
       + 'target date that changes anything.</div>';

  /* ---- what would be raised ------------------------------------------- */
  if(p.create.length){
    b += '<div class="card" style="margin-bottom:12px"><div class="hd">'
      + '<h3>Would raise '+fN(p.create.length)+' new action'+(p.create.length===1?'':'s')+'</h3>'
      + '<span class="sub">these lines carry no open action</span></div><div class="bd flush">'
      + '<div class="scroll sm">' + dataTable('wl-new', [
          {k:'clin', h:'CLIN', cls:'mono', get:r=>r.rec.clin},
          {k:'acrn', h:'ACRN', cls:'mono c', get:r=>r.rec.acrn},
          {k:'title',h:'Action', cls:'w', get:r=>r.draft.title, cell:r=>'<b>'+esc(r.draft.title)+'</b>'},
          {k:'disp', h:'Disposition', cls:'c', get:r=>r.draft.disp,
           cell:r=>{ const d=CED.actDisp(r.draft.disp);
             return d? '<span class="pill '+(d.tone||'')+'">'+esc(d.name)+'</span>'
                     : '<span class="pill a">none read</span>'; }},
          {k:'due',  h:'Due', cls:'c', get:r=>r.draft.due,
           cell:r=>r.draft.due? esc(dLabel(r.draft.due)) : '<span class="pill">&ndash;</span>'},
          {k:'ulo',  h:'ULO', cls:'n', get:r=>r.rec.line.ulo, cell:r=>fD(r.rec.line.ulo)}
        ], p.create, {sortKey:'ulo'}) + '</div></div></div>';
  }

  /* ---- what would change ------------------------------------------------ */
  if(p.update.length){
    const FL = {disp:'Disposition', due:'Due', withWho:'With'};
    b += '<div class="card" style="margin-bottom:12px"><div class="hd">'
      + '<h3>Would update '+fN(p.update.length)+' existing action'
      + (p.update.length===1?'':'s')+'</h3>'
      + '<span class="sub">the newest open action on each line</span></div><div class="bd flush">'
      + '<div class="scroll sm">' + dataTable('wl-upd', [
          {k:'clin', h:'CLIN', cls:'mono', get:r=>r.rec.clin},
          {k:'title',h:'Action', cls:'w', get:r=>r.action.title, cell:r=>'<b>'+esc(r.action.title)+'</b>'},
          {k:'ch',   h:'Changes', cls:'w', get:r=>r.changes.length,
           cell:r=>r.changes.length
             ? r.changes.map(c=>'<span class="pill b">'+esc(FL[c.f]||c.f)+'</span> '
                 + (c.f==='disp'
                     ? (esc(((CED.actDisp(c.from)||{}).name)) || 'none') + ' &rarr; <b>'
                       + (esc(((CED.actDisp(c.to)||{}).name)) || 'none') + '</b>'
                     : (esc(c.from) || '&ndash;') + ' &rarr; <b>' + esc(c.to) + '</b>')).join('<br>')
             : '<span class="pill">no field changes</span>'},
          {k:'note', h:'Their note', cls:'w', get:r=>r.note,
           cell:r=>r.note? esc(r.note) : '<span class="pill">&ndash;</span>'}
        ], p.update, {sortKey:'clin', sortDir:'asc'}) + '</div>'
      + '<div class="note" style="margin:10px 12px 3px">Every one of these also gets the '
      + 'response written into its <b>history</b>, whether or not a field changed &mdash; the '
      + 'log is the record that they answered.</div></div></div>';
  }

  /* ---- what could not be used ------------------------------------------ */
  if(p.unreadable.length){
    b += '<div class="card" style="margin-bottom:12px"><div class="hd">'
      + '<h3>'+fN(p.unreadable.length)+' disposition'+(p.unreadable.length===1?'':'s')
      + ' could not be read</h3></div><div class="bd flush">'
      + '<div class="note a" style="margin:10px 12px">These do not match anything in the '
      + 'vocabulary, so the <b>note and the date are still taken</b> and the disposition is left '
      + 'unset. Set it by hand, or say it in words the tool knows: '
      + CED.ACT_DISP.map(d=>'<b>'+esc(d.name)+'</b>').join(', ') + '.</div>'
      + '<div class="scroll sm">' + dataTable('wl-bad', [
          {k:'row',  h:'Row', cls:'n', get:r=>r.row},
          {k:'clin', h:'CLIN', cls:'mono', get:r=>r.clin},
          {k:'raw',  h:'They wrote', cls:'w', get:r=>r.dispRaw,
           cell:r=>'<span class="pill a">'+esc(r.dispRaw)+'</span>'}
        ], p.unreadable, {sortKey:'row', sortDir:'asc'}) + '</div></div></div>';
  }

  if(p.unmatched.length){
    b += '<div class="card" style="margin-bottom:12px"><div class="hd">'
      + '<h3>'+fN(p.unmatched.length)+' answered row'+(p.unmatched.length===1?'':'s')
      + ' matched no line</h3></div><div class="bd flush">'
      + '<div class="note r" style="margin:10px 12px">Nothing will be done with these. The '
      + 'contract, CLIN and ACRN together do not name a line in <b>'+esc(per.label)+'</b> &mdash; '
      + 'usually a row that was edited or added by hand, or a line that has since dropped off '
      + 'the report.</div>'
      + '<div class="scroll sm">' + dataTable('wl-nomatch', [
          {k:'row', h:'Row', cls:'n', get:r=>r.row},
          {k:'contract', h:'Contract', cls:'mono', get:r=>r.contract},
          {k:'clin', h:'CLIN', cls:'mono', get:r=>r.clin},
          {k:'acrn', h:'ACRN', cls:'mono c', get:r=>r.acrn},
          {k:'note', h:'They wrote', cls:'w', get:r=>r.note||r.dispRaw}
        ], p.unmatched, {sortKey:'row', sortDir:'asc'}) + '</div></div></div>';
  }

  b += '<div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    + '<button class="mbtn go" data-act="wlApply"'
    + ((p.create.length||p.update.length)? '' : ' disabled') + '>Apply '
    + fN(p.create.length + p.update.length) + ' change'
    + ((p.create.length+p.update.length)===1?'':'s') + '</button>'
    + '<button class="mbtn pill" data-act="closeModal">Cancel &mdash; change nothing</button>'
    + '<span style="flex:1"></span>'
    + '<label style="font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)">Your initials</label>'
    + '<input data-wl="who" value="'+esc(who())+'" style="width:70px;background:var(--panelA);'
    + 'border:1px solid var(--line2);border-radius:5px;padding:3px 7px;font-size:12px">'
    + '</div>';

  modal('Take back a worklist', b);
}

function wlApply(){
  const p = WLP;
  if(!p) return;
  const el = $('modalHost').querySelector('[data-wl="who"]');
  if(el) setWho(el.value);
  const from = p.who || 'the worklist';
  let made = 0, changed = 0;

  p.create.forEach(c=>{
    const r = actSave(c.draft, 'raised from a worklist returned by ' + from);
    if(r && r.ok) made++;
  });
  p.update.forEach(u=>{
    const a = actById(u.action.id);
    if(!a) return;
    u.changes.forEach(ch=>{ a[ch.f] = ch.to; });
    const note = u.note? (from + ': ' + u.note) : (from + ' responded');
    const r = actSave(a, note);
    if(r && r.ok) changed++;
  });

  /* THE RETURN IS A FACT ABOUT A CONTACT, NOT ABOUT A FILE. It is logged
     against whoever the workbook says answered and the period it was about,
     so "has Ellen come back on August?" has an answer even after the file
     itself is long gone. A return that names nobody is still logged - under
     the file name - rather than dropped, because something did come back. */
  const rWho  = (p.meta && p.meta.who) || p.who || '';
  const rRole = (p.meta && p.meta.role) || '';
  if(rWho){
    sendLog({kind:'returned', name:rWho, role:rRole || 'ko', pk:DB.cur,
             answered:(p.create.length + p.update.length), file:p.file});
  }

  WLP = null;
  closeModal(); paintChrome(); render();
  setStat('&#9989; Took back <b>'+esc(p.file)+'</b> &mdash; '+fN(made)+' action'
    + (made===1?'':'s')+' raised, '+fN(changed)+' updated'
    + (p.unmatched.length
        ? ', '+fN(p.unmatched.length)+(p.unmatched.length===1
            ? ' row matched nothing and was left alone'
            : ' rows matched nothing and were left alone') : '')
    + '.');
}
</script>

<script>
/* ============================================================================
   CHROME, ROUTING AND BOOT.

   Menu contents are rebuilt on every open from live state, so an item can
   never show a stale enabled state or a stale tick. Items carry a function,
   not a string of JS - only an index goes into the markup, which keeps
   quoting out of it entirely.
   ============================================================================ */

let MENU_ACTS = [];

function paintChrome(){
  const on = !!DB;
  const bar = $('mbar');
  let h = '';
  h += '<button class="mbtn" data-menu="file">File</button>';
  h += '<button class="mbtn" data-menu="view">View</button>';
  const multi = on && DB.periods.length>1;
  VIEWS.forEach(v=>{
    /* the comparison and the trend are OFFERED with one period loaded, not
       hidden - a reader who wants month over month should find out how to get
       it from the view itself, not by wondering where the button went */
    const dim = !on;
    h += '<button class="mbtn'+(VIEW===v.id?' act':'')+(v.multi&&!multi?' pill':'')
      +  '" data-view="'+v.id+'"'+(dim?' disabled':'')+'>'+v.name
      +  (v.multi&&on&&!multi? ' <span style="opacity:.55">·1</span>':'')+'</button>';
  });
  h += '<span style="flex:1"></span>';
  if(on){
    /* State is never hidden behind a menu: these say what the numbers are
       filtered to, and clicking one opens the menu that changes it. */
    const nF = filterCount();
    h += '<button class="mbtn pill" data-menu="period">'
      +  esc(curPeriod().label)
      +  ' &middot; '+fN(curFiles().length)+' contract'+(curFiles().length===1?'':'s')
      +  (DB.periods.length>1? ' &middot; '+fN(DB.periods.length)+' periods' : '')+'</button>';
    h += '<button class="mbtn pill" data-act="gotoLines">'
      +  (nF? '<b>'+nF+' filter'+(nF===1?'':'s')+' on</b>' : 'no filters')+'</button>';
    h += '<button class="mbtn go" data-act="exportXlsx">Export .xlsx</button>';
  }else{
    h += '<button class="mbtn go" data-act="import">Import ULO summaries</button>';
  }
  bar.innerHTML = h;

  $('verChip').textContent = VER;
  const a = $('asOfChip'), f = $('fileChip');
  if(on && curAsOf()){ a.hidden=false; a.textContent='AS OF '+dLabel(curAsOf()).toUpperCase(); }
  else a.hidden=true;
  if(on){ f.hidden=false; f.textContent = fN(CED.all().length)+' CLIN LINES'; }
  else f.hidden=true;
}

function filterCount(){
  let n=0;
  /* `win` is deliberately absent: it is the tool's PURPOSE, not a choice the
     reader made, and counting it would make a fresh import report a filter on.
     It states itself in the strip above every view instead. */
  ['contract','part','appn','fy','ctype','fund','canc','life','q'].forEach(k=>{ if(F[k]) n++; });
  if(typeof CQ!=='undefined'){ if(CQ.q) n++; if(CQ.risk) n++; }
  return n;
}

/* ------------------------------------------------------------------- menus */
function openMenu(which, anchor){
  closeMenu();
  const items = buildMenu(which);
  MENU_ACTS = items.map(i=>i.fn||null);
  const el = document.createElement('div');
  el.className = 'menu';
  el.innerHTML = items.map((i,ix)=>{
    if(i.sep) return '<div class="sep"></div>';
    if(i.lbl) return '<div class="lbl">'+esc(i.lbl)+'</div>';
    return '<button class="mi" data-mi="'+ix+'"'+(i.off?' disabled':'')+'>'
         + '<span class="tick">'+(i.on? '&#10003;' : '')+'</span>'+i.t+'</button>';
  }).join('');
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  el.style.left = Math.min(r.left, window.innerWidth - el.offsetWidth - 10) + 'px';
  el.style.top  = (r.bottom + window.scrollY + 2) + 'px';
  MENU = el;
  anchor.classList.add('open');
}
function closeMenu(){
  if(MENU){ MENU.remove(); MENU=null; }
  document.querySelectorAll('.mbtn.open').forEach(b=>b.classList.remove('open'));
}

function buildMenu(which){
  const on = !!DB;
  if(which==='file') return [
    {t:'Import ULO summaries&hellip; <span style="color:var(--faint)">Ctrl+O</span>', fn:pickFiles},
    {t:'Re-import the same files', off:!(LASTFILES&&LASTFILES.length), fn:reImport},
    {sep:1},
    {t:'Periods&hellip; <span style="color:var(--faint)">manage months</span>', off:!on, fn:viewPeriods},
    {sep:1},
    {t:'Open a saved copy&hellip;', fn:()=>$('loadIn').click()},
    {t:'Save copy (with data) <span style="color:var(--faint)">Ctrl+S</span>', off:!on, fn:saveCopy},
    {sep:1},
    {t:'Build PowerPoint&hellip;', off:!on, fn:()=>go('slides')},
    {t:'Export the action register&hellip;', off:!on, fn:exportActions},
    {t:'Merge an action register&hellip;', off:!on, fn:()=>$('actIn').click()},
    {t:'Export the contact register&hellip;', off:!on, fn:exportPocs},
    {t:'Merge a contact register&hellip;', off:!on, fn:()=>$('pocIn').click()},
    {t:'Export the send log&hellip;', off:!on, fn:exportSends},
    {t:'Merge a send log&hellip;', off:!on, fn:()=>$('sendIn').click()},
    {sep:1},
    {t:'Send worklists&hellip;', off:!on, fn:pocSendAll},
    {t:'Take back a worklist&hellip;', off:!on, fn:()=>$('wlIn').click()},
    {sep:1},
    {t:'Export .xlsx', off:!on, fn:exportXlsx},
    {t:'Export CLIN lines .csv', off:!on, fn:exportCsv},
    {t:'Print / PDF', off:!on, fn:()=>window.print()},
    {sep:1},
    {t:'Clear all data', off:!on, fn:clearAll},
    {t:'About', fn:about}
  ];
  if(which==='period'){
    const out = [{lbl:'Show the position at'}];
    (DB? DB.periods : []).forEach(p=>{
      const t = CED.totals(CED.inPeriod(p.key));
      out.push({t: esc(p.label) + ' <span style="color:var(--faint)">&middot; ULO $'
                 + fM(t.ulo) + 'M &middot; ' + fN(t.n) + ' lines</span>',
                on: DB.cur===p.key, fn:()=>goPeriod(p.key)});
    });
    out.push({sep:1});
    out.push({t:'Import another month&hellip;', fn:pickFiles});
    out.push({t:'Periods&hellip;', fn:viewPeriods});
    return out;
  }
  if(which==='view'){
    const th = document.documentElement.getAttribute('data-theme')||'light';
    const out = [{lbl:'Go to'}];
    VIEWS.forEach(v=>out.push({t:v.name, on:VIEW===v.id, off:!on, fn:()=>go(v.id)}));
    out.push({sep:1},{lbl:'Filters'});
    out.push({t:'Clear all filters', off:!on||!filterCount(), fn:clearFilters});
    out.push({sep:1},{lbl:'Appearance'});
    out.push({t:'Daylight', on:th!=='dark', fn:()=>setTheme('light')});
    out.push({t:'Dark',     on:th==='dark', fn:()=>setTheme('dark')});
    return out;
  }
  return [];
}

function setTheme(t){
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.setAttribute('data-theme','light');
  try{ localStorage.setItem('cedTheme', t); }catch(e){}
}

/* ------------------------------------------------------------------ routing */
function go(v){ VIEW=v; closeModal(); paintChrome(); render(); window.scrollTo(0,0); }

function render(){
  const m = $('main');
  if(!DB){ m.innerHTML = welcome(); return; }
  let h;
  try{
    h = VIEW==='portfolio'? viewPortfolio()
      : VIEW==='risk'     ? viewRisk()
      : VIEW==='contracts'? viewContracts()
      : VIEW==='lines'    ? viewLines()
      : VIEW==='compare'  ? viewCompare()
      : VIEW==='trend'    ? viewTrend()
      : VIEW==='actions'  ? viewActions()
      : VIEW==='pocs'     ? viewPocs()
      : VIEW==='slides'   ? viewSlides()
      : VIEW==='verify'   ? viewVerify()
      : viewPortfolio();
  }catch(err){
    console.error(err);
    h = '<div class="card"><div class="hd"><h3>That view failed to render</h3></div>'
      + '<div class="bd"><div class="note r">'+esc(err&&err.message||err)+'</div>'
      + '<div class="note">The data is still loaded. Try another view, or <b>Verify</b>, '
      + 'which is the least likely to depend on anything unusual in the import.</div></div></div>';
  }
  m.innerHTML = winBanner() + h;
}

/* ------------------------------------------------------- THE WATCH WINDOW
   CED exists to monitor expired and cancelling year funding, so that is the
   lens it opens through. The lens is only honest if it says so, and says what
   it is holding back: this strip renders ABOVE EVERY VIEW, names the window in
   the owner's own words, and carries the excluded balance as a figure rather
   than as an idea. One click widens it.

   It is deliberately not a "filter" in filterCount(): filters are choices the
   reader made, and this is the tool's purpose. Counting it as a filter would
   make "no filters" read as false on a fresh import. */
function winBanner(){
  if(!DB) return '';
  const asOf = curAsOf();
  const w = CED.windowSplit(CED.all(), asOf);
  const on = F.win === 'watch', only = F.win === 'canc';
  const canc = w.by.canc, out = w.out;
  const btn = (id, txt, act) =>
    '<button class="mbtn'+(F.win===id? ' act':'')+'" data-win="'+id+'">'+txt+'</button>';

  let h = '<div class="winbar'+(on||only? '' : ' wide')+'">';
  h += '<span class="wtag">WATCH WINDOW</span>';
  h += '<span class="wsay">'+esc(CED.windowSays(asOf, CED.all()))+'</span>';
  if(canc.n){
    h += '<span class="wcanc"><b>$'+pM(canc.ulo)+'M</b> cancelling &middot; '
      +  fN(canc.n)+' line'+(canc.n===1?'':'s')+'</span>';
  }
  /* WHAT THE LENS IS HIDING, always, as a number - and measured against the
     lens ACTUALLY SET, not against the window. Under "Cancelling only" the
     expired years are hidden too, and reporting the window's own out-of-scope
     figure understated what was off the screen by the whole of exp1-4. */
  const shown  = CED.scope();
  const hidden = {n: CED.all().length - shown.length,
                  ulo: w.all.ulo - CED.totals(shown).ulo};
  h += '<span class="wout">'+(F.win
        ? '$'+pM(hidden.ulo)+'M in '+fN(hidden.n)+' line'+(hidden.n===1?'':'s')
          +' out of scope'
        : 'showing everything, in scope and out')+'</span>';
  h += '<span style="flex:1"></span>';
  /* the three states are ONE control and wrap as one - split across two lines
     they read as unrelated buttons, and the group is what tells the reader
     that a lens is a choice rather than a fact */
  h += '<span class="wbtns">' + btn('canc', 'Cancelling only')
     + btn('watch', 'Watch window') + btn('', 'Everything') + '</span>';
  h += '</div>';
  return h;
}

function welcome(){
  return '<div class="card"><div class="hd"><h3>Contract Execution Dashboard</h3>'
    + '<span class="sub">obligations, expenditures and unliquidated balance, by contract</span></div>'
    + '<div class="bd">'
    + '<div class="note b">Import one or more monthly <b>ULO Summary</b> workbooks. '
    + 'Pick them all at once - the dashboard reports across every contract you select.</div>'
    + '<p style="color:var(--ink2);max-width:70ch">The <b>contract number is read from the file name</b>, '
    + 'because it appears nowhere inside the workbook: the first word of '
    + '<span class="mono">N0001922CXXXX O&amp;M ULO Summary 8.26.26.xlsx</span> is the contract, and the '
    + 'trailing date is the as-of. Inside, the tool looks for the detail tab - the sheet naming both '
    + '<i>ULO</i> and <i>CLIN</i> - and reads its thirteen columns from '
    + '<b>Appropriation</b> through <b>Comments</b>.</p>'
    + '<p style="color:var(--ink2);max-width:70ch">Nothing is uploaded and no network call is made. '
    + 'The file you opened contains <b>no data</b>; a copy written through <b>File &rarr; Save copy</b> '
    + 'contains contract execution data and is a <b>CUI</b> artefact.</p>'
    + '<div style="margin-top:14px"><button class="mbtn go" data-act="import">Import ULO summaries</button> '
    + '<button class="mbtn pill" data-act="openSaved">Open a saved copy</button></div>'
    + '</div></div>';
}

function clearFilters(){ resetFilters(); paintChrome(); render(); }

/* Switching the period switches the WHOLE tool - every single-period view
   reads CED.all(), which is the current period. Filters are kept, because
   "show me Australia in July and then in August" is the obvious next thing a
   reader does; the sort is kept for the same reason. */
function goPeriod(k){
  if(!DB || DB.cur===k) return;
  DB.cur = k;
  closeModal();
  paintChrome(); render();
  const t = CED.totals(CED.all());
  setStat('Showing <b>' + esc(periodOf(k).label) + '</b> &middot; '
    + fN(t.n) + ' CLIN lines &middot; ULO <b>$' + fM(t.ulo) + 'M</b>'
    + (curAsOf()? ' &middot; as of <b>'+dLabel(curAsOf())+'</b>' : ''));
}

/* Give a period a month. The only way an undated import joins the timeline. */
function askMonth(key){
  const per = periodOf(key);
  if(!per) return;
  const now = new Date();
  const guess = per.key!==UNDATED? per.key
              : (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  const v = prompt('Which month is "' + per.label + '"?\n\n'
    + 'Enter it as YYYY-MM, for example 2026-09.\n'
    + 'If that month already exists the two are merged.', guess);
  if(v===null) return;
  const ym = (''+v).trim();
  if(!setPeriodMonth(key, ym)){
    setStat('&#9888; <span class="bad">"'+esc(ym)+'" is not a month.</span> Use YYYY-MM, e.g. 2026-09.');
    return;
  }
  paintChrome(); render(); viewPeriods();
  setStat('&#9989; Moved to <b>'+esc(pLabel(ym))+'</b>. '
    + fN(DB.periods.length)+' period'+(DB.periods.length===1?'':'s')+' loaded.');
}

function askDropPeriod(key){
  const per = periodOf(key);
  if(!per) return;
  const n = CED.inPeriod(key).length;
  if(!confirm('Remove "' + per.label + '" and its ' + n + ' CLIN lines?\n\n'
    + 'Nothing on disk is touched; the workbooks can be imported again.')) return;
  removePeriod(key);
  paintChrome(); render();
  if(DB) viewPeriods(); else closeModal();
  setStat('Removed <b>'+esc(per.label)+'</b>.');
}
function gotoLines(){ go('lines'); }

function clearAll(){
  if(!confirm('Clear all imported data from this tab?\n\nNothing on disk is touched. Any copy you saved is unaffected.')) return;
  DB=null; resetFilters(); SORT={}; DIRTY=false; LASTFILES=null;
  $('cuiChip').className='chip ok';
  $('cuiChip').textContent='UNCLASSIFIED — NO DATA';
  paintChrome(); render();
  setStat('Cleared. <b>File &rarr; Import ULO summaries</b> to start again.');
}

function about(){
  modal('About', '<div class="note b"><b>Contract Execution Dashboard '+VER+'</b> &middot; build '+esc(BUILD)+'</div>'
    + '<p style="color:var(--ink2);max-width:74ch">A single-file, dependency-free dashboard over the monthly '
    + 'per-contract ULO summary workbooks. It runs from a <span class="mono">file://</span> URL with no '
    + 'installs, no network and no external libraries.</p>'
    + '<div class="note"><b>Unliquidated obligation (ULO)</b> is obligations less expenditures - money placed on '
    + 'contract and not yet paid out. The tool takes the ULO figure the file carries and checks it against '
    + 'obligations minus expenditures on every line; where they disagree it reports the line rather than '
    + 'overwriting the number.</div>'
    + '<div class="note"><b>Expired</b> and <b>cancelled</b> are kept apart throughout. Expired funds are no '
    + 'longer available for new obligation but can still be liquidated; cancelled funds are gone.</div>'
    + '<div class="note a">A saved copy of this page contains contract execution data and is <b>CUI//DL ONLY//'
    + 'F-35 PARTNERS</b>. The shipped file contains none.</div>');
}

/* -------------------------------------------------------------- delegation */
document.addEventListener('click', e=>{
  const mi = e.target.closest('[data-mi]');
  if(mi){
    const fn = MENU_ACTS[+mi.dataset.mi];
    closeMenu();
    if(fn) fn();
    return;
  }
  const mb = e.target.closest('[data-menu]');
  if(mb){
    const wasOpen = mb.classList.contains('open');
    closeMenu();
    if(!wasOpen) openMenu(mb.dataset.menu, mb);
    return;
  }
  closeMenu();

  const vb = e.target.closest('[data-view]');
  if(vb && !vb.disabled){ go(vb.dataset.view); return; }

  /* the watch window. PAGE is cleared with it: a paged table showing rows
     101-350 of the whole report is showing nothing at all once the lens
     narrows to six cancelling lines. */
  const wb = e.target.closest('[data-win]');
  if(wb){ F.win = wb.dataset.win; PAGE = {}; render(); paintChrome(); return; }

  const pg = e.target.closest('[data-page]');
  if(pg){
    const p = pg.dataset.page.split('|');
    PAGE[p[0]] = +p[1] || 1e9;
    render();
    return;
  }

  const sh = e.target.closest('[data-sort]');
  if(sh){
    const p = sh.dataset.sort.split('|');
    const st = SORT[p[0]] || (SORT[p[0]]={k:p[1], dir:'desc'});
    if(st.k===p[1]) st.dir = st.dir==='asc'? 'desc':'asc';
    else { st.k=p[1]; st.dir='desc'; }
    /* re-sorting a paged table starts it at the top again, or "show all" on one
       ordering silently persists into the next */
    delete PAGE[p[0]];
    render();
    return;
  }

  const ab = e.target.closest('[data-act]');
  if(ab){
    const a = ab.dataset.act;
    if(a==='import')        pickFiles();
    else if(a==='impApply')     impApply();
    else if(a==='impAll')       impAll();
    else if(a==='impCancel')    impCancel();
    else if(a==='openSaved')$('loadIn').click();
    else if(a==='exportXlsx')exportXlsx();
    else if(a==='clearFilters') clearFilters();
    else if(a==='gotoLines')gotoLines();
    else if(a==='closeModal'){
      /* THE BACKDROP CLOSES ONLY WHEN THE BACKDROP ITSELF WAS CLICKED.

         The mask carries data-act="closeModal" so that clicking away from the
         dialog dismisses it, and a click anywhere inside the dialog bubbles up
         to that same mask. The first cut told the two apart by looking for a
         [data-stop] wrapper and exempting the close button by its CSS class -
         which meant every OTHER deliberate close control inside a modal was
         swallowed. Cancel on both forms did nothing at all, and the x worked
         only because it was named in the exemption.

         The question is not "where did the click land" but "what is carrying
         the instruction": if that is the mask, only a direct hit on the mask
         counts; a real close BUTTON closes wherever it sits. */
      if(ab.classList.contains('mask') && e.target !== ab) return;
      closeModal();
    }
    else if(a==='filterContract'){ F.contract = ab.dataset.v; go('lines'); }
    else if(a==='periods')    viewPeriods();
    else if(a==='setMonth')   askMonth(ab.dataset.v);
    else if(a==='dropPeriod') askDropPeriod(ab.dataset.v);
    else if(a==='buildPptx')  buildPptx();
    else if(a==='slideAll')   slideAll(true);
    else if(a==='slideNone')  slideAll(false);
    else if(a==='slideReset') slideReset();
    else if(a==='actNew')     actNewFor('portfolio','');
    else if(a==='pocNew')     pocNewFor({m:{
      /* a window already opened against a line or a contract knows what it is
         about - it must not ask for the contract number back */
      contract: ab.dataset.contract || '', clin: ab.dataset.clin || '',
      acrn:     ab.dataset.acrn     || '', part: ab.dataset.part || ''}});
    else if(a==='pocApply')   pocApply();
    else if(a==='pocDelete')  pocDelete(ab.dataset.v);
    else if(a==='pocWorklist')pocWorklist(ab.dataset.v, ab.dataset.role);
    else if(a==='pocSendAll') pocSendAll();
    else if(a==='wlPick')     wlPick(ab.dataset.v);
    else if(a==='wlBuild')    wlBuild();
    else if(a==='wlApply')    wlApply();
    else if(a==='actApply')   actApply();
    else if(a==='actDelete')  actDelete(ab.dataset.v);
    else if(a==='actAdd')     actNewFor(ab.dataset.scope||'line', ab.dataset.v||'');
    else if(a==='clearActionFilters'){
      AQ = {q:'', status:'', disp:'', owner:'', overdue:false};
      paintChrome(); render();
    }
    else if(a==='gotoContracts') go('contracts');
    else if(a==='clearContractFilters'){
      CQ = {q:'', risk:''};
      F.appn=''; F.part=''; F.fund='';
      paintChrome(); render();
    }
    return;
  }

  const sr = e.target.closest('[data-slide]');
  if(sr){ slideToggle(sr.dataset.slide); return; }

  const at = e.target.closest('[data-aq-toggle]');
  if(at){ AQ[at.dataset.aqToggle] = !AQ[at.dataset.aqToggle]; render(); return; }

  const pq = e.target.closest('[data-pq]');
  if(pq){ PQ[pq.dataset.pq] = pq.dataset.v; render(); return; }

  /* NOT [data-wl] - the initials box on the "take back a worklist" review
     carries data-wl="who", and a delegated handler that broad turned a click
     into that field into a recipient toggle, wiping the review and opening
     the send dialog on top of it. An attribute used as an event selector has
     to be unique to the thing it selects. */
  const wr = e.target.closest('[data-wlpick]');
  if(wr){ wlToggle(wr.dataset.wlpick); return; }

  const pr = e.target.closest('[data-poc]');
  if(pr){ pocEdit(pr.dataset.poc); return; }

  const ar = e.target.closest('[data-action]');
  if(ar){ actEdit(ar.dataset.action); return; }

  const cr = e.target.closest('[data-contract]');
  if(cr){ openContract(cr.dataset.contract); return; }

  const lr = e.target.closest('[data-line]');
  if(lr){ openLine(lr.dataset.line); return; }
});

document.addEventListener('change', e=>{
  const f = e.target.closest('[data-filter]');
  if(f){ F[f.dataset.filter] = f.value; paintChrome(); render(); return; }
  const c = e.target.closest('[data-cmp]');
  if(c){ CMP[c.dataset.cmp] = c.value; render(); return; }
  const t = e.target.closest('[data-tpl]');
  if(t){ setTpl(t.value); return; }
  const mk = e.target.closest('[data-mark]');
  if(mk){ setMark(mk.dataset.mark, mk.value); return; }
  const cq = e.target.closest('[data-cq]');
  if(cq){ CQ[cq.dataset.cq] = cq.value; render(); return; }
  const aq = e.target.closest('[data-aq]');
  if(aq){ AQ[aq.dataset.aq] = aq.value; render(); }
  /* the as-of on one row of the import dialog */
  const im = e.target.closest('[data-imp]');
  if(im){ impSet(+im.dataset.imp, im.value); return; }
});

/* The search box re-renders on a short debounce, and restores focus and the
   caret afterwards - re-rendering the table under a typing user otherwise
   drops every second keystroke. */
let qT = null;
document.addEventListener('input', e=>{
  const id = e.target.id;
  if(id !== 'qBox' && id !== 'cqBox' && id !== 'aqBox') return;
  const v = e.target.value, pos = e.target.selectionStart;
  clearTimeout(qT);
  qT = setTimeout(()=>{
    if(id==='qBox') F.q = v; else if(id==='cqBox') CQ.q = v; else AQ.q = v;
    paintChrome(); render();
    const b = $(id);
    if(b){ b.focus(); try{ b.setSelectionRange(pos,pos); }catch(_){} }
  }, 180);
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeMenu(); closeModal(); return; }
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && !e.altKey){
    const k = e.key.toLowerCase();
    if(k==='o'){ e.preventDefault(); pickFiles(); }
    else if(k==='s'){ e.preventDefault(); saveCopy(); }
  }
});

window.addEventListener('beforeunload', e=>{
  if(DB && DIRTY){ e.preventDefault(); e.returnValue=''; }
});

$('fileIn').addEventListener('change', function(){ onFiles(this); });
$('loadIn').addEventListener('change', function(){ loadCopy(this); });
$('actIn').addEventListener('change', function(){ importActions(this); });
$('pocIn').addEventListener('change', function(){ importPocs(this); });
$('wlIn').addEventListener('change', function(){ takeWorklist(this); });
$('sendIn').addEventListener('change', function(){ importSends(this); });

/* --------------------------------------------------------------------- boot */
(function boot(){
  let payload = null;
  try{
    const raw = ($('pubState')||{}).textContent || 'null';
    payload = JSON.parse(raw);
  }catch(e){ payload = null; }

  if(payload && payload.lines && payload.lines.length){
    adoptDb(payload);
    setStat('&#9989; Opened with <b>'+fN(DB.lines.length)+'</b> CLIN lines embedded in this file'
      + ' &middot; ' + fN(DB.periods.length) + ' period' + (DB.periods.length===1?'':'s')
      + ' &middot; showing <b>'+esc(curPeriod().label)+'</b>'
      + '. <b>This file is CUI.</b>');
  }else{
    paintChrome(); render();
  }
})();
</script>
</body>
