         + 'to ' + (asOf? dLabel(asOf) : 'the period as-of')
         + '. Partner funds carry no expiration date and are in the total but in no year.'
  })];
}

/* ============================================================================
   WHAT CANCELS THIS YEAR — the slide the tool exists to produce.

   Everything else in the deck is context for this one. The owner's job is the
   expired window, and the sharp end of it is the fifth and final expired year:
   money still on contract, still owed against, and gone on 30 September
   whether or not anyone acted.

   IT IS NOT LENSED, IT IS THE LENS. This slide builds from the whole period
   and does its own split, so it reads the same whichever way the window is
   set — a briefing about what cancels should not change because someone
   clicked a button before exporting.

   A SNAPSHOT, so it works on a first import.
   ============================================================================ */
function cancModel(){
  if(!DB) return null;
  /* scopeWide, not scope: the split below IS the window, and applying the
     window first would make the out-of-scope columns read zero by
     construction. The reader's other filters still apply. */
  const ls = CED.scopeWide();
  if(!ls.length) return null;
  const asOf = curAsOf();
  const w = CED.windowSplit(ls, asOf);
  /* by contract, largest cancelling balance first — the unit a conversation
     actually happens in */
  const byK = {};
  w.by.canc.lines.forEach(L=>{
    const k = L.piin || '(no contract)';
    (byK[k] = byK[k] || {piin:k, ktr:L.ktr||k, lines:[]}).lines.push(L);
  });
  const rows = Object.keys(byK).map(k=>{
    const g = byK[k];
    const tags = {};
    g.lines.forEach(L=>{ tags[((L.appn||'(none)')+' '+(L.fy||'')).trim()] = 1; });
    return Object.assign({}, g, CED.totals(g.lines),
                         {appns: Object.keys(tags).sort()});
  }).sort((a,b)=>b.ulo - a.ulo);
  return {w:w, rows:rows, asOf:asOf};
}

function slCancelling(){
  const m = cancModel();
  if(!m) return [];
  const w = m.w, rows = m.rows, asOf = m.asOf, per = curPeriod();
  const canc = w.by.canc, exp = w.by.exp;
  /* days left in the fiscal year — the whole point of the urgency */
  const fyEnd = w.fy? (w.fy + '-09-30') : '';
  const left  = (asOf && fyEnd)? CED.daysBetween(asOf, fyEnd) : null;

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'CANCELS 30 SEP', v:'$'+pM(canc.ulo)+'M',
     n:fN(canc.n)+' line'+(canc.n===1?'':'s'),
     c: Math.abs(canc.ulo)>5000? PC.RED : PC.GREEN},
    {k:'DAYS LEFT', v: (left===null? '–' : fN(left)),
     n: (left===null? 'no as-of date' : 'to 30 Sep FY'+(w.fy? String(w.fy).slice(-2):'')),
     c: (left!==null && left<=60)? PC.RED : PC.AMBER},
    {k:'EXPIRED, WATCHING', v:'$'+pM(exp.ulo)+'M',
     n:'years 1-4 · '+fN(exp.n)+' lines', c:PC.AMBER},
    {k:'IN THE WINDOW', v:'$'+pM(w.inWin.ulo)+'M',
     n: Math.abs(w.all.ulo)>5000
        ? ((w.inWin.ulo / w.all.ulo)*100).toFixed(0)+'% of the report' : 'of the report',
     c:PC.NAVY},
    {k:'OUT OF SCOPE', v:'$'+pM(w.out.ulo)+'M',
     n:'available, cancelled, FMS', c:PC.DIM}
  ]);

  const RH = 0.26;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- the takeaway ---------------------------------------------------- */
  const say = Math.abs(canc.ulo) > 5000
    ? '$' + pM(canc.ulo) + 'M on ' + fN(canc.n) + ' line' + (canc.n===1?'':'s')
      + ' across ' + fN(rows.length) + ' contract' + (rows.length===1?'':'s')
      + ' cancels on 30 September'
      + (left!==null? ' — ' + fN(left) + ' days from the as-of.' : '.')
    : 'Nothing on this report is in its final expired year: no balance cancels on 30 September.';
  const sayY = GRID.visY + 0.82 + 0.14;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1,
                               c: Math.abs(canc.ulo)>5000? PC.RED : PC.NAVY})), 't');

  /* ---- where it sits --------------------------------------------------- */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(2, Math.floor((6.82 - tblY)/RH) - 2);
  const cap = capRows(rows, room), overCap = cap.over, show = cap.show;
  body += secLabel(44, GRID.x, lblY, GRID.w,
    'CANCELLING BALANCE BY CONTRACT'
    + (overCap? '  — the largest ' + show.length + ' of ' + fN(rows.length) : ''));

  const ah = [THL('Contract'), THL('Appropriation / FY'), TH('Lines'),
              TH('Obligated $M'), TH('Expended $M'), TH('Cancelling $M'), TH('% exp')];
  const arows = show.map(r=>[
    {t:fitText(r.ktr, 2.10, 850), align:'l', sz:850, b:1},
    {t:fitText(r.appns.join(', '), 2.30, 850), align:'l', sz:850, c:PC.DIM},
    {t:fN(r.n), align:'r', sz:850},
    {t:pM(r.obl), align:'r', sz:850},
    {t:pM(r.exp), align:'r', sz:850},
    {t:pM(r.ulo), align:'r', sz:850, b:1, c:PC.RED},
    {t: r.pctExp===null? '–' : (r.pctExp*100).toFixed(0)+'%', align:'r', sz:850, c:PC.DIM}
  ]);
  if(overCap){
    const rest = cap.rest;
    const s = f => rest.reduce((a,r)=>a + f(r), 0);
    arows.push([
      {t:'+ '+fN(rest.length)+' more contracts', align:'l', sz:850, i:1, c:PC.DIM},
      {t:'', align:'l', sz:850},
      {t:fN(s(r=>r.n)), align:'r', sz:850, i:1, c:PC.DIM},
      {t:pM(s(r=>r.obl)), align:'r', sz:850, i:1, c:PC.DIM},
      {t:pM(s(r=>r.exp)), align:'r', sz:850, i:1, c:PC.DIM},
      {t:pM(s(r=>r.ulo)), align:'r', sz:850, i:1, c:PC.DIM},
      {t:'', align:'r', sz:850}
    ]);
  }
  const tot = CED.totals(canc.lines);
  arows.push([
    TT('ALL CANCELLING', {align:'l', sz:850}),
    TT('', {align:'l', sz:850}),
    TT(fN(tot.n), {align:'r', sz:850}),
    TT(pM(tot.obl), {align:'r', sz:850}),
    TT(pM(tot.exp), {align:'r', sz:850}),
    TT(pM(tot.ulo), {align:'r', sz:850}),
    TT(tot.pctExp===null? '–' : (tot.pctExp*100).toFixed(0)+'%', {align:'r', sz:850})
  ]);
  const aw = autoWidths(ah, arows, GRID.w);
  body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});

  return [stdSlide({
    /* THIS SLIDE STATES ITS OWN SCOPE, in the takeaway and in the table, so
       the generic lens clause would only repeat it — and would be wrong,
       since it builds wide and splits for itself. */
    noLens: true,
    title: 'What cancels 30 September — ' + (per? per.label : ''),
    body:  body,
    foot:  'THE FIFTH AND FINAL EXPIRED YEAR. ' + CED.windowSays(asOf, CED.scopeWide())
         + ' The cohort is derived from the life table rather than listed, so it does not '
         + 'need restating each October: it is every account whose period of availability '
         + 'ended FY' + (w.fy? (w.fy - 5) : '') + '. Expired money may still be disbursed or '
         + 'deobligated; after 30 September it can be neither, and a balance left here is an '
         + 'error to clear rather than a bill to pay. Figures cover the whole report: this '
         + 'slide does its own split and is not affected by the window setting on screen.'
  })];
}

/* ============================================================================
   BALANCE BY PARTICIPANT

   Who the money belongs to, in the owner's own briefing order, and what state
   it is in. A SNAPSHOT, so it works on a first import.

   THE TABLE GETS THE HEIGHT. There are seventeen participants on the real
   files and this slide exists to list them; a chart of seventeen columns is a
   thicket, and a table cut to five rows is a slide about the Air Force.
   ============================================================================ */
function partModel(){
  if(!DB) return null;
  const ls = CED.scope();
  if(!ls.length) return null;
  const rows = CED.byParticipantState(ls, curAsOf());
  return rows.length? rows : null;
}

function slParticipant(){
  const rows = partModel();
  if(!rows) return [];
  const asOf = curAsOf(), per = curPeriod();
  const all  = CED.totals(CED.scope());
  const sum  = f => rows.reduce((s,r)=>s + f(r), 0);

  /* the order itself carries the split: everything above the FMS rank is a
     service or a named partner nation */
  const SVC  = 6;                      /* PARTS[0..5] are the US services  */
  const FMS  = CED.FMS_RANK;           /* and everything at or past this   */
  const band = rs => rs.reduce((s,r)=>s + r.ulo, 0);
  const svc  = rows.filter(r=>r.rank < SVC);
  const ptnr = rows.filter(r=>r.rank >= SVC && r.rank < FMS);
  const fms  = rows.filter(r=>r.rank >= FMS);
  const atRisk = sum(r=>r.expired.ulo + r.cancelled.ulo);

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'UNLIQUIDATED', v:'$'+pM(all.ulo)+'M',
     n:fN(rows.length)+' participants', c:PC.NAVY},
    {k:'US SERVICES', v:'$'+pM(band(svc))+'M',
     n:fN(svc.length)+' of them', c:PC.BLUE},
    {k:'PARTNERS', v:'$'+pM(band(ptnr))+'M',
     n:fN(ptnr.length)+' nations', c:PC.BLUE},
    {k:'FMS', v:'$'+pM(band(fms))+'M',
     n:fN(fms.length)+' cases', c:PC.DIM},
    {k:'AT RISK', v:'$'+pM(atRisk)+'M',
     n:'expired or cancelled', c: Math.abs(atRisk)>5000? PC.AMBER : PC.GREEN}
  ]);

  const RH = 0.26;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- the takeaway goes ABOVE the table, which needs the room --------- */
  const top = CED.sortBy(rows, r=>Math.abs(r.ulo), 'desc')[0];
  const say = top
    ? top.label + ' holds the largest balance at $' + pM(top.ulo) + 'M, '
      + (Math.abs(all.ulo) > 5000
          ? ((top.ulo / all.ulo) * 100).toFixed(0) + '% of the report' : 'of the report')
      + (Math.abs(atRisk) > 5000
          ? '; $' + pM(atRisk) + 'M across all participants is expired or cancelled.' : '.')
    : '';
  const sayY = GRID.visY + 0.82 + 0.14;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(2, Math.floor((6.82 - tblY)/RH) - 2);
  const overCap = rows.length > room;
  /* THE ORDER IS THE OWNER'S, so what gets cut is always the FMS tail rather
     than something in the middle - and it is never cut silently. */
  const cap = capRows(rows, room), show = cap.show;

  body += secLabel(44, GRID.x, lblY, GRID.w,
    'BY PARTICIPANT, IN BRIEFING ORDER'
    + (overCap? '  — the first ' + show.length + ' of ' + fN(rows.length)
                + '; the tail is the FMS cases' : ''));

  const ah = [THL('Participant'), TH('Lines'), TH('Obligated $M'), TH('Unliquidated $M'),
              TH('Available'), TH('Expired'), TH('Cancelled'), TH('No dates')];
  const cell = (v, c) => ({t: Math.abs(v)<5000? '–' : pM(v), align:'r', sz:850,
                           c: Math.abs(v)<5000? PC.DIM : (c || PC.INK)});
  const arows = show.map(r=>[
    {t:fitText(r.label, 2.05, 850), align:'l', sz:850,
     /* a US service is the reader's own money and leads the list; the rest
        are shown in the same weight so nothing is implied about them */
     b: r.rank < SVC},
    {t:fN(r.n), align:'r', sz:850},
    {t:pM(r.obl), align:'r', sz:850},
    {t:pM(r.ulo), align:'r', sz:850, b:1},
    cell(r.available.ulo, PC.BLUE),
    cell(r.expired.ulo,   PC.AMBER),
    cell(r.cancelled.ulo, PC.RED),
    cell(r.nodate.ulo,    PC.DIM)
  ]);
  if(overCap){
    const rest = cap.rest;
    const s = f => rest.reduce((a,r)=>a + f(r), 0);
    /* THE REMAINDER TAKES A ROW OF ITS OWN. It once overwrote the last visible
       row, and that participant vanished from the slide AND from the total
       that replaced it. */
    arows.push([
      {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
      {t:fN(s(r=>r.n)), align:'r', sz:850, i:1, c:PC.DIM},
      {t:pM(s(r=>r.obl)), align:'r', sz:850, i:1, c:PC.DIM},
      {t:pM(s(r=>r.ulo)), align:'r', sz:850, i:1, c:PC.DIM},
      cell(s(r=>r.available.ulo), PC.DIM), cell(s(r=>r.expired.ulo), PC.DIM),
      cell(s(r=>r.cancelled.ulo), PC.DIM), cell(s(r=>r.nodate.ulo), PC.DIM)
    ]);
  }
  arows.push([
    TT('ALL', {align:'l', sz:850}),
    TT(fN(sum(r=>r.n)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.obl)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.available.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.expired.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.cancelled.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.nodate.ulo)), {align:'r', sz:850})
  ]);
  const aw = autoWidths(ah, arows, GRID.w);
  body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});

  return [stdSlide({
    /* capTitle budgets 42 characters before the title reaches the roundel,
       and the longer form lost the period to an ellipsis - 'Aug…'. The
       month is the one part of a title that must survive. */
    title: 'Balance by participant — ' + (per? per.label : ''),
    body:  body,
    foot:  'The order is fixed, and it is the order the owner briefs in: Air Force, ANG, '
         + 'AFRC, STOVL, USMC-CV, '
         + 'USN, then the partner nations, then every FMS case alphabetically. A line has '
         + 'exactly one participant and exactly one state, so the four state columns sum '
         + 'to each row and the rows sum to the report. Partner and FMS funds carry no '
         + 'expiration or cancel date at all, which is why their balance sits under NO '
         + 'DATES rather than under available — they do not cancel on this schedule.'
  })];
}

/* ============================================================================
   THE TEN LARGEST UNLIQUIDATED BALANCES

   662 CLIN lines is not a thing anyone can read. This is the one slide that
   answers "where is it, actually" - and the finding is usually the
   concentration rather than any single line: if ten lines carry a third of the
   balance, ten conversations move a third of the problem.

   A SNAPSHOT, so it works on a first import.
   ============================================================================ */
function topModel(){
  if(!DB) return null;
  const ls = CED.scope();
  if(!ls.length) return null;
  const t = CED.topByUlo(ls, 10);
  return t.rows.length? t : null;
}

function slTopLines(){
  const t = topModel();
  if(!t) return [];
  const asOf = curAsOf(), per = curPeriod();
  const share = v => Math.abs(t.all.ulo) > 5000
    ? ((v / t.all.ulo) * 100).toFixed(1) + '%' : '–';
  const n50 = t.need[0.5], n80 = t.need[0.8];

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'UNLIQUIDATED', v:'$'+pM(t.all.ulo)+'M',
     n:fN(t.all.n)+' CLIN lines', c:PC.NAVY},
    {k:'THE TOP TEN', v:'$'+pM(t.top.ulo)+'M',
     n:share(t.top.ulo)+' of the balance', c:PC.BLUE},
    {k:'LARGEST', v:'$'+pM(t.rows[0].ulo)+'M',
     n:'one line', c:PC.BLUE},
    {k:'HALF SITS ON', v: n50===null? '–' : String(n50),
     n: n50===null? 'no positive balance' : 'lines of '+fN(t.all.n),
     c: PC.AMBER},
    {k:'FOUR FIFTHS ON', v: n80===null? '–' : String(n80),
     n: n80===null? '' : 'lines of '+fN(t.all.n), c: PC.AMBER}
  ]);

  const RH = 0.26;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- the takeaway is the concentration, not the biggest line --------- */
  const say = (n50 !== null)
    ? 'Half the unliquidated balance sits on ' + n50 + ' of ' + fN(t.all.n)
      + ' lines; the ten largest carry $' + pM(t.top.ulo) + 'M, '
      + share(t.top.ulo) + ' of the total.'
    : 'There is no positive balance to concentrate: the report totals $'
      + pM(t.all.ulo) + 'M.';
  const sayY = GRID.visY + 0.82 + 0.14;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  body += secLabel(44, GRID.x, lblY, GRID.w,
    'THE TEN LARGEST, BY UNLIQUIDATED BALANCE');

  const ah = [TH('#'), THL('Contract'), THL('CLIN / ACRN'), THL('CLIN title'),
              THL('Participant'), THL('Appn / FY'), THL('State'), TH('$M'), TH('Share')];
  const arows = t.rows.map(r=>{
    const L = r.line, p = CED.phaseOf(L, asOf);
    const st = p.id==='cancelled'? 'CANCELLED'
             : p.id==='expired'  ? ('expired ' + (p.year||'?') + ' of 5')
             : p.id==='active'   ? ('available'
                 + (CED.cancelFY(L)? ', cancels FY'+CED.cancelFY(L) : ''))
             : 'no dates';
    return [
      {t:String(r.rank), align:'r', sz:850, c:PC.DIM},
      {t:fitText(L.ktr, 1.30, 850), align:'l', sz:850},
      {t:L.clin+' / '+L.acrn, align:'l', sz:850},
      {t:fitText(L.title, 2.00, 850), align:'l', sz:850},
      {t:fitText(L.part, 1.30, 850), align:'l', sz:850},
      {t:fitText(((L.appn||'–') + ' ' + (L.fy||'')).trim(), 1.00, 850),
       align:'l', sz:850, c:PC.DIM},
      {t:st, align:'l', sz:850,
       c: p.id==='cancelled'? PC.RED : p.id==='expired'? PC.AMBER
          : p.id==='active'? PC.BLUE : PC.DIM},
      {t:pM(L.ulo), align:'r', sz:850, b:1},
      {t:share(L.ulo), align:'r', sz:850, c:PC.DIM}
    ];
  });
  /* THE REST TAKES A ROW OF ITS OWN, so the column is the whole report and
     not just the part that fitted. */
  if(t.rest.n){
    arows.push([
      {t:'', align:'r', sz:850},
      {t:'+ '+fN(t.rest.n)+' more lines', align:'l', sz:850, i:1, c:PC.DIM},
      {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
      {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
      {t:pM(t.rest.ulo), align:'r', sz:850, i:1, c:PC.DIM},
      {t:share(t.rest.ulo), align:'r', sz:850, i:1, c:PC.DIM}
    ]);
  }
  arows.push([
    TT('', {align:'r', sz:850}),
    TT('ALL', {align:'l', sz:850}),
    TT('', {align:'l', sz:850}), TT('', {align:'l', sz:850}),
    TT('', {align:'l', sz:850}), TT('', {align:'l', sz:850}),
    TT(fN(t.all.n)+' lines', {align:'l', sz:850}),
    TT(pM(t.all.ulo), {align:'r', sz:850}),
    TT('100.0%', {align:'r', sz:850})
  ]);
  const aw = autoWidths(ah, arows, GRID.w);
  body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});

  return [stdSlide({
    title: 'Ten largest balances — ' + (per? per.label : ''),
    body:  body,
    foot:  'Ranked by unliquidated balance, largest first. HALF SITS ON is the fewest '
         + 'lines whose balances together reach half the total, which is the figure worth '
         + 'briefing: it says how many conversations move the problem. State is as at '
         + (asOf? dLabel(asOf) : 'the period as-of')
         + (t.negatives
             ? '. ' + fN(t.negatives) + ' line' + (t.negatives===1? ' carries':'s carry')
               + ' a NEGATIVE balance and therefore appear at the bottom of this ranking, '
               + 'not the top; they are listed in Verify.'
             : '. No line carries a negative balance.')
  })];
}

/* ============================================================================
   BALANCE BY APPROPRIATION

   The Verify card audits the VALUES in this field; this is the money in them,
   and the thing that makes it a slide rather than a listing is that
   appropriations do not behave alike: O&M is one-year money and the
   procurement accounts are three-year. The same dollar of balance is a
   different problem depending on which it sits in.

   A SNAPSHOT, so it works on a first import.
   ============================================================================ */
function appnModel(){
  if(!DB) return null;
  const ls = CED.scope();
  if(!ls.length) return null;
  const rows = CED.byAppnState(ls, curAsOf());
  return rows.length? rows : null;
}

function slAppn(){
  const rows = appnModel();
  if(!rows) return [];
  const asOf = curAsOf(), per = curPeriod();
  const all  = CED.totals(CED.scope());
  const sum  = f => rows.reduce((s,r)=>s + f(r), 0);
  const band = rs => rs.reduce((s,r)=>s + r.ulo, 0);

  const oneYr  = rows.filter(r=>r.life && r.life.yrs === 1);
  const multi  = rows.filter(r=>r.life && r.life.yrs > 1);
  const noLife = rows.filter(r=>!r.life && !r.blank);
  const blank  = rows.filter(r=>r.blank);
  const atRisk = sum(r=>r.expired.ulo + r.cancelled.ulo);

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'UNLIQUIDATED', v:'$'+pM(all.ulo)+'M',
     n:fN(rows.length)+' appropriations', c:PC.NAVY},
    {k:'ONE-YEAR MONEY', v:'$'+pM(band(oneYr))+'M',
     n:'O&M — the fastest to expire', c: Math.abs(band(oneYr))>5000? PC.AMBER : PC.DIM},
    {k:'THREE-YEAR', v:'$'+pM(band(multi))+'M',
     n:'the procurement accounts', c:PC.BLUE},
    {k:'NO LIFE DERIVED', v:'$'+pM(band(noLife))+'M',
     n:fN(noLife.length)+' compound or unknown',
     c: Math.abs(band(noLife))>5000? PC.RED : PC.GREEN},
    {k:'NO APPROPRIATION', v:'$'+pM(band(blank))+'M',
     n:'partner and FMS funds', c:PC.DIM}
  ]);

  const RH = 0.26;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- the shape of it -------------------------------------------------- */
  const chTop = GRID.visY + 0.82 + 0.22;
  /* 1.70" left room for three of five appropriations - and there are only
     ever a handful, so cutting any of them is a waste of a slide. 1.55" buys
     the two rows that make the table complete, and the chart is five columns
     wide either way. */
  const chH   = 1.55;
  body += secLabel(40, GRID.x, chTop - 0.22, GRID.w,
    'UNLIQUIDATED BALANCE BY APPROPRIATION');
  body += pptCols(50, GRID.x, chTop, GRID.w, chH, rows.map(r=>({
    label: r.blank? '(none)' : fitText(r.value, 1.10, 800),
    sub:   r.life? (r.life.yrs + '-year') : (r.blank? 'partner' : 'no life'),
    v:     r.ulo,
    /* one-year money is the near problem; three-year is the far one */
    tone:  r.blank? PC.DIM : !r.life? PC.RED
             : r.life.yrs === 1? PC.AMBER : PC.BLUE
  })), '');
  const chBot = chTop + chH;

  /* ---- the takeaway ----------------------------------------------------- */
  const big = rows.filter(r=>!r.blank)[0] || null;
  const say = big
    ? big.value + ' carries $' + pM(big.ulo) + 'M'
      + (big.life? ' of ' + big.life.yrs + '-year money' : '')
      + (Math.abs(all.ulo) > 5000
          ? ', ' + ((big.ulo / all.ulo) * 100).toFixed(0) + '% of the report' : '')
      + (Math.abs(atRisk) > 5000
          ? '; $' + pM(atRisk) + 'M across all appropriations is expired or cancelled.'
          : '.')
    : 'No line on this report carries an appropriation.';
  const sayY = chBot + GAP;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  /* ---- the detail ------------------------------------------------------- */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(2, Math.floor((6.82 - tblY)/RH) - 2);
  const cap = capRows(rows, room), overCap = cap.over, show = cap.show;
  body += secLabel(44, GRID.x, lblY, GRID.w,
    'BY APPROPRIATION, AS THE SOURCE WRITES IT'
    + (overCap? '  — the largest ' + show.length + ' of ' + fN(rows.length) : ''));

  const ah = [THL('Appropriation'), THL('Life'), TH('Lines'), TH('Unliquidated $M'),
              TH('Available'), TH('Expired'), TH('Cancelled'), TH('No dates')];
  const cell = (v, c) => ({t: Math.abs(v)<5000? '–' : pM(v), align:'r', sz:850,
                           c: Math.abs(v)<5000? PC.DIM : (c || PC.INK)});
  const arows = show.map(r=>[
    {t: r.blank? '(none)' : fitText(r.value, 1.85, 850), align:'l', sz:850,
     c: r.blank? PC.DIM : PC.INK, b: !r.blank},
    {t: r.blank? 'partner — does not cancel'
       : r.life? (r.life.name + ' · ' + r.life.yrs + '-year')
       : (r.compound? 'compound — none derived' : 'not in the life table'),
     align:'l', sz:850,
     c: r.blank? PC.DIM : r.life? PC.INK : PC.RED},
    {t:fN(r.n), align:'r', sz:850},
    {t:pM(r.ulo), align:'r', sz:850, b:1},
    cell(r.available.ulo, PC.BLUE),
    cell(r.expired.ulo,   PC.AMBER),
    cell(r.cancelled.ulo, PC.RED),
    cell(r.nodate.ulo,    PC.DIM)
  ]);
  if(overCap){
    const rest = cap.rest;
    const s = f => rest.reduce((a,r)=>a + f(r), 0);
    arows.push([
      {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
      {t:'', align:'l', sz:850},
      {t:fN(s(r=>r.n)), align:'r', sz:850, i:1, c:PC.DIM},
      {t:pM(s(r=>r.ulo)), align:'r', sz:850, i:1, c:PC.DIM},
      cell(s(r=>r.available.ulo), PC.DIM), cell(s(r=>r.expired.ulo), PC.DIM),
      cell(s(r=>r.cancelled.ulo), PC.DIM), cell(s(r=>r.nodate.ulo), PC.DIM)
    ]);
  }
  arows.push([
    TT('ALL', {align:'l', sz:850}),
    TT('', {align:'l', sz:850}),
    TT(fN(sum(r=>r.n)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.available.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.expired.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.cancelled.ulo)), {align:'r', sz:850}),
    TT(pM(sum(r=>r.nodate.ulo)), {align:'r', sz:850})
  ]);
  const aw = autoWidths(ah, arows, GRID.w);
  body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});

  return [stdSlide({
    title: 'Balance by appropriation — ' + (per? per.label : ''),
    body:  body,
    foot:  'APPROPRIATIONS DO NOT BEHAVE ALIKE: O&M is one-year money and the procurement '
         + 'accounts are three-year, so the same dollar of balance is a different problem '
         + 'depending which it sits in. Values are shown exactly as the workbook writes '
         + 'them. A COMPOUND value such as PROC FF/O&M matches a pattern in the life table '
         + 'and is still reported as having NO life derived, because that is what the tool '
         + 'concludes — it will not split one balance across two rules. Partner and FMS '
         + 'funds carry no appropriation and no dates; they do not cancel on this schedule.'
  })];
}

/* How long a worklist may sit unanswered before it is chased. Stated once,
   used by the model, the slide and the footnote, so the slide can never
   describe a threshold the table was not sorted on. */
const WL_DUE = 14;

/* ============================================================================
   WORKLIST STATUS BY CONTACT

   The chase slide. The actions slide says how much of the money has an answer;
   this one says who was ASKED and who has not come back - which is the thing
   that actually moves between one month-end and the next.

   It is a SNAPSHOT, so it works on a first import. It is worth building with an
   EMPTY send log, because "nobody has been asked about any of it" is the
   finding, not a reason to leave the slide out.

   NEVER ASKED IS A ROW, NOT AN ABSENCE. Every contact who owns a line appears
   whether or not anything was ever sent to them; a status report that only
   lists the people you happened to write to cannot tell you who you forgot.
   ============================================================================ */
/* ONE computation path for the picker, the blurb and the slide. The catalogue
   has to know whether this slide can say anything BEFORE offering it - a slide
   that is offered and then builds nothing is a lie in the picker, and the deck
   silently comes out one shorter than the reader ticked. */
function wlRows(){
  if(!DB) return [];
  const ls = CED.scope();
  if(!ls.length) return [];
  return CED.wlStatus(pocs(), ls, actions(), sends(), DB.cur, curAsOf(), WL_DUE);
}
function slWorklist(){
  const rows = wlRows();
  if(!rows.length) return [];
  const ls = CED.scope();
  const asOf = curAsOf(), per = curPeriod();

  const of = id => rows.filter(r=>r.state===id);
  const late = of('overdue'), wait = of('waiting'), never = of('never');
  const back = of('returned'), resent = of('stale');
  const owed = late.concat(wait, resent, never);      /* still to answer */

  /* EVERY AGGREGATE ON THIS SLIDE IS A UNION, NEVER A SUM.

     Contacts overlap by construction: the KO and the contractor on one
     contract hold exactly the same lines, and a portfolio-wide PM holds
     everybody's. Adding their balances together read "Never asked, 2
     contacts, $57.165M, 716 lines" for two people sitting on the same 358
     lines. Only the per-contact table below is per contact, and it says so. */
  const linesOf = (()=>{
    const m = new Map();                       /* one pocLines pass per contact */
    return r => {
      const k = r.role + '|' + r.name;
      if(!m.has(k)) m.set(k, CED.pocLines(pocs(), ls, r.name, r.role));
      return m.get(k);
    };
  })();
  function union(rs){
    const seen = new Set(), out = [];
    (rs||[]).forEach(r=>linesOf(r).forEach(L=>{
      if(seen.has(L.ix)) return;
      seen.add(L.ix); out.push(L);
    }));
    const cov = CED.coverage(out, actions(), asOf);
    return {n: out.length, uncovered: cov.uncovered.ulo};
  }
  const owedU  = union(owed);
  const oldest = late.concat(wait).reduce((m,r)=>
                    (r.age!==null && (m===null || r.age>m))? r.age : m, null);

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'CONTACTS', v:String(rows.length),
     n:'own a balance this period', c:PC.NAVY},
    {k:'ASKED', v:String(rows.length - never.length) + ' of ' + rows.length,
     n: never.length? fN(never.length)+' never asked' : 'everyone has been sent one',
     c: never.length? PC.RED : PC.GREEN},
    {k:'RETURNED', v:String(back.length),
     n:'have answered in full', c: back.length? PC.GREEN : PC.DIM},
    {k:'OUTSTANDING', v:'$'+pM(owedU.uncovered)+'M',
     n:fN(owed.length)+' yet to answer', c: owed.length? PC.AMBER : PC.GREEN},
    {k:'OVERDUE', v:String(late.length),
     n: oldest===null? 'nothing waiting'
        : 'oldest ' + oldest + ' day' + (oldest===1?'':'s'),
     c: late.length? PC.RED : PC.GREEN}
  ]);

  const RH   = 0.26;
  const topY = GRID.visY + 0.82 + 0.14;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;
  const colW = (GRID.w - 0.40) / 2;
  const rx   = GRID.x + colW + 0.40;

  /* ---- where the chase stands ------------------------------------------ */
  body += secLabel(40, GRID.x, topY, colW, 'WHERE THE CHASE STANDS');
  const sh = [THL('State'), TH('Contacts'), TH('$M owed'), TH('Lines')];
  const srows = CED.WL_STATES.map(st=>({st:st, g:of(st.id)}))
    .filter(x=>x.g.length).map(x=>{
      const u = union(x.g);
      return [
        {t:x.st.name, align:'l', sz:900,
         c: x.st.id==='overdue'? PC.RED : x.st.id==='returned'? PC.GREEN
            : x.st.id==='never'? PC.RED : PC.AMBER,
         b: x.st.id==='overdue' || x.st.id==='never'},
        {t:fN(x.g.length), align:'r', sz:900},
        {t:pM(u.uncovered), align:'r', sz:900},
        {t:fN(u.n), align:'r', sz:900}
      ];
    });
  const sw = autoWidths(sh, srows, colW);
  body += _pTbl(50, GRID.x, topY+0.24, colW, sw, [sh].concat(srows), RH, {rule:PC.LINE});
  const leftBot = topY + 0.24 + RH*(srows.length+1);

  /* ---- by role, because that is who gets chased how -------------------- */
  body += secLabel(42, rx, topY, colW, 'BY ROLE');
  const rh = [THL('Role'), TH('Asked'), TH('Back'), TH('$M owed')];
  const byRole = CED.POC_ROLES.map(R=>{
    const g = rows.filter(r=>r.role===R.id);
    return {R:R, g:g};
  }).filter(x=>x.g.length).map(x=>[
    {t:x.R.name, align:'l', sz:900},
    {t:fN(x.g.filter(r=>r.state!=='never').length) + '/' + fN(x.g.length), align:'r', sz:900},
    {t:fN(x.g.filter(r=>r.state==='returned').length), align:'r', sz:900},
    {t:pM(union(x.g.filter(r=>r.state!=='returned')).uncovered), align:'r', sz:900}
  ]);
  const rw = autoWidths(rh, byRole, colW);
  body += _pTbl(60, rx, topY+0.24, colW, rw, [rh].concat(byRole), RH, {rule:PC.LINE});
  const rightBot = topY + 0.24 + RH*(byRole.length+1);

  /* ---- the takeaway ----------------------------------------------------- */
  const say = never.length
    ? fN(never.length) + ' of ' + fN(rows.length) + ' contacts have never been asked'
      + ' about ' + (per? per.label : 'this period') + ', covering $'
      + pM(union(never).uncovered) + 'M of unexplained balance.'
    : late.length
      ? fN(late.length) + ' contact' + (late.length===1?' is':'s are') + ' overdue'
        + (oldest!==null? ', the oldest by ' + oldest + ' days' : '')
        + ' — $' + pM(union(late).uncovered) + 'M unexplained sits behind them.'
      : owed.length
        ? 'Everyone has been asked; ' + fN(owed.length) + ' have yet to answer, '
          + 'covering $' + pM(owedU.uncovered) + 'M.'
        : 'Every contact has been asked and every one has answered.';
  const sayY = Math.max(leftBot, rightBot) + GAP;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  /* ---- the contacts still to answer ------------------------------------ */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(0, Math.floor((6.82 - tblY)/RH) - 1);
  if(owed.length && room >= 2){
    const overCap = owed.length > room;
    const show = owed.slice(0, overCap? room-1 : room);
    body += secLabel(44, GRID.x, lblY, GRID.w,
      'STILL TO ANSWER' + (overCap? '  — the ' + show.length + ' largest of '
                                    + fN(owed.length) : ''));
    const ah = [THL('State'), THL('Role'), THL('Contact'), THL('Organisation'),
                TH('Lines'), TH('$M owed'), THL('Sent'), TH('Days')];
    const arows = show.map(r=>{
      const st = CED.wlState(r.state);
      return [
        {t:st.name, align:'l', sz:850,
         c: r.state==='overdue'||r.state==='never'? PC.RED : PC.AMBER},
        {t:r.short, align:'l', sz:850},
        {t:fitText(r.name, 1.70, 850), align:'l', sz:850},
        {t:fitText(r.poc? r.poc.org : '', 1.55, 850), align:'l', sz:850, c:PC.DIM},
        {t:fN(r.n), align:'r', sz:850},
        {t:pM(r.uncovered.ulo), align:'r', sz:850},
        {t: r.sent? dLabel(r.sent.at.slice(0,10)) : 'never', align:'l', sz:850,
         c: r.sent? PC.INK : PC.RED},
        {t: r.age===null? '–' : String(r.age), align:'r', sz:850,
         c: (r.age!==null && r.age > WL_DUE)? PC.RED : PC.INK}
      ];
    });
    if(overCap){
      const rest = owed.slice(show.length);
      arows.push([
        {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:fN(rest.reduce((a,r)=>a+r.n,0)), align:'r', sz:850, i:1, c:PC.DIM},
        {t:pM(rest.reduce((a,r)=>a+Math.abs(r.uncovered.ulo),0)),
         align:'r', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}
      ]);
    }
    const aw = autoWidths(ah, arows, GRID.w);
    body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});
  }

  return [stdSlide({
    title: 'Worklist status by contact — ' + (per? per.label : ''),
    body:  body,
    foot:  'A worklist is recorded as sent when this tool builds it and as returned when '
         + 'one is read back in, both against the period they are about. Overdue is more '
         + 'than ' + WL_DUE + ' days without a reply, counted from the day it was sent '
         + 'to today — unlike every money figure here, which is as at '
         + (asOf? dLabel(asOf) : 'the period as-of') + '. '
         + 'Contacts OVERLAP - the KO and the contractor on one contract hold the same '
         + 'lines - so every total on this slide counts each line ONCE. Only the '
         + 'per-contact table is per contact, and its column deliberately does not add up.'
  })];
}

/* WHY A LENSED SLIDE HAS NOTHING TO DRAW.

   Most of the deck is built through the watch window, and the window can be
   legitimately empty - a report with no expired money is a good report. When
   that happens the slide is switched off, and the reason has to say so: it
   said "needs an import" to a reader who had just imported, which is the kind
   of small lie that makes someone stop trusting the rest of the screen. */
function winWhy(){
  if(!DB) return 'needs an import';
  if(!F.win) return 'nothing to show for this period';
  const w = CED.windowSplit(CED.all(), curAsOf());
  const n = (F.win === 'canc')? w.by.canc.n : w.inWin.n;
  if(!n)
    return (F.win === 'canc'
             ? 'nothing is in its final expired year'
             : 'nothing is in the watch window')
         + ' — widen it to see the whole report';
  return 'nothing to show for this period';
}

function slideCatalogue(){
  const multi = DB && DB.periods.length > 1;
  const dated = DB? DB.periods.filter(p=>p.key!==UNDATED).length : 0;
  return [
    /* `rec` is "in the deck unless told otherwise", and every slide is - the
       four together are the monthly read-out, and a reader who wants fewer
       unticks one. Anything `off` is never selected whatever `rec` says.

       THE ORDER IS THE ARGUMENT, and it starts where the tool's purpose does:
       what cancels this year, then the rest of the expired window, and only
       then the month's movement. Until v0.27 cancellation risk was the NINTH
       slide, behind participants and appropriations - a deck that buried its
       own reason for existing eight slides deep. */
    {id:'canc',   name:'What cancels 30 September', rec:true,
     off: !DB || !cancModel(), why:'needs an import', build:slCancelling},
    /* THE NEAR CLIFF, second: availability ending is next year's cancelling
       year, and it is the decision the owner can still influence. */
    {id:'expiry', name:'Funds expiring by fiscal year', rec:true,
     off: !DB || !expModel(),
     why: DB? 'no line carries an expiration date' : 'needs an import',
     build:slExpiry},
    /* and the whole timeline behind both, so the two cliffs have a context */
    {id:'risk',   name:'Cancellation risk', rec:true,
     off:!DB, why:'needs an import', build:slRisk},
    {id:'mom',    name:'Month over month — roll-forward', rec:true,
     off:!multi, why:'needs two periods', build:slMomBridge},
    {id:'movers', name:'Biggest movers', rec:true,
     off:!multi, why:'needs two periods', build:slMomMovers},
    {id:'trend',  name:'Unliquidated balance trend', rec:true,
     off:dated<2, why:'needs two dated periods', build:slTrend},
    /* the chase, month over month: where the money nobody can account for
       went, and how much of that was somebody actually answering */
    {id:'unex',   name:'Unexplained balance — month over month', rec:true,
     off: !multi || !unexModel(),
     why: multi? 'nothing is unexplained in either month' : 'needs two periods',
     build:slUnexplained},
    /* the money by the rule that governs it - one-year against three-year */
    {id:'appn',   name:'Balance by appropriation', rec:true,
     off: !DB || !appnModel(), why: DB? winWhy() : 'needs an import', build:slAppn},
    /* where the balance actually sits - the concentration question */
    {id:'top',    name:'Ten largest balances', rec:true,
     off: !DB || !topModel(), why: DB? winWhy() : 'needs an import', build:slTopLines},
    /* who the money belongs to, in the owner's briefing order */
    {id:'part',   name:'Balance by participant', rec:true,
     off: !DB || !partModel(), why: DB? winWhy() : 'needs an import', build:slParticipant},
    /* also a snapshot - and worth building with an EMPTY register, because
       "at risk and nothing recorded against it" is the finding, not the gap */
    {id:'actions',name:'Actions and confidence', rec:true,
     off:!DB, why:'needs an import', build:slActions},
    /* also a snapshot, and also worth building with an empty send log:
       "nobody has been asked about any of it" is the finding */
    /* a snapshot of the OPEN BOOK, so it needs the register rather than a
       second period - and it says so when the register is empty */
    /* a snapshot, and worth building with an empty register - a matrix that
       is entirely "Nothing said" is the finding, not the gap */
    {id:'disp',   name:'Disposition by contract', rec:true,
     off: !DB || !dispModel(),
     why: DB? 'nothing is at risk in this period' : 'needs an import',
     build:slDisp},
    {id:'aging',  name:'Action aging by owner', rec:true,
     off: !DB || !actions().filter(CED.actOpen).length,
     why: DB? 'no action is open' : 'needs an import', build:slAging},
    {id:'worklist',name:'Worklist status by contact', rec:true,
     off:!DB || !wlRows().length,
     why: DB? 'needs a contact who owns a line' : 'needs an import',
     build:slWorklist}
  ];
}

/* ============================================================================
   PACKAGING - the slides go into the real template zip.
   ============================================================================ */
function _b64bytes(b64){
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
const _utf8 = s => new TextEncoder().encode(s);

/* THE MASTER CARRIES ITS OWN "As of ..." LINE, bottom left, left over from
   whatever review the template was last used for. Left alone it ships a Sep
   2026 position under the words "As of Aug 2026 Review".

   It is not always one run: in the CFO deck the date and the word "Review" are
   separate runs, so replacing only the run that matched left the tail behind.
   Retype the whole PARAGRAPH - first run takes the new text, the rest are
   emptied - and carry across whatever followed the date, so "Review" survives
   without being duplicated. */
const MONTH_FULL = ['January','February','March','April','May','June','July',
                    'August','September','October','November','December'];
function deckAsOfLabel(){
  const p = periodOf(CMP.b) || curPeriod();
  if(!p) return '';
  if(p.key === UNDATED) return '';
  const t = p.key.split('-');
  return 'As of ' + MONTH_FULL[(+t[1])-1] + ' ' + t[0];
}
function _retypeAsOf(xml, label){
  if(!label) return xml;
  return xml.replace(/<a:p\b[^>]*>[\s\S]*?<\/a:p>/g, para=>{
    const runs = para.match(/<a:t>[\s\S]*?<\/a:t>/g) || [];
    const txt  = runs.map(t=>t.slice(5,-6)).join('');
    const m = /^\s*As of [A-Z][a-z]+\.? ?[0-9]{4}(.*)$/.exec(txt);
    if(!m) return para;
    const full = label + (m[1] || '');
    let first = true;
    return para.replace(/<a:t>[\s\S]*?<\/a:t>/g, ()=>{
      if(first){ first = false; return '<a:t>'+xe(full)+'</a:t>'; }
      return '<a:t></a:t>';
    });
  });
}

let MARK_TOP = null, MARK_BOT = null;
function markDefault(){ return (TEMPLATES[TPLKEY] && TEMPLATES[TPLKEY].mark) || 'CUI'; }
function marks(){
  return {top: MARK_TOP===null? markDefault() : MARK_TOP,
          bot: MARK_BOT===null? markDefault() : MARK_BOT};
}

function buildDeck(slideXmls){
  const T = TEMPLATES[TPLKEY];
  if(!T) throw new Error('unknown template: '+TPLKEY);
  const td = new TextDecoder();
  const files = [];
  Object.keys(T.parts).forEach(p=>{
    let u = _b64bytes(T.parts[p]);
    if(p.indexOf('ppt/slideMasters/')===0){
      const mk = marks();
      let x = td.decode(u).split('__MARK_TOP__').join(xe(mk.top))
                          .split('__MARK_BOT__').join(xe(mk.bot));
      x = _retypeAsOf(x, deckAsOfLabel());
      u = _utf8(x);
    }
    if(p==='[Content_Types].xml'){
      u = _utf8(td.decode(u).replace('__CTSLIDES__', slideXmls.map((s,i)=>
        '<Override PartName="/ppt/slides/slide'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>'
      ).join('')));
    }else if(p==='ppt/presentation.xml'){
      u = _utf8(td.decode(u).replace('__SLDIDS__', slideXmls.map((s,i)=>
        '<p:sldId id="'+(600+i)+'" r:id="rId'+(900+i)+'"/>').join('')));
    }else if(p==='ppt/_rels/presentation.xml.rels'){
      u = _utf8(td.decode(u).replace('__SLDRELS__', slideXmls.map((s,i)=>
        '<Relationship Id="rId'+(900+i)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide"'
        +' Target="slides/slide'+(i+1)+'.xml"/>').join('')));
    }
    files.push({name:p, data:u});
  });
  slideXmls.forEach((s,i)=>{
    files.push({name:'ppt/slides/slide'+(i+1)+'.xml', data:_utf8(s)});
    files.push({name:'ppt/slides/_rels/slide'+(i+1)+'.xml.rels', data:_utf8(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout"'
      +' Target="../slideLayouts/'+T.layout+'"/></Relationships>')});
  });
  /* the same stored-zip writer the .xlsx export uses - one implementation */
  return zipStore(files, 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
}

/* The default set, recomputed on every call while SLIDESEL is null. An empty
   Set is a real answer - "I unticked them all" - and is honoured, which is why
   the test is `=== null` and not falsiness. */
function slideDefault(){
  return new Set(slideCatalogue().filter(c=>c.rec && !c.off).map(c=>c.id));
}
function slideSel(){
  return SLIDESEL === null? slideDefault() : SLIDESEL;
}
function slideToggle(id){
  const c = slideCatalogue().find(x=>x.id===id);
  if(!c || c.off) return;
  if(SLIDESEL === null) SLIDESEL = slideDefault();   /* first pick materialises it */
  SLIDESEL.has(id)? SLIDESEL.delete(id) : SLIDESEL.add(id);
  render();
}
function slideAll(on){
  SLIDESEL = on? new Set(slideCatalogue().filter(c=>!c.off).map(c=>c.id)) : new Set();
  render();
}
function slideReset(){ SLIDESEL = null; render(); }
function setTpl(k){ TPLKEY = k; render(); }
function setMark(which, v){
  if(which==='top') MARK_TOP = v; else MARK_BOT = v;
  render();
}

function buildPptx(){
  try{
    const chosen = slideCatalogue().filter(c=>slideSel().has(c.id) && !c.off);
    if(!chosen.length){ setStat('&#9888; Pick at least one slide.'); return; }
    let xmls = [];
    chosen.forEach(c=>{ xmls = xmls.concat(c.build()); });
    if(!xmls.length){ setStat('&#9888; Nothing to build - the chosen slides need more data.'); return; }
    const blob = buildDeck(xmls);
    const nm = 'CED Contract Execution ' + (periodOf(CMP.b)? periodOf(CMP.b).label : '') + '.pptx';
    dl(nm.replace(/\s+/g,' ').trim(), blob);
    setStat('&#9989; Built <b>'+xmls.length+'</b> slide'+(xmls.length===1?'':'s')
      + ' inside <b>'+esc(TEMPLATES[TPLKEY].label)+'</b>. '
      + '<b>That deck is CUI</b> &mdash; it carries contract execution data.');
  }catch(err){
    setStat('&#9888; <span class="bad">Deck build failed:</span> '+esc(err&&err.message||err));
    console.error(err);
  }
}

    + ' <button class="mbtn pill" data-act="slideNone">None</button>'
    + (SLIDESEL===null? '' : ' <button class="mbtn pill" data-act="slideReset">Back to default</button>')
    + '<div class="note" style="margin-top:10px">'
    + (chosen.length
        ? 'The deck will carry ' + chosen.map(c=>'<b>'+esc(c.name)+'</b>').join(', ') + '.'
        : 'Nothing is selected, so there is no deck to build.')
