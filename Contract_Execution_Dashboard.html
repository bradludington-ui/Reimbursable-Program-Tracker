<script>
/* ============================================================================
   POWERPOINT EXPORT — the month-over-month slide.

   The slide is built INSIDE the real JPO template package, on that template's
   own layout, so the roundel, both CUI banners, the title style and the
   title/body separator line come from the master rather than being redrawn
   here. Three templates are embedded (10_tpl.js, generated by
   tools/make_tpl.py): the CFO Execution Review deck, the Spend Plan template
   and the SFWG/SFCB Membership deck.

   The geometry contract is SPWB's, unchanged, because a CED slide has to sit
   in the same deck as an SPWB slide and the eye tracks the block:

     title    the real title placeholder    (master band at y 0.360")
     ————     the master's separator line   (y 1.303")
     VISUAL   x 0.36", y 1.38", w 9.28"     <- identical on every slide
     footnote x 0.36", y 6.90", h 0.30"     <- clear of the bottom CUI banner

   Nothing is placed by eye and nothing is centred: every shape is anchored
   top-left off GRID, so a short table simply ends higher.
   ============================================================================ */

const EMU = 914400;
const IN  = v => Math.round(v*EMU);
const GRID = {x:0.36, w:9.28, visY:1.38, visH:5.52, footY:6.90, footH:0.30};

/* Print inks. Deliberately NOT the screen palette: these are chosen to survive
   a monochrome print and a projector, which the screen greens do not. */
const PC = {NAVY:'1B2A4A', INK:'101010', DIM:'6B7280', LINE:'C9D2E0', BAND:'F1F4F9',
            GREEN:'1F6E43', AMBER:'8A5A00', RED:'B02A2A', GOLD:'B8860B',
            BLUE:'3D6FA8', PURP:'5B3E96', WHITE:'FFFFFF', RULE:'8FA0B8'};

/* ---- measurement ---------------------------------------------------------
   Calibri advance widths by character class, in em. Digits are 0.507 and are
   tabular, so number columns measure exactly; letters are averaged. This leans
   WIDE on purpose: over-estimating costs a little air, under-estimating wraps
   a header and drags the whole row taller. */
function textW(s, sz){
  s = ''+(s===null||s===undefined?'':s);
  let em = 0;
  for(const ch of s){
    if(ch === ' ')                      em += 0.226;
    else if(ch >= '0' && ch <= '9')     em += 0.507;
    else if('.,:;\'`!|ilIjt()[]-'.indexOf(ch) >= 0) em += 0.30;
    else if('mwMW'.indexOf(ch) >= 0)    em += 0.87;
    else if(ch >= 'A' && ch <= 'Z')     em += 0.62;
    else                                em += 0.50;
  }
  return em * (sz/100) / 72;
}
const CELL_PAD = 0.10;
function autoWidths(header, rows, bandW){
  const n = header.length;
  const need = new Array(n).fill(0), grow = new Array(n).fill(false);
  header.forEach((c,i)=>{ const o=(c&&typeof c==='object')? c:{t:c};
    if((o.align||'r')==='l') grow[i]=true;
    const w = textW(o.t, o.sz||900) * 1.06 * 1.05;
    if(w>need[i]) need[i]=w;
  });
  rows.forEach(r=>r.forEach((cell,i)=>{
    if(i>=n) return;
    const o = (cell && typeof cell==='object')? cell : {t:cell};
    if(o.vMerge) return;
    const w = textW(o.t, o.sz||1000) * (o.b? 1.06 : 1);
    if(w > need[i]) need[i] = w;
    if((o.align||'r') === 'l') grow[i] = true;
  }));
  let w = need.map(v => v + CELL_PAD);
  const tot = w.reduce((a,b)=>a+b,0);
  if(tot > bandW){
    const k = bandW/tot; w = w.map(v=>v*k);
  }else{
    const spare = bandW - tot;
    const wt = w.map((v,i)=> v * (grow[i]? 3 : 1));
    const base = wt.reduce((a,b)=>a+b,0) || 1;
    w = w.map((v,i)=> v + spare*wt[i]/base);
  }
  return w;
}
/* `sz` is the OOXML unit - HUNDREDTHS OF A POINT - the same one every cell and
   run here uses. Passing points instead silently truncates to four characters;
   that bug shipped once in a sibling tool. */
function fitText(s, widthIn, sz){
  s = ''+(s===null||s===undefined?'':s);
  const pt = (sz||1000)/100;
  const max = Math.max(4, Math.floor(widthIn / (0.53*pt/72)));
  return s.length<=max? s : s.slice(0,max-1)+'…';
}

/* ---- primitives ---------------------------------------------------------- */
function _pRun(t,o){
  o=o||{};
  return '<a:r><a:rPr lang="en-US" sz="'+(o.sz||1000)+'"'+(o.b?' b="1"':'')+(o.i?' i="1"':'')
    +'><a:solidFill><a:srgbClr val="'+(o.c||PC.INK)+'"/></a:solidFill>'
    +'<a:latin typeface="Calibri"/></a:rPr><a:t>'+xe(t)+'</a:t></a:r>';
}
function _pPara(runs,align){ return '<a:p><a:pPr'+(align?' algn="'+align+'"':'')+'/>'+runs+'</a:p>'; }
function _pText(id,x,y,w,h,paras,anchor){
  return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="t'+id+'"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>'
    +'<p:spPr><a:xfrm><a:off x="'+IN(x)+'" y="'+IN(y)+'"/><a:ext cx="'+IN(w)+'" cy="'+IN(h)+'"/></a:xfrm>'
    +'<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr>'
    +'<p:txBody><a:bodyPr wrap="square" lIns="0" rIns="0" tIns="0" bIns="0" anchor="'+(anchor||'t')+'"/>'
    +'<a:lstStyle/>'+paras+'</p:txBody></p:sp>';
}
function _pRect(id,x,y,w,h,o){
  o=o||{};
  const fill = o.fill? '<a:solidFill><a:srgbClr val="'+o.fill+'"/></a:solidFill>' : '<a:noFill/>';
  const ln   = o.line? '<a:ln w="'+(o.lw||6350)+'"><a:solidFill><a:srgbClr val="'+o.line+'"/></a:solidFill></a:ln>'
                     : '<a:ln><a:noFill/></a:ln>';
  return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="r'+id+'"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>'
    +'<p:spPr><a:xfrm><a:off x="'+IN(x)+'" y="'+IN(y)+'"/><a:ext cx="'+IN(w)+'" cy="'+IN(h)+'"/></a:xfrm>'
    +'<a:prstGeom prst="'+(o.prst||'rect')+'"><a:avLst/></a:prstGeom>'+fill+ln+'</p:spPr>'
    +'<p:txBody><a:bodyPr lIns="45720" rIns="45720" tIns="27432" bIns="27432" anchor="'+(o.anchor||'ctr')+'"/>'
    +'<a:lstStyle/>'+(o.paras||'<a:p><a:endParaRPr lang="en-US"/></a:p>')+'</p:txBody></p:sp>';
}
function _pLine(id,x1,y1,x2,y2,o){
  o=o||{};
  const x=Math.min(x1,x2), y=Math.min(y1,y2);
  const w=Math.abs(x2-x1), h=Math.abs(y2-y1);
  const flip = (x2<x1? ' flipH="1"':'') + (y2<y1? ' flipV="1"':'');
  return '<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="'+id+'" name="c'+id+'"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr>'
    +'<p:spPr><a:xfrm'+flip+'><a:off x="'+IN(x)+'" y="'+IN(y)+'"/>'
    +'<a:ext cx="'+IN(w)+'" cy="'+IN(h)+'"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom>'
    +'<a:ln w="'+(o.w||9525)+'"><a:solidFill><a:srgbClr val="'+(o.c||PC.LINE)+'"/></a:solidFill>'
    +(o.dash? '<a:prstDash val="'+o.dash+'"/>':'')+'</a:ln></p:spPr></p:cxnSp>';
}
/* the REAL title placeholder - position, font, size and colour all inherited */
function _pTitle(text){
  return '<p:sp><p:nvSpPr><p:cNvPr id="2" name="Title 1"/><p:cNvSpPr><a:spLocks noGrp="1"/></p:cNvSpPr>'
    +'<p:nvPr><p:ph type="title"/></p:nvPr></p:nvSpPr><p:spPr/>'
    +'<p:txBody><a:bodyPr/><a:lstStyle/><a:p><a:r><a:rPr lang="en-US"/><a:t>'
    +xe(text)+'</a:t></a:r></a:p></p:txBody></p:sp>';
}
function _pTbl(id,x,y,w,widths,rows,rowH,opts){
  opts = opts||{};
  const tot = widths.reduce((a,b)=>a+b,0);
  const grid = widths.map(cw=>'<a:gridCol w="'+Math.round(cw/tot*IN(w))+'"/>').join('');
  const LN = c => '<a:solidFill><a:srgbClr val="'+c+'"/></a:solidFill>';
  const trs = rows.map((r,ri)=>'<a:tr h="'+IN(ri===0 && opts.rowH0? opts.rowH0 : rowH)+'">'+r.map(cell=>{
    const o = (cell&&typeof cell==='object')? cell : {t:cell};
    const rule = o.rule || opts.rule || PC.LINE;
    /* CT_TableCellProperties fixes the child order: lnL, lnR, lnT, lnB, fill */
    const lines = opts.grid
      ? '<a:lnL w="6350">'+LN(rule)+'</a:lnL><a:lnR w="6350">'+LN(rule)+'</a:lnR>'
        +'<a:lnT w="6350">'+LN(rule)+'</a:lnT><a:lnB w="6350">'+LN(rule)+'</a:lnB>'
      : '<a:lnB w="6350">'+LN(rule)+'</a:lnB>';
    const fill = o.fill? '<a:solidFill><a:srgbClr val="'+o.fill+'"/></a:solidFill>' : '<a:noFill/>';
    const mv = opts.tight? '0' : '9144';
    const tcPr = '<a:tcPr marL="45720" marR="45720" marT="'+mv+'" marB="'+mv+'" anchor="'
      +(o.anchor||'ctr')+'">'+lines+fill+'</a:tcPr>';
    /* EVERY paragraph states its own size via endParaRPr. PowerPoint decides a
       row's minimum height from the type it thinks the paragraph holds, and it
       falls back to endParaRPr whenever the run is empty - a blank cell or a
       merged one. Without it the row inherits the table style default (18pt)
       and sizes itself for text that is not there. */
    const epr = '<a:endParaRPr lang="en-US" sz="'+(o.sz||1000)+'"/>';
    if(o.vMerge)
      return '<a:tc vMerge="1"><a:txBody><a:bodyPr/><a:lstStyle/><a:p>'+epr+'</a:p></a:txBody>'+tcPr+'</a:tc>';
    const attrs = (o.rowSpan&&o.rowSpan>1? ' rowSpan="'+o.rowSpan+'"':'');
    const txt  = (o.t===0? '0' : (o.t||''));
    const runs = txt? _pRun(txt, {sz:o.sz||1000, b:o.b, i:o.i, c:o.c||PC.INK}) : '';
    const para = '<a:p><a:pPr algn="'+(o.align||'r')+'"/>'+runs+epr+'</a:p>';
    return '<a:tc'+attrs+'><a:txBody><a:bodyPr/><a:lstStyle/>'+para+'</a:txBody>'+tcPr+'</a:tc>';
  }).join('')+'</a:tr>').join('');
  return '<p:graphicFrame><p:nvGraphicFramePr><p:cNvPr id="'+id+'" name="tbl'+id+'"/>'
    +'<p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr><p:nvPr/></p:nvGraphicFramePr>'
    +'<p:xfrm><a:off x="'+IN(x)+'" y="'+IN(y)+'"/><a:ext cx="'+IN(w)+'" cy="'
    +IN(rowH*rows.length + (opts.rowH0? opts.rowH0-rowH : 0))+'"/></p:xfrm>'
    +'<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table">'
    +'<a:tbl><a:tblPr/><a:tblGrid>'+grid+'</a:tblGrid>'+trs+'</a:tbl></a:graphicData></a:graphic></p:graphicFrame>';
}
function _pSlide(body){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" '
    +'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" '
    +'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">'
    +'<p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'
    +'<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/>'
    +'<a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>'
    +body+'</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>';
}

/* THE standard slide. Everything goes through here - that is the whole point. */
/* THE LENS GOES ON THE SLIDE, NOT JUST ON THE SCREEN.

   A briefing deck outlives the session that built it. The watch window is the
   default, so most decks are drawn over expired and cancelling money only -
   and a slide headed "Balance by appropriation" that quietly omits every
   available dollar is a lie by omission the moment it leaves the building.
   Every slide therefore states which lens built it, in one clause appended to
   the footnote it already carries. `wide:true` says the slide deliberately
   ignores the lens, and says why. */
function lensNote(wide){
  if(typeof DB === 'undefined' || !DB) return '';
  const win = (typeof F !== 'undefined')? F.win : '';
  if(wide)
    return '  SCOPE: the whole report, in scope and out — this slide spans the '
         + 'life cycle, so the watch window is not applied to it.';
  if(win === 'canc')
    return '  SCOPE: THE CANCELLING YEAR ONLY. ' + CED.windowSays(curAsOf(), CED.all())
         + ' Expired years 1-4, available, cancelled and undated money is NOT on this slide.';
  if(win === 'watch')
    return '  SCOPE: THE WATCH WINDOW — expired and cancelling year funding only. '
         + CED.windowSays(curAsOf(), CED.all())
         + ' Money still available, already cancelled, or carrying no dates is NOT on this slide.';
  return '  SCOPE: the whole report, in scope and out.';
}

function stdSlide(o){
  let b = _pTitle(capTitle(o.title));
  b += (o.body||'');
  const foot = (o.foot||'') + (o.noLens? '' : lensNote(o.wide));
  if(foot)
    b += _pText(91, GRID.x, GRID.footY, GRID.w, GRID.footH,
          _pPara(_pRun(foot,{sz:800,c:PC.DIM})), 't');
  return _pSlide(b);
}

/* ---- composite pieces ---------------------------------------------------- */
const TH  = t => ({t, b:1, c:PC.WHITE, fill:PC.NAVY, sz:900, align:'r'});
const THL = t => ({t, b:1, c:PC.WHITE, fill:PC.NAVY, sz:900, align:'l'});
const TT  = (t,o) => Object.assign({t, b:1, fill:PC.BAND, sz:1000}, o||{});

const pM  = v => (Math.abs(v)<5000? '0.000' : (v/1e6).toLocaleString(undefined,
                    {minimumFractionDigits:3, maximumFractionDigits:3}));
const pSign = v => (Math.abs(v)<5000? '–' : (v>0? '+' : '−') + pM(Math.abs(v)));
/* the same, but as MONEY - the KPI tiles read as figures, not as deltas, so
   they keep the unit. "−36.545M" is not a dollar amount. */
const pSignD = v => (Math.abs(v)<5000? '–' : (v>0? '+' : '−') + '$' + pM(Math.abs(v)) + 'M');

/* THE TITLE MUST NOT REACH THE ROUNDEL.

   The master centres the title on the slide, and the roundel sits in the top
   left out to about 1.62". A centred title therefore has roughly 6.6" to play
   with before its left edge runs under the logo — and "Unliquidated balance
   trend — Aug 2026 to Sep 2026" did exactly that, printing the first letters
   on top of the badge. Titles are budgeted in characters, measured at the
   master's own title size, and trimmed on a word boundary rather than being
   allowed to collide. */
const TITLE_CH = 42;
function capTitle(t){
  t = ''+(t||'');
  if(t.length <= TITLE_CH) return t;
  const cut = t.slice(0, TITLE_CH);
  const sp  = cut.lastIndexOf(' ');
  return (sp > TITLE_CH*0.6? cut.slice(0,sp) : cut).replace(/[\s—–-]+$/,'') + '…';
}

/* A KPI strip: n equal tiles across the band, label over value. */
function kpiStrip(id, y, h, tiles){
  const gap = 0.12;
  const w = (GRID.w - gap*(tiles.length-1)) / tiles.length;
  let out = '';
  tiles.forEach((t,i)=>{
    const x = GRID.x + i*(w+gap);
    const paras =
      '<a:p><a:pPr algn="l"/>'+_pRun(t.k,{sz:800,b:1,c:PC.DIM})+'<a:endParaRPr lang="en-US" sz="800"/></a:p>'
     +'<a:p><a:pPr algn="l"/>'+_pRun(t.v,{sz:1600,b:1,c:t.c||PC.NAVY})+'<a:endParaRPr lang="en-US" sz="1600"/></a:p>'
     +(t.n? '<a:p><a:pPr algn="l"/>'+_pRun(t.n,{sz:750,c:PC.DIM})+'<a:endParaRPr lang="en-US" sz="750"/></a:p>' : '');
    out += _pRect(id+i, x, y, w, h, {fill:PC.BAND, line:PC.LINE, anchor:'ctr', paras:paras});
  });
  return out;
}

/* ----------------------------------------------------------------------------
   A COLUMN CHART, drawn from rectangles.

   There is no charting library here and there cannot be one, so the bars are
   `_pRect`s on a computed scale. This exists because the cancellation picture
   is the one thing on this deck that is genuinely a SHAPE - "how much falls off
   in which year" - and a table of the same numbers does not show the wall.

   The axis is a real axis: a baseline, a rounded maximum, and a gridline with
   its value at the top. A bar too short to draw still gets its label, so a
   period with almost nothing reads as "almost nothing" rather than vanishing.
   ---------------------------------------------------------------------------- */
function niceMax(v){
  if(!(v>0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  const step = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return step*p;
}
function pptCols(id, x, y, w, h, rows, note){
  if(!rows.length)
    return _pText(id, x, y, w, 0.3, _pPara(_pRun('No dated balance to chart.',{sz:1000,c:PC.DIM})), 't');
  const LBL_H = 0.34;              /* the two label lines under the baseline */
  const TOP   = 0.20;              /* headroom for the value above a full bar */
  const plotH = h - LBL_H - TOP;
  const base  = y + TOP + plotH;
  const max   = niceMax(Math.max.apply(null, rows.map(r=>Math.abs(r.v))));
  const step  = w / rows.length;
  const bw    = Math.min(0.86, step*0.62);
  let g = '';
  /* the scale, stated once at the top left, and a baseline */
  g += _pText(id, x, y, 3.4, 0.16, _pPara(_pRun(
        '$M  0 – '+pM(max) + (note? '   ·   '+note : ''),{sz:750,c:PC.DIM})), 't');
  g += _pLine(id+1, x, base, x+w, base, {c:PC.RULE, w:9525});
  rows.forEach((r,i)=>{
    const cx = x + step*i + step/2;
    const bh = (Math.abs(r.v)/max) * plotH;
    if(bh > 0.012)
      g += _pRect(id+10+i*3, cx-bw/2, base-bh, bw, bh, {fill:r.tone||PC.BLUE});
    /* the same floor pM itself uses - anything under $5,000 prints as "0.000",
       and a label reading 0.000 over an empty column is noise, not data */
    if(Math.abs(r.v) >= 5000)
      g += _pText(id+11+i*3, cx-step/2, base-bh-0.19, step, 0.17,
            _pPara(_pRun(pM(r.v),{sz:750,b:1,c:PC.INK}),'ctr'), 'b');
    g += _pText(id+12+i*3, cx-step/2, base+0.04, step, LBL_H-0.04,
          _pPara(_pRun(r.label,{sz:800,b:1,c:PC.INK}),'ctr')
        + (r.sub? _pPara(_pRun(r.sub,{sz:750,c:PC.DIM}),'ctr') : ''), 't');
  });
  return g;
}

/* CAP A TABLE, AND KEEP WHAT IT CUT.

   Six slide builders show the rows that fit and give everything else a single
   "+ N more" row, so that the money column is still the whole report rather
   than just the part that happened to fit. All six carried their own copy of
   the same two lines of arithmetic — one off-by-one, found once, had to be
   found again in each of them — and a mutation naming the line could not say
   which slide it meant: the sweep patched whichever came first in the file,
   so adding a slide ABOVE an existing one silently moved the mutation onto
   different code while still printing a verdict beside the old description.

   `rest` is derived from `show`, never recomputed, so the two can never
   disagree about where the cut fell. That is the bug this replaces: a cap
   that showed rows 0..n-1 and a remainder that started at n-1 overwrote the
   last visible row, and that participant vanished from the slide AND from the
   total that replaced it. */
function capRows(rows, room){
  const over = (rows||[]).length > room;
  const show = over? rows.slice(0, room - 1) : (rows||[]);
  return {show: show, rest: (rows||[]).slice(show.length), over: over};
}

/* A small section label above a block. */
function secLabel(id, x, y, w, text){
  return _pText(id, x, y, w, 0.20, _pPara(_pRun(text,{sz:850,b:1,c:PC.NAVY})), 't');
}

/* ============================================================================
   THE MONTH-OVER-MONTH SLIDE
   ============================================================================ */
function momModel(){
  const a = CMP.a, b = CMP.b;
  const pa = periodOf(a), pb = periodOf(b);
  if(!pa || !pb || a===b) return null;
  const A = CED.inPeriod(a), B = CED.inPeriod(b);
  return {pa, pb, c: CED.compare(A, B)};
}

function slMomBridge(){
  const m = momModel();
  if(!m) return [];
  const br = m.c.bridge;

  /* ---- the KPI strip ---------------------------------------------------- */
  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'OPENING ULO', v:'$'+pM(br.opening)+'M', n:m.pa.label},
    {k:'PAID OUT',    v:'$'+pM(br.expUp)+'M',   n:'liquidated', c:PC.GREEN},
    {k:'DEOBLIGATED', v:'$'+pM(Math.abs(br.oblDown))+'M', n:'off contract', c:PC.AMBER},
    {k:'CLOSING ULO', v:'$'+pM(br.closing)+'M', n:m.pb.label},
    {k:'CHANGE',      v:pSignD(br.delta),
     n: br.delta<0? 'balance fell' : 'balance rose', c: br.delta<=0? PC.GREEN : PC.RED}
  ]);

  /* ---- two blocks side by side ------------------------------------------ */
  const colW = (GRID.w - 0.40) / 2;
  const rx   = GRID.x + colW + 0.40;
  const topY = GRID.visY + 0.82 + 0.28;

  body += secLabel(40, GRID.x, topY, colW, 'ROLL-FORWARD');
  body += secLabel(41, rx, topY, colW, 'BY CONTRACT');
  const tblY = topY + 0.24;

  /* the bridge. Every row is a MOVEMENT except the two balances, and the two
     balances are the only bold banded rows - so the eye lands on them first. */
  const bh = [THL('Roll-forward'), TH('$M')];
  const brow = (label, v, tone) => [
    {t:label, align:'l', sz:950},
    {t:(Math.abs(v)<5000? '–' : (v>0?'+':'−')+pM(Math.abs(v))), align:'r', sz:950,
     c: Math.abs(v)<5000? PC.DIM : tone}
  ];
  const brows = [
    [TT('Opening balance — '+m.pa.label,{align:'l',sz:950}), TT('$'+pM(br.opening),{align:'r',sz:950})],
    brow('Obligations added',     br.oblUp,   PC.RED),
    brow('Deobligations',         br.oblDown, PC.GREEN),
    brow('Expenditures',          -br.expUp,  PC.GREEN),
    brow('Expenditure reversals', -br.expDown,PC.RED),
    brow('Lines new to the report',  br.addedUlo,   PC.RED),
    brow('Lines no longer reported', br.removedUlo, PC.GREEN),
    [TT('Closing balance — '+m.pb.label,{align:'l',sz:950}), TT('$'+pM(br.closing),{align:'r',sz:950})]
  ];
  const RH = 0.28;
  const bw = autoWidths(bh, brows, colW);
  body += _pTbl(50, GRID.x, tblY, colW, bw, [bh].concat(brows), RH, {rule:PC.LINE});
  const leftBot = tblY + RH*(brows.length+1);

  /* by contract: opening, paid, closing, and what is left to run */
  const ch = [THL('Contract'), TH('Open $M'), TH('Paid $M'), TH('Close $M'), TH('Exp %')];
  const rows = [];
  const ktrs = [...new Set(m.c.rows.map(r=>r.line.piin))];
  ktrs.forEach(k=>{
    const kr = m.c.rows.filter(r=>r.line.piin===k);
    const openU = kr.reduce((s,r)=>s+(r.a? r.a.ulo:0),0);
    const closeU= kr.reduce((s,r)=>s+(r.b? r.b.ulo:0),0);
    const paid  = kr.filter(r=>r.kind==='matched').reduce((s,r)=>s+Math.max(r.dExp,0),0);
    const cur   = kr.filter(r=>r.b).map(r=>r.b);
    const t     = CED.totals(cur);
    rows.push([
      {t: fitText((kr[0].line.ktr||k), colW*0.36, 900), align:'l', sz:900},
      {t: pM(openU),  align:'r', sz:900},
      {t: pM(paid),   align:'r', sz:900, c:PC.GREEN},
      {t: pM(closeU), align:'r', sz:900},
      {t: t.pctExp===null? '–' : (t.pctExp*100).toFixed(1)+'%', align:'r', sz:900}
    ]);
  });
  const allCur = m.c.rows.filter(r=>r.b).map(r=>r.b);
  const tAll = CED.totals(allCur);
  rows.push([
    TT('TOTAL',{align:'l',sz:900}),
    TT(pM(br.opening),{align:'r',sz:900}),
    TT(pM(br.expUp),{align:'r',sz:900}),
    TT(pM(br.closing),{align:'r',sz:900}),
    TT(tAll.pctExp===null? '–' : (tAll.pctExp*100).toFixed(1)+'%',{align:'r',sz:900})
  ]);
  const cw = autoWidths(ch, rows, colW);
  body += _pTbl(60, rx, tblY, colW, cw, [ch].concat(rows), RH, {rule:PC.LINE});
  let rightBot = tblY + RH*(rows.length+1);

  /* The right column would otherwise stop half way down and leave the bottom
     third of the slide empty, which reads as unconsidered rather than as
     restraint. Who the money moved for is the obvious second cut, so the
     participants that moved most go underneath - as many as fit, and no more. */
  const pRows = [];
  const parts = [...new Set(m.c.rows.map(r=>r.line.part))];
  parts.forEach(nm=>{
    const pr = m.c.rows.filter(r=>r.line.part===nm);
    pRows.push({
      nm,
      paid:  pr.filter(r=>r.kind==='matched').reduce((a,r)=>a+Math.max(r.dExp,0),0),
      dUlo:  pr.reduce((a,r)=>a+r.dUlo,0),
      close: pr.reduce((a,r)=>a+(r.b? r.b.ulo:0),0)
    });
  });
  /* the owner's briefing order, so the same rows appear in the same places
     every month and the deck can be read across months without re-reading it */
  pRows.sort((a,b)=> CED.partRank(a.nm)-CED.partRank(b.nm) || a.nm.localeCompare(b.nm));
  const roomFor = Math.max(0, Math.floor((6.05 - (rightBot + 0.46)) / RH) - 1);
  /* If there is a remainder it needs a row of its own - the first cut OVERWROTE
     the last real row with it, so that participant (the Navy, as it happened)
     vanished from the table AND was left out of the remainder it was replaced
     by, and the column stopped adding up to the roll-forward. */
  const capP  = Math.max(0, Math.min(7, roomFor));
  const overP = pRows.length > capP;
  const keepP = overP? Math.max(0, capP-1) : capP;
  const showP = pRows.slice(0, keepP);
  const restP = pRows.slice(keepP);
  if(showP.length){
    const py = rightBot + 0.24;
    body += secLabel(42, rx, py, colW, 'BY PARTICIPANT');
    const ph = [THL('Participant'), TH('Paid $M'), TH('Δ ULO $M'), TH('Close $M')];
    const prr = showP.map(r=>[
      {t:fitText(r.nm, colW*0.42, 900), align:'l', sz:900},
      {t:pM(r.paid), align:'r', sz:900, c:PC.GREEN},
      {t:pSign(r.dUlo), align:'r', sz:900},
      {t:pM(r.close), align:'r', sz:900}
    ]);
    /* The order puts the services first, so what a short box cuts is always the
       partner and FMS tail - never something in the middle. Cutting it silently
       would still be wrong, so the remainder gets its OWN row saying how many
       went and what they are worth, and the column still adds to the whole. */
    if(restP.length){
      const sum = f => restP.reduce((a,r)=>a+r[f], 0);
      prr.push([
        {t:'+ '+restP.length+' more', align:'l', sz:900, i:1, c:PC.DIM},
        {t:pM(sum('paid')),    align:'r', sz:900, c:PC.GREEN},
        {t:pSign(sum('dUlo')), align:'r', sz:900},
        {t:pM(sum('close')),   align:'r', sz:900}
      ]);
    }
    const pw = autoWidths(ph, prr, colW);
    body += _pTbl(62, rx, py+0.24, colW, pw, [ph].concat(prr), RH, {rule:PC.LINE});
    rightBot = py + 0.24 + RH*(prr.length+1);
  }

  /* the takeaway, written from the numbers rather than typed */
  const movers = m.c.rows.filter(r=>r.moved).length;
  const say = 'The balance '
    + (br.delta<0? 'fell ' : br.delta>0? 'rose ' : 'held at ')
    + (Math.abs(br.delta)>=5000? '$'+pM(Math.abs(br.delta))+'M' : 'nothing')
    + ': $'+pM(br.expUp)+'M paid out'
    + (Math.abs(br.oblDown)>=5000? ', $'+pM(Math.abs(br.oblDown))+'M deobligated' : '')
    + (br.removedN? ', $'+pM(Math.abs(br.removedUlo))+'M on '+br.removedN+' line'
        +(br.removedN===1?'':'s')+' no longer reported' : '')
    + (br.addedN? ', $'+pM(br.addedUlo)+'M on '+br.addedN+' new line'+(br.addedN===1?'':'s') : '')
    + '. ' + movers + ' of ' + m.c.rows.length + ' lines moved.';
  const sayY = Math.max(leftBot, rightBot) + 0.24;
  body += _pText(70, GRID.x, Math.min(sayY, 6.50), GRID.w, 0.34,
            _pPara(_pRun(say,{sz:1000,b:1,c:PC.NAVY})), 't');

  return [stdSlide({
    title: 'Contract Execution — ' + m.pa.label + ' to ' + m.pb.label,
    body:  body,
    foot:  'Unliquidated obligations from the monthly per-contract ULO summaries. '
         + m.pa.label + ' as of ' + (m.pa.asOf? dLabel(m.pa.asOf) : 'n/a') + '; '
         + m.pb.label + ' as of ' + (m.pb.asOf? dLabel(m.pb.asOf) : 'n/a') + '. '
         + 'Paid out and deobligated are measured on lines reported in both months; '
         + 'lines entering and leaving the report are shown separately. '
         + (br.ok? 'The roll-forward reconciles to the cent.' : 'THE ROLL-FORWARD DOES NOT RECONCILE - see Verify.')
  })];
}

/* ---- the movers slide ---------------------------------------------------- */

/* ---- the trend slide ----------------------------------------------------- */
function slTrend(){
  const ps = DB.periods.filter(p=>p.key!==UNDATED);
  if(ps.length < 2) return [];
  const ser = CED.series(ps, CED.inPeriod);
  const bn  = CED.burn(ser);
  const last= ser[ser.length-1];

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'PERIODS', v:String(ser.length), n:ser[0].label+' to '+last.label},
    {k:'BALANCE NOW', v:'$'+pM(last.ulo)+'M', n:last.label, c:PC.RED},
    {k:'PAID / MONTH', v:bn? '$'+pM(bn.rate)+'M' : '–',
     n:bn? 'mean over '+bn.months+' month'+(bn.months===1?'':'s') : '', c:PC.GREEN},
    {k:'MONTHS TO CLEAR', v:(bn&&bn.runway!==null)? bn.runway.toFixed(1) : '–',
     n:'at that rate', c:PC.AMBER}
  ]);

  const topY = GRID.visY + 0.82 + 0.28;
  body += secLabel(40, GRID.x, topY, GRID.w, 'BY PERIOD');
  const hdr = [THL('Period'), THL('As of'), TH('Obligations $M'), TH('Expenditures $M'),
               TH('ULO $M'), TH('Exp %'), TH('Paid in period $M'), TH('Δ ULO $M')];
  const rows = ser.map(x=>[
    {t:x.label, align:'l', sz:900, b:1},
    {t:x.asOf? dLabel(x.asOf) : '–', align:'l', sz:900},
    {t:pM(x.obl), align:'r', sz:900},
    {t:pM(x.exp), align:'r', sz:900},
    {t:pM(x.ulo), align:'r', sz:900},
    {t:x.pctExp===null? '–' : (x.pctExp*100).toFixed(1)+'%', align:'r', sz:900},
    {t:x.cmp? pM(x.cmp.bridge.expUp) : '–', align:'r', sz:900, c:PC.GREEN},
    {t:x.cmp? pSign(x.dUlo) : '–', align:'r', sz:900}
  ]);
  const widths = autoWidths(hdr, rows, GRID.w);
  body += _pTbl(50, GRID.x, topY+0.24, GRID.w, widths, [hdr].concat(rows), 0.26, {rule:PC.LINE});

  const sayY = topY + 0.24 + 0.26*(rows.length+1) + 0.22;
  if(bn && bn.runway!==null && sayY < 6.5){
    body += _pText(70, GRID.x, sayY, GRID.w, 0.34, _pPara(_pRun(
      'At $'+pM(bn.rate)+'M a month the $'+pM(last.ulo)+'M on the books clears in about '
      + bn.runway.toFixed(1)+' months.', {sz:1000,b:1,c:PC.NAVY})), 't');
  }
  /* per contract, underneath - with two periods the series table is three rows
     and would otherwise leave the slide two thirds empty */
  const kt = [...new Set(CED.everything().map(L=>L.piin))];
  const cBot = topY + 0.24 + 0.26*(rows.length+1);
  if(kt.length > 1 && cBot + 1.4 < 6.3){
    const cy = cBot + (sayY < 6.5? 0.60 : 0.28);
    body += secLabel(44, GRID.x, cy, GRID.w, 'UNLIQUIDATED BALANCE BY CONTRACT');
    const ch2 = [THL('Contract')].concat(ser.map(x=>TH(x.label+' $M'))).concat([TH('Change $M')]);
    const cr = kt.map(k=>{
      const cells = ser.map(x=>CED.totals(x.lines.filter(L=>L.piin===k)).ulo);
      const nm = (CED.everything().find(L=>L.piin===k)||{}).ktr || k;
      return [{t:nm, align:'l', sz:900}]
        .concat(cells.map(v=>({t:pM(v), align:'r', sz:900})))
        .concat([{t:pSign(cells[cells.length-1]-cells[0]), align:'r', sz:900}]);
    });
    cr.push([TT('TOTAL',{align:'l',sz:900})]
      .concat(ser.map(x=>TT(pM(x.ulo),{align:'r',sz:900})))
      .concat([TT(pSign(last.ulo-ser[0].ulo),{align:'r',sz:900})]));
    const cw2 = autoWidths(ch2, cr, GRID.w);
    body += _pTbl(56, GRID.x, cy+0.24, GRID.w, cw2, [ch2].concat(cr), 0.26, {rule:PC.LINE});
  }

  return [stdSlide({
    title: 'Unliquidated balance trend',
    body:  body,
    foot:  'The rate is expenditures only: money removed by deobligation was never going to be '
         + 'spent, and counting it as burn would flatter the runway. Rates are divided by the '
         + 'actual months between reporting dates. A straight-line reading of what has happened, '
         + 'not a forecast.'
  })];
}

/* ============================================================================
   CANCELLATION RISK

   A snapshot, not a comparison - it needs ONE period, so it is the only slide
   here that is available on a first import.

   The rule the whole slide rests on, and the reason it is worth its own page:
   EXPIRED and CANCELLED are different facts. Expired money can still be paid
   out; cancelled money is gone and a balance still sitting against it is an
   error to clear, not a bill to pay. The two are never added together, and the
   footnote says so on the slide rather than only in the tool.
   ============================================================================ */
function slRisk(){
  if(!DB) return [];
  const ls = CED.scopeWide()   /* the cancellation timeline spans every state by definition */;
  if(!ls.length) return [];
  const per   = curPeriod();
  const asOf  = curAsOf();
  const t     = CED.totals(ls);
  const bands = CED.riskBands(ls, asOf);
  const band  = id => (bands.find(b=>b.id===id) || {ulo:0, n:0});
  const exp   = CED.expired(ls, asOf);
  const expT  = CED.totals(exp);

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'UNLIQUIDATED', v:'$'+pM(t.ulo)+'M', n:fN(t.n)+' CLIN lines'},
    {k:'PAST CANCEL DATE', v:'$'+pM(band('cancelled').ulo)+'M',
     n:fN(band('cancelled').n)+' lines · should be zero',
     c: band('cancelled').ulo>=5000? PC.RED : PC.GREEN},
    {k:'CANCELS \u2264 12 MONTHS', v:'$'+pM(band('m12').ulo)+'M',
     n: band('m12').ulo>=5000? 'liquidate or lose' : 'clear',
     c: band('m12').ulo>=5000? PC.RED : PC.GREEN},
    {k:'EXPIRED, STILL OPEN', v:'$'+pM(expT.ulo)+'M',
     n:fN(exp.length)+' lines past expiration', c:PC.AMBER},
    {k:'NO CANCEL DATE', v:'$'+pM(band('none').ulo)+'M', n:'FMS / partner', c:PC.PURP}
  ]);

  /* ---- the wall ---------------------------------------------------------- */
  const byC = CED.byCancel(ls).filter(g=>g.key!=='');
  const MAXC = 11;
  let cols = byC;
  if(cols.length > MAXC){
    /* keep the nearest dates - they are the ones that matter - and fold the
       rest into one column so the total on the chart is still the total */
    const head = cols.slice(0, MAXC-1);
    const tail = cols.slice(MAXC-1);
    head.push({key:'zzz', label:'later', ulo:tail.reduce((a,g)=>a+g.ulo,0), n:0});
    cols = head;
  }
  const tone = g => {
    if(g.key==='zzz') return PC.BLUE;
    if(!asOf) return PC.BLUE;
    if(g.key <= asOf) return PC.RED;
    const m = CED.monthsTo(asOf, g.key);
    return m<12? PC.RED : m<24? PC.AMBER : PC.BLUE;
  };
  body += secLabel(40, GRID.x, GRID.visY+0.82+0.24, GRID.w, 'UNLIQUIDATED BALANCE BY CANCEL DATE');
  /* Funds cancel on 1 October, so in practice every column carries the same day
     and month and only the year differs. Repeating "01 Oct" under eleven columns
     is noise; where they really are all the same it is said once, in the axis
     caption, and the columns carry the year alone. */
  const dm = g => g.key.slice(8,10)+' '+MON[(+g.key.slice(5,7))-1];
  const real = cols.filter(g=>g.key!=='zzz');
  const same = real.length>1 && real.every(g=>dm(g)===dm(real[0]));
  body += pptCols(100, GRID.x, 2.68, GRID.w, 1.95, cols.map(g=>({
    label: g.key==='zzz'? 'later' : g.key.slice(0,4),
    sub:   (g.key==='zzz' || same)? '' : dm(g),
    v: g.ulo, tone: tone(g)
  })), same? 'all on '+dm(real[0]) : '');

  /* ---- the takeaway ------------------------------------------------------ */
  const say = (band('cancelled').ulo>=5000
      ? '$'+pM(band('cancelled').ulo)+'M on '+fN(band('cancelled').n)
        +' lines is already past its cancel date. '
      : 'Nothing is past its cancel date. ')
    + (band('m12').ulo>=5000
      ? 'A further $'+pM(band('m12').ulo)+'M cancels within 12 months. '
      : 'Nothing further cancels within 12 months. ')
    + (expT.ulo>=5000
      ? '$'+pM(expT.ulo)+'M has expired and can still be disbursed or deobligated.'
      : 'Nothing expired is still open.');
  body += _pText(70, GRID.x, 4.78, GRID.w, 0.32,
            _pPara(_pRun(say,{sz:1000,b:1,c:PC.NAVY})), 't');

  /* ---- who holds it ------------------------------------------------------ */
  const ktrs = [...new Set(ls.map(L=>L.piin))].map(k=>{
    const kl = ls.filter(L=>L.piin===k);
    const kb = CED.riskBands(kl, asOf);
    const g  = id => (kb.find(b=>b.id===id)||{ulo:0}).ulo;
    const ke = CED.totals(CED.expired(kl, asOf));
    const ahead = kl.filter(L=>L.cancD && (!asOf || L.cancD>asOf) && Math.abs(L.ulo)>CED.EPS)
                    .map(L=>L.cancD).sort();
    return {ktr:kl[0].ktr, ulo:CED.totals(kl).ulo, past:g('cancelled'), m12:g('m12'),
            expired:ke.ulo, next:ahead.length? ahead[0] : ''};
  }).sort((a,b)=>(b.past+b.m12+b.expired)-(a.past+a.m12+a.expired));

  const rowH = 0.26;
  const tblY = 5.44;
  const room = Math.max(1, Math.floor((6.80 - tblY)/rowH) - 1);
  const show = ktrs.slice(0, room);
  body += secLabel(42, GRID.x, tblY-0.24, GRID.w,
    'EXPOSURE BY CONTRACT' + (ktrs.length>show.length
      ? '  \u2014 the ' + show.length + ' most exposed of ' + fN(ktrs.length) : ''));
  const hdr = [THL('Contract'), TH('ULO $M'), TH('Past cancel $M'),
               TH('Cancels \u2264 12mo $M'), TH('Expired, open $M'), THL('Next cancel date')];
  const rws = show.map(r=>[
    {t:r.ktr, align:'l', sz:900},
    {t:pM(r.ulo), align:'r', sz:900},
    {t:r.past>=5000? pM(r.past) : '\u2013', align:'r', sz:900, c:r.past>=5000? PC.RED : PC.DIM},
    {t:r.m12 >=5000? pM(r.m12)  : '\u2013', align:'r', sz:900, c:r.m12 >=5000? PC.RED : PC.DIM},
    {t:r.expired>=5000? pM(r.expired) : '\u2013', align:'r', sz:900,
     c:r.expired>=5000? PC.AMBER : PC.DIM},
    {t:r.next? dLabel(r.next) : '\u2013', align:'l', sz:900, c:r.next? PC.INK : PC.DIM}
  ]);
  const w = autoWidths(hdr, rws, GRID.w);
  body += _pTbl(60, GRID.x, tblY, GRID.w, w, [hdr].concat(rws), rowH, {rule:PC.LINE});

  return [stdSlide({
    wide:  true,
    title: 'Cancellation risk — ' + (per? per.label : ''),
    body:  body,
    foot:  'EXPIRED and CANCELLED are different facts and are never added together: an expired '
         + 'balance can still be disbursed or deobligated, a cancelled one is gone and a balance '
         + 'against it is an error to clear. Measured against '
         + (asOf? dLabel(asOf) : 'no as-of date, so nothing can be called expired or cancelled')
         + '. FMS and partner lines carry no cancel date in the source and do not cancel on this '
         + 'schedule; they are excluded from the chart and shown separately above.'
  })];
}

/* ============================================================================
   ACTIONS AND CONFIDENCE

   The companion to the risk slide. That one says what is at stake; this one
   says what is being done about it and how much of it nobody can yet explain.

   It is a SNAPSHOT, so like the risk slide it works on a first import - and it
   is worth building even with an empty register, because "$28.6M at risk and
   nothing recorded against any of it" is the most important thing that could be
   put in front of a board.
   ============================================================================ */
function slActions(){
  if(!DB) return [];
  const ls   = CED.scope();
  if(!ls.length) return [];
  const acts = actions();
  const asOf = curAsOf();
  const per  = curPeriod();
  const cov  = CED.coverage(ls, acts, asOf);
  const open = acts.filter(CED.actOpen);
  const late = acts.filter(a=>CED.actOverdue(a, asOf));
  const sv   = v => (''+(v===null||v===undefined?'':v)).trim();

  /* the print inks a disposition reads in */
  const DTONE = {liquidate:PC.GREEN, deobligate:PC.AMBER, research:PC.BLUE,
                 dispute:PC.RED, none:PC.DIM};

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'AT RISK', v:'$'+pM(cov.atRisk.ulo)+'M',
     n:fN(cov.atRisk.n)+' expired or cancelled lines', c:PC.AMBER},
    {k:'ACCOUNTED FOR', v: cov.pct===null? '–' : (cov.pct*100).toFixed(1)+'%',
     n:'has a stated disposition',
     c:(cov.pct!==null && cov.pct>=0.8)? PC.GREEN : (cov.pct!==null && cov.pct>=0.4)? PC.AMBER : PC.RED},
    {k:'UNEXPLAINED', v:'$'+pM(cov.uncovered.ulo)+'M',
     n:fN(cov.uncovered.n)+' lines with nothing said', c:PC.RED},
    {k:'OPEN ACTIONS', v:String(open.length),
     n:fN(acts.length)+' raised in all', c:PC.NAVY},
    {k:'OVERDUE', v:String(late.length),
     n: asOf? 'against '+dLabel(asOf) : 'no as-of date',
     c: late.length? PC.RED : PC.GREEN}
  ]);

  const colW = (GRID.w - 0.40) / 2;
  const rx   = GRID.x + colW + 0.40;
  const topY = GRID.visY + 0.82 + 0.14;
  const RH   = 0.26;
  /* Clearances are stated, not guessed. The first cut clamped the takeaway to
     y=5.10 and put the next label 0.24 above the table start - which sat 0.12"
     INSIDE the takeaway's own box. validate_deck.py failed the build on the
     overlap; every gap below is now explicit and additive. */
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- what we say becomes of the money -------------------------------- */
  body += secLabel(40, GRID.x, topY, colW, 'WHAT BECOMES OF THE AT-RISK MONEY');
  const dh = [THL('Disposition'), TH('Lines'), TH('$M'), TH('Share')];
  const drows = CED.ACT_DISP.map(d=>({d:d, t:cov.byDisp[d.id]}))
    .concat([{d:{id:'', name:'Nothing said'}, t:cov.uncovered}])
    .filter(x=>x.t.n > 0 || x.d.id === '')
    .map(x=>[
      {t:x.d.name, align:'l', sz:900,
       c: x.d.id===''? PC.RED : (DTONE[x.d.id]||PC.INK), b: x.d.id===''},
      {t:fN(x.t.n), align:'r', sz:900},
      {t:pM(x.t.ulo), align:'r', sz:900},
      {t: Math.abs(cov.atRisk.ulo)>500? ((x.t.ulo/cov.atRisk.ulo)*100).toFixed(1)+'%' : '–',
       align:'r', sz:900}
    ]);
  drows.push([
    TT('AT RISK',{align:'l',sz:900}),
    TT(fN(cov.atRisk.n),{align:'r',sz:900}),
    TT(pM(cov.atRisk.ulo),{align:'r',sz:900}),
    TT('100.0%',{align:'r',sz:900})
  ]);
  const dw = autoWidths(dh, drows, colW);
  body += _pTbl(50, GRID.x, topY+0.24, colW, dw, [dh].concat(drows), RH, {rule:PC.LINE});
  const leftBot = topY + 0.24 + RH*(drows.length+1);

  /* ---- who is carrying it ---------------------------------------------- */
  body += secLabel(42, rx, topY, colW, 'OPEN ACTIONS BY OWNER');
  const byOwner = new Map();
  open.forEach(a=>{
    const k = sv(a.owner) || '(unassigned)';
    if(!byOwner.has(k)) byOwner.set(k, {name:k, n:0, amt:0, late:0});
    const g = byOwner.get(k);
    g.n++; g.amt += (actAmount(a) || 0);
    if(CED.actOverdue(a, asOf)) g.late++;
  });
  const orows = [...byOwner.values()]
    .sort((a,b)=> b.late-a.late || Math.abs(b.amt)-Math.abs(a.amt))
    .slice(0, 5)                       /* five owners; the table below names the rest */
    .map(g=>[
      {t:fitText(g.name, colW*0.45, 900), align:'l', sz:900,
       c: g.name==='(unassigned)'? PC.RED : PC.INK},
      {t:fN(g.n), align:'r', sz:900},
      {t:pM(g.amt), align:'r', sz:900},
      {t:g.late? fN(g.late) : '–', align:'r', sz:900, c:g.late? PC.RED : PC.DIM}
    ]);
  let rightBot = topY + 0.24;
  if(orows.length){
    /* NOT '$M'. The disposition table on the left IS a partition of the
       at-risk balance and totals to it; this one is not. It is the balance
       each action NAMES, so it includes still-active money and counts a line
       once per action - on the seeded register it came to $62M against $37M
       at risk. A reader who adds this column up must not be able to think
       they have found a discrepancy. The header says what it is and the
       footnote says why it does not add. */
    const oh = [THL('Owner'), TH('Open'), TH('Balance $M'), TH('Late')];
    const ow = autoWidths(oh, orows, colW);
    body += _pTbl(60, rx, topY+0.24, colW, ow, [oh].concat(orows), RH, {rule:PC.LINE});
    rightBot = topY + 0.24 + RH*(orows.length+1);
  }else{
    body += _pText(61, rx, topY+0.28, colW, 0.3,
      _pPara(_pRun('No action is open.', {sz:1000, i:1, c:PC.DIM})), 't');
    rightBot = topY + 0.6;
  }

  /* ---- the takeaway ----------------------------------------------------- */
  const say = 'Of $'+pM(cov.atRisk.ulo)+'M at risk, $'+pM(cov.covered.ulo)
    + 'M has a stated disposition and $'+pM(cov.uncovered.ulo)+'M does not. '
    + (open.length
        ? open.length+' action'+(open.length===1?' is':'s are')+' open'
          + (late.length? ', '+late.length+' of them overdue' : '') + '.'
        : 'No action has been raised against any of it.');
  const sayY = Math.max(leftBot, rightBot) + GAP;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  /* ---- the open actions themselves -------------------------------------- */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(0, Math.floor((6.82 - tblY)/RH) - 1);
  if(open.length && room >= 2){
    const ranked = CED.sortBy(open, a=>(CED.actOverdue(a, asOf)? 1e12 : 0)
                                      + Math.abs(actAmount(a) || 0), 'desc');
    const overCap = ranked.length > room;
    const show = ranked.slice(0, overCap? room-1 : room);
    body += secLabel(44, GRID.x, lblY, GRID.w,
      'OPEN ACTIONS' + (overCap? '  — the ' + show.length + ' largest of '
                                 + fN(ranked.length) : ''));
    const ah = [THL('Status'), THL('Action'), THL('CLIN / ACRN'), THL('Owner'),
                THL('With'), THL('Disposition'), TH('$M'), THL('Due')];
    const arows = show.map(a=>{
      const p = a.target.split('|');
      const d = CED.actDisp(a.disp);
      const lt = CED.actOverdue(a, asOf);
      return [
        {t:CED.actStatus(a.status).name, align:'l', sz:850},
        {t:fitText(a.title, 2.60, 850), align:'l', sz:850},
        {t: a.scope==='line'? (p[1]+' / '+p[2]) : a.scope==='contract'? 'whole contract' : 'portfolio',
         align:'l', sz:850},
        {t:fitText(sv(a.owner) || 'unassigned', 1.15, 850), align:'l', sz:850,
         c: sv(a.owner)? PC.INK : PC.RED},
        {t:fitText(a.withWho, 1.15, 850), align:'l', sz:850},
        {t: d? d.name : 'not set', align:'l', sz:850, c: d? (DTONE[d.id]||PC.INK) : PC.RED},
        {t: actAmount(a)===null? '–' : pM(actAmount(a)), align:'r', sz:850},
        {t: a.due? (dLabel(a.due) + (lt? ' LATE' : '')) : '–', align:'l', sz:850,
         c: lt? PC.RED : PC.INK}
      ];
    });
    if(overCap){
      const rest = ranked.slice(show.length);
      arows.push([
        {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:pM(rest.reduce((s,a)=>s+(actAmount(a)||0),0)), align:'r', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}
      ]);
    }
    const aw = autoWidths(ah, arows, GRID.w);
    body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});
  }

  return [stdSlide({
    title: 'Actions and confidence — ' + (per? per.label : ''),
    body:  body,
    foot:  'Accounted for is the share of the AT-RISK balance — expired or already cancelled '
         + '— carrying an action that says what becomes of the money. An open action with no '
         + 'disposition is unexplained: work in progress is not yet an answer. '
         + 'Balance under action is what each action names, not a share of the at-risk total. '
         + 'Overdue is against ' + (asOf? dLabel(asOf) : 'the period')
         + ', the as-of, not today.'
  })];
}

/* ---- the catalogue ------------------------------------------------------- */
/* ============================================================================
   MONTH OVER MONTH IN UNEXPLAINED BALANCE

   The ULO bridge asks where the money went; this asks where the money we
   CANNOT ACCOUNT FOR went, and separates the one movement the team controls -
   somebody answered - from the ones that would have happened anyway.

   "Unexplained fell $12M" is not a finding until it says which. Answered means
   keep chasing, because it works. Paid down means the money is leaving on its
   own and the chase achieved nothing.
   ============================================================================ */
/* ONE computation for the picker, the blurb and the slide - the same rule the
   worklist slide follows. With nothing unexplained in either month there is
   nothing to bridge, and the picker has to say so rather than offering a slide
   that then fails to appear in the deck. */
function unexModel(){
  const m = momModel();
  if(!m) return null;
  const br = CED.unexBridge(CED.inPeriod(CMP.a), CED.inPeriod(CMP.b),
                            actions(), m.pa.asOf, m.pb.asOf);
  if(Math.abs(br.opening) <= CED.EPS && Math.abs(br.closing) <= CED.EPS) return null;
  return {m:m, br:br};
}
function slUnexplained(){
  const u = unexModel();
  if(!u) return [];
  const m = u.m, br = u.br;
  const la = CED.inPeriod(CMP.a), lb = CED.inPeriod(CMP.b);

  const P    = br.parts;
  const good = P.explained;                       /* the chase, negative      */
  const bal  = P.paid + P.deobligated + P.left + P.noLongerAtRisk;
  const bad  = P.newlyAtRisk + P.arrived + P.obligated + P.regressed;

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'OPENING', v:'$'+pM(br.opening)+'M', n:m.pa.label+' unexplained', c:PC.NAVY},
    {k:'ANSWERED', v:'$'+pM(Math.abs(good))+'M',
     n:'the chase working', c: Math.abs(good)>5000? PC.GREEN : PC.DIM},
    {k:'LEFT ANYWAY', v:'$'+pM(Math.abs(bal))+'M',
     n:'paid, taken back or gone', c:PC.BLUE},
    {k:'NEWLY UNEXPLAINED', v:'$'+pM(bad)+'M',
     n:'arrived or crossed into risk', c: bad>5000? PC.RED : PC.DIM},
    {k:'CLOSING', v:'$'+pM(br.closing)+'M', n:m.pb.label+' unexplained',
     c: br.delta<=0? PC.GREEN : PC.RED}
  ]);

  const colW = (GRID.w - 0.40) / 2;
  const rx   = GRID.x + colW + 0.40;
  const topY = GRID.visY + 0.82 + 0.28;
  const RH   = 0.26;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- the roll-forward, with the CAUSES kept apart --------------------- */
  body += secLabel(40, GRID.x, topY, colW, 'WHERE THE UNEXPLAINED WENT');
  const bh = [THL('Roll-forward'), TH('$M')];
  const brow = (label, v, tone) => [
    {t:label, align:'l', sz:900},
    {t:(Math.abs(v)<5000? '–' : (v>0?'+':'−')+pM(Math.abs(v))), align:'r', sz:900,
     c: Math.abs(v)<5000? PC.DIM : tone}
  ];
  const brows = [[TT('Opening — '+m.pa.label,{align:'l',sz:900}),
                  TT('$'+pM(br.opening),{align:'r',sz:900})]];
  /* only the causes that actually moved - an empty row per cause is noise,
     and there are nine of them */
  CED.UNEX_PARTS.forEach(p=>{
    if(Math.abs(P[p.id]) <= 5000) return;
    brows.push(brow(p.name, P[p.id], p.good? PC.GREEN : PC.RED));
  });
  brows.push([TT('Closing — '+m.pb.label,{align:'l',sz:900}),
              TT('$'+pM(br.closing),{align:'r',sz:900})]);
  const bw = autoWidths(bh, brows, colW);
  body += _pTbl(50, GRID.x, topY+0.24, colW, bw, [bh].concat(brows), RH, {rule:PC.LINE});
  const leftBot = topY + 0.24 + RH*(brows.length+1);

  /* ---- by contract. Contracts do not overlap, so this one DOES add up --- */
  body += secLabel(42, rx, topY, colW, 'BY CONTRACT');
  /* the bridge hands these out so the breakdown cannot disagree with the
     total sitting next to it - see the note on openBy in 04_model.js */
  const oB = br.openBy, cB = br.closeBy, aB = br.answeredBy;
  const ch = [THL('Contract'), TH('Open $M'), TH('Answered'), TH('Close $M')];
  const ranked = CED.sortBy(br.piins, k=>Math.abs(cB[k]||0), 'desc');
  const shownK = ranked.slice(0, 5), restK = ranked.slice(5);
  const crows = shownK.map(k=>[
      {t:fitText(k, colW*0.42, 900), align:'l', sz:900},
      {t:pM(oB[k]||0), align:'r', sz:900},
      {t:(Math.abs(aB[k]||0)<5000? '–' : '−'+pM(Math.abs(aB[k]))),
       align:'r', sz:900, c: Math.abs(aB[k]||0)<5000? PC.DIM : PC.GREEN},
      {t:pM(cB[k]||0), align:'r', sz:900}
    ]);
  /* the tail takes a row of its own so the columns still add to the bridge */
  if(restK.length){
    const sum = (m) => restK.reduce((s,k)=>s+(m[k]||0), 0);
    crows.push([
      {t:'+ '+restK.length+' more', align:'l', sz:900, i:1, c:PC.DIM},
      {t:pM(sum(oB)), align:'r', sz:900, i:1, c:PC.DIM},
      {t:(Math.abs(sum(aB))<5000? '–' : '−'+pM(Math.abs(sum(aB)))),
       align:'r', sz:900, i:1, c:PC.DIM},
      {t:pM(sum(cB)), align:'r', sz:900, i:1, c:PC.DIM}
    ]);
  }
  crows.push([
    TT('ALL', {align:'l', sz:900}),
    TT(pM(br.opening), {align:'r', sz:900}),
    TT(Math.abs(P.explained)<5000? '–' : '−'+pM(Math.abs(P.explained)), {align:'r', sz:900}),
    TT(pM(br.closing), {align:'r', sz:900})
  ]);
  const cw = autoWidths(ch, crows, colW);
  body += _pTbl(60, rx, topY+0.24, colW, cw, [ch].concat(crows), RH, {rule:PC.LINE});
  const rightBot = topY + 0.24 + RH*(crows.length+1);

  /* ---- the takeaway ----------------------------------------------------- */
  const say = (Math.abs(br.delta) < 5000)
    ? 'Unexplained balance is unchanged at $'+pM(br.closing)+'M.'
    : (br.delta < 0
        ? 'Unexplained fell $'+pM(Math.abs(br.delta))+'M — but only $'
          + pM(Math.abs(good)) + 'M of that was answered; $'+pM(Math.abs(bal))
          + 'M left the balance on its own.'
        : 'Unexplained ROSE $'+pM(br.delta)+'M — $'+pM(bad)
          + 'M arrived or crossed into risk against $'+pM(Math.abs(good))
          + 'M answered.');
  const sayY = Math.max(leftBot, rightBot) + GAP;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  /* ---- the biggest single movements ------------------------------------ */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(0, Math.floor((6.82 - tblY)/RH) - 1);
  const moves = CED.sortBy(br.rows, r=>Math.abs(r.amt), 'desc');
  if(moves.length && room >= 2){
    const overCap = moves.length > room;
    const show = moves.slice(0, overCap? room-1 : room);
    body += secLabel(44, GRID.x, lblY, GRID.w,
      'BIGGEST MOVEMENTS' + (overCap? '  — the ' + show.length + ' largest of '
                                      + fN(moves.length) : ''));
    const ah = [THL('Cause'), THL('Contract'), THL('CLIN / ACRN'), THL('Participant'),
                THL('Appn'), TH('Was $M'), TH('Now $M'), TH('Change $M')];
    const arows = show.map(r=>{
      const p = CED.UNEX_PARTS.find(x=>x.id===r.bucket) || {name:r.bucket, good:true};
      return [
        {t:p.name, align:'l', sz:850, c: p.good? PC.GREEN : PC.RED},
        {t:fitText(r.L.ktr, 1.45, 850), align:'l', sz:850},
        {t:r.L.clin+' / '+r.L.acrn, align:'l', sz:850},
        {t:fitText(r.L.part, 1.35, 850), align:'l', sz:850},
        {t:fitText(r.L.appn || '–', 0.85, 850), align:'l', sz:850, c:PC.DIM},
        {t:pM(r.uA), align:'r', sz:850},
        {t:pM(r.uB), align:'r', sz:850},
        {t:(r.amt>0?'+':'−')+pM(Math.abs(r.amt)), align:'r', sz:850,
         c: r.amt<0? PC.GREEN : PC.RED}
      ];
    });
    if(overCap){
      const rest = moves.slice(show.length);
      const net = rest.reduce((s,r)=>s+r.amt, 0);
      arows.push([
        {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:(net>0?'+':'−')+pM(Math.abs(net)), align:'r', sz:850, i:1, c:PC.DIM}
      ]);
    }
    const aw = autoWidths(ah, arows, GRID.w);
    body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});
  }

  return [stdSlide({
    title: 'Unexplained balance — ' + m.pb.label,
    body:  body,
    foot:  'Unexplained is at-risk balance — expired or already cancelled — carrying no '
         + 'action that says what becomes of the money. Each month is scored against the '
         + 'register AS IT STOOD THAT MONTH, so an answer given in '+esc(m.pb.label)
         + ' does not count back into '+esc(m.pa.label)+'. ANSWERED is the only movement '
         + 'here the team controls; a line both paid down and answered credits the chase '
         + 'only with what was left to answer for. The causes carry opening to closing '
         + 'exactly'+(br.ok? '' : ' — AND DO NOT RECONCILE, WHICH IS A DEFECT')+'.'
  })];
}

/* ============================================================================
   ACTION AGING BY OWNER

   Not the same slide as Actions and confidence. That one asks how much of the
   money has an answer; this asks how long the answers have been outstanding
   and whose they are.

   AGING IS NOT OVERDUE. An action with no due date can never be overdue and
   can still have been sitting there since March - and that is precisely the
   item that quietly becomes a cancelled balance. So there is no overdue column
   on this slide at all: one question, one clock, no mixing.
   ============================================================================ */
function slAging(){
  if(!DB) return [];
  const open = actions().filter(CED.actOpen);
  if(!open.length) return [];
  const today = new Date().toISOString().slice(0,10);
  const per   = curPeriod();
  const rows  = CED.agingByOwner(actions(), today, actAmount);
  const prof  = CED.agingProfile(actions(), today, actAmount);

  const ages   = open.map(a=>CED.actAge(a, today)).filter(d=>d!==null);
  const oldest = ages.length? Math.max.apply(null, ages) : null;
  const med    = CED.median(ages);
  const old90  = prof.find(x=>x.band.id==='d90p') || {n:0, amount:0};
  const unown  = rows.find(r=>r.unowned) || null;

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'OPEN ACTIONS', v:String(open.length),
     n:fN(rows.length)+' owner'+(rows.length===1?'':'s'), c:PC.NAVY},
    {k:'MEDIAN AGE', v: med===null? '–' : med+'d',
     n:'half are older than this', c: (med!==null && med>60)? PC.AMBER : PC.BLUE},
    {k:'OLDEST', v: oldest===null? '–' : oldest+'d',
     n:'since it was raised', c: (oldest!==null && oldest>90)? PC.RED : PC.BLUE},
    {k:'OVER 90 DAYS', v:String(old90.n),
     n: old90.n? '$'+pM(old90.amount)+'M under them' : 'none this old',
     c: old90.n? PC.RED : PC.GREEN},
    {k:'UNASSIGNED', v: unown? String(unown.n) : '0',
     n: unown? 'nobody is carrying them' : 'every action is owned',
     c: unown? PC.RED : PC.GREEN}
  ]);

  const RH = 0.26;
  const topY = GRID.visY + 0.82 + 0.14;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- THE MATRIX GETS THE ROOM. It is the slide. --------------------- */
  const lblTop = topY;
  const tblTop = lblTop + LBL_H;
  /* leave space for the takeaway and the profile strip beneath */
  const roomTop = Math.max(2, Math.floor((5.55 - tblTop)/RH) - 1);
  const cap = capRows(rows, roomTop), overCap = cap.over, show = cap.show;

  body += secLabel(40, GRID.x, lblTop, GRID.w,
    'OPEN ACTIONS BY OWNER, BY AGE' + (overCap? '  — the ' + show.length
      + ' oldest of ' + fN(rows.length) : ''));

  const ah = [THL('Owner'), TH('Open')]
    .concat(CED.AGE_BANDS.map(b=>TH(b.short)))
    .concat([TH('Oldest'), TH('Median'), TH('Balance $M')]);
  const tone = b => b.id==='d90p'? PC.RED : b.id==='d90'? PC.AMBER
                  : b.id==='d60'? PC.BLUE : PC.GREEN;
  const arows = show.map(r=>[
    {t:fitText(r.name, 1.85, 900), align:'l', sz:900,
     c: r.unowned? PC.RED : PC.INK, b: r.unowned},
    {t:fN(r.n), align:'r', sz:900}
  ].concat(CED.AGE_BANDS.map(b=>({
      t: r.bands[b.id]? fN(r.bands[b.id]) : '–',
      align:'r', sz:900, c: r.bands[b.id]? tone(b) : PC.DIM
    })))
   .concat([
    {t: r.oldest===null? '–' : r.oldest+'d', align:'r', sz:900,
     c: (r.oldest!==null && r.oldest>90)? PC.RED : PC.INK},
    {t: r.median===null? '–' : r.median+'d', align:'r', sz:900},
    {t: pM(r.amount), align:'r', sz:900}
  ]));
  if(overCap){
    const rest = cap.rest;
    arows.push([
      {t:'+ '+rest.length+' more', align:'l', sz:900, i:1, c:PC.DIM},
      {t:fN(rest.reduce((s,r)=>s+r.n,0)), align:'r', sz:900, i:1, c:PC.DIM}
    ].concat(CED.AGE_BANDS.map(b=>({
        t:fN(rest.reduce((s,r)=>s+r.bands[b.id],0)) || '–',
        align:'r', sz:900, i:1, c:PC.DIM
      })))
     .concat([
      {t:'', align:'r', sz:900}, {t:'', align:'r', sz:900},
      {t:pM(rest.reduce((s,r)=>s+r.amount,0)), align:'r', sz:900, i:1, c:PC.DIM}
    ]));
  }
  /* the total row: owners do not overlap, so THIS column really does add up */
  arows.push([
    TT('ALL', {align:'l', sz:900}),
    TT(fN(open.length), {align:'r', sz:900})
  ].concat(CED.AGE_BANDS.map(b=>{
      const g = prof.find(x=>x.band.id===b.id) || {n:0};
      return TT(g.n? fN(g.n) : '–', {align:'r', sz:900});
    }))
   .concat([
    TT(oldest===null? '–' : oldest+'d', {align:'r', sz:900}),
    TT(med===null? '–' : med+'d', {align:'r', sz:900}),
    TT(pM(rows.reduce((s,r)=>s+r.amount,0)), {align:'r', sz:900})
  ]));
  const aw = autoWidths(ah, arows, GRID.w);
  body += _pTbl(50, GRID.x, tblTop, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});
  const matBot = tblTop + RH*(arows.length+1);

  /* ---- the takeaway ----------------------------------------------------- */
  const say = unown && unown.n
    ? fN(unown.n) + ' of ' + fN(open.length) + ' open action'
      + (open.length===1?'':'s') + ' ' + (unown.n===1? 'has':'have') + ' no owner'
      + (old90.n? ', and ' + fN(old90.n) + ' ' + (old90.n===1? 'has':'have')
                  + ' been open over 90 days' : '') + '.'
    : old90.n
      ? fN(old90.n) + ' of ' + fN(open.length) + ' open actions '
        + (old90.n===1?'has':'have') + ' been open over 90 days, with $'
        + pM(old90.amount) + 'M under them.'
      : oldest===null
        ? 'None of the open actions carries a raised date, so none of them can be aged.'
        : 'The oldest open action is ' + oldest + ' days old; the median is '
          + med + '.';
  const sayY = matBot + GAP;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  /* ---- the oldest individual items ------------------------------------- */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(0, Math.floor((6.82 - tblY)/RH) - 1);
  const aged = CED.sortBy(open.filter(a=>CED.actAge(a, today)!==null),
                          a=>CED.actAge(a, today), 'desc');
  if(aged.length && room >= 2){
    const cap = aged.length > room;
    const list = aged.slice(0, cap? room-1 : room);
    body += secLabel(44, GRID.x, lblY, GRID.w,
      'THE OLDEST OPEN ACTIONS' + (cap? '  — ' + list.length + ' of '
                                        + fN(aged.length) : ''));
    const oh = [TH('Age'), THL('Raised'), THL('Owner'), THL('Action'),
                THL('CLIN / ACRN'), THL('Status'), THL('Disposition'), TH('$M')];
    const orows = list.map(a=>{
      const d = CED.actAge(a, today);
      const p = (a.target||'').split('|');
      const dz = CED.actDisp(a.disp);
      return [
        {t:d+'d', align:'r', sz:850, b:1, c: d>90? PC.RED : d>60? PC.AMBER : PC.INK},
        {t:dLabel(a.opened), align:'l', sz:850, c:PC.DIM},
        {t:fitText((''+(a.owner||'')).trim() || 'unassigned', 1.05, 850), align:'l', sz:850,
         c: (''+(a.owner||'')).trim()? PC.INK : PC.RED},
        {t:fitText(a.title, 2.30, 850), align:'l', sz:850},
        {t: a.scope==='line'? (p[1]+' / '+p[2])
           : a.scope==='contract'? 'whole contract' : 'portfolio', align:'l', sz:850},
        {t:CED.actStatus(a.status).name, align:'l', sz:850},
        {t: dz? dz.name : 'not set', align:'l', sz:850, c: dz? PC.INK : PC.RED},
        {t: actAmount(a)===null? '–' : pM(actAmount(a)), align:'r', sz:850}
      ];
    });
    if(cap){
      const rest = aged.slice(list.length);
      orows.push([
        {t:'', align:'r', sz:850},
        {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:pM(rest.reduce((s,a)=>s+Math.abs(actAmount(a)||0),0)),
         align:'r', sz:850, i:1, c:PC.DIM}
      ]);
    }
    const ow = autoWidths(oh, orows, GRID.w);
    body += _pTbl(80, GRID.x, tblY, GRID.w, ow, [oh].concat(orows), RH, {rule:PC.LINE});
  }

  return [stdSlide({
    title: 'Action aging by owner — ' + (per? per.label : ''),
    body:  body,
    foot:  'Age is days since the action was RAISED, counted to today — unlike every money '
         + 'figure in this deck, which is as at the period as-of. Actions are raised after '
         + 'the report they are about lands, so ageing them against the as-of would read as '
         + 'negative. AGING IS NOT OVERDUE: an action with no due date can never be overdue '
         + 'and can still be six months old. Closed actions are excluded. Balance $M is what '
         + 'each action names, not a share of any total — two actions can name one line.'
  })];
}

/* ============================================================================
   DISPOSITION BREAKDOWN BY CONTRACT

   The actions slide gives the confidence figure for the portfolio. This gives
   it per contract, because a contracting officer runs ONE contract and the
   portfolio number tells them nothing about their own.

   A SNAPSHOT, so it works on a first import, and worth building with an empty
   register: a matrix that is entirely "Nothing said" is the finding.

   THE ONLY TABLE IN THIS DECK THAT ADDS UP IN BOTH DIRECTIONS. Contracts
   partition the lines and a line carries exactly one disposition or none, so
   the rows sum to the contract balances, the columns sum to the portfolio
   dispositions, and the corner is the at-risk total. `ok` measures it.
   ============================================================================ */
/* ONE computation for the picker, the blurb and the slide - the third slide
   to need this, and for the same reason: with nothing at risk there is no
   matrix, and the picker must say so rather than offering a slide that then
   fails to appear in the deck. */
function dispModel(){
  if(!DB) return null;
  const ls = CED.scope();
  if(!ls.length) return null;
  const D = CED.dispByContract(ls, actions(), curAsOf());
  if(!D.rows.length || Math.abs(D.all.atRisk.ulo) <= CED.EPS) return null;
  return D;
}
function slDisp(){
  const D = dispModel();
  if(!D) return [];
  const asOf = curAsOf(), per = curPeriod();

  const all  = D.all;
  const tone = {liquidate:PC.GREEN, deobligate:PC.AMBER, research:PC.BLUE,
                dispute:PC.RED, none:PC.DIM};
  const share = v => Math.abs(all.atRisk.ulo) > 5000
    ? ((v / all.atRisk.ulo) * 100).toFixed(1) + '%' : '–';

  const liq  = all.byDisp.liquidate, deo = all.byDisp.deobligate;
  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'AT RISK', v:'$'+pM(all.atRisk.ulo)+'M',
     n:fN(D.rows.length)+' contract'+(D.rows.length===1?'':'s'), c:PC.AMBER},
    {k:'ACCOUNTED FOR', v: all.pct===null? '–' : (all.pct*100).toFixed(1)+'%',
     n:'has a stated disposition',
     c:(all.pct!==null && all.pct>=0.8)? PC.GREEN
       : (all.pct!==null && all.pct>=0.4)? PC.AMBER : PC.RED},
    {k:'WILL LIQUIDATE', v:'$'+pM(liq.ulo)+'M', n:share(liq.ulo)+' of at risk',
     c: Math.abs(liq.ulo)>5000? PC.GREEN : PC.DIM},
    {k:'DEOBLIGATE', v:'$'+pM(deo.ulo)+'M', n:share(deo.ulo)+' of at risk',
     c: Math.abs(deo.ulo)>5000? PC.AMBER : PC.DIM},
    {k:'NOTHING SAID', v:'$'+pM(all.uncovered.ulo)+'M',
     n:fN(all.uncovered.n)+' lines', c: Math.abs(all.uncovered.ulo)>5000? PC.RED : PC.GREEN}
  ]);

  const RH = 0.26;
  const topY = GRID.visY + 0.82 + 0.14;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;

  /* ---- THE MATRIX GETS THE ROOM. It is the slide. --------------------- */
  const tblTop = topY + LBL_H;
  const roomTop = Math.max(2, Math.floor((5.40 - tblTop)/RH) - 2);
  const cap = capRows(D.rows, roomTop), overCap = cap.over, show = cap.show;
  body += secLabel(40, GRID.x, topY, GRID.w,
    'WHAT BECOMES OF THE AT-RISK MONEY, BY CONTRACT  ($M)'
    + (overCap? '  — the ' + show.length + ' largest of ' + fN(D.rows.length) : ''));

  const ah = [THL('Contract'), TH('At risk')]
    .concat(CED.ACT_DISP.map(d=>TH(d.name)))
    .concat([TH('Nothing said'), TH('Accounted')]);
  const cell = (v, c) => ({t: Math.abs(v)<5000? '–' : pM(v), align:'r', sz:900,
                           c: Math.abs(v)<5000? PC.DIM : (c || PC.INK)});
  const arows = show.map(r=>[
    {t:fitText(r.ktr, 1.55, 900), align:'l', sz:900},
    {t:pM(r.atRisk), align:'r', sz:900, b:1}
  ].concat(CED.ACT_DISP.map(d=>cell(r.cov.byDisp[d.id].ulo, tone[d.id])))
   .concat([
    cell(r.uncovered, PC.RED),
    {t: r.pct===null? '–' : (r.pct*100).toFixed(0)+'%', align:'r', sz:900,
     c: r.pct===null? PC.DIM : r.pct>=0.8? PC.GREEN : r.pct>=0.4? PC.AMBER : PC.RED}
  ]));
  if(overCap){
    const rest = cap.rest;
    const sum = f => rest.reduce((s,r)=>s+f(r), 0);
    arows.push([
      {t:'+ '+rest.length+' more', align:'l', sz:900, i:1, c:PC.DIM},
      {t:pM(sum(r=>r.atRisk)), align:'r', sz:900, i:1, c:PC.DIM}
    ].concat(CED.ACT_DISP.map(d=>({
        t: Math.abs(sum(r=>r.cov.byDisp[d.id].ulo))<5000? '–'
           : pM(sum(r=>r.cov.byDisp[d.id].ulo)),
        align:'r', sz:900, i:1, c:PC.DIM
      })))
     .concat([
      {t: Math.abs(sum(r=>r.uncovered))<5000? '–' : pM(sum(r=>r.uncovered)),
       align:'r', sz:900, i:1, c:PC.DIM},
      {t:'', align:'r', sz:900}
    ]));
  }
  /* THE CORNER. Rows and columns both meet here, and dispByContract has
     already measured that they do. */
  arows.push([
    TT('ALL', {align:'l', sz:900}),
    TT(pM(all.atRisk.ulo), {align:'r', sz:900})
  ].concat(CED.ACT_DISP.map(d=>
      TT(Math.abs(all.byDisp[d.id].ulo)<5000? '–' : pM(all.byDisp[d.id].ulo),
         {align:'r', sz:900})))
   .concat([
    TT(Math.abs(all.uncovered.ulo)<5000? '–' : pM(all.uncovered.ulo), {align:'r', sz:900}),
    TT(all.pct===null? '–' : (all.pct*100).toFixed(0)+'%', {align:'r', sz:900})
  ]));
  const aw = autoWidths(ah, arows, GRID.w);
  body += _pTbl(50, GRID.x, tblTop, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});
  const matBot = tblTop + RH*(arows.length+1);

  /* ---- the takeaway ----------------------------------------------------- */
  const worst = CED.sortBy(D.rows, r=>Math.abs(r.uncovered), 'desc')[0];
  const say = Math.abs(all.uncovered.ulo) <= 5000
    ? 'Every dollar of the $'+pM(all.atRisk.ulo)+'M at risk carries a stated disposition.'
    : (all.pct===null
        ? 'Nothing is at risk in this period.'
        : (all.pct*100).toFixed(0) + '% of the $'+pM(all.atRisk.ulo)
          + 'M at risk has a stated disposition; $'+pM(all.uncovered.ulo)
          + 'M does not'
          + (worst && D.rows.length > 1
                 && Math.abs(worst.uncovered - all.uncovered.ulo) > 5000
              ? ', and $'+pM(worst.uncovered)+'M of that is on '+worst.ktr
              : (worst && D.rows.length > 1
                  ? ', all of it on '+worst.ktr : ''))
          + '.');
  const sayY = matBot + GAP;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  /* ---- the biggest balances nobody has said anything about ------------- */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(0, Math.floor((6.82 - tblY)/RH) - 1);
  const bare = CED.sortBy(all.bareLines, L=>Math.abs(L.ulo), 'desc');
  if(bare.length && room >= 2){
    const cap = bare.length > room;
    const list = bare.slice(0, cap? room-1 : room);
    body += secLabel(44, GRID.x, lblY, GRID.w,
      'THE LARGEST AT-RISK BALANCES WITH NOTHING SAID'
      + (cap? '  — ' + list.length + ' of ' + fN(bare.length) : ''));
    const oh = [THL('Contract'), THL('CLIN / ACRN'), THL('Participant'), THL('Appn'),
                THL('FY'), THL('State'), TH('Cancels'), TH('$M')];
    const orows = list.map(L=>{
      const p = CED.phaseOf(L, asOf);
      return [
        {t:fitText(L.ktr, 1.45, 850), align:'l', sz:850},
        {t:L.clin+' / '+L.acrn, align:'l', sz:850},
        {t:fitText(L.part, 1.55, 850), align:'l', sz:850},
        {t:fitText(L.appn || '–', 0.85, 850), align:'l', sz:850, c:PC.DIM},
        {t:(''+(L.fy||'–')), align:'l', sz:850, c:PC.DIM},
        {t: p.id==='cancelled'? 'CANCELLED'
           : p.id==='expired'? ('expired '+(p.year||'?')+' of 5') : '–',
         align:'l', sz:850, c: p.id==='cancelled'? PC.RED : PC.AMBER},
        {t: CED.cancelFY(L)? 'FY'+CED.cancelFY(L) : '–', align:'r', sz:850},
        {t: pM(L.ulo), align:'r', sz:850, b:1}
      ];
    });
    if(cap){
      const rest = bare.slice(list.length);
      orows.push([
        {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850}, {t:'', align:'l', sz:850},
        {t:pM(rest.reduce((s,L)=>s+L.ulo, 0)), align:'r', sz:850, i:1, c:PC.DIM}
      ]);
    }
    const ow = autoWidths(oh, orows, GRID.w);
    body += _pTbl(80, GRID.x, tblY, GRID.w, ow, [oh].concat(orows), RH, {rule:PC.LINE});
  }

  return [stdSlide({
    title: 'Disposition by contract — ' + (per? per.label : ''),
    body:  body,
    foot:  'At risk is expired or already cancelled balance; active money is excluded. '
         + 'A line takes the disposition of its own action, or of its contract where it '
         + 'has none of its own, so it is counted under exactly one heading. '
         + 'UNLIKE EVERY OTHER TABLE IN THIS DECK THIS ONE ADDS UP BOTH WAYS: the rows '
         + 'sum to the at-risk balance of each contract and the columns to the portfolio'
         + (D.ok? '' : ' — AND HERE THEY DO NOT, WHICH IS A DEFECT')
         + '. Accounted for is the share with any disposition at all.'
  })];
}

/* ============================================================================
   FUNDS EXPIRING, BY FISCAL YEAR

   The cancellation slide is the FAR cliff. This is the near one, and it asks a
   different question: not "when is this money gone" but "when does it stop
   being possible to place new work against it". After expiration a balance can
   still be liquidated or given back; it cannot be re-obligated.

   A SNAPSHOT, so it works on a first import.
   ============================================================================ */
function expModel(){
  if(!DB) return null;
  const ls = CED.scopeWide()   /* the expiration wall is about availability ENDING, so it must see money that has not expired yet */;
  if(!ls.length) return null;
  const rows = CED.byExpiryFY(ls, curAsOf()).filter(r=>r.fy !== null || r.n > 0);
  if(!rows.some(r=>r.fy !== null)) return null;   /* nothing dated to report */
  return rows;
}

function slExpiry(){
  const rows = expModel();
  if(!rows) return [];
  const asOf = curAsOf(), per = curPeriod();
  const dated = rows.filter(r=>r.fy !== null);
  const none  = rows.find(r=>r.fy === null) || null;

  const sum = (rs, f) => rs.reduce((s,r)=>s + f(r), 0);
  const avail  = sum(dated, r=>r.available.ulo);
  const gone   = sum(dated, r=>r.expired.ulo);
  const cancd  = sum(dated, r=>r.cancelled.ulo);
  /* the next year to lose its availability, and how long there is */
  const ahead  = dated.filter(r=>r.days !== null && r.days > 0)
                      .sort((a,b)=>a.days - b.days);
  const wall   = ahead[0] || null;

  let body = kpiStrip(30, GRID.visY, 0.82, [
    {k:'STILL AVAILABLE', v:'$'+pM(avail)+'M',
     n:'can still be obligated', c: Math.abs(avail)>5000? PC.BLUE : PC.DIM},
    {k:'NEXT TO EXPIRE', v: wall? ('FY'+wall.fy) : '–',
     n: wall? ('$'+pM(wall.ulo)+'M in '+wall.days+' days') : 'nothing ahead',
     c: wall? PC.RED : PC.GREEN},
    {k:'ALREADY EXPIRED', v:'$'+pM(gone)+'M',
     n:'liquidate or give back only', c: Math.abs(gone)>5000? PC.AMBER : PC.GREEN},
    {k:'CANCELLED', v:'$'+pM(cancd)+'M',
     n:'past the cancel date', c: Math.abs(cancd)>5000? PC.RED : PC.GREEN},
    {k:'NO EXPIRY', v: none? '$'+pM(none.ulo)+'M' : '$0.000M',
     n:'partner funds — no such date', c:PC.DIM}
  ]);

  const RH = 0.26;
  const TXT_H = 0.30, LBL_H = 0.24, GAP = 0.18;
  const chTop = GRID.visY + 0.82 + 0.20;
  /* THE CHART IS THE SHAPE; THE TABLE IS THE DETAIL, and the table was losing.
     At 2.05" only two of twelve fiscal years fitted beneath it - a by-fiscal-
     year slide showing two years. The risk slide gives its chart 1.95"; this
     one carries more columns and needs less height per column, so 1.70" reads
     the same and buys four more rows. */
  const chH   = 1.70;

  /* ---- the shape of it -------------------------------------------------- */
  body += secLabel(40, GRID.x, chTop - 0.22, GRID.w,
    'UNLIQUIDATED BALANCE BY THE FISCAL YEAR IT STOPS BEING AVAILABLE');
  const bars = dated.map(r=>({
    label: 'FY' + r.fy,
    sub:   r.days === null? '' : (r.days > 0? 'in '+r.days+'d' : 'gone'),
    v:     r.ulo,
    /* red is the money whose availability has not yet run out and soon will -
       that is the only column anyone can still act on to obligate */
    tone:  (r.days !== null && r.days > 0)
             ? (r.days <= 365? PC.RED : PC.BLUE)
             : (Math.abs(r.cancelled.ulo) > Math.abs(r.expired.ulo)? PC.DIM : PC.AMBER)
  }));
  const allSame = dated.length > 1
    && dated.every(r=>r.expD && r.expD.slice(5) === (dated[0].expD||'').slice(5));
  body += pptCols(50, GRID.x, chTop, GRID.w, chH, bars,
    allSame? 'all on ' + dLabel(dated[0].expD).slice(0, 6) : '');
  const chBot = chTop + chH;

  /* ---- the takeaway ----------------------------------------------------- */
  const say = wall
    ? '$' + pM(wall.ulo) + 'M of FY' + wall.fy + ' money stops being available in '
      + wall.days + ' days, on ' + dLabel(wall.expD) + '. After that it can only be '
      + 'liquidated or given back.'
    : (Math.abs(avail) > 5000
        ? '$' + pM(avail) + 'M is still available, with no expiration date ahead of '
          + (asOf? dLabel(asOf) : 'the as-of') + '.'
        : 'Nothing on this report is still available for new obligation; $'
          + pM(gone + cancd) + 'M has already expired or cancelled.');
  const sayY = chBot + GAP;
  body += _pText(70, GRID.x, sayY, GRID.w, TXT_H,
            _pPara(_pRun(say, {sz:1000, b:1, c:PC.NAVY})), 't');

  /* ---- year by year ----------------------------------------------------- */
  const lblY = sayY + TXT_H + GAP;
  const tblY = lblY + LBL_H;
  const room = Math.max(0, Math.floor((6.82 - tblY)/RH) - 2);
  if(dated.length && room >= 2){
    /* THE YEARS STILL AHEAD FIRST - they are the only ones that can be acted
       on - then the largest of what has already gone. */
    const future = dated.filter(r=>r.days !== null && r.days > 0);
    const past   = CED.sortBy(dated.filter(r=>!(r.days !== null && r.days > 0)),
                              r=>Math.abs(r.ulo), 'desc');
    const ordered = future.concat(past);
    const cap = capRows(ordered, room), overCap = cap.over, show = cap.show;
    body += secLabel(44, GRID.x, lblY, GRID.w,
      'BY FISCAL YEAR' + (overCap? '  — ' + show.length + ' of ' + fN(ordered.length)
                                 + ', those still ahead first' : ''));

    const ah = [THL('Availability'), THL('Expires'), TH('Days'), TH('Lines'),
                TH('Available $M'), TH('Expired $M'), TH('Cancelled $M'), TH('Total $M')];
    const cell = (v, c) => ({t: Math.abs(v)<5000? '–' : pM(v), align:'r', sz:850,
                             c: Math.abs(v)<5000? PC.DIM : (c || PC.INK)});
    const arows = show.map(r=>[
      {t:'FY'+r.fy, align:'l', sz:850, b:1},
      {t: r.expD? dLabel(r.expD) : (r.dates.length? r.dates.length+' dates' : '–'),
       align:'l', sz:850},
      {t: r.days === null? '–' : (r.days > 0? String(r.days) : 'gone'),
       align:'r', sz:850, c: (r.days !== null && r.days > 0 && r.days <= 365)? PC.RED : PC.INK},
      {t:fN(r.n), align:'r', sz:850},
      cell(r.available.ulo, PC.BLUE),
      cell(r.expired.ulo,   PC.AMBER),
      cell(r.cancelled.ulo, PC.RED),
      {t:pM(r.ulo), align:'r', sz:850, b:1}
    ]);
    if(overCap){
      const rest = cap.rest;
      const s = f => rest.reduce((a,r)=>a + f(r), 0);
      arows.push([
        {t:'+ '+rest.length+' more', align:'l', sz:850, i:1, c:PC.DIM},
        {t:'', align:'l', sz:850}, {t:'', align:'r', sz:850},
        {t:fN(s(r=>r.n)), align:'r', sz:850, i:1, c:PC.DIM},
        cell(s(r=>r.available.ulo), PC.DIM), cell(s(r=>r.expired.ulo), PC.DIM),
        cell(s(r=>r.cancelled.ulo), PC.DIM),
        {t:pM(s(r=>r.ulo)), align:'r', sz:850, i:1, c:PC.DIM}
      ]);
    }
    /* the total row includes the undated tail, or the column would not be the
       balance on the report */
    arows.push([
      TT('ALL', {align:'l', sz:850}),
      TT(none? 'incl. no-expiry' : '', {align:'l', sz:850}),
      TT('', {align:'r', sz:850}),
      TT(fN(sum(rows, r=>r.n)), {align:'r', sz:850}),
      TT(pM(avail), {align:'r', sz:850}),
      TT(pM(gone), {align:'r', sz:850}),
      TT(pM(cancd), {align:'r', sz:850}),
      TT(pM(sum(rows, r=>r.ulo)), {align:'r', sz:850})
    ]);
    const aw = autoWidths(ah, arows, GRID.w);
    body += _pTbl(80, GRID.x, tblY, GRID.w, aw, [ah].concat(arows), RH, {rule:PC.LINE});
  }

  return [stdSlide({
    wide:  true,
    title: 'Funds expiring by fiscal year — ' + (per? per.label : ''),
    body:  body,
    foot:  'EXPIRATION IS NOT CANCELLATION. Expired money can still be liquidated or '
         + 'given back; it cannot be obligated against new work. Cancellation comes five '
         + 'years later and is a different slide. The fiscal year shown is the LAST ONE '
         + 'THE MONEY WAS AVAILABLE IN, not the year its expiration date falls in - funds '
         + 'expire on 1 October, which is already the next fiscal year. Days are counted '
